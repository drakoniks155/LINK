<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Blink</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* =========================================================
   AUTH
========================================================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background:
    radial-gradient(circle at 50% 20%, #242424 0%, #090909 45%, #000 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

.auth-box {
  width: min(430px, 100%);
  background: rgba(15,15,15,.96);
  border: 1px solid #333;
  border-radius: 30px;
  padding: 28px 22px;
  box-shadow: 0 25px 80px rgba(0,0,0,.7);
}

.auth-logo {
  text-align: center;
  font-size: 34px;
  font-weight: 1000;
  letter-spacing: 4px;
  margin-bottom: 6px;
}

.auth-subtitle {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-bottom: 25px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: #090909;
  border: 1px solid #292929;
  padding: 5px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.auth-tab {
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: #777;
  padding: 11px;
  font-weight: 900;
}

.auth-tab.active {
  background: white;
  color: black;
}

.auth-message {
  min-height: 18px;
  text-align: center;
  font-size: 12px;
  color: #ff8b8b;
  margin: 8px 0;
}

.auth-loading {
  display: none;
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-top: 12px;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.badge {
  background: rgba(8,8,8,.92);
  backdrop-filter: blur(15px);
  border: 1px solid #333;
  border-radius: 18px;
  padding: 10px 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

.brand {
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  font-size: 12px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  margin-right: 7px;
}

.dot.live {
  background: #4cff8a;
  box-shadow: 0 0 12px #4cff8a;
}

/* =========================================================
   MAP CONTROLS
========================================================= */

.map-controls {
  position: absolute;
  z-index: 2000;
  right: 14px;
  top: 130px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-button,
.map-style-button,
.add-place-map-button {
  width: 50px;
  height: 50px;
  border: 1px solid #333;
  border-radius: 16px;
  background: #050505;
  color: white;
  box-shadow: 0 8px 25px rgba(0,0,0,.55);
}

.zoom-button {
  font-size: 30px;
  font-weight: 700;
}

.map-style-button,
.add-place-map-button {
  font-size: 22px;
}

.zoom-button:active,
.map-style-button:active,
.add-place-map-button:active {
  transform: scale(.94);
}

.map-style-box {
  position: relative;
}

.map-styles {
  position: absolute;
  right: 58px;
  top: 0;
  width: 155px;
  background: rgba(5,5,5,.97);
  border: 1px solid #333;
  border-radius: 16px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
}

.map-styles button {
  width: 100%;
  border: 0;
  background: transparent;
  color: white;
  text-align: left;
  padding: 11px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: bold;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom {
  position: absolute;
  z-index: 1000;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: rgba(8,8,8,.95);
  border: 1px solid #333;
  border-radius: 24px;
  padding: 7px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 5px;
}

.nav {
  border: 0;
  background: transparent;
  color: #999;
  border-radius: 17px;
  padding: 8px 3px;
}

.nav.active {
  background: white;
  color: black;
}

.nav span {
  display: block;
}

.nav .icon {
  font-size: 19px;
}

.nav .txt {
  font-size: 10px;
  font-weight: bold;
}

/* =========================================================
   PANELS
========================================================= */

.panel {
  position: absolute;
  z-index: 3000;
  inset: 0;
  background: rgba(0,0,0,.62);
  display: flex;
  align-items: flex-end;
  backdrop-filter: blur(3px);
}

.sheet {
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 28px 28px 0 0;
  padding: 18px 16px 30px;
}

.handle {
  width: 42px;
  height: 4px;
  background: #444;
  border-radius: 10px;
  margin: 0 auto 16px;
}

.close {
  float: right;
  border: 0;
  background: #222;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 22px;
}

input,
select {
  width: 100%;
  background: #171717;
  color: white;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 12px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #777;
}

.field {
  margin: 12px 0;
}

.field label {
  display: block;
  color: #aaa;
  font-size: 12px;
  margin-bottom: 6px;
}

.btn {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 13px;
  background: white;
  color: black;
  font-weight: 900;
  margin-top: 8px;
}

.btn.secondary {
  background: #222;
  color: white;
  border: 1px solid #333;
}

.btn.danger {
  background: #351515;
  color: #ff8b8b;
  border: 1px solid #552222;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.grow {
  flex: 1;
}

.note {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
}

.empty {
  text-align: center;
  color: #888;
  padding: 25px;
}

/* =========================================================
   PROFILE
========================================================= */

.profile {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 15px 0;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #222;
  border: 2px solid white;
}

.avatar.small {
  width: 46px;
  height: 46px;
  border-width: 1px;
}

.code {
  font-size: 12px;
  color: #999;
}

/* =========================================================
   FRIENDS
========================================================= */

.friend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid #252525;
}

.request {
  padding: 14px;
  margin: 8px 0;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
}

/* =========================================================
   CHAT
========================================================= */

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #252525;
}

.chat-last {
  color: #777;
  font-size: 11px;
  margin-top: 4px;
}

.messages {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 55vh;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  max-width: 80%;
  padding: 10px 12px;
  border-radius: 16px;
  background: #202020;
  align-self: flex-start;
  font-size: 13px;
}

.message.mine {
  background: white;
  color: black;
  align-self: flex-end;
}

.message-time {
  font-size: 9px;
  opacity: .55;
  margin-top: 4px;
}

/* =========================================================
   PLACES
========================================================= */

.place-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #252525;
}

.place-icon {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border: 1px solid #333;
  border-radius: 14px;
  background: #171717;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.place-name {
  font-weight: 900;
  font-size: 15px;
}

.place-type {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

/* =========================================================
   MARKERS
========================================================= */

.pin {
  width: 46px;
  height: 46px;
  border: 3px solid white;
  border-radius: 50%;
  background: #222;
  position: relative;
  box-shadow: 0 5px 20px rgba(0,0,0,.6);
}

.pin img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.ring {
  position: absolute;
  inset: -8px;
  border: 2px solid white;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.2);
    opacity: .15;
  }
}

.friend-pin {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid white;
  background: #222;
}

.friend-pin img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.speed-label {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #000;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 900;
}

.direction-arrow {
  position: absolute;
  left: 50%;
  top: -27px;
  transform: translateX(-50%);
  font-size: 18px;
  text-shadow: 0 2px 5px #000;
}

.place-marker {
  width: 44px;
  height: 44px;
  border: 2px solid white;
  border-radius: 50%;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  box-shadow: 0 5px 20px rgba(0,0,0,.65);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: absolute;
  z-index: 5000;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  background: white;
  color: black;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  max-width: 90%;
  text-align: center;
}

/* =========================================================
   NOTIFICATION
========================================================= */

.notification-badge {
  display: inline-flex;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 10px;
  align-items: center;
  justify-content: center;
  background: #ff4545;
  color: white;
  font-size: 10px;
  font-weight: 900;
  vertical-align: top;
  margin-left: 4px;
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:700px) {

  .bottom {
    width: 520px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
  }

  .panel {
    align-items: center;
    justify-content: center;
  }

  .sheet {
    width: 520px;
    border-radius: 28px;
    max-height: 80vh;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     AUTH SCREEN
======================================================= -->

<div id="authScreen">

  <div class="auth-box">

    <div class="auth-logo">
      ⚡ BLINK
    </div>

    <div class="auth-subtitle">
      Друзья рядом. Всегда.
    </div>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        onclick="showAuthMode('login')"
      >
        Вход
      </button>

      <button
        id="registerTab"
        class="auth-tab"
        onclick="showAuthMode('register')"
      >
        Регистрация
      </button>

    </div>

    <div id="registerFields" style="display:none">

      <div class="field">

        <label>
          Имя пользователя
        </label>

        <input
          id="authUsername"
          maxlength="30"
          placeholder="Например, Никс"
          autocomplete="username"
        >

      </div>

    </div>

    <div class="field">

      <label>
        Email
      </label>

      <input
        id="authEmail"
        type="email"
        placeholder="example@mail.com"
        autocomplete="email"
      >

    </div>

    <div class="field">

      <label>
        Пароль
      </label>

      <input
        id="authPassword"
        type="password"
        placeholder="Минимум 6 символов"
        autocomplete="current-password"
      >

    </div>

    <button
      id="authButton"
      class="btn"
      onclick="submitAuth()"
    >
      Войти
    </button>

    <div
      id="authMessage"
      class="auth-message"
    ></div>

    <div
      id="authLoading"
      class="auth-loading"
    >
      Подождите...
    </div>

  </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app" style="display:none">

  <div id="map"></div>

  <div class="topbar">

    <div class="badge brand">
      ⚡ BLINK
    </div>

    <div class="badge status">

      <span
        id="statusDot"
        class="dot"
      ></span>

      <span id="statusText">
        GPS не запущен
      </span>

    </div>

  </div>


  <!-- MAP CONTROLS -->

  <div class="map-controls">

    <div class="zoom-controls">

      <button
        class="zoom-button"
        onclick="zoomIn()"
      >
        +
      </button>

      <button
        class="zoom-button"
        onclick="zoomOut()"
      >
        −
      </button>

    </div>


    <button
      class="add-place-map-button"
      onclick="startAddingPlace()"
      title="Добавить место"
    >
      📍
    </button>


    <div class="map-style-box">

      <button
        class="map-style-button"
        onclick="toggleMapStyles()"
      >
        🗺️
      </button>

      <div
        id="mapStyles"
        class="map-styles"
        style="display:none"
      >

        <button onclick="setMapStyle('light')">
          ⚪ Белая
        </button>

        <button onclick="setMapStyle('dark')">
          ⚫ Тёмная
        </button>

        <button onclick="setMapStyle('hybrid')">
          🛰️ Гибрид
        </button>

      </div>

    </div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <button
      class="nav active"
      data-page="map"
    >

      <span class="icon">
        🗺️
      </span>

      <span class="txt">
        Карта
      </span>

    </button>


    <button
      class="nav"
      data-page="friends"
    >

      <span class="icon">
        👥
      </span>

      <span class="txt">
        Друзья
      </span>

    </button>


    <button
      class="nav"
      data-page="chats"
    >

      <span class="icon">
        💬
      </span>

      <span class="txt">
        Чаты
      </span>

    </button>


    <button
      class="nav"
      data-page="profile"
    >

      <span class="icon">
        👤
      </span>

      <span class="txt">
        Профиль
      </span>

    </button>

  </div>


  <div
    id="panel"
    class="panel"
    style="display:none"
  >

    <div
      id="sheet"
      class="sheet"
    ></div>

  </div>


  <div
    id="toast"
    class="toast"
    style="display:none"
  ></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";

const {
  createClient
} = supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser =
  null;

let myProfile =
  null;

let myName =
  "Я";

let myPhoto =
  "";

let myCode =
  "";

let locationEnabled =
  true;

let watchId =
  null;

let marker =
  null;

let lastPosition =
  null;

let friendMarkers =
  {};

let realtimeChannels =
  [];

let currentChatId =
  null;

let currentChatUser =
  null;


/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map")
   .setView(
     [0, 0],
     2
   );


const lightMap =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }
  );


const darkMap =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      attribution: "© OpenStreetMap © CARTO"
    }
  );


const satelliteMap =
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "© Esri"
    }
  );


const labelsMap =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      attribution: "© OpenStreetMap © CARTO"
    }
  );


let currentMapStyle =
  localStorage.getItem("blink_map_style") ||
  "dark";


function setMapStyle(style) {

  [
    lightMap,
    darkMap,
    satelliteMap,
    labelsMap
  ].forEach(layer => {

    if (map.hasLayer(layer)) {
      map.removeLayer(layer);
    }

  });


  if (style === "light") {
    lightMap.addTo(map);
  }

  if (style === "dark") {
    darkMap.addTo(map);
  }

  if (style === "hybrid") {
    satelliteMap.addTo(map);
    labelsMap.addTo(map);
  }


  currentMapStyle =
    style;

  localStorage.setItem(
    "blink_map_style",
    style
  );

  document.getElementById(
    "mapStyles"
  ).style.display = "none";
}


function toggleMapStyles() {

  const menu =
    document.getElementById("mapStyles");

  menu.style.display =
    menu.style.display === "none"
      ? "block"
      : "none";
}


function zoomIn() {
  map.zoomIn();
}


function zoomOut() {
  map.zoomOut();
}


setMapStyle(currentMapStyle);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


function avatar(src) {

  if (src) {
    return src;
  }

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
        <rect width="160" height="160" fill="#222"/>
        <text x="80" y="108"
          text-anchor="middle"
          font-size="70"
          fill="white">👤</text>
      </svg>`
    )
  );
}


function toast(text) {

  const box =
    document.getElementById("toast");

  box.textContent =
    text;

  box.style.display =
    "block";

  clearTimeout(
    window.blinkToast
  );

  window.blinkToast =
    setTimeout(
      () => {
        box.style.display =
          "none";
      },
      2800
    );
}


function setStatus(text, live) {

  document.getElementById(
    "statusText"
  ).textContent =
    text;

  document.getElementById(
    "statusDot"
  ).classList.toggle(
    "live",
    !!live
  );
}


/* =========================================================
   AUTH UI
========================================================= */

let authMode =
  "login";


function showAuthMode(mode) {

  authMode =
    mode;

  document.getElementById(
    "loginTab"
  ).classList.toggle(
    "active",
    mode === "login"
  );

  document.getElementById(
    "registerTab"
  ).classList.toggle(
    "active",
    mode === "register"
  );

  document.getElementById(
    "registerFields"
  ).style.display =
    mode === "register"
      ? "block"
      : "none";

  document.getElementById(
    "authButton"
  ).textContent =
    mode === "login"
      ? "Войти"
      : "Создать аккаунт";

  document.getElementById(
    "authMessage"
  ).textContent =
    "";
}


function authMessage(text) {

  document.getElementById(
    "authMessage"
  ).textContent =
    text;
}


function setAuthLoading(value) {

  document.getElementById(
    "authLoading"
  ).style.display =
    value
      ? "block"
      : "none";

  document.getElementById(
    "authButton"
  ).disabled =
    value;
}


/* =========================================================
   LOGIN / REGISTER
========================================================= */

async function submitAuth() {

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  const username =
    document.getElementById(
      "authUsername"
    ).value.trim();


  if (!email) {
    authMessage("Введи email.");
    return;
  }

  if (!password) {
    authMessage("Введи пароль.");
    return;
  }

  if (
    authMode === "register" &&
    password.length < 6
  ) {
    authMessage(
      "Пароль должен быть минимум 6 символов."
    );
    return;
  }

  if (
    authMode === "register" &&
    !username
  ) {
    authMessage(
      "Введи имя пользователя."
    );
    return;
  }


  setAuthLoading(true);
  authMessage("");


  try {

    if (authMode === "login") {

      const {
        data,
        error
      } =
        await db.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        throw error;
      }

      currentUser =
        data.user;

      await startApplication();

    }

    else {

      const {
        data,
        error
      } =
        await db.auth.signUp({

          email,
          password,

          options: {
            data: {
              username
            }
          }

        });

      if (error) {
        throw error;
      }


      if (
        data.session &&
        data.user
      ) {

        currentUser =
          data.user;

        await startApplication();

      }

      else {

        authMessage(
          "Аккаунт создан. Проверь email и подтверди регистрацию."
        );

      }

    }

  }

  catch(error) {

    console.error(error);

    authMessage(
      translateAuthError(
        error.message
      )
    );

  }

  finally {

    setAuthLoading(false);

  }

}


function translateAuthError(message) {

  const text =
    String(message || "").toLowerCase();


  if (
    text.includes("invalid login credentials")
  ) {
    return "Неверный email или пароль.";
  }

  if (
    text.includes("email not confirmed")
  ) {
    return "Сначала подтверди email.";
  }

  if (
    text.includes("user already registered")
  ) {
    return "Этот email уже зарегистрирован.";
  }

  if (
    text.includes("password should be at least")
  ) {
    return "Пароль слишком короткий.";
  }

  return message || "Произошла ошибка.";
}

  ).style.display =
    "none";

async function loadProfile() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "PROFILE ERROR",
      error
    );

    return;

  }


  if (data) {

    myProfile =
      data;

    myName =
      data.username ||
      currentUser.user_metadata?.username ||
      "Я";

    myPhoto =
      data.avatar_url ||
      "";

    myCode =
      data.friend_code ||
      "";

    locationEnabled =
      data.location_sharing_enabled !== false;

  }


  if (!myCode) {

    myCode =
      generateFriendCode();

    await saveProfileToDatabase();

  }

}


function generateFriendCode() {

  return String(
    Math.floor(
      1000 +
      Math.random() *
      9000
    )
  );

}


async function saveProfileToDatabase() {

  if (!currentUser) {
    return;
  }


  const updates = {

    username:
      myName,

    friend_code:
      myCode,

    avatar_url:
      myPhoto,

    location_sharing_enabled:
      locationEnabled,

    updated_at:
      new Date().toISOString()

  };


  const {
    error
  } =
    await db
      .from("profiles")
      .update(updates)
      .eq(
        "id",
        currentUser.id
      );


  if (error) {

    console.error(
      "SAVE PROFILE ERROR",
      error
    );

  }

}

/* =========================================================
   LOCATION
========================================================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );

}


function calculateBearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const rad =
    Math.PI / 180;

  const y =
    Math.sin(
      (lon2 - lon1) * rad
    ) *
    Math.cos(lat2 * rad);

  const x =
    Math.cos(lat1 * rad) *
    Math.sin(lat2 * rad) -
    Math.sin(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.cos(
      (lon2 - lon1) * rad
    );

  return (
    Math.atan2(y,x) *
    180 /
    Math.PI +
    360
  ) % 360;

}


function directionName(degrees) {

  const names = [
    "С",
    "СВ",
    "В",
    "ЮВ",
    "Ю",
    "ЮЗ",
    "З",
    "СЗ"
  ];

  return names[
    Math.round(
      degrees / 45
    ) % 8
  ];

}

function startGPS() {

  if (!locationEnabled) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }


  if (
    !navigator.geolocation
  ) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }


  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  setStatus(
    "Получаем GPS…",
    true
  );


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      onPositionError,

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      }

    );

}


async function onPosition(position) {

  const c =
    position.coords;


  let speedMs =
    Number.isFinite(c.speed)
      ? Math.max(0,c.speed)
      : null;


  let direction =
    lastPosition
      ? lastPosition.direction
      : 0;


  if (lastPosition) {

    const seconds =
      (
        position.timestamp -
        lastPosition.time
      ) / 1000;


    if (seconds > 0) {

      const meters =
        calculateDistance(
          lastPosition.lat,
          lastPosition.lng,
          c.latitude,
          c.longitude
        );


      if (speedMs === null) {

        speedMs =
          meters / seconds;

      }


      if (meters > 1) {

        direction =
          calculateBearing(
            lastPosition.lat,
            lastPosition.lng,
            c.latitude,
            c.longitude
          );

      }

    }

  }


  const speedKmh =
    (speedMs || 0) * 3.6;


  lastPosition = {

    lat:
      c.latitude,

    lng:
      c.longitude,

    time:
      position.timestamp,

    direction,

    speed:
      speedKmh

  };


  if (!marker) {

    marker =
      L.marker(
        [
          c.latitude,
          c.longitude
        ],
        {
          icon:
            userIcon(
              speedKmh,
              direction
            ),
          zIndexOffset:
            1000
        }
      ).addTo(map);


    marker.bindPopup(
      `
        <b>${escapeHtml(myName)}</b>
        <br>
        🚀 ${speedKmh.toFixed(1)} км/ч
        <br>
        🧭 ${directionName(direction)}
      `
    );


    map.setView(
      [
        c.latitude,
        c.longitude
      ],
      16
    );

  }

  else {

    marker.setLatLng([
      c.latitude,
      c.longitude
    ]);

    marker.setIcon(
      userIcon(
        speedKmh,
        direction
      )
    );

  }


  setStatus(
    "GPS • " +
    directionName(direction),
    true
  );


  await updateMyLocation(
    c.latitude,
    c.longitude,
    c.accuracy || 0,
    speedKmh,
    direction
  );

}


async function updateMyLocation(
  latitude,
  longitude,
  accuracy,
  speed,
  heading
) {

  if (!currentUser) {
    return;
  }


  try {

    const {
      error
    } =
      await db.rpc(
        "update_my_location",
        {
          p_latitude:
            latitude,

          p_longitude:
            longitude,

          p_accuracy:
            accuracy,

          p_speed:
            speed,

          p_heading:
            heading
        }
      );


    if (error) {

      console.error(
        "LOCATION ERROR",
        error
      );

    }

  }

  catch(error) {

    console.error(error);

  }

}


function onPositionError(error) {

  if (error.code === 1) {

    setStatus(
      "Разреши геолокацию",
      false
    );

    toast(
      "Разреши браузеру доступ к геолокации."
    );

  }

  else if (error.code === 2) {

    setStatus(
      "GPS недоступен",
      false
    );

  }

  else if (error.code === 3) {

    setStatus(
      "GPS не отвечает",
      false
    );

  }

  else {

    setStatus(
      "Ошибка GPS",
      false
    );

  }

}


/* =========================================================
   FRIEND LOCATIONS
========================================================= */

async function loadFriendLocations() {

  if (!currentUser) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "get_friend_locations"
      );


    if (error) {
      throw error;
    }


    const locations =
      data || [];


    Object.keys(
      friendMarkers
    ).forEach(id => {

      if (
        !locations.some(
          location =>
            location.user_id === id
        )
      ) {

        map.removeLayer(
          friendMarkers[id]
        );

        delete friendMarkers[id];

      }

    });


    locations.forEach(location => {

      if (
        !location.latitude ||
        !location.longitude
      ) {
        return;
      }


      if (
        friendMarkers[
          location.user_id
        ]
      ) {

        friendMarkers[
          location.user_id
        ].setLatLng([
          location.latitude,
          location.longitude
        ]);

      }

      else {

        const friendMarker =
          L.marker(

            [
              location.latitude,
              location.longitude
            ],

            {
              icon:
                friendIcon(
                  location.avatar_url
                ),

              zIndexOffset:
                700

            }

          ).addTo(map);


        friendMarker.bindPopup(
          `
            <b>
              ${escapeHtml(
                location.username ||
                "Друг"
              )}
            </b>

            <br>

            🚀
            ${Number(
              location.speed || 0
            ).toFixed(1)}
            км/ч

            <br>

            🧭
            ${directionName(
              Number(
                location.heading || 0
              )
            )}
          `
        );


        friendMarkers[
          location.user_id
        ] =
          friendMarker;

      }

    });

  }

  catch(error) {

    console.error(
      "FRIEND LOCATIONS ERROR",
      error
    );

  }

}

async function openChatWithFriend(
  friendId,
  friendName
) {

  closePanel();


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "create_direct_chat",
        {
          p_other_user_id:
            friendId
        }
      );


    if (error) {
      throw error;
    }


    let chatId =
      data;


    if (
      Array.isArray(data)
    ) {
      chatId =
        data[0]?.chat_id ||
        data[0]?.id;
    }

    if (
      typeof data === "object" &&
      data !== null
    ) {
      chatId =
        data.chat_id ||
        data.id ||
        chatId;
    }


    if (!chatId) {
      throw new Error(
        "Не удалось создать чат."
      );
    }


    currentChatId =
      chatId;

    currentChatUser = {
      id:
        friendId,

      name:
        friendName
    };


    showChat();

  }

  catch(error) {

    console.error(error);

    toast(
      error.message ||
      "Не удалось открыть чат."
    );

  }

}

        onkeydown="

      >

async function loadChatMessages() {

  const box =
    document.getElementById(
      "messages"
    );


  if (!box || !currentChatId) {
    return;
  }


  const {
    data,
    error
  } =
    await db.rpc(
      "get_chat_messages",
      {
        p_chat_id:
          currentChatId
      }
    );


  if (error) {

    console.error(error);

    box.innerHTML =
      `<div class="empty">
        Не удалось загрузить сообщения.
      </div>`;

    return;

  }


  const messages =
    data || [];


  if (!messages.length) {

    box.innerHTML =
      `<div class="empty">
        Пока нет сообщений.
        <br>
        Напиши первым.
      </div>`;

    return;

  }


  box.innerHTML =
    messages.map(message => {

      const mine =
        message.sender_id ===
        currentUser.id;


      const date =
        message.created_at
          ? new Date(
              message.created_at
            ).toLocaleTimeString(
              "ru-RU",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )
          : "";


      return `

        <div
          class="message
            ${mine ? "mine" : ""}"
        >

          ${escapeHtml(
            message.body || ""
          )}

          <div class="message-time">
            ${date}
          </div>

        </div>

      `;

    }).join("");


  box.scrollTop =
    box.scrollHeight;

}


async function sendCurrentMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  if (
    !input ||
    !currentChatId
  ) {
    return;
  }


  const body =
    input.value.trim();


  if (!body) {
    return;
  }


  try {

    const {
      error
    } =
      await db.rpc(
        "send_message",
        {
          p_chat_id:
            currentChatId,

          p_body:
            body
        }
      );


    if (error) {
      throw error;
    }


    input.value =
      "";

    await loadChatMessages();

  }

  catch(error) {

    console.error(error);

    toast(
      error.message ||
      "Не удалось отправить сообщение."
    );

  }

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function loadNotifications() {

  if (!currentUser) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await db
        .from("notifications")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "read",
          false
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {
      throw error;
    }


    updateNotificationBadge(
      (data || []).length
    );

  }

  catch(error) {

    console.error(
      "NOTIFICATIONS ERROR",
      error
    );

  }

}


function updateNotificationBadge(count) {

  const nav =
    document.querySelector(
      '[data-page="friends"]'
    );


  if (!nav) {
    return;
  }


  const txt =
    nav.querySelector(".txt");


  if (!txt) {
    return;
  }


  const old =
    nav.querySelector(
      ".notification-badge"
    );


  if (old) {
    old.remove();
  }


  if (count > 0) {

    const badge =
      document.createElement(
        "span"
      );

    badge.className =
      "notification-badge";

    badge.textContent =
      count;

    txt.appendChild(
      badge
    );

  }

}


/* =========================================================
   REALTIME
========================================================= */

function startRealtime() {

  stopRealtime();


  const notificationsChannel =
    db
      .channel(
        "blink-notifications"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "notifications",
          filter:
            `user_id=eq.${currentUser.id}`
        },
        async () => {

          await loadNotifications();

          toast(
            "🔔 Новое уведомление"
          );

        }
      )
      .subscribe();


  const locationsChannel =
    db
      .channel(
        "blink-locations"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "locations"
        },
        async () => {

          await loadFriendLocations();

        }
      )
      .subscribe();


  const requestsChannel =
    db
      .channel(
        "blink-friend-requests"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "friend_requests"
        },
        async () => {

          await loadNotifications();

          if (
            document.getElementById(
              "requestsList"
            )
          ) {
            await renderRequests();
          }

        }
      )
      .subscribe();


  realtimeChannels.push(
    notificationsChannel,
    locationsChannel,
    requestsChannel
  );

}


function subscribeToChat() {

  if (!currentChatId) {
    return;
  }


  const channel =
    db
      .channel(
        `chat-${currentChatId}`
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          const row =
            payload.new;


          if (
            row.chat_id ===
            currentChatId
          ) {

            loadChatMessages();

          }

        }
      )
      .subscribe();


  realtimeChannels.push(
    channel
  );

}


function stopRealtime() {

  realtimeChannels.forEach(
    channel => {
      try {
        db.removeChannel(
          channel
        );
      }
      catch(e) {}
    }
  );

  realtimeChannels =
    [];

}

/* =========================================================
   PLACES
========================================================= */

const placeTypes = {

  home: {
    name: "Дом",
    icon: "🏠"
  },

  work: {
    name: "Работа",
    icon: "💼"
  },

  school: {
    name: "Школа",
    icon: "🎓"
  },

  other: {
    name: "Другое",
    icon: "📍"
  }

};


let savedPlaces =
  JSON.parse(
    localStorage.getItem(
      "blink_places"
    ) || "[]"
  );


let placeMarkers =
  {};


function startAddingPlace() {

  closePanel();


  toast(
    "Нажми на карте точку."
  );


  map.once(
    "click",
    event => {

      showAddPlaceForm(
        event.latlng.lat,
        event.latlng.lng
      );

    }
  );

}


function showAddPlaceForm(
  lat,
  lng
) {

  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>

    <h2>
      📍 Добавить место
    </h2>

    <div class="field">

      <label>
        Название
      </label>

      <input
        id="placeName"
        maxlength="40"
        placeholder="Например: Мой дом"
      >

    </div>

    <div class="field">

      <label>
        Тип
      </label>

      <select id="placeType">

        <option value="home">
          🏠 Дом
        </option>

        <option value="work">
          💼 Работа
        </option>

        <option value="school">
          🎓 Школа
        </option>

        <option value="other">
          📍 Другое
        </option>

      </select>

    </div>

    <button
      class="btn"
      onclick="
        confirmNewPlace(
          ${lat},
          ${lng}
        )
      "
    >
      Сохранить
    </button>

  `);

}


function confirmNewPlace(
  lat,
  lng
) {

  const name =
    document.getElementById(
      "placeName"
    ).value.trim();


  const type =
    document.getElementById(
      "placeType"
    ).value;


  if (!name) {

    toast(
      "Введи название."
    );

    return;

  }


  const place = {

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(),

    name,
    type,
    lat,
    lng

  };


  savedPlaces.push(
    place
  );


  localStorage.setItem(
    "blink_places",
    JSON.stringify(
      savedPlaces
    )
  );


  renderSavedPlaces();

  closePanel();

  toast(
    "Место сохранено."
  );

}


function renderSavedPlaces() {

  Object.values(
    placeMarkers
  ).forEach(marker => {

    if (map.hasLayer(marker)) {
      map.removeLayer(marker);
    }

  });


  placeMarkers =
    {};


  savedPlaces.forEach(place => {

    const data =
      placeTypes[
        place.type
      ] ||
      placeTypes.other;


    const marker =
      L.marker(
        [
          place.lat,
          place.lng
        ],
        {
          icon:
            L.divIcon({

              className: "",

              html:
                `<div class="place-marker">
                  ${data.icon}
                </div>`,

              iconSize: [
                44,
                44
              ],

              iconAnchor: [
                22,
                22
              ]

            }),

          zIndexOffset:
            500
        }
      ).addTo(map);


    marker.bindPopup(`
      <b>
        ${escapeHtml(place.name)}
      </b>

      <br>

      ${data.icon}
      ${data.name}

      <br><br>

      <button
        class="popup-delete"
        onclick="
          deletePlace('${place.id}')
        "
      >
        Удалить
      </button>
    `);


    placeMarkers[
      place.id
    ] =
      marker;

  });

}


function deletePlace(id) {

  savedPlaces =
    savedPlaces.filter(
      place =>
        place.id !== id
    );


  localStorage.setItem(
    "blink_places",
    JSON.stringify(
      savedPlaces
    )
  );


  if (
    placeMarkers[id]
  ) {

    map.removeLayer(
      placeMarkers[id]
    );

    delete placeMarkers[id];

  }


  toast(
    "Место удалено."
  );

}


function showPlaces() {

  let list =
    "";


  savedPlaces.forEach(place => {

    const data =
      placeTypes[
        place.type
      ] ||
      placeTypes.other;


    list += `

      <div class="place-item">

        <div class="place-icon">
          ${data.icon}
        </div>

        <div class="grow">

          <div class="place-name">
            ${escapeHtml(place.name)}
          </div>

          <div class="place-type">
            ${data.name}
          </div>

        </div>

        <button
          class="btn secondary"
          style="width:auto;margin:0"
          onclick="
            focusPlace('${place.id}')
          "
        >
          👁️
        </button>

        <button
          class="btn danger"
          style="width:auto;margin:0"
          onclick="
            deletePlace('${place.id}');
            showPlaces();
          "
        >
          ×
        </button>

      </div>

    `;

  });


  if (!list) {

    list =
      `<div class="empty">
        Пока нет сохранённых мест.
      </div>`;

  }


  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>

    <h2>
      📍 Мои места
    </h2>

    <button
      class="btn"
      onclick="startAddingPlace()"
    >
      ＋ Добавить место
    </button>

    <div style="margin-top:12px">
      ${list}
    </div>

  `);

}


function focusPlace(id) {

  const place =
    savedPlaces.find(
      p =>
        p.id === id
    );


  if (!place) {
    return;
  }


  closePanel();


  map.setView(
    [
      place.lat,
      place.lng
    ],
    17
  );


  setTimeout(
    () => {

      if (
        placeMarkers[id]
      ) {

        placeMarkers[id].openPopup();

      }

    },
    300
  );

}

========================================================= */

async function checkSession() {

  try {

    const {
      data,
      error
    } =
      await db.auth.getSession();


    if (error) {

      console.error(error);

      return;

    }


    if (
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await startApplication();

    }

    else {

      document.getElementById(
        "authScreen"
      ).style.display =
        "flex";

      document.getElementById(
        "app"
      ).style.display =
        "none";

    }

  }

  catch(error) {

    console.error(error);

  }

}


db.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event === "SIGNED_IN" &&
      session
    ) {

      currentUser =
        session.user;

    }


    if (
      event === "SIGNED_OUT"
    ) {

      currentUser =
        null;

    }

  }
);

checkSession();
