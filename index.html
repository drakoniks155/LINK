<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Blink</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

html,
body,
#app,
#map{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* MAP */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

/* TOP */

.top{
    position:absolute;
    z-index:1000;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.pill{
    pointer-events:auto;

    background:rgba(8,8,8,.88);
    backdrop-filter:blur(14px);

    border:1px solid #333;
    border-radius:18px;

    padding:10px 14px;

    box-shadow:0 10px 30px #0008;
}

.brand{
    font-weight:900;
    letter-spacing:1px;
}

.status{
    font-size:12px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;

    background:#777;

    margin-right:6px;
}

.dot.live{
    background:#4cff8a;
    box-shadow:0 0 12px #4cff8a;
}

/* SPEED */

.speed{
    position:absolute;
    z-index:1000;

    top:72px;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    background:#080808e8;

    border:1px solid #333;
    border-radius:20px;

    padding:9px 18px;

    backdrop-filter:blur(14px);
}

.speed b{
    font-size:24px;
}

.speed small{
    display:block;
    color:#999;
    font-size:9px;
}

/* BOTTOM MENU */

.bottom{
    position:absolute;
    z-index:1000;

    left:10px;
    right:10px;
    bottom:10px;

    background:#080808eb;

    border:1px solid #333;
    border-radius:24px;

    padding:7px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:5px;

    backdrop-filter:blur(16px);
}

.nav{
    border:0;
    background:transparent;
    color:#999;

    border-radius:17px;

    padding:8px 3px;
}

.nav.active{
    background:#fff;
    color:#000;
}

.nav span{
    display:block;
}

.ico{
    font-size:18px;
}

.txt{
    font-size:10px;
    font-weight:700;
}

/* AUTH */

.auth{
    position:absolute;
    z-index:5000;

    inset:0;

    background:#080808;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.box{
    width:min(430px,100%);

    background:#111;

    border:1px solid #292929;

    border-radius:28px;

    padding:24px;

    box-shadow:0 20px 80px #000;
}

.logo{
    font-size:46px;
    font-weight:1000;
    letter-spacing:-4px;
}

.sub{
    color:#999;
    margin:0 0 20px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;

    background:#181818;

    padding:4px;

    border-radius:14px;

    margin-bottom:15px;
}

.tabs button{
    border:0;
    background:transparent;

    color:#999;

    padding:10px;

    border-radius:11px;

    font-weight:700;
}

.tabs .active{
    background:#fff;
    color:#000;
}

.field{
    margin:10px 0;
}

.field label{
    display:block;

    color:#aaa;

    font-size:12px;

    margin-bottom:6px;
}

input{
    width:100%;

    border:1px solid #303030;

    background:#171717;

    color:#fff;

    border-radius:14px;

    padding:12px;

    outline:0;
}

input:focus{
    border-color:#777;
}

.btn{
    width:100%;

    border:0;

    border-radius:15px;

    padding:13px;

    background:#fff;
    color:#000;

    font-weight:900;

    margin-top:8px;
}

.btn.secondary{
    background:#222;
    color:#fff;

    border:1px solid #333;
}

.btn.danger{
    background:#2a1115;
    color:#ff8798;
}

.msg{
    min-height:18px;

    color:#ff8798;

    font-size:13px;

    margin-top:9px;
}

/* PANELS */

.panel{
    position:absolute;
    z-index:2000;

    inset:0;

    background:#0009;

    backdrop-filter:blur(3px);

    display:flex;
    align-items:flex-end;
}

.sheet{
    width:100%;

    max-height:88dvh;

    overflow:auto;

    background:#0d0d0d;

    border:1px solid #292929;

    border-radius:28px 28px 0 0;

    padding:16px 16px 30px;
}

.handle{
    width:42px;
    height:4px;

    background:#444;

    border-radius:20px;

    margin:0 auto 15px;
}

.close{
    float:right;

    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    background:#222;

    color:#fff;

    font-size:22px;
}

.profile{
    display:flex;

    gap:14px;

    align-items:center;

    margin-bottom:15px;
}

.avatar{
    width:68px;
    height:68px;

    border-radius:50%;

    object-fit:cover;

    background:#222;

    border:2px solid #fff;
}

.small{
    width:45px;
    height:45px;

    border-width:1px;
}

.row{
    display:flex;

    gap:8px;

    align-items:center;
}

.grow{
    flex:1;
}

.friend{
    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 0;

    border-bottom:1px solid #242424;
}

.muted{
    color:#888;

    font-size:12px;
}

.name{
    font-weight:900;

    font-size:18px;
}

/* TOGGLE */

.toggle{
    width:48px;
    height:28px;

    border:0;

    border-radius:20px;

    background:#333;

    position:relative;
}

.toggle i{
    position:absolute;

    top:3px;
    left:3px;

    width:22px;
    height:22px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

.toggle.on{
    background:#fff;
}

.toggle.on i{
    left:23px;
    background:#000;
}

/* TOAST */

.toast{
    position:absolute;
    z-index:6000;

    left:50%;
    bottom:92px;

    transform:translateX(-50%);

    background:#fff;
    color:#000;

    padding:11px 15px;

    border-radius:14px;

    font-weight:800;

    font-size:13px;

    max-width:90%;

    text-align:center;
}

/* MAP MARKER */

.pin{
    position:relative;

    width:46px;
    height:46px;

    border-radius:50%;

    overflow:visible;

    background:#222;

    border:3px solid #fff;

    box-shadow:0 5px 20px #000a;
}

.pin img{
    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;
}

.ring{
    position:absolute;

    inset:-9px;

    border:2px solid #fff;

    border-radius:50%;

    animation:pulse 1.6s infinite;
}

@keyframes pulse{

    50%{
        transform:scale(1.2);
        opacity:.15;
    }

}

.speedLabel{
    position:absolute;

    top:49px;
    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    background:#000;

    color:#fff;

    border:1px solid #333;

    border-radius:9px;

    padding:3px 7px;

    font-size:10px;

    font-weight:900;
}

.leaflet-control-zoom{
    margin-bottom:90px!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

.hidden{
    display:none!important;
}

@media(min-width:700px){

    .bottom{
        width:520px;

        left:50%;
        right:auto;

        transform:translateX(-50%);
    }

    .panel{
        align-items:center;
        justify-content:center;
    }

    .sheet{
        width:520px;

        border-radius:28px;

        max-height:80vh;
    }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_irhX2HtmV_YgYk6bV_LDKQA_yPuTi4op";

const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let user = null;

let profile = null;

let map = null;

let myMarker = null;

let watchId = null;

let last = null;

let friends = [];

let friendMarkers = new Map();

let myTrail = [];

let friendTrails = new Map();

let trailLayers = [];

let authMode = "login";

let channel = null;

let sharing = true;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        });

}


function avatar(url){

    if(url){
        return url;
    }

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="160"
                 height="160">

                <rect
                    width="160"
                    height="160"
                    fill="#222"/>

                <text
                    x="80"
                    y="105"
                    text-anchor="middle"
                    font-size="70"
                    fill="white">

                    👤

                </text>

            </svg>
        `);

}


function toast(text){

    $("toast").textContent = text;

    $("toast").classList.remove("hidden");

    clearTimeout(window.__toastTimer);

    window.__toastTimer =
        setTimeout(function(){

            $("toast").classList.add("hidden");

        },2500);

}


function status(text,on){

    $("status").textContent = text;

    $("dot").classList.toggle(
        "live",
        !!on
    );

}


function openPanel(html){

    $("sheet").innerHTML =
        '<div class="handle"></div>' +
        html;

    $("panel").classList.remove(
        "hidden"
    );

}


function closePanel(){

    $("panel").classList.add(
        "hidden"
    );

}


$("panel").onclick = function(e){

    if(e.target === $("panel")){

        closePanel();

    }

};


/* =========================================================
   MAP
========================================================= */

function initMap(){

    map =
        L.map("map").setView(
            [0,0],
            2
        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,

            attribution:
                "© OpenStreetMap"
        }
    ).addTo(map);

}


/* =========================================================
   USER ICON
========================================================= */

function icon(
    url,
    speed,
    me
){

    return L.divIcon({

        className:
            me
                ? "myIcon"
                : "friendIcon",

        html:`

            <div class="pin">

                ${
                    me
                        ? '<div class="ring"></div>'
                        : ''
                }

                <img
                    src="${avatar(url)}">

            </div>

            <div class="speedLabel">

                ${Number(speed || 0).toFixed(1)}
                км/ч

            </div>

        `,

        iconSize:[
            46,
            70
        ],

        iconAnchor:[
            23,
            23
        ]

    });

}


/* =========================================================
   RAINBOW TRAIL
========================================================= */

const rainbow = [

    "#ff004c",
    "#ff7a00",
    "#ffe600",
    "#42ff00",
    "#00e5ff",
    "#2575ff",
    "#9b4dff",
    "#ff2bd6"

];


function redrawTrails(){

    trailLayers.forEach(
        function(layer){

            map.removeLayer(
                layer
            );

        }
    );

    trailLayers = [];


    drawTrail(
        myTrail,
        8
    );


    for(
        const trail of friendTrails.values()
    ){

        drawTrail(
            trail,
            6
        );

    }

}


function drawTrail(
    points,
    width
){

    if(points.length < 2){
        return;
    }


    const glow =
        L.polyline(
            points,
            {
                color:"#fff",
                weight:width + 9,
                opacity:.13,
                lineCap:"round"
            }
        ).addTo(map);


    trailLayers.push(
        glow
    );


    const start =
        Math.max(
            0,
            points.length - 25
        );


    for(
        let i=start;
        i<points.length-1;
        i++
    ){

        const progress =
            (i-start) /
            Math.max(
                1,
                points.length-2-start
            );


        const color =
            rainbow[
                Math.min(
                    rainbow.length-1,
                    Math.floor(
                        progress *
                        (rainbow.length-1)
                    )
                )
            ];


        const line =
            L.polyline(
                [
                    points[i],
                    points[i+1]
                ],
                {
                    color:color,
                    weight:width,
                    opacity:.92,
                    lineCap:"round"
                }
            ).addTo(map);


        trailLayers.push(
            line
        );

    }

}


/* =========================================================
   DISTANCE
========================================================= */

function haversine(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2-lat1)*rad;

    const dLon =
        (lon2-lon1)*rad;


    const a =
        Math.sin(dLat/2) ** 2 +

        Math.cos(lat1*rad) *
        Math.cos(lat2*rad) *

        Math.sin(dLon/2) ** 2;


    return 2 *
        R *
        Math.asin(
            Math.sqrt(a)
        );

}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(
    u,
    name
){

    let q =
        await sb
            .from("profiles")
            .select("*")
            .eq("id",u.id)
            .maybeSingle();


    if(q.error){
        throw q.error;
    }


    if(q.data){
        return q.data;
    }


    q =
        await sb
            .from("profiles")
            .insert({

                id:u.id,

                username:
                    name ||
                    u.user_metadata?.username ||
                    "Blink user",

                location_sharing_enabled:
                    true

            })
            .select()
            .single();


    if(q.error){
        throw q.error;
    }


    return q.data;

}


/* =========================================================
   START APP
========================================================= */

async function boot(u){

    user = u;


    try{

        profile =
            await ensureProfile(
                user,
                user.user_metadata?.username
            );


        sharing =
            profile.location_sharing_enabled !== false;


        $("auth")
            .classList
            .add("hidden");


        startGPS();


        await loadFriends();


        subscribe();


    }catch(e){

        toast(
            "Ошибка: " +
            e.message
        );

    }

}


/* =========================================================
   SESSION
========================================================= */

async function loadSession(){

    const q =
        await sb.auth.getSession();


    if(q.data.session){

        await boot(
            q.data.session.user
        );

    }

}


sb.auth.onAuthStateChange(
    function(event,session){

        if(
            session &&
            !user
        ){

            setTimeout(
                function(){

                    boot(
                        session.user
                    );

                },
                0
            );

        }


        if(
            event ===
            "SIGNED_OUT"
        ){

            location.reload();

        }

    }
);


/* =========================================================
   AUTH TABS
========================================================= */

$("loginTab").onclick =
function(){

    authMode =
        "login";


    $("loginTab")
        .classList
        .add("active");


    $("signupTab")
        .classList
        .remove("active");


    $("usernameWrap")
        .classList
        .add("hidden");


    $("authBtn")
        .textContent =
        "Войти";

};


$("signupTab").onclick =
function(){

    authMode =
        "signup";


    $("signupTab")
        .classList
        .add("active");


    $("loginTab")
        .classList
        .remove("active");


    $("usernameWrap")
        .classList
        .remove("hidden");


    $("authBtn")
        .textContent =
        "Создать аккаунт";

};


/* =========================================================
   LOGIN / SIGNUP
========================================================= */

$("authBtn").onclick =
async function(){

    $("authMsg")
        .textContent =
        "Подождите…";


    try{

        const email =
            $("email")
                .value
                .trim();


        const password =
            $("password")
                .value;


        if(
            !email ||
            !password
        ){

            throw Error(
                "Введите email и пароль."
            );

        }


        /* LOGIN */

        if(
            authMode ===
            "login"
        ){

            const q =
                await sb.auth
                    .signInWithPassword({

                        email:email,

                        password:password

                    });


            if(q.error){
                throw q.error;
            }

        }


        /* SIGNUP */

        else{

            const name =
                $("username")
                    .value
                    .trim();


            if(!name){

                throw Error(
                    "Введите имя."
                );

            }


            const q =
                await sb.auth
                    .signUp({

                        email:email,

                        password:password,

                        options:{

                            data:{
                                username:name
                            }

                        }

                    });


            if(q.error){
                throw q.error;
            }


            /*
             * Confirm email выключен
             * в Supabase, поэтому session
             * должна появиться сразу.
             */

            if(q.data.session){

                await boot(
                    q.data.user
                );

            }else{

                $("authMsg")
                    .textContent =
                    "Регистрация выполнена. Если вход не произошёл, проверь настройки Email в Supabase.";

            }

        }


    }catch(e){

        $("authMsg")
            .textContent =
            e.message ||
            "Ошибка";

    }

};


/* =========================================================
   GPS
========================================================= */

function startGPS(){

    if(
        !navigator.geolocation
    ){

        status(
            "GPS не поддерживается",
            false
        );

        return;

    }


    if(!sharing){

        status(
            "Геолокация выключена",
            false
        );

        return;

    }


    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    watchId =
        navigator.geolocation.watchPosition(

            onPosition,

            onGeoError,

            {

                enableHighAccuracy:true,

                maximumAge:2000,

                timeout:15000

            }

        );


    status(
        "Получаем GPS…",
        true
    );

}


/* =========================================================
   GPS POSITION
========================================================= */

async function onPosition(p){

    const c =
        p.coords;


    let speed =
        Number.isFinite(
            c.speed
        )
        ? Math.max(
            0,
            c.speed
        )
        : null;


    /*
     * Если браузер сам
     * не сообщил скорость,
     * рассчитываем её по
     * предыдущей точке.
     */

    if(
        speed === null &&
        last
    ){

        const seconds =
            (p.timestamp -
             last.time) / 1000;


        if(seconds > 0){

            speed =
                haversine(

                    last.lat,
                    last.lng,

                    c.latitude,
                    c.longitude

                ) / seconds;

        }

    }


    speed =
        (speed ?? 0) * 3.6;


    last = {

        lat:c.latitude,

        lng:c.longitude,

        time:p.timestamp,

        speed:speed

    };


    /* TRAIL */

    myTrail.push(
        [
            c.latitude,
            c.longitude
        ]
    );


    if(
        myTrail.length > 45
    ){

        myTrail.shift();

    }


    /* SPEED */

    $("mySpeed")
        .textContent =
        speed.toFixed(1) +
        " км/ч";


    status(
        "GPS в реальном времени",
        true
    );


    /* MARKER */

    if(!myMarker){

        myMarker =
            L.marker(

                [
                    c.latitude,
                    c.longitude
                ],

                {

                    icon:
                        icon(
                            profile.avatar_url,
                            speed,
                            true
                        ),

                    zIndexOffset:1000

                }

            ).addTo(map);


        map.setView(
            [
                c.latitude,
                c.longitude
            ],
            16
        );

    }else{

        myMarker.setLatLng(
            [
                c.latitude,
                c.longitude
            ]
        );


        myMarker.setIcon(
            icon(
                profile.avatar_url,
                speed,
                true
            )
        );

    }


    redrawTrails();


    /* SEND LOCATION TO SUPABASE */

    const q =
        await sb
            .from("locations")
            .upsert({

                user_id:user.id,

                latitude:
                    c.latitude,

                longitude:
                    c.longitude,

                accuracy:
                    c.accuracy || 0,

                speed:speed,

                updated_at:
                    new Date()
                        .toISOString()

            });


    if(q.error){

        console.warn(
            q.error
        );

    }

}

/* =========================================================
   LOAD FRIENDS
========================================================= */

async function loadFriends(){

    const q =
        await sb.rpc(
            "get_my_friends"
        );


    if(q.error){

        console.warn(
            q.error
        );

        return;

    }


    friends =
        q.data || [];


    for(
        const friend of friends
    ){

        if(
            !friendTrails.has(
                friend.id
            )
        ){

            friendTrails.set(
                friend.id,
                []
            );

        }

    }


    const locations =
        await sb.rpc(
            "get_friend_locations"
        );


    if(
        locations.data
    ){

        locations.data.forEach(
            updateFriend
        );

    }

}


/* =========================================================
   UPDATE FRIEND
========================================================= */

function updateFriend(x){

    const id =
        x.user_id;


    if(
        !id ||
        id === user.id
    ){

        return;

    }


    const lat =
        Number(x.latitude);


    const lng =
        Number(x.longitude);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    /* TRAIL */

    const trail =
        friendTrails.get(id) || [];


    trail.push(
        [
            lat,
            lng
        ]
    );


    if(
        trail.length > 35
    ){

        trail.shift();

    }


    friendTrails.set(
        id,
        trail
    );


    /* FRIEND DATA */

    const f =
        friends.find(
            v => v.id === id
        );


    const speed =
        Number(
            x.speed || 0
        );


    const name =
        f?.username ||
        x.username ||
        "Друг";


    const avatarUrl =
        f?.avatar_url ||
        x.avatar_url;


    /* MARKER */

    let marker =
        friendMarkers.get(id);


    if(!marker){

        marker =
            L.marker(

                [
                    lat,
                    lng
                ],

                {

                    icon:
                        icon(
                            avatarUrl,
                            speed,
                            false
                        )

                }

            ).addTo(map);


        marker.bindPopup(

            `<b>
                ${esc(name)}
            </b>
            <br>
            🚀 ${speed.toFixed(1)} км/ч`

        );


        friendMarkers.set(
            id,
            marker
        );

    }else{

        marker.setLatLng(
            [
                lat,
                lng
            ]
        );


        marker.setIcon(
            icon(
                avatarUrl,
                speed,
                false
            )
        );


        if(
            marker.getPopup()
        ){

            marker
                .getPopup()
                .setContent(

                    `<b>
                        ${esc(name)}
                    </b>
                    <br>
                    🚀 ${speed.toFixed(1)} км/ч`

                );

        }

    }


    redrawTrails();

}


/* =========================================================
   REALTIME
========================================================= */

function subscribe(){

    if(channel){

        sb.removeChannel(
            channel
        );

    }


    channel =
        sb
            .channel(
                "blink-location-stream"
            )

            .on(

                "postgres_changes",

                {

                    event:"INSERT",

                    schema:"public",

                    table:"locations"

                },

                function(payload){

                    if(
                        payload.new.user_id !==
                        user.id
                    ){

                        updateFriend(
                            payload.new
                        );

                    }

                }

            )

            .on(

                "postgres_changes",

                {

                    event:"UPDATE",

                    schema:"public",

                    table:"locations"

                },

                function(payload){

                    if(
                        payload.new.user_id !==
                        user.id
                    ){

                        updateFriend(
                            payload.new
                        );

                    }

                }

            )

            .subscribe();

}

/* =========================================================
   AVATAR UPLOAD
========================================================= */

async function uploadAvatar(e){

    const file =
        e.target.files?.[0];


    if(!file){
        return;
    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        toast(
            "Выбери изображение."
        );

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        toast(
            "Файл должен быть меньше 5 МБ."
        );

        return;

    }


    toast(
        "Загрузка фотографии…"
    );


    const path =
        user.id + ".jpg";


    const q =
        await sb
            .storage
            .from("avatars")
            .upload(

                path,
                file,

                {

                    upsert:true,

                    contentType:
                        file.type,

                    cacheControl:
                        "3600"

                }

            );


    if(q.error){

        toast(
            "Ошибка: " +
            q.error.message
        );

        return;

    }


    const url =
        sb
            .storage
            .from("avatars")
            .getPublicUrl(path)
            .data
            .publicUrl
        + "?v=" +
        Date.now();


    const update =
        await sb
            .from("profiles")
            .update({

                avatar_url:url

            })
            .eq(
                "id",
                user.id
            );


    if(update.error){

        toast(
            "Ошибка: " +
            update.error.message
        );

        return;

    }


    profile.avatar_url =
        url;


    $("profileAvatar").src =
        url;


    if(myMarker){

        myMarker.setIcon(

            icon(
                url,
                last?.speed || 0,
                true
            )

        );

    }


    toast(
        "Фотография сохранена."
    );

}

            .value
            .trim();

        toast(
            "Нужно 4 цифры."
        );

    const q =
        await sb.rpc(

            "send_friend_request_by_code",

            {

    if(q.error){

        toast(
            q.error.message
        );

        return;

    toast(

}

/* =========================================================
   TOGGLE LOCATION
========================================================= */

async function toggleLocation(){

    sharing =
        !sharing;


    const q =
        await sb
            .from("profiles")
            .update({

                location_sharing_enabled:
                    sharing

            })
            .eq(
                "id",
                user.id
            );


    if(q.error){

        sharing =
            !sharing;


        toast(
            q.error.message
        );

        return;

    }


    if(sharing){

        startGPS();

    }else{

        if(
            watchId !== null
        ){

            navigator
                .geolocation
                .clearWatch(
                    watchId
                );

        }


        watchId =
            null;


        await sb
            .from("locations")
            .delete()
            .eq(
                "user_id",
                user.id
            );


        if(myMarker){

            map.removeLayer(
                myMarker
            );

            myMarker =
                null;

        }


        myTrail = [];


        redrawTrails();


        status(
            "Геолокация выключена",
            false
        );

    }


    renderSettings();

}
