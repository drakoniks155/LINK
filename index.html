<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Blink</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #080808;
  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}


/* =========================================================
   AUTH SCREEN
========================================================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 0%,
      #242424 0%,
      #090909 50%,
      #000 100%
    );
}

.auth-card {
  width: 100%;
  max-width: 430px;

  padding: 28px 22px;

  background:
    rgba(15,15,15,.96);

  border:
    1px solid #333;

  border-radius: 30px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.7);
}

.logo {
  font-size: 34px;
  font-weight: 1000;
  letter-spacing: 3px;
  text-align: center;

  margin-bottom: 5px;
}

.logo-sub {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-bottom: 25px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 6px;

  padding: 5px;

  background: #111;

  border-radius: 15px;

  margin-bottom: 18px;
}

.auth-tab {
  border: 0;

  padding: 11px;

  border-radius: 11px;

  background: transparent;

  color: #777;

  font-weight: 800;
}

.auth-tab.active {
  background: white;
  color: black;
}

.auth-error {
  display: none;

  padding: 11px;

  margin-bottom: 12px;

  border-radius: 12px;

  background: #321313;

  border: 1px solid #642525;

  color: #ff9b9b;

  font-size: 13px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  position: fixed;

  z-index: 2000;

  top: 12px;
  left: 12px;
  right: 12px;

  display: flex;
  justify-content: space-between;

  pointer-events: none;
}

.badge {
  background:
    rgba(7,7,7,.91);

  backdrop-filter:
    blur(16px);

  border:
    1px solid #333;

  border-radius:
    18px;

  padding:
    10px 14px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.5);
}

.brand {
  font-weight: 1000;
  letter-spacing: 1px;
}

.status {
  font-size: 12px;
}

.dot {
  display: inline-block;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #666;

  margin-right: 7px;
}

.dot.live {
  background: #4cff8a;

  box-shadow:
    0 0 12px #4cff8a;
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.map-controls {
  position: fixed;

  z-index: 2000;

  right: 13px;
  top: 125px;

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.map-control {
  width: 50px;
  height: 50px;

  border:
    1px solid #333;

  border-radius: 16px;

  background: #050505;

  color: white;

  font-size: 21px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.55);
}

.map-control.big {
  font-size: 28px;
  font-weight: 900;
}


/* =========================================================
   MAP STYLE MENU
========================================================= */

.map-style-box {
  position: relative;
}

.map-styles {
  position: absolute;

  right: 58px;
  top: 0;

  width: 165px;

  padding: 6px;

  background:
    rgba(5,5,5,.97);

  border:
    1px solid #333;

  border-radius: 16px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.7);
}

.map-styles button {
  width: 100%;

  border: 0;

  background: transparent;

  color: white;

  text-align: left;

  padding: 11px;

  border-radius: 10px;

  font-weight: 700;
}

.map-styles button:hover {
  background: #222;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom {
  position: fixed;

  z-index: 2500;

  left: 10px;
  right: 10px;
  bottom: 10px;

  padding: 7px;

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 5px;

  background:
    rgba(8,8,8,.96);

  border:
    1px solid #333;

  border-radius: 24px;

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.7);
}

.nav {
  border: 0;

  background: transparent;

  color: #777;

  border-radius: 17px;

  padding: 7px 2px;
}

.nav.active {
  background: white;
  color: black;
}

.nav .icon {
  display: block;
  font-size: 18px;
}

.nav .txt {
  display: block;

  margin-top: 2px;

  font-size: 9px;

  font-weight: 900;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
  position: fixed;

  z-index: 5000;

  inset: 0;

  display: flex;

  align-items: flex-end;

  background:
    rgba(0,0,0,.62);

  backdrop-filter:
    blur(5px);
}

.sheet {
  width: 100%;

  max-height: 88dvh;

  overflow-y: auto;

  padding: 18px 16px 35px;

  background: #0d0d0d;

  border:
    1px solid #292929;

  border-radius:
    28px 28px 0 0;
}

.handle {
  width: 42px;
  height: 4px;

  background: #444;

  border-radius: 10px;

  margin:
    0 auto 17px;
}

.close {
  float: right;

  width: 36px;
  height: 36px;

  border: 0;

  border-radius: 50%;

  background: #222;

  color: white;

  font-size: 22px;
}


/* =========================================================
   INPUTS
========================================================= */

.field {
  margin: 12px 0;
}

.field label {
  display: block;

  color: #aaa;

  font-size: 12px;

  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;

  padding: 13px;

  outline: none;

  background: #171717;

  color: white;

  border:
    1px solid #333;

  border-radius: 14px;
}

textarea {
  min-height: 90px;
  resize: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #777;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn {
  width: 100%;

  border: 0;

  border-radius: 15px;

  padding: 13px;

  background: white;

  color: black;

  font-weight: 900;

  margin-top: 8px;
}

.btn.secondary {
  background: #222;

  color: white;

  border:
    1px solid #333;
}

.btn.danger {
  background: #351515;

  color: #ff9292;

  border:
    1px solid #552222;
}

.btn.small {
  width: auto;

  padding: 9px 12px;

  margin: 0;
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.grow {
  flex: 1;
}


/* =========================================================
   PROFILE
========================================================= */

.profile {
  display: flex;

  align-items: center;

  gap: 14px;

  margin: 15px 0;
}

.avatar {
  width: 70px;
  height: 70px;

  min-width: 70px;

  object-fit: cover;

  border-radius: 50%;

  background: #222;

  border:
    2px solid white;
}

.avatar.small {
  width: 46px;
  height: 46px;

  min-width: 46px;

  border-width: 1px;
}

.code {
  color: #888;

  font-size: 12px;

  margin-top: 4px;
}

.note {
  color: #777;

  font-size: 12px;

  line-height: 1.5;

  margin-top: 15px;
}


/* =========================================================
   FRIEND
========================================================= */

.friend {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px 0;

  border-bottom:
    1px solid #252525;
}

.friend-name {
  font-weight: 900;
}

.online-dot {
  display: inline-block;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #555;

  margin-left: 4px;
}

.online-dot.online {
  background: #4cff8a;

  box-shadow:
    0 0 8px #4cff8a;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
  text-align: center;

  color: #777;

  padding: 30px 15px;

  line-height: 1.6;
}


/* =========================================================
   PLACES
========================================================= */

.place-item {
  display: flex;

  align-items: center;

  gap: 11px;

  padding: 12px 0;

  border-bottom:
    1px solid #252525;
}

.place-icon {
  width: 46px;
  height: 46px;

  min-width: 46px;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #171717;

  border:
    1px solid #333;

  border-radius: 14px;

  font-size: 21px;
}

.place-name {
  font-size: 15px;
  font-weight: 900;
}

.place-type {
  margin-top: 3px;

  color: #777;

  font-size: 11px;
}


/* =========================================================
   PLACE MARKER
========================================================= */

.place-marker {
  width: 44px;
  height: 44px;

  display: flex;

  align-items: center;
  justify-content: center;

  border:
    2px solid white;

  border-radius: 50%;

  background: #080808;

  font-size: 21px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.65);
}


/* =========================================================
   USER MARKER
========================================================= */

.pin {
  position: relative;

  width: 48px;
  height: 48px;

  border:
    3px solid white;

  border-radius: 50%;

  background: #222;

  box-shadow:
    0 5px 20px rgba(0,0,0,.65);
}

.pin img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.ring {
  position: absolute;

  inset: -8px;

  border:
    2px solid white;

  border-radius: 50%;

  animation:
    pulse 1.5s infinite;
}

@keyframes pulse {

  50% {
    transform: scale(1.2);
    opacity: .15;
  }

}

.speed-label {
  position: absolute;

  top: 53px;

  left: 50%;

  transform:
    translateX(-50%);

  white-space: nowrap;

  padding:
    3px 7px;

  background: #000;

  border:
    1px solid #333;

  border-radius: 8px;

  font-size: 10px;

  font-weight: 900;
}

.direction-arrow {
  position: absolute;

  left: 50%;
  top: -27px;

  transform:
    translateX(-50%);

  font-size: 18px;

  text-shadow:
    0 2px 5px #000;
}


/* =========================================================
   CHAT
========================================================= */

.chat-list {
  margin-top: 5px;
}

.chat-item {
  display: flex;

  align-items: center;

  gap: 11px;

  padding: 13px 0;

  border-bottom:
    1px solid #252525;

  cursor: pointer;
}

.chat-last {
  color: #777;

  font-size: 11px;

  margin-top: 4px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.messages {
  max-height: 48dvh;

  overflow-y: auto;

  padding: 5px 0;
}

.message {
  display: flex;

  margin: 7px 0;
}

.message.mine {
  justify-content: flex-end;
}

.message-bubble {
  max-width: 78%;

  padding: 10px 12px;

  border-radius: 16px;

  background: #222;

  font-size: 13px;

  line-height: 1.35;
}

.message.mine .message-bubble {
  background: white;
  color: black;
}

.message-time {
  margin-top: 3px;

  font-size: 9px;

  opacity: .5;
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

.notification {
  padding: 13px 0;

  border-bottom:
    1px solid #252525;
}

.notification.unread {
  border-left:
    3px solid white;

  padding-left: 10px;
}

.notification-title {
  font-weight: 900;
}

.notification-body {
  color: #999;

  font-size: 12px;

  margin-top: 4px;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  z-index: 9000;

  left: 50%;

  bottom: 92px;

  transform:
    translateX(-50%);

  max-width: 90%;

  padding: 11px 15px;

  background: white;

  color: black;

  border-radius: 14px;

  font-size: 13px;

  font-weight: 900;

  text-align: center;

  box-shadow:
    0 10px 35px rgba(0,0,0,.5);
}


/* =========================================================
   LOADER
========================================================= */

.loader {
  width: 22px;
  height: 22px;

  border:
    3px solid #333;

  border-top-color: white;

  border-radius: 50%;

  animation:
    spin .7s linear infinite;

  margin: 15px auto;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

  .bottom {
    width: 560px;

    left: 50%;
    right: auto;

    transform:
      translateX(-50%);
  }

  .panel {
    align-items: center;
    justify-content: center;
  }

  .sheet {
    width: 540px;

    max-height: 82vh;

    border-radius: 28px;
  }

}

</style>

</head>

<body>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ytmdvlqcrqqeblxbnzno.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser =
  null;

let myProfile =
  null;

let friends =
  [];

let friendLocations =
  [];

let notifications =
  [];

let chats =
  [];

let messages =
  [];

let currentChatId =
  null;

let realtimeChannels =
  [];


/* =========================================================
   LOCAL UI DATA
========================================================= */

let locationEnabled =
  localStorage.getItem(
    "blink_location"
  ) !== "off";

let watchId =
  null;

let marker =
  null;

let lastPosition =
  null;

let placeMarkers =
  {};

let savedPlaces =
  JSON.parse(
    localStorage.getItem(
      "blink_places"
    ) || "[]"
  );


/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map")
   .setView(
     [0,0],
     2
   );


const lightMap =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }
  );


const darkMap =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      attribution: "© OpenStreetMap © CARTO"
    }
  );


const satelliteMap =
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "© Esri"
    }
  );


const labelsMap =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      attribution: "© OpenStreetMap © CARTO"
    }
  );


let currentMapStyle =
  localStorage.getItem(
    "blink_map_style"
  ) || "dark";


function setMapStyle(style) {

  [
    lightMap,
    darkMap,
    satelliteMap,
    labelsMap
  ].forEach(layer => {

    if (
      map.hasLayer(layer)
    ) {

      map.removeLayer(layer);

    }

  });


  if (
    style === "light"
  ) {

    lightMap.addTo(map);

  }


  if (
    style === "dark"
  ) {

    darkMap.addTo(map);

  }


  if (
    style === "hybrid"
  ) {

    satelliteMap.addTo(map);

    labelsMap.addTo(map);

  }


  currentMapStyle =
    style;


  localStorage.setItem(
    "blink_map_style",
    style
  );


  document.getElementById(
    "mapStyles"
  ).style.display =
    "none";

}


setMapStyle(
  currentMapStyle
);


function toggleMapStyles() {

  const menu =
    document.getElementById(
      "mapStyles"
    );


  menu.style.display =
    menu.style.display === "none"
      ? "block"
      : "none";

}


function zoomIn() {
  map.zoomIn();
}

/* =========================================================
   AUTH
========================================================= */

async function submitAuth() {

  hideAuthError();


  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "authPassword"
    ).value;


  if (
    !email ||
    !password
  ) {

    showAuthError(
      "Заполни email и пароль."
    );

    return;

  }


  const button =
    document.getElementById(
      "authButton"
    );


  button.disabled =
    true;


  button.textContent =
    "Подождите…";


  try {

    if (
      authMode === "register"
    ) {

      const name =
        document.getElementById(
          "authName"
        ).value.trim()
        || "Пользователь";


      if (
        password.length < 6
      ) {

        throw new Error(
          "Пароль должен содержать минимум 6 символов."
        );

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email,
          password,

          options: {

            data: {
              username: name
            }

          }

        });


      if (
        error
      ) {

        throw error;

      }


      if (
        data.user
      ) {

        currentUser =
          data.user;

      }


      toast(
        "Аккаунт создан."
      );


      if (
        !data.session
      ) {

        showAuthError(
          "Проверь почту и подтверди регистрацию."
        );

        return;

      }

    }

    else {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if (
        error
      ) {

        throw error;

      }


      currentUser =
        data.user;

    }


    await initializeApp();

  }

  catch(error) {

    console.error(
      error
    );


    showAuthError(
      translateAuthError(
        error.message
      )
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      authMode === "register"
        ? "Создать аккаунт"
        : "Войти";

  }

}


function translateAuthError(
  message
) {

  if (
    message.includes(
      "Invalid login credentials"
    )
  ) {

    return "Неверный email или пароль.";

  }


  if (
    message.includes(
      "already registered"
    )
  ) {

    return "Этот email уже зарегистрирован.";

  }


  return message;

}

  for (
    let i = 0;
    i < 20;
    i++
  ) {

    const code =
      String(
        Math.floor(
          1000 +
          Math.random() * 9000
        )
      );


    const {
      data
    } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq(
          "friend_code",
          code
        )
        .maybeSingle();


    if (
      !data
    ) {

      return code;

    }

  }


  throw new Error(
    "Не удалось создать код."
  );

/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (
    !locationEnabled
  ) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }


  if (
    !navigator.geolocation
  ) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  setStatus(
    "Получаем GPS…",
    true
  );


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      onPositionError,

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      }

    );

}


async function onPosition(
  position
) {

  const c =
    position.coords;


  let speedMs =
    Number.isFinite(c.speed)
      ? Math.max(
          0,
          c.speed
        )
      : null;


  let direction =
    lastPosition
      ? lastPosition.direction
      : 0;


  if (
    lastPosition
  ) {

    const seconds =
      (
        position.timestamp -
        lastPosition.time
      ) / 1000;


    if (
      seconds > 0
    ) {

      const meters =
        calculateDistance(

          lastPosition.lat,
          lastPosition.lng,

          c.latitude,
          c.longitude

        );


      if (
        speedMs === null
      ) {

        speedMs =
          meters /
          seconds;

      }


      if (
        meters > 1
      ) {

        direction =
          calculateBearing(

            lastPosition.lat,
            lastPosition.lng,

            c.latitude,
            c.longitude

          );

      }

    }

  }


  const speedKmh =
    (speedMs || 0) * 3.6;


  lastPosition = {

    lat:
      c.latitude,

    lng:
      c.longitude,

    time:
      position.timestamp,

    direction:
      direction,

    speed:
      speedKmh

  };


  updateUserMarker(
    c.latitude,
    c.longitude,
    speedKmh,
    direction
  );


  setStatus(
    "GPS • " +
    directionName(direction),
    true
  );


  await saveMyLocation(

    c.latitude,
    c.longitude,

    c.accuracy,

    speedKmh,

    direction

  );

}


function updateUserMarker(
  lat,
  lng,
  speed,
  direction
) {

  if (
    !marker
  ) {

    marker =
      L.marker(

        [
          lat,
          lng
        ],

        {
          icon:
            userIcon(
              speed,
              direction
            ),

          zIndexOffset:
            1000
        }

      ).addTo(map);


    marker.bindPopup(
      userPopup(
        speed,
        direction
      )
    );


    map.setView(
      [lat,lng],
      16
    );

  }

  else {

    marker.setLatLng(
      [lat,lng]
    );


    marker.setIcon(
      userIcon(
        speed,
        direction
      )
    );


    marker
      .getPopup()
      .setContent(
        userPopup(
          speed,
          direction
        )
      );

  }

}

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2-lat1)*rad;

  const dLon =
    (lon2-lon1)*rad;


  const a =

    Math.sin(dLat/2)**2

    +

    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *
    Math.sin(dLon/2)**2;


  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );

}


/* =========================================================
   BEARING
========================================================= */

function calculateBearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const rad =
    Math.PI / 180;


  const y =
    Math.sin(
      (lon2-lon1)*rad
    )
    *
    Math.cos(
      lat2*rad
    );


  const x =

    Math.cos(
      lat1*rad
    )
    *
    Math.sin(
      lat2*rad
    )

    -

    Math.sin(
      lat1*rad
    )
    *
    Math.cos(
      lat2*rad
    )
    *
    Math.cos(
      (lon2-lon1)*rad
    );


  return (
    Math.atan2(y,x)
    * 180 /
    Math.PI
    + 360
  ) % 360;

}


function directionName(
  degrees
) {

  const names = [
    "С",
    "СВ",
    "В",
    "ЮВ",
    "Ю",
    "ЮЗ",
    "З",
    "СЗ"
  ];


  return names[
    Math.round(
      degrees / 45
    ) % 8
  ];

}

async function handlePhotoChange(
  event
) {

  const file =
    event.target.files[0];


  if (
    !file
  ) {

    return;

  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    toast(
      "Фото должно быть меньше 5 МБ."
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    async function() {

      try {

        const dataUrl =
          reader.result;


        const {
          error
        } =
          await supabaseClient
            .from("profiles")
            .update({

              avatar_url:
                dataUrl

            })
            .eq(
              "id",
              currentUser.id
            );


        if (
          error
        ) {

          throw error;

        }


        myProfile.avatar_url =
          dataUrl;


        const preview =
          document.getElementById(
            "profilePreview"
          );


        if (
          preview
        ) {

          preview.src =
            dataUrl;

        }


        if (
          marker
        ) {

          marker.setIcon(

            userIcon(

              lastPosition
                ? lastPosition.speed
                : 0,

              lastPosition
                ? lastPosition.direction
                : 0

            )

          );

        }


        toast(
          "Фотография сохранена."
        );

      }

      catch(error) {

        console.error(
          error
        );

        toast(
          "Не удалось сохранить фото."
        );

      }

    };

async function loadMessages(
  chatId
) {

  try {

    const {
      data,
      error
    } =

        "get_chat_messages",
        {
          p_chat_id:
            chatId
        }
      );


    if (
      error
    ) {

      throw error;

    }


    messages =

  }

  catch(error) {

    );

}


async function openChat(
  chatId
) {

    chatId;


  await loadMessages(
    chatId
  );


  renderChat();

}


function renderChat() {

  let html =
    "";


  messages.forEach(
    message => {

      const mine =
        message.sender_id ===
        currentUser.id;


      html += `

        <div class="message ${
          mine ? "mine" : ""
        }">

          <div class="message-bubble">

            ${escapeHtml(
              message.body
            )}

            <div class="message-time">

              ${formatTime(
                message.created_at
              )}

            </div>

          </div>

        </div>

      `;

    }

  );


  if (
    !html
  ) {

    html = `

      <div class="empty">
        Начните общение 👋
      </div>

    `;

  }


  openPanel(`

    <button
      class="close"
      onclick="showChats()"
    >
      ×
    </button>


    <h2>
      💬 Чат
    </h2>


    <div
      id="messages"
      class="messages"
    >
      ${html}
    </div>


    <div class="row">

      <input
        id="messageInput"
        maxlength="1000"
        placeholder="Написать сообщение…"
        onkeydown="
          if(event.key === 'Enter')
            sendMessage();
        "
      >

      <button
        class="btn small"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  `);


  const box =
    document.getElementById(
      "messages"
    );


  if (
    box
  ) {

    box.scrollTop =
      box.scrollHeight;

  }

}


async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );


  if (
    !input
  ) {

    return;

  }


  const body =
    input.value.trim();


  if (
    !body ||
    !currentChatId
  ) {

    return;

  }


  input.value =
    "";


  try {

    const {
      error
    } =
      await supabaseClient.rpc(
        "send_message",
        {
          p_chat_id:
            currentChatId,

          p_body:
            body
        }
      );


    if (
      error
    ) {

      throw error;

    }


    await loadMessages(
      currentChatId
    );


    renderChat();

  }

  catch(error) {

    console.error(
      error
    );

    toast(
      error.message ||
      "Не удалось отправить."
    );

  }

}

function confirmNewPlace(
  lat,
  lng
) {

  const name =
    document.getElementById(
      "placeName"
    ).value.trim();


  const type =
    document.getElementById(
      "placeType"
    ).value;


  if (
    !name
  ) {

    toast(
      "Введи название."
    );

    return;

  }


  const place = {

    id:
      Date.now().toString(),

    name:
      name,

    type:
      type,

    lat:
      lat,

    lng:
      lng

  };


  savedPlaces.push(
    place
  );


  localStorage.setItem(

    "blink_places",

    JSON.stringify(
      savedPlaces
    )

  );


  renderSavedPlaces();

  closePanel();


  toast(
    "Место сохранено."
  );


  map.setView(
    [lat,lng],
    17
  );

}


function renderSavedPlaces() {

  Object.values(
    placeMarkers
  ).forEach(
    marker => {

      if (
        map.hasLayer(marker)
      ) {

        map.removeLayer(marker);

      }

    }
  );


  placeMarkers =
    {};


  savedPlaces.forEach(
    place => {

      const data =
        placeTypes[
          place.type
        ] ||
        placeTypes.other;


      const marker =
        L.marker(

          [
            place.lat,
            place.lng
          ],

          {
            icon:
              placeIcon(
                place.type
              ),

            zIndexOffset:
              500
          }

        ).addTo(map);


      marker.bindPopup(`

        <b>
          ${escapeHtml(
            place.name
          )}
        </b>

        <br>

        ${data.icon}
        ${data.name}

        <br><br>

        <button
          class="popup-delete"
          onclick="
            deletePlace('${place.id}')
          "
        >
          Удалить
        </button>

      `);


      placeMarkers[
        place.id
      ] =
        marker;

    }
  );

}


function placeIcon(
  type
) {

  const data =
    placeTypes[
      type
    ] ||
    placeTypes.other;


  return L.divIcon({

    className: "",

    html:

      '<div class="place-marker">' +

        data.icon +

      '</div>',

    iconSize:
      [44,44],

    iconAnchor:
      [22,22]

  });

}


function deletePlace(
  id
) {

  savedPlaces =
    savedPlaces.filter(
      place =>
        place.id !== id
    );


  localStorage.setItem(

    "blink_places",

    JSON.stringify(
      savedPlaces
    )

  );


  if (
    placeMarkers[id]
  ) {

    map.removeLayer(
      placeMarkers[id]
    );

    delete placeMarkers[id];

  }


  toast(
    "Место удалено."
  );

}


function showPlaces() {

  let html =
    "";


  savedPlaces.forEach(
    place => {

      const data =
        placeTypes[
          place.type
        ] ||
        placeTypes.other;


      html += `

        <div class="place-item">

          <div class="place-icon">
            ${data.icon}
          </div>

          <div class="grow">

            <div class="place-name">

              ${escapeHtml(
                place.name
              )}

            </div>

            <div class="place-type">

              ${data.name}

            </div>

          </div>

          <button
            class="btn secondary small"
            onclick="
              focusPlace('${place.id}')

          >
            👁️
          </button>

          <button
            class="btn danger small"
            onclick="
              deletePlace('${place.id}');
              showPlaces();
            "
          >
            ×
          </button>

        </div>

      `;

    }
  );


  if (
    !html
  ) {

    html = `

      <div class="empty">

        Пока нет сохранённых мест.

        <br><br>

        Нажми «Добавить место»,
        затем выбери точку на карте.

      </div>

    `;

  }


  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>


    <h2>
      📍 Мои места
    </h2>


    <button
      class="btn"
      onclick="startAddingPlace()"
    >
      ＋ Добавить место
    </button>

}


function focusPlace(

) {

  const place =
    savedPlaces.find(

async function logout() {

  try {

    if (
      watchId !== null
    ) {

      navigator.geolocation
        .clearWatch(
          watchId
        );

    }


    realtimeChannels.forEach(
      channel => {

        supabaseClient
          .removeChannel(
            channel
          );

      }
    );


    await supabaseClient.auth.signOut();


    location.reload();

  }

  catch(error) {

    console.error(
      error
    );

  }

}


/* =========================================================
   REALTIME
========================================================= */

function startRealtime() {

  if (
    !currentUser
  ) {

    return;

  }


  realtimeChannels.forEach(
    channel => {

      supabaseClient
        .removeChannel(
          channel
        );

    }
  );


  realtimeChannels =
    [];


  const notificationsChannel =
    supabaseClient
      .channel(
        "blink-notifications-" +
        currentUser.id
      )
      .on(

        "postgres_changes",

        {

          event: "INSERT",

          schema: "public",

          table: "notifications",

          filter:
            "user_id=eq." +
            currentUser.id

        },

        payload => {

          notifications.unshift(
            payload.new
          );


          toast(
            payload.new.title ||
            "Новое уведомление"
          );

        }

      )
      .subscribe();


  realtimeChannels.push(
    notificationsChannel
  );


  const locationChannel =
    supabaseClient
      .channel(
        "blink-locations"
      )
      .on(

        "postgres_changes",

        {

          event: "*",

          schema: "public",

          table: "locations"

        },

        async () => {

          await loadFriendLocations();

        }

      )
      .subscribe();


  realtimeChannels.push(
    locationChannel
  );


  const messagesChannel =
    supabaseClient
      .channel(
        "blink-messages"
      )
      .on(

        "postgres_changes",

        {

          event: "INSERT",

          schema: "public",

          table: "messages"

        },

        async payload => {

          if (
            currentChatId &&
            payload.new.chat_id ===
            currentChatId
          ) {

            await loadMessages(
              currentChatId
            );


            renderChat();

          }

        }

      )
      .subscribe();


  realtimeChannels.push(
    messagesChannel
  );


  const requestsChannel =
    supabaseClient
      .channel(
        "blink-friend-requests-" +
        currentUser.id
      )
      .on(

        "postgres_changes",

        {

          event: "*",

          schema: "public",

          table: "friend_requests"

        },

        () => {

          loadFriends();

        }

      )
      .subscribe();


  realtimeChannels.push(
    requestsChannel
  );

}

  document.getElementById(
    "panel"
  ).style.display =
    "none";

}


document.getElementById(
  "panel"
).onclick =
  function(event) {

    if (
      event.target.id ===
      "panel"
    ) {

      closePanel();

    }

  };


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(".nav")
  .forEach(button => {

    button.onclick =
      async function() {

        document
          .querySelectorAll(".nav")
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        const page =
          button.dataset.page;


        if (
          page === "map"
        ) {

          closePanel();

          return;

        }


        if (
          page === "friends"
        ) {

          await loadFriends();

          await showFriends();

        }


        if (
          page === "chats"
        ) {

          await loadChats();

          showChats();

        }


        if (
          page === "profile"
        ) {

          showProfile();

        }


        if (
          page === "settings"
        ) {

          showSettings();

        }

      };

  });


/* =========================================================
   HELPERS
========================================================= */

function avatar(
  src
) {

  if (
    src
  ) {

    return src;

  }


  return (

    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(

      '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +

      '<rect width="160" height="160" fill="#222"/>' +

      '<text x="80" y="108" text-anchor="middle" font-size="70" fill="white">👤</text>' +

      '</svg>'

    )

  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#039;"

    })[character]
  );

}


function formatTime(
  date
) {

  if (
    !date
  ) {

    return "";

  }


  return new Date(
    date
  ).toLocaleTimeString(
    "ru-RU",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


function toast(
  text
) {

  const box =
    document.getElementById(
      "toast"
    );


  box.textContent =
    text;


  box.style.display =
    "block";


  clearTimeout(
    window.blinkToast
  );


  window.blinkToast =
    setTimeout(
      () => {

        box.style.display =
          "none";

      },
      2500
    );

}


function setStatus(
  text,
  live
) {

  document.getElementById(
    "statusText"
  ).textContent =
    text;


  document.getElementById(
    "statusDot"
  ).classList.toggle(
    "live",
    Boolean(live)
  );

}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (
      event === "SIGNED_OUT"
    ) {

      currentUser =
        null;

      return;

    }


    if (
      session?.user &&
      !currentUser
    ) {

      currentUser =
        session.user;

      await initializeApp();

    }

  }
);


/* =========================================================
   START
========================================================= */

checkSession();

</script>
