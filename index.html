<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #0a0a0c; color: #fff; }
        #map { height: 100vh; width: 100%; }
        .me-label { font-size: 12px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 10px; color: white; margin-top: 4px; }
        .me-marker { display: flex; flex-direction: column; align-items: center; }
        .me-dot { width: 32px; height: 32px; background: white; border-radius: 50%; border: 3px solid #1a1a1a; box-shadow: 0 0 20px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .me-arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 14px solid white; margin-top: -2px; }
        .me-ring { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 3px solid #2ecc71; animation: pulse-ring 2s ease-out infinite; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes pulse-ring { 0% { transform: translate(-50%,-50%) scale(0.7); opacity: 0.9; } 70% { transform: translate(-50%,-50%) scale(1.4); opacity: 0; } 100% { opacity: 0; } }
        .map-battery { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 1000; }
        .auth-box { max-width: 400px; margin: 100px auto; padding: 20px; background: #1a1a1e; border-radius: 16px; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0c; color: white; }
        .auth-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: white; color: black; font-weight: bold; cursor: pointer; }
        .auth-box .error { color: #ff5c5c; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>

<!-- ============ ЭКРАН ВХОДА ============ -->
<div id="authScreen">
    <div class="auth-box">
        <h2 style="text-align:center;">LINK</h2>
        <div id="authForm">
            <input type="text" id="regName" placeholder="Имя">
            <input type="email" id="regEmail" placeholder="Почта">
            <input type="password" id="regPass" placeholder="Пароль">
            <button id="registerBtn">Зарегистрироваться</button>
            <hr style="margin:12px 0;border-color:#333;">
            <input type="email" id="loginEmail" placeholder="Почта">
            <input type="password" id="loginPass" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <div id="authError" class="error"></div>
        </div>
    </div>
</div>

<!-- ============ КАРТА ============ -->
<div id="map" style="display:none;"></div>
<div class="map-battery" id="batteryDisplay">🔋 --%</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    (function() {
        "use strict";

        // ============ ДАННЫЕ ============
        let currentUser = null;
        let map = null;
        let userMarker = null;
        let watchId = null;

        // ============ РЕГИСТРАЦИЯ / ВХОД ============
        function generateId() {
            let id;
            const users = JSON.parse(localStorage.getItem('link_users') || '[]');
            do { id = Math.floor(1000 + Math.random() * 9000); }
            while (users.some(u => u.id === id));
            return id;
        }

        function register() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const err = document.getElementById('authError');
            if (pass.length < 6) { err.textContent = 'Пароль минимум 6 символов'; return; }
            const users = JSON.parse(localStorage.getItem('link_users') || '[]');
            if (users.find(u => u.email === email)) { err.textContent = 'Почта уже занята'; return; }
            const id = generateId();
            const user = { id, name, email, pass, friends: [] };
            users.push(user);
            localStorage.setItem('link_users', JSON.stringify(users));
            localStorage.setItem('link_session', JSON.stringify(user));
            startApp(user);
        }

        function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const err = document.getElementById('authError');
            const users = JSON.parse(localStorage.getItem('link_users') || '[]');
            const user = users.find(u => u.email === email && u.pass === pass);
            if (!user) { err.textContent = 'Неверная почта или пароль'; return; }
            localStorage.setItem('link_session', JSON.stringify(user));
            startApp(user);
        }

        document.getElementById('registerBtn').addEventListener('click', register);
        document.getElementById('loginBtn').addEventListener('click', login);

        // ============ ЗАПУСК ПРИЛОЖЕНИЯ ============
        function startApp(user) {
            currentUser = user;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('map').style.display = 'block';
            initMap();
            initBattery();
            getLocation();
        }

        // ============ КАРТА ============
        function initMap() {
            map = L.map('map', { zoomControl: true }).setView([55.75, 37.61], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function createUserMarker(lat, lng) {
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                return;
            }
            const html = `
                <div class="me-marker" style="position:relative;">
                    <div class="me-ring"></div>
                    <div class="me-dot">📍</div>
                    <div class="me-arrow"></div>
                    <div class="me-label">${currentUser.name}</div>
                </div>
            `;
            const icon = L.divIcon({ html, iconSize: [60, 70], iconAnchor: [30, 35] });
            userMarker = L.marker([lat, lng], { icon }).addTo(map);
            map.setView([lat, lng], 16);
        }

        // ============ ГЕОПОЗИЦИЯ ============
        function getLocation() {
            if (!navigator.geolocation) {
                document.getElementById('batteryDisplay').textContent = '⚠️ Геопозиция не поддерживается';
                return;
            }
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    createUserMarker(lat, lng);
                },
                (err) => {
                    document.getElementById('batteryDisplay').textContent = '⚠️ Ошибка геопозиции';
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
            );
        }

        // ============ БАТАРЕЯ ============
        function initBattery() {
            if (navigator.getBattery) {
                navigator.getBattery().then(b => {
                    updateBattery(b.level, b.charging);
                    b.addEventListener('levelchange', () => updateBattery(b.level, b.charging));
                    b.addEventListener('chargingchange', () => updateBattery(b.level, b.charging));
                });
            }
        }

        function updateBattery(level, charging) {
            const pct = Math.round(level * 100);
            document.getElementById('batteryDisplay').textContent = `🔋 ${pct}%${charging ? ' ⚡' : ''}`;
        }

        // ============ АВТОВХОД ============
        (function autoLogin() {
            const saved = localStorage.getItem('link_session');
            if (saved) {
                try {
                    const user = JSON.parse(saved);
                    startApp(user);
                } catch (e) {}
            }
        })();

    })();
</script>
</body>
</html>
