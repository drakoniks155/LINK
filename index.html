<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Blink</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================================================
   AUTH
========================================================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background:
    radial-gradient(circle at top, #222 0%, #080808 45%, #000 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 430px;
  background: rgba(15,15,15,.96);
  border: 1px solid #333;
  border-radius: 30px;
  padding: 28px 22px;
  box-shadow: 0 25px 80px rgba(0,0,0,.7);
}

.logo {
  text-align: center;
  font-size: 38px;
  font-weight: 1000;
  letter-spacing: 3px;
  margin-bottom: 5px;
}

.logo-sub {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-bottom: 28px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: #080808;
  padding: 5px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.auth-tab {
  border: 0;
  background: transparent;
  color: #777;
  padding: 11px;
  border-radius: 12px;
  font-weight: 900;
}

.auth-tab.active {
  background: white;
  color: black;
}

.auth-error {
  background: #321414;
  border: 1px solid #612525;
  color: #ff9a9a;
  padding: 11px;
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 12px;
}

.auth-loading {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 12px;
}

/* =========================================================
   MAP
========================================================= */

#app {
  display: none;
  width: 100%;
  height: 100%;
}

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  position: absolute;
  z-index: 1000;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.badge {
  background: rgba(8,8,8,.92);
  backdrop-filter: blur(15px);
  border: 1px solid #333;
  border-radius: 18px;
  padding: 10px 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

.brand {
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  font-size: 12px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  margin-right: 7px;
}

.dot.live {
  background: #4cff8a;
  box-shadow: 0 0 12px #4cff8a;
}

/* =========================================================
   CONTROLS
========================================================= */

.map-controls {
  position: absolute;
  z-index: 2000;
  right: 14px;
  top: 125px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-button,
.map-style-button,
.add-place-map-button,
.location-button {
  width: 50px;
  height: 50px;
  border: 1px solid #333;
  border-radius: 16px;
  background: #050505;
  color: white;
  box-shadow: 0 8px 25px rgba(0,0,0,.55);
}

.zoom-button {
  font-size: 30px;
  font-weight: 700;
}

.map-style-button,
.add-place-map-button,
.location-button {
  font-size: 21px;
}

.zoom-button:active,
.map-style-button:active,
.add-place-map-button:active,
.location-button:active {
  transform: scale(.94);
}

.map-style-box {
  position: relative;
}

.map-styles {
  position: absolute;
  right: 58px;
  top: 0;
  width: 155px;
  background: rgba(5,5,5,.97);
  border: 1px solid #333;
  border-radius: 16px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
}

.map-styles button {
  width: 100%;
  border: 0;
  background: transparent;
  color: white;
  text-align: left;
  padding: 11px;
  border-radius: 11px;
  font-size: 13px;
  font-weight: bold;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom {
  position: absolute;
  z-index: 1000;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: rgba(8,8,8,.95);
  border: 1px solid #333;
  border-radius: 24px;
  padding: 7px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 5px;
}

.nav {
  border: 0;
  background: transparent;
  color: #999;
  border-radius: 17px;
  padding: 8px 3px;
}

.nav.active {
  background: white;
  color: black;
}

.nav span {
  display: block;
}

.nav .icon {
  font-size: 19px;
}

.nav .txt {
  font-size: 10px;
  font-weight: bold;
}

/* =========================================================
   PANELS
========================================================= */

.panel {
  position: absolute;
  z-index: 3000;
  inset: 0;
  background: rgba(0,0,0,.62);
  display: flex;
  align-items: flex-end;
  backdrop-filter: blur(3px);
}

.sheet {
  width: 100%;
  max-height: 88dvh;
  overflow-y: auto;
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 28px 28px 0 0;
  padding: 18px 16px 30px;
}

.handle {
  width: 42px;
  height: 4px;
  background: #444;
  border-radius: 10px;
  margin: 0 auto 16px;
}

.close {
  float: right;
  border: 0;
  background: #222;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 22px;
}

/* =========================================================
   INPUTS
========================================================= */

.field {
  margin: 12px 0;
}

.field label {
  display: block;
  color: #aaa;
  font-size: 12px;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  background: #171717;
  color: white;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 12px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #777;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 13px;
  background: white;
  color: black;
  font-weight: 900;
  margin-top: 8px;
}

.btn.secondary {
  background: #222;
  color: white;
  border: 1px solid #333;
}

.btn.danger {
  background: #351515;
  color: #ff8b8b;
  border: 1px solid #552222;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.grow {
  flex: 1;
}

/* =========================================================
   PROFILE
========================================================= */

.profile {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 15px 0;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  background: #222;
  border: 2px solid white;
}

.avatar.small {
  width: 46px;
  height: 46px;
  border-width: 1px;
}

.code {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

/* =========================================================
   FRIENDS
========================================================= */

.friend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid #252525;
}

.empty {
  text-align: center;
  color: #888;
  padding: 25px;
}

.note {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
}

/* =========================================================
   PLACES
========================================================= */

.place-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid #252525;
}

.place-icon {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border: 1px solid #333;
  border-radius: 14px;
  background: #171717;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.place-name {
  font-weight: 900;
  font-size: 15px;
}

.place-type {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}

/* =========================================================
   MARKERS
========================================================= */

.place-marker {
  width: 44px;
  height: 44px;
  border: 2px solid white;
  border-radius: 50%;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  box-shadow: 0 5px 20px rgba(0,0,0,.65);
}

.pin {
  width: 46px;
  height: 46px;
  border: 3px solid white;
  border-radius: 50%;
  background: #222;
  position: relative;
  box-shadow: 0 5px 20px rgba(0,0,0,.6);
}

.pin img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.ring {
  position: absolute;
  inset: -8px;
  border: 2px solid white;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  50% {
    transform: scale(1.2);
    opacity: .15;
  }
}

.speed-label {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: #000;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 900;
}

.friend-pin {
  width: 42px;
  height: 42px;
  border: 3px solid white;
  border-radius: 50%;
  background: #111;
  box-shadow: 0 5px 20px rgba(0,0,0,.7);
  overflow: hidden;
}

.friend-pin img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.direction-arrow {
  position: absolute;
  left: 50%;
  top: -27px;
  transform: translateX(-50%);
  font-size: 18px;
  text-shadow: 0 2px 5px #000;
}

/* =========================================================
   TOAST
========================================================= */

.toast {
  position: absolute;
  z-index: 5000;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  background: white;
  color: black;
  padding: 11px 15px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  max-width: 90%;
  text-align: center;
}

/* =========================================================
   LOADING
========================================================= */

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: #050505;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.loading-logo {
  font-size: 38px;
  font-weight: 1000;
  letter-spacing: 4px;
}

.spinner {
  margin-top: 20px;
  width: 32px;
  height: 32px;
  border: 3px solid #333;
  border-top-color: white;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:700px) {

  .bottom {
    width: 520px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
  }

  .panel {
    align-items: center;
    justify-content: center;
  }

  .sheet {
    width: 520px;
    border-radius: 28px;
    max-height: 80vh;
  }

}

</style>
</head>

<body>

<!-- =======================================================
     LOADING
======================================================= -->

<div id="loadingScreen">

  <div class="loading-logo">
    ⚡ BLINK
  </div>

  <div class="spinner"></div>

</div>


<!-- =======================================================
     AUTH
======================================================= -->

<div id="authScreen" style="display:none">

  <div class="auth-box">

    <div class="logo">
      ⚡ BLINK
    </div>

    <div class="logo-sub">
      Люди рядом. Всегда.
    </div>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        onclick="switchAuth('login')"
      >
        Вход
      </button>

      <button
        id="registerTab"
        class="auth-tab"
        onclick="switchAuth('register')"
      >
        Регистрация
      </button>

    </div>

    <div
      id="authError"
      class="auth-error"
      style="display:none"
    ></div>

    <div
      id="registerNameField"
      class="field"
      style="display:none"
    >

      <label>
        Имя
      </label>

      <input
        id="authName"
        maxlength="30"
        placeholder="Твоё имя"
        autocomplete="name"
      >

    </div>

    <div class="field">

      <label>
        Email
      </label>

      <input
        id="authEmail"
        type="email"
        placeholder="example@mail.com"
        autocomplete="email"
      >

    </div>

    <div class="field">

      <label>
        Пароль
      </label>

      <input
        id="authPassword"
        type="password"
        placeholder="Минимум 6 символов"
        autocomplete="current-password"
      >

    </div>

    <button
      id="authButton"
      class="btn"
      onclick="submitAuth()"
    >
      Войти
    </button>

    <div
      id="authLoading"
      class="auth-loading"
      style="display:none"
    >
      Подождите...
    </div>

  </div>

</div>


<!-- =======================================================
     APP
======================================================== -->

<div id="app">

  <div id="map"></div>


  <!-- TOP BAR -->

  <div class="topbar">

    <div class="badge brand">
      ⚡ BLINK
    </div>

    <div class="badge status">

      <span
        id="statusDot"
        class="dot"
      ></span>

      <span id="statusText">
        GPS не запущен
      </span>

    </div>

  </div>


  <!-- MAP CONTROLS -->

  <div class="map-controls">

    <div class="zoom-controls">

      <button
        class="zoom-button"
        onclick="zoomIn()"
      >
        +
      </button>

      <button
        class="zoom-button"
        onclick="zoomOut()"
      >
        −
      </button>

    </div>

    <button
      class="location-button"
      onclick="centerMe()"
      title="Показать меня"
    >
      🎯
    </button>

    <button
      class="add-place-map-button"
      onclick="startAddingPlace()"
    >
      📍
    </button>

    <div class="map-style-box">

      <button
        class="map-style-button"
        onclick="toggleMapStyles()"
      >
        🗺️
      </button>

      <div
        id="mapStyles"
        class="map-styles"
        style="display:none"
      >

        <button onclick="setMapStyle('light')">
          ⚪ Белая
        </button>

        <button onclick="setMapStyle('dark')">
          ⚫ Тёмная
        </button>

        <button onclick="setMapStyle('hybrid')">
          🛰️ Гибрид
        </button>

      </div>

    </div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <button class="nav active" data-page="map">

      <span class="icon">🗺️</span>
      <span class="txt">Карта</span>

    </button>

    <button class="nav" data-page="friends">

      <span class="icon">👥</span>
      <span class="txt">Друзья</span>

    </button>

    <button class="nav" data-page="profile">

      <span class="icon">👤</span>
      <span class="txt">Профиль</span>

    </button>

    <button class="nav" data-page="settings">

      <span class="icon">⚙️</span>
      <span class="txt">Настройки</span>

    </button>

  </div>


  <!-- PANEL -->

  <div
    id="panel"
    class="panel"
    style="display:none"
  >

    <div
      id="sheet"
      class="sheet"
    ></div>

  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
    style="display:none"
  ></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser = null;

let profile = null;

let myName = "Я";

let myPhoto = "";

let myCode = "";

let friends = [];

let friendLocations = [];

let locationEnabled = true;

let watchId = null;

let marker = null;

let lastPosition = null;

let friendMarkers = {};

let savedPlaces = [];

let placeMarkers = {};

let authMode = "login";

let currentMapStyle =
  localStorage.getItem(
    "blink_map_style"
  ) || "dark";


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[c];

    }
  );

}


function avatar(src) {

  if (src) {
    return src;
  }

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +
      '<rect width="160" height="160" fill="#222"/>' +
      '<text x="80" y="108" text-anchor="middle" font-size="70" fill="white">👤</text>' +
      '</svg>'
    )
  );

}


function toast(text) {

  const box =
    document.getElementById("toast");

  box.textContent = text;

  box.style.display = "block";

  clearTimeout(window.blinkToast);

  window.blinkToast =
    setTimeout(function() {

      box.style.display = "none";

    }, 2800);

}


function setStatus(text, live) {

  document.getElementById(
    "statusText"
  ).textContent = text;

  document.getElementById(
    "statusDot"
  ).classList.toggle(
    "live",
    !!live
  );

}


/* =========================================================
   AUTH UI
========================================================= */

function switchAuth(mode) {

  authMode = mode;

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      mode === "login"
    );

  document
    .getElementById("registerTab")
    .classList.toggle(
      "active",
      mode === "register"
    );

  document.getElementById(
    "registerNameField"
  ).style.display =
    mode === "register"
      ? "block"
      : "none";

  document.getElementById(
    "authButton"
  ).textContent =
    mode === "login"
      ? "Войти"
      : "Создать аккаунт";

  document.getElementById(
    "authPassword"
  ).autocomplete =
    mode === "login"
      ? "current-password"
      : "new-password";

  hideAuthError();

}


function showAuthError(text) {

  const box =
    document.getElementById(
      "authError"
    );

  box.textContent = text;

  box.style.display = "block";

}


function hideAuthError() {

  document.getElementById(
    "authError"
  ).style.display = "none";

}


function setAuthLoading(value) {

  document.getElementById(
    "authLoading"
  ).style.display =
    value
      ? "block"
      : "none";

  document.getElementById(
    "authButton"
  ).disabled =
    value;

}


/* =========================================================
   AUTH
========================================================= */

async function submitAuth() {

  hideAuthError();

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  const name =
    document.getElementById(
      "authName"
    ).value.trim();

  if (!email) {

    showAuthError(
      "Введи email."
    );

    return;

  }

  if (!password || password.length < 6) {

    showAuthError(
      "Пароль должен содержать минимум 6 символов."
    );

    return;

  }

  if (
    authMode === "register" &&
    !name
  ) {

    showAuthError(
      "Введи имя."
    );

    return;

  }

  setAuthLoading(true);

  try {

    if (
      authMode === "login"
    ) {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });

      if (error) {
        throw error;
      }

      currentUser =
        data.user;

      await enterApp();

    }

    else {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email,
          password,

          options: {

            data: {
              username: name
            }

          }

        });

      if (error) {
        throw error;
      }

      if (!data.user) {

        throw new Error(
          "Supabase не создал пользователя."
        );

      }

      currentUser =
        data.user;

      /*
       * Если в Supabase включено подтверждение email,
       * session может отсутствовать.
       */

      if (!data.session) {

        showAuthError(
          "Аккаунт создан. Проверь почту и подтверди email, затем войди."
        );

        setAuthLoading(false);

        return;

      }

      await createProfileIfNeeded(
        name
      );

      await enterApp();

    }

  }
  catch(error) {

    console.error(error);

    showAuthError(
      translateAuthError(
        error.message
      )
    );

  }
  finally {

    setAuthLoading(false);

  }

}


function translateAuthError(message) {

  const text =
    String(message || "");

  if (
    text.toLowerCase().includes(
      "invalid login credentials"
    )
  ) {

    return "Неверный email или пароль.";

  }

  if (
    text.toLowerCase().includes(
      "user already registered"
    )
  ) {

    return "Этот email уже зарегистрирован.";

  }

  if (
    text.toLowerCase().includes(
      "email not confirmed"
    )
  ) {

    return "Сначала подтверди email.";

  }

  if (
    text.toLowerCase().includes(
      "password"
    ) &&
    text.toLowerCase().includes(
      "6"
    )
  ) {

    return "Пароль должен содержать минимум 6 символов.";

  }

  return text || "Произошла ошибка.";

}


/* =========================================================
   PROFILE
========================================================= */

async function createProfileIfNeeded(
  username
) {

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if (error) {
    throw error;
  }

  if (data) {

    profile = data;

    return;

  }

  let code = null;

  for (
    let i = 0;
    i < 30;
    i++
  ) {

    const candidate =
      String(
        Math.floor(
          1000 +
          Math.random() *
          9000
        )
      );

    const {
      data: existing
    } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq(
          "friend_code",
          candidate
        )
        .maybeSingle();

    if (!existing) {

      code =
        candidate;

      break;

    }

  }

  if (!code) {

    throw new Error(
      "Не удалось создать код пользователя."
    );

  }

  const {
    data: inserted,
    error: insertError
  } =
    await supabaseClient
      .from("profiles")
      .insert({

        id:
          currentUser.id,

        username:
          username || "Пользователь",

        friend_code:
          code,

        avatar_url:
          "",

        bio:
          "",

        notifications_enabled:
          true,

        location_sharing_enabled:
          true

      })
      .select()
      .single();

  if (insertError) {
    throw insertError;
  }

  profile =
    inserted;

}


async function loadProfile() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if (error) {
    throw error;
  }

  if (!data) {

    await createProfileIfNeeded(

  profile =

}

/* =========================================================

========================================================= */

function setMapStyle(style) {

  if (!map) {
    return;
  }

  [
    lightMap,
    darkMap,
    satelliteMap,
    labelsMap

  ].forEach(
    layer => {

      if (
        layer &&
        map.hasLayer(layer)
      ) {

        map.removeLayer(layer);

      }

    }
  );

  if (style === "light") {
    lightMap.addTo(map);
  }

  if (style === "dark") {
    darkMap.addTo(map);
  }

  if (style === "hybrid") {

    satelliteMap.addTo(map);
    labelsMap.addTo(map);

  }

  currentMapStyle =
    style;

  localStorage.setItem(
    "blink_map_style",
    style
  );

  const styles =
    document.getElementById(
      "mapStyles"
    );

  if (styles) {
    styles.style.display = "none";

/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (!locationEnabled) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }

  if (!navigator.geolocation) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

  }

  setStatus(
    "Получаем GPS…",
    true
  );

  watchId =
    navigator.geolocation.watchPosition(
      onPosition,
      onPositionError,
      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      }
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2-lat1) * rad;

  const dLon =
    (lon2-lon1) * rad;

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *
    Math.sin(dLon/2) ** 2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );

}


/* =========================================================
   BEARING
========================================================= */

function calculateBearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const rad =
    Math.PI / 180;

  const y =
    Math.sin(
      (lon2-lon1)*rad
    ) *
    Math.cos(
      lat2*rad
    );

  const x =
    Math.cos(
      lat1*rad
    ) *
    Math.sin(
      lat2*rad
    ) -
    Math.sin(
      lat1*rad
    ) *
    Math.cos(
      lat2*rad
    ) *
    Math.cos(
      (lon2-lon1)*rad
    );

  return (
    Math.atan2(y,x) *
    180 /
    Math.PI +
    360
  ) % 360;

}


function directionName(
  degrees
) {

  const names = [
    "С",
    "СВ",
    "В",
    "ЮВ",
    "Ю",
    "ЮЗ",
    "З",
    "СЗ"
  ];

  return names[
    Math.round(
      degrees / 45
    ) % 8
  ];

}

/* =========================================================
   GPS POSITION
========================================================= */

async function onPosition(
  position
) {

  const c =
    position.coords;

  let speedMs =
    Number.isFinite(c.speed)
      ? Math.max(0,c.speed)
      : null;

  let direction =
    lastPosition
      ? lastPosition.direction
      : 0;

  if (lastPosition) {

    const seconds =
      (
        position.timestamp -
        lastPosition.time
      ) / 1000;

    if (seconds > 0) {

      const meters =
        calculateDistance(
          lastPosition.lat,
          lastPosition.lng,
          c.latitude,
          c.longitude
        );

      if (speedMs === null) {

        speedMs =
          meters / seconds;

      }

      if (meters > 1) {

        direction =
          calculateBearing(
            lastPosition.lat,
            lastPosition.lng,
            c.latitude,
            c.longitude
          );

      }

    }

  }

  const speedKmh =
    (speedMs || 0) * 3.6;

  lastPosition = {

    lat: c.latitude,

    lng: c.longitude,

    time: position.timestamp,

    direction,

    speed: speedKmh

  };

  if (!marker) {

    marker =
      L.marker(
        [
          c.latitude,
          c.longitude
        ],
        {
          icon:
            userIcon(
              speedKmh,
              direction
            ),
          zIndexOffset: 1000
        }
      ).addTo(map);

    marker.bindPopup(
      createMyPopup(
        speedKmh,
        direction
      )
    );

    map.setView(
      [
        c.latitude,
        c.longitude
      ],
      16
    );

  }
  else {

    marker.setLatLng(
      [
        c.latitude,
        c.longitude
      ]
    );

    marker.setIcon(
      userIcon(
        speedKmh,
        direction
      )
    );

    marker
      .getPopup()
      .setContent(
        createMyPopup(
          speedKmh,
          direction
        )
      );

  }

  setStatus(
    "GPS • " +
    directionName(direction),
    true
  );

  await saveMyLocation(
    c.latitude,
    c.longitude,
    c.accuracy
  );

}


function createMyPopup(
  speed,
  direction
) {

  return (

    "<b>" +
    escapeHtml(myName) +
    "</b>" +

    "<br>🚀 " +
    speed.toFixed(1) +
    " км/ч" +

    "<br>🧭 " +
    directionName(direction)

  );

}


/* =========================================================
   SAVE LOCATION
========================================================= */

let lastLocationSave = 0;

async function saveMyLocation(
  lat,
  lng,
  accuracy
) {

  if (!currentUser) {
    return;
  }

  if (!locationEnabled) {
    return;
  }

  const now =
    Date.now();

  if (
    now - lastLocationSave <
    5000
  ) {
    return;
  }

  lastLocationSave =
    now;

  const {
    error
  } =
    await supabaseClient
      .from("locations")
      .upsert(
        {
          user_id:
            currentUser.id,

          latitude:
            lat,

          longitude:
            lng,

          accuracy:
            accuracy || null,

          updated_at:
            new Date().toISOString()

        },
        {
          onConflict:
            "user_id"
        }
      );

  if (error) {

    console.error(
      "LOCATION ERROR:",
      error
    );

  }

}


/* =========================================================
   GPS ERROR
========================================================= */

function onPositionError(
  error
) {

  if (error.code === 1) {

    setStatus(
      "Разреши геолокацию",
      false
    );

    toast(
      "Разреши браузеру доступ к геолокации."
    );

  }
  else if (error.code === 2) {

    setStatus(
      "GPS недоступен",
      false
    );

  }
  else if (error.code === 3) {

    setStatus(
      "GPS не отвечает",
      false
    );

  }
  else {

    setStatus(
      "Ошибка GPS",
      false
    );

  }

}

/* =========================================================
   FRIEND MARKERS
========================================================= */

function renderFriendMarkers() {

  if (!map) {
    return;
  }

  Object.keys(
    friendMarkers
  ).forEach(
    id => {

      if (
        map.hasLayer(
          friendMarkers[id]
        )
      ) {

        map.removeLayer(
          friendMarkers[id]
        );

      }

    }
  );

  friendMarkers = {};

  friendLocations.forEach(
    friend => {

      if (
        !friend.latitude ||
        !friend.longitude
      ) {

        return;

      }

      const m =
        L.marker(
          [
            friend.latitude,
            friend.longitude
          ],
          {
            icon:
              friendIcon(
                friend.avatar_url
              ),
            zIndexOffset:
              800
          }
        ).addTo(map);

      m.bindPopup(
        "<b>" +
        escapeHtml(
          friend.username ||
          "Друг"
        ) +
        "</b>" +

        "<br>🔢 Код: " +
        escapeHtml(
          friend.friend_code ||
          ""
        )
      );

      friendMarkers[
        friend.user_id
      ] = m;

    }
  );

}

async function addFriend() {

  const input =
    document.getElementById(
      "friendCode"
    );

  const code =
    input.value.trim();

  if (
    !/^\d{4}$/.test(code)
  ) {

    toast(
      "Код должен состоять из 4 цифр."
    );

    return;

  }

  if (
    code === myCode
  ) {

    toast(
      "Нельзя добавить самого себя."
    );

    return;

  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "send_friend_request_by_code",
        {
          target_code:
            code
        }
      );

    if (error) {
      throw error;
    }

    toast(
      "Заявка отправлена."
    );

    input.value = "";

  }
  catch(error) {

    console.error(error);

    toast(
      error.message ||
      "Не удалось отправить заявку."
    );

  }

}

/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

  const input =
    document.getElementById(
      "nameInput"
    );

  const name =
    input.value.trim() ||
    "Пользователь";

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .update({

          username:
            name,

          avatar_url:
            myPhoto

        })
        .eq(
          "id",
          currentUser.id
        )
        .select()
        .single();

    if (error) {
      throw error;
    }

    profile =
      data;

    myName =
      data.username;

    myPhoto =
      data.avatar_url || "";

    if (marker) {

      marker.setIcon(
        userIcon(
          lastPosition
            ? lastPosition.speed
            : 0,
          lastPosition
            ? lastPosition.direction
            : 0
        )
      );

    }

    toast(
      "Профиль сохранён."
    );

    closePanel();

  }
  catch(error) {

    console.error(error);

    toast(
      error.message ||
      "Не удалось сохранить профиль."
    );

  }

}

/* =========================================================
   LOCATION TOGGLE
========================================================= */

async function toggleLocation() {

  locationEnabled =
    !locationEnabled;

  try {

    await supabaseClient
      .from("profiles")
      .update({

        location_sharing_enabled:
          locationEnabled

      })
      .eq(
        "id",
        currentUser.id
      );

  }
  catch(error) {

    console.error(error);

  }

  if (locationEnabled) {

    startGPS();

  }
  else {

    if (
      watchId !== null
    ) {

      navigator.geolocation.clearWatch(
        watchId
      );

    }

    watchId = null;

    setStatus(
      "Геолокация выключена",
      false
    );

  }

  showSettings();

}

   CENTER
========================================================= */

  closePanel();

  if (!map) {
    return;
  }

  if (lastPosition) {

    map.setView(
      [
        lastPosition.lat,
        lastPosition.lng
      ],

}


/* =========================================================
   PANEL
========================================================= */

function openPanel(
  html
) {

  document.getElementById(
    "sheet"
  ).innerHTML =
    '<div class="handle"></div>' +
    html;

  document.getElementById(
    "panel"
  ).style.display =
    "flex";

}


function closePanel() {

  document.getElementById(
    "panel"
  ).style.display =
    "none";

}


document.getElementById(
  "panel"
).onclick =
function(event) {

  if (
    event.target.id === "panel"
  ) {

    closePanel();

  }

};


/* =========================================================
   PLACES
========================================================= */

const placeTypes = {

  home: {
    name: "Дом",
    icon: "🏠"
  },

  work: {
    name: "Работа",
    icon: "💼"
  },

  school: {
    name: "Школа",
    icon: "🎓"
  },

  other: {
    name: "Другое",
    icon: "📍"
  }

};


async function loadSavedPlaces() {

  /*
   * Если таблица places есть,
   * используем её.
   *
   * Если её ещё нет — приложение
   * не ломается и использует localStorage.
   */

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("places")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (!error && data) {

      savedPlaces =
        data;

      return;

    }

  }
  catch(error) {

    console.log(
      "places table unavailable"
    );

  }

  savedPlaces =
    JSON.parse(
      localStorage.getItem(
        "blink_places"
      ) || "[]"
    );

}


function placeIcon(
  type
) {

  const data =
    placeTypes[type] ||
    placeTypes.other;

  return L.divIcon({

    className: "",

    html:
      '<div class="place-marker">' +
      data.icon +
      '</div>',

    iconSize: [
      44,
      44
    ],

    iconAnchor: [
      22,
      22
    ]

  });

}


function renderSavedPlaces() {

  if (!map) {
    return;
  }

  Object.values(
    placeMarkers
  ).forEach(
    marker => {

      if (
        map.hasLayer(marker)
      ) {

        map.removeLayer(marker);

      }

    }
  );

  placeMarkers = {};

  savedPlaces.forEach(
    place => {

      const marker =
        L.marker(
          [
            place.lat,
            place.lng
          ],
          {
            icon:
              placeIcon(
                place.type
              ),
            zIndexOffset:
              500
          }
        ).addTo(map);

      const type =
        placeTypes[
          place.type
        ] ||
        placeTypes.other;

      marker.bindPopup(

        "<b>" +
        escapeHtml(
          place.name
        ) +
        "</b>" +

        "<br>" +
        type.icon +
        " " +
        type.name +

        "<br><br>" +

        '<button class="popup-delete" ' +
        'onclick="deletePlace(\'' +
        place.id +
        '\')">' +
        "Удалить" +
        "</button>"

      );

      placeMarkers[
        place.id
      ] =
        marker;

    }
  );

}


function persistPlacesLocal() {

  localStorage.setItem(
    "blink_places",
    JSON.stringify(
      savedPlaces
    )
  );

}


/* =========================================================
   ADD PLACE
========================================================= */

function startAddingPlace() {

  closePanel();

  toast(
    "Нажми на карте точку для нового места."
  );

  map.once(
    "click",
    event => {

      showAddPlaceForm(
        event.latlng.lat,
        event.latlng.lng
      );

    }
  );

}


function showAddPlaceForm(
  lat,
  lng
) {

  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>

    <h2>
      📍 Добавить место
    </h2>

    <div class="field">

      <label>
        Название
      </label>

      <input
        id="placeName"
        maxlength="40"
        placeholder="Например: Мой дом"
      >

    </div>

    <div class="field">

      <label>
        Тип
      </label>

      <select id="placeType">

        <option value="home">
          🏠 Дом
        </option>

        <option value="work">
          💼 Работа
        </option>

        <option value="school">
          🎓 Школа
        </option>

        <option value="other">
          📍 Другое
        </option>

      </select>

    </div>

    <button
      class="btn"
      onclick="
        confirmNewPlace(
          ${lat},
          ${lng}
        )
      "
    >
      Сохранить
    </button>

  `);

}


async function confirmNewPlace(
  lat,
  lng
) {

  const name =
    document.getElementById(
      "placeName"
    ).value.trim();

  const type =
    document.getElementById(
      "placeType"
    ).value;

  if (!name) {

    toast(
      "Введи название."
    );

    return;

  }

  const place = {

    id:
      crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(),

    user_id:
      currentUser.id,

    name,

    type,

    lat,

    lng

  };

  /*
   * Сначала пытаемся записать в Supabase.
   */

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("places")
        .insert({

          user_id:
            currentUser.id,

          name,

          type,

          lat,

          lng

        })
        .select()
        .single();

    if (!error && data) {

      savedPlaces.unshift(
        data
      );

    }
    else {

      throw error;

    }

  }
  catch(error) {

    /*
     * Если таблицы places пока нет,
     * сохраняем локально.
     */

    savedPlaces.unshift(
      place
    );

    persistPlacesLocal();

  }

  renderSavedPlaces();

  closePanel();

  toast(
    "Место сохранено."
  );

}


async function deletePlace(
  id
) {

  try {

    await supabaseClient
      .from("places")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "user_id",
        currentUser.id
      );

  }
  catch(error) {

    console.error(error);

  }

  savedPlaces =
    savedPlaces.filter(
      place =>
        place.id !== id
    );

  persistPlacesLocal();

  if (
    placeMarkers[id]
  ) {

    map.removeLayer(
      placeMarkers[id]
    );

    delete placeMarkers[id];

  }

  toast(
    "Место удалено."
  );

}


function showPlaces() {

  let list = "";

  savedPlaces.forEach(
    place => {

      const data =
        placeTypes[
          place.type
        ] ||
        placeTypes.other;

      list += `

        <div class="place-item">

          <div class="place-icon">
            ${data.icon}
          </div>

          <div class="grow">

            <div class="place-name">
              ${escapeHtml(
                place.name
              )}
            </div>

            <div class="place-type">
              ${data.name}
            </div>

          </div>

          <button
            class="btn secondary"
            style="width:auto;margin:0"
            onclick="
              focusPlace(
                '${place.id}'
              )
            "
          >
            👁️
          </button>

          <button
            class="btn danger"
            style="width:auto;margin:0"
            onclick="
              deletePlace(
                '${place.id}'
              );
              showPlaces();
            "
          >
            ×
          </button>

        </div>

      `;

    }
  );

  if (!list) {

    list =
      '<div class="empty">' +
      'Пока нет сохранённых мест.' +
      '</div>';

  }

  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>

    <h2>
      📍 Мои места
    </h2>

    <button
      class="btn"
      onclick="startAddingPlace()"
    >
      ＋ Добавить место
    </button>

    <div style="margin-top:12px">
      ${list}
    </div>

  `);

}


function focusPlace(
  id
) {

  const place =
    savedPlaces.find(
      item =>
        item.id === id
    );

  if (!place) {
    return;
  }

  closePanel();

  map.setView(
    [
      place.lat,
      place.lng
    ],
    17
  );

  setTimeout(
    () => {

      if (
        placeMarkers[id]
      ) {

        placeMarkers[id]
          .openPopup();

      }

    },
    300
  );

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime() {

  /*
   * Обновляем карту при изменении locations.
   */

  supabaseClient
    .channel(
      "blink-locations"
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "locations"
      },
      function() {

        loadFriendLocations();

      }
    )
    .subscribe();


  /*
   * Обновляем друзей при изменении
   * friend_requests.
   */

  supabaseClient
    .channel(
      "blink-friend-requests"
    )
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "friend_requests"
      },
      function() {

        loadFriends();

      }
    )
    .subscribe();

}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(".nav")
  .forEach(
    button => {

      button.onclick =
      async function() {

        document
          .querySelectorAll(".nav")
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );

        button.classList.add(
          "active"
        );

        const page =
          button.dataset.page;

        if (
          page === "map"
        ) {

          closePanel();

        }

        if (
          page === "friends"
        ) {

          await showFriends();

        }

        if (
          page === "profile"
        ) {

          showProfile();

        }

        if (
          page === "settings"
        ) {

          showSettings();

        }

      };

    }
  );


/* =========================================================
   SESSION CHECK
========================================================= */

async function boot() {

  try {

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await enterApp();

    }
    else {

      document.getElementById(
        "loadingScreen"
      ).style.display =
        "none";

      document.getElementById(
        "authScreen"
      ).style.display =
        "flex";

    }

  }
  catch(error) {

    console.error(error);

    document.getElementById(
      "loadingScreen"
    ).style.display =
      "none";

    document.getElementById(
      "authScreen"
    ).style.display =
      "flex";

    showAuthError(
      "Ошибка подключения к Supabase: " +
      error.message
    );

  }

}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async function(
    event,
    session
  ) {

    if (
      event === "SIGNED_OUT"
    ) {

      currentUser = null;

    }

  }
);


/* =========================================================
   START
========================================================= */

boot();

</script>
