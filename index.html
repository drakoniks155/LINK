<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>BLINK — Друзья всегда на связи</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        /* Глобальные сбросы и базовые стили */
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Inter, Arial, sans-serif;
            background: #090909;
            color: #fff;
        }
        button, input { font: inherit; }
        button {
            cursor: pointer;
            border: 0;
        }
        .hidden { display: none !important; }

        /* Основной контейнер приложения */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Экран авторизации */
        #auth {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 20%, #191919, #080808 65%);
        }
        .auth-card {
            width: min(590px, 94vw);
            padding: 34px;
            border: 1px solid #333;
            border-radius: 34px;
            background: #101010;
            box-shadow: 0 30px 80px #000;
        }
        .logo {
            text-align: center;
            font-weight: 900;
            font-size: 46px;
            letter-spacing: -2px;
        }
        .logo span { color: #ffc400; }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 19px;
            margin: 10px 0 30px;
        }

        /* Вкладки входа/регистрации */
        .tabs {
            display: flex;
            background: #1a1a1a;
            border-radius: 22px;
            padding: 5px;
            margin-bottom: 24px;
        }
        .tabs button {
            flex: 1;
            padding: 16px;
            border-radius: 17px;
            background: transparent;
            color: #888;
            font-weight: 800;
        }
        .tabs button.active {
            background: #fff;
            color: #111;
        }

        /* Поля формы */
        .field { margin: 15px 0; }
        .field label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }
        .field input, .modal input {
            width: 100%;
            padding: 17px 18px;
            border: 1px solid #363636;
            border-radius: 18px;
            background: #171717;
            color: #fff;
            outline: none;
        }
        .field input:focus, .modal input:focus { border-color: #fff; }

        /* Основная кнопка */
        .primary {
            width: 100%;
            padding: 17px;
            border-radius: 18px;
            background: #fff;
            color: #111;
            font-weight: 900;
            font-size: 18px;
            margin-top: 12px;
        }

        /* Сообщения об ошибках и успехе */
        .error {
            background: #3a1618;
            border: 1px solid #6b292d;
            color: #ff9b9f;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .success {
            background: #142e1a;
            border: 1px solid #2e7040;
            color: #a6e9b5;
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        /* Основной экран с картой */
        #main {
            position: relative;
            background: #111;
        }
        #map {
            position: absolute;
            inset: 0;
        }

        /* Стили для элементов управления картой */
        .leaflet-control-zoom {
            margin-top: 90px !important;
            margin-right: 15px !important;
        }
        .leaflet-control-zoom a {
            background: #111 !important;
            color: #fff !important;
            border: 1px solid #333 !important;
        }
        .leaflet-control-attribution { font-size: 9px; }

        /* Верхняя панель */
        .top {
            position: absolute;
            z-index: 1000;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .pill {
            pointer-events: auto;
            background: #0d0d0df2;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 13px 18px;
            box-shadow: 0 12px 35px #0008;
            font-weight: 800;
        }
        .gps-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #777;
            margin-right: 9px;
        }
        .gps-dot.ok {
            background: #34d058;
            box-shadow: 0 0 10px #34d058;
        }
        .logo-pill { font-size: 23px; }
        .logo-pill span { color: #ffc400; }

        /* Кнопки карты */
        .map-actions {
            position: absolute;
            right: 16px;
            top: 105px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .map-btn {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: #0d0d0df2;
            color: #fff;
            border: 1px solid #333;
            font-size: 25px;
            box-shadow: 0 12px 25px #0008;
        }
        .map-btn.active { outline: 2px solid #ffc400; }

        /* Нижняя навигационная панель */
        .bottom {
            position: absolute;
            z-index: 1000;
            left: 16px;
            right: 16px;
            bottom: 16px;
            height: 84px;
            background: #0d0d0df5;
            border: 1px solid #333;
            border-radius: 30px;
            display: flex;
            padding: 7px;
            box-shadow: 0 15px 45px #0009;
        }
        .nav {
            flex: 1;
            border-radius: 23px;
            background: transparent;
            color: #888;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .nav .ico { font-size: 24px; }
        .nav.active {
            background: #fff;
            color: #111;
        }
        .badge {
            position: absolute;
            background: #ff3b30;
            color: #fff;
            font-size: 11px;
            border-radius: 20px;
            padding: 3px 6px;
            margin-left: 28px;
            margin-top: -28px;
        }

        /* Всплывающие панели */
        .panel {
            position: absolute;
            z-index: 1100;
            inset: 0;
            background: #090909;
            overflow: auto;
            padding: 20px 18px 120px;
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .panel h2 {
            margin: 0;
            font-size: 28px;
        }
        .close {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            font-size: 22px;
        }

        /* Карточки */
        .card {
            background: #121212;
            border: 1px solid #2d2d2d;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .muted { color: #888; }
        .code {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 7px;
        }
        .small-btn {
            background: #fff;
            color: #111;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 800;
        }
        .danger {
            background: #351719;
            color: #ff9a9f;
        }

        /* Элементы друзей */
        .friend {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #242424;
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 900;
        }
        .friend-info { flex: 1; }
        .friend-name { font-weight: 900; }
        .friend-code {
            color: #888;
            font-size: 13px;
        }
        .request-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .request-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            font-weight: 800;
        }
        .accept {
            background: #fff;
            color: #111;
        }
        .reject {
            background: #242424;
            color: #fff;
        }

        /* Модальное окно */
        .modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #0009;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .modal {
            width: min(480px, 94vw);
            background: #111;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 22px;
        }
        .modal h3 { margin-top: 0; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
        }

        /* Уведомления (тосты) */
        .toast {
            position: fixed;
            z-index: 5000;
            left: 50%;
            bottom: 115px;
            transform: translateX(-50%);
            background: #fff;
            color: #111;
            padding: 14px 20px;
            border-radius: 18px;
            font-weight: 800;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 15px 40px #0009;
        }

        /* Подписи на карте */
        .place-label {
            background: #111;
            color: #fff;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 4px 7px;
        }
        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #111;
            color: #fff;
        }
        .leaflet-popup-content { margin: 12px; }

        /* Состояние загрузки */
        .loading {
            position: absolute;
            z-index: 2500;
            inset: 0;
            display: grid;
            place-items: center;
            background: #080808dd;
            font-weight: 900;
            font-size: 18px;
        }
        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: auto auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 500px) {
            .auth-card { padding: 25px; }
            .logo { font-size: 40px; }
            .subtitle { font-size: 16px; }
            .bottom { height: 78px; }
            .nav { font-size: 12px; }
            .map-actions { top: 100px; }
            .top { top: 14px; }
            .pill { padding: 11px 14px; }
            .logo-pill { font-size: 20px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Экран авторизации -->
    <section id="auth" class="screen">
        <div class="auth-card">
            <div class="logo"><span>⚡</span> BLINK</div>
            <div class="subtitle">Друзья рядом. В реальном времени.</div>
            <div class="tabs">
                <button id="loginTab" class="active">Вход</button>
                <button id="registerTab">Регистрация</button>
            </div>
            <div id="authMsg" class="hidden"></div>
            <div id="usernameField" class="field hidden">
                <label>Имя пользователя</label>
                <input id="username" maxlength="30" placeholder="Например, Никс">
            </div>
            <div class="field">
                <label>Email</label>
                <input id="email" type="email" autocomplete="email" placeholder="example@mail.com">
            </div>
            <div class="field">
                <label>Пароль</label>
                <input id="password" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
            </div>
            <button id="authBtn" class="primary">Войти</button>
        </div>
    </section>

    <!-- Основной экран -->
    <section id="main" class="screen hidden">
        <div id="map"></div>

        <!-- Верхняя панель -->
        <div class="top">
            <div class="pill logo-pill"><span>⚡</span> BLINK</div>
            <div class="pill">
                <span id="gpsDot" class="gps-dot"></span>
                <span id="gpsText">GPS не запущен</span>
            </div>
        </div>

        <!-- Кнопки управления картой -->
        <div class="map-actions">
            <button class="map-btn" id="zoomIn">+</button>
            <button class="map-btn" id="zoomOut">−</button>
            <button class="map-btn" id="locateBtn">🎯</button>
            <button class="map-btn" id="addPlaceBtn">📍</button>
            <button class="map-btn" id="hybridBtn">🗺️</button>
        </div>

        <!-- Нижняя навигация -->
        <div class="bottom">
            <button class="nav active" data-panel="mapPanel"><span class="ico">🗺️</span>Карта</button>
            <button class="nav" data-panel="friendsPanel"><span class="ico">👥</span><span class="badge hidden" id="requestBadge">0</span>Друзья</button>
            <button class="nav" data-panel="profilePanel"><span class="ico">👤</span>Профиль</button>
            <button class="nav" data-panel="settingsPanel"><span class="ico">⚙️</span>Настройки</button>
        </div>

        <!-- Панели -->
        <div id="friendsPanel" class="panel hidden"></div>
        <div id="profilePanel" class="panel hidden"></div>
        <div id="settingsPanel" class="panel hidden"></div>
    </section>

    <!-- Модальное окно -->
    <div id="modalWrap" class="modal-wrap hidden">
        <div class="modal" id="modal"></div>
    </div>

    <!-- Уведомление (тост) -->
    <div id="toast" class="toast hidden"></div>

    <!-- Индикатор загрузки -->
    <div id="loading" class="loading hidden">
        <div>
            <div class="spinner"></div>
            <div id="loadingText">Загрузка…</div>
        </div>
    </div>
</div>

<!-- Подключение библиотек -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Конфигурация Supabase
    const SUPABASE_URL = 'https://pfglyeeiydnnfrkjkglk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_mqY9TwP0DuU3_b8kNswqYg_SQT1rEKt';
    const { createClient } = supabase;
    const db = createClient(SUABASE_URL, SUPABASE_KEY);

    // Глобальные переменные состояния
    let user = null,
        profile = null,
        map = null,
        meMarker = null,
        accuracyCircle = null;
    let friends = [],
        incoming = [],
        friendMarkers = new Map(),
        placeMarkers = new Map();
    let locationWatch = null,
        locationChannel = null,
        requestChannel = null,
        addPlaceMode = false,
        lastPosition = null;
    let imageryLayer = null,
        labelsLayer = null,
        streetLayer = null,
        hybrid = true;

    // Вспомогательные функции
    const $ = id => document.getElementById(id);

    function esc(v) {
        return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }

    function toast(msg, ms = 3000) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(window.__toast);
        window.__toast = setTimeout(() => el.classList.add('hidden'), ms);
    }

    function setLoading(on, text = 'Загрузка…') {
        $('loadingText').textContent = text;
        $('loading').classList.toggle('hidden', !on);
    }

    function authMessage(msg, type = 'error') {
        const el = $('authMsg');
        el.className = type;
        el.textContent = msg;
    }

    function clearAuthMessage() {
        const el = $('authMsg');
        el.className = 'hidden';
        el.textContent = '';
    }

    function initials(name) {
        return (name || '?').trim().slice(0, 2).toUpperCase();
    }

    function validCode(c) {
        return /^\d{4}$/.test(c);
    }

    function randomCode() {
        return String(Math.floor(1000 + Math.random() * 9000));
    }

    // Управление вкладками авторизации
    let registerMode = false;

    function setAuthMode(reg) {
        registerMode = reg;
        $('loginTab').classList.toggle('active', !reg);
        $('registerTab').classList.toggle('active', reg);
        $('usernameField').classList.toggle('hidden', !reg);
        $('authBtn').textContent = reg ? 'Создать аккаунт' : 'Войти';
        clearAuthMessage();
    }

    // Обработка клика по кнопке авторизации
    $('loginTab').onclick = () => setAuthMode(false);
    $('registerTab').onclick = () => setAuthMode(true);
    $('authBtn').onclick = handleAuth;

    async function handleAuth() {
        const email = $('email').value.trim(),
            password = $('password').value,
            username = $('username').value.trim();

        if (!email || !password) {
            authMessage('Заполни email и пароль.');
            return;
        }
        if (password.length < 6) {
            authMessage('Пароль должен содержать минимум 6 символов.');
            return;
        }
        if (registerMode && !username) {
            authMessage('Укажи имя пользователя.');
            return;
        }

        setLoading(true, registerMode ? 'Создание аккаунта…' : 'Вход…');
        clearAuthMessage();

        try {
            if (registerMode) {
                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: { data: { username } }
                });
                if (error) throw error;
                if (!data.session) {
                    setLoading(false);
                    authMessage('Аккаунт создан. Подтверди email, затем войди.', 'success');
                    return;
                }
                user = data.user;
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) throw error;
                user = data.user;
            }
            await enterApp();
        } catch (e) {
            console.error(e);
            authMessage(humanError(e));
            setLoading(false);
        }
    }

    function humanError(e) {
        const m = e?.message || String(e);
        if (/Invalid login credentials/i.test(m)) return 'Неверный email или пароль.';
        if (/Email not confirmed/i.test(m)) return 'Сначала подтверди email.';
        if (/permission denied|row-level security|42501/i.test(m)) return 'Нет доступа к данным. Проверь RLS-политики Supabase.';
        return m;
    }

    // Создание/получение профиля пользователя
    async function ensureProfile() {
        const { data, error } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if (error) throw error;
        if (data) { profile = data; return data; }

        let lastErr = null;
        for (let i = 0; i < 8; i++) {
            const code = randomCode();
            const row = {
                id: user.id,
                username: user.user_metadata?.username || user.email?.split('@')[0] || 'Пользователь',
                friend_code: code,
                notifications_enabled: true,
                location_sharing_enabled: true
            };
            const r = await db.from('profiles').upsert(row, { onConflict: 'id' }).select().single();
            if (!r.error) { profile = r.data; return profile; }
            lastErr = r.error;
        }
        throw lastErr || new Error('Не удалось создать профиль');
    }

    // Вход в приложение
    async function enterApp() {
        setLoading(true, 'Подключение BLINK…');
        try {
            await ensureProfile();
            showMain();
            initMap();
            await Promise.all([loadFriends(), loadIncoming(), loadFriendLocations(), loadPlaces()]);
            startLocation();
            subscribeRealtime();
            renderProfile();
            setLoading(false);
        } catch (e) {
            console.error(e);
            setLoading(false);
            showMain();
            initMap();
            toast('Ошибка загрузки: ' + humanError(e), 5000);
        }
    }

    function showMain() {
        $('auth').classList.add('hidden');
        $('main').classList.remove('hidden');
    }

    function showAuth() {
        $('main').classList.add('hidden');
        $('auth').classList.remove('hidden');
        stopLocation();
        unsubscribeRealtime();
    }

    // Инициализация карты
    function initMap() {
        if (map) return;
        map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView([50, 15], 4);

        imageryLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '© Esri'
        });
        streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });
        labelsLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            opacity: .95,
            attribution: '© Esri'
        });

        imageryLayer.addTo(map);
        labelsLayer.addTo(map);

        // Обработчики кнопок управления
        $('zoomIn').onclick = () => map.zoomIn();
        $('zoomOut').onclick = () => map.zoomOut();
        $('locateBtn').onclick = () => locateMe();
        $('hybridBtn').onclick = toggleHybrid;
        $('addPlaceBtn').onclick = toggleAddPlace;

        // Клик по карте для добавления места
        map.on('click', async e => {
            if (addPlaceMode) {
                await savePlaceAt(e.latlng.lat, e.latlng.lng);
                addPlaceMode = false;
                $('addPlaceBtn').classList.remove('active');
            }
        });
    }

    // Переключение гибридного/обычного режима карты
    function toggleHybrid() {
        hybrid = !hybrid;
        if (hybrid) {
            if (map.hasLayer(streetLayer)) map.removeLayer(streetLayer);
            if (!map.hasLayer(imageryLayer)) imageryLayer.addTo(map);
            if (!map.hasLayer(labelsLayer)) labelsLayer.addTo(map);
            toast('Гибридная карта включена');
        } else {
            if (map.hasLayer(imageryLayer)) map.removeLayer(imageryLayer);
            if (map.hasLayer(labelsLayer)) map.removeLayer(labelsLayer);
            if (!map.hasLayer(streetLayer)) streetLayer.addTo(map);
            toast('Обычная карта включена');
        }
    }

    // Определение местоположения пользователя
    function locateMe() {
        if (lastPosition) {
            map.flyTo([lastPosition.lat, lastPosition.lng], 17, { duration: 1 });
        } else {
            toast('Жду GPS…');
            startLocation();
        }
    }

    // Запуск отслеживания GPS
    function startLocation() {
        if (!navigator.geolocation) {
            $('gpsText').textContent = 'GPS недоступен';
            return;
        }
        if (locationWatch !== null) return;

        $('gpsText').textContent = 'Запуск GPS…';
        locationWatch = navigator.geolocation.watchPosition(
            async pos => {
                const c = pos.coords;
                lastPosition = {
                    lat: c.latitude,
                    lng: c.longitude,
                    accuracy: c.accuracy,
                    speed: c.speed,
                    heading: c.heading
                };
                updateMeMarker(c.latitude, c.longitude, c.accuracy);
                $('gpsDot').classList.add('ok');
                $('gpsText').textContent = 'GPS включён';
                try {
                    await updateMyLocation(c);
                } catch (e) {
                    console.warn('Не удалось записать GPS:', e);
                }
            },
            err => {
                console.warn(err);
                $('gpsDot').classList.remove('ok');
                $('gpsText').textContent = err.code === 1 ? 'GPS запрещён' : 'GPS недоступен';
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
        );
    }

    function stopLocation() {
        if (locationWatch !== null) {
            navigator.geolocation.clearWatch(locationWatch);
            locationWatch = null;
        }
    }

    // Обновление маркера пользователя на карте
    function updateMeMarker(lat, lng, accuracy) {
        const icon = L.divIcon({
            className: '',
            html: '<div style="width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #111;box-shadow:0 0 0 7px #fff4,0 0 25px #fff"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });

        if (!meMarker) {
            meMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 })
                .addTo(map)
                .bindPopup('<b>Вы</b><br>Моё местоположение');
            map.flyTo([lat, lng], 16, { duration: 1 });
        } else {
            meMarker.setLatLng([lat, lng]);
        }

        if (!accuracyCircle) {
            accuracyCircle = L.circle([lat, lng], {
                radius: accuracy || 20,
                color: '#fff',
                weight: 1,
                fillOpacity: .04
            }).addTo(map);
        } else {
            accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy || 20);
        }
    }

    // Обновление местоположения в базе данных
    async function updateMyLocation(c) {
        const args = {
            p_latitude: c.latitude,
            p_longitude: c.longitude,
            p_accuracy: c.accuracy || 0,
            p_speed: c.speed || 0,
            p_heading: c.heading || 0
        };
        const r = await db.rpc('update_my_location', args);
        if (r.error) {
            const fallback = await db.from('locations').upsert({
                user_id: user.id,
                latitude: c.latitude,
                longitude: c.longitude,
                accuracy: c.accuracy || 0,
                speed: c.speed || 0,
                heading: c.heading || 0,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });
            if (fallback.error) throw r.error;
        }
    }

    // Обёртка для вызова RPC-функций
    async function rpc(name, args = {}) {
        const r = await db.rpc(name, args);
        if (r.error) throw r.error;
        return r.data;
    }

    // Загрузка списка друзей
    async function loadFriends() {
        try {
            friends = await rpc('get_my_friends') || [];
        } catch (e) {
            console.warn('get_my_friends:', e);
            friends = [];
        }
        renderFriends();
    }

    // Загрузка входящих заявок
    async function loadIncoming() {
        try {
            incoming = await rpc('get_incoming_requests') || [];
        } catch (e) {
            console.warn('get_incoming_requests:', e);
            incoming = [];
        }
        renderFriends();
        updateBadge();
    }

    // Загрузка местоположений друзей
    async function loadFriendLocations() {
        try {
            const rows = await rpc('get_friend_locations') || [];
            const seen = new Set();
            rows.forEach(r => {
                seen.add(r.user_id);
                updateFriendMarker(r);
            });
            for (const [id, m] of friendMarkers) {
                if (!seen.has(id)) {
                    map.removeLayer(m);
                    friendMarkers.delete(id);
                }
            }
        } catch (e) {
            console.warn('get_friend_locations:', e);
        }
    }

    // Обновление маркера друга
    function updateFriendMarker(r) {
        const icon = L.divIcon({
            className: '',
            html: '<div style="width:28px;height:28px;border-radius:50%;background:#ffc400;border:4px solid #111;box-shadow:0 0 0 5px #ffc40055,0 4px 15px #000"></div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        let m = friendMarkers.get(r.user_id);
        if (!m) {
            m = L.marker([r.latitude, r.longitude], { icon }).addTo(map);
            friendMarkers.set(r.user_id, m);
        } else {
            m.setLatLng([r.latitude, r.longitude]);
        }

        m.bindPopup(
            `<b>${esc(r.username || 'Друг')}</b><br>Код: ${esc(r.friend_code || '----')}<br><span style="color:#888">Обновлено: ${new Date(r.updated_at || Date.now()).toLocaleTimeString('ru-RU')}</span>`
        );
    }

    // Отправка заявки в друзья
    async function sendFriendRequest() {
        const code = $('friendCodeInput').value.trim();
        if (!validCode(code)) {
            toast('Введи ровно 4 цифры');
            return;
        }
        try {
            setLoading(true, 'Отправка заявки…');
            await rpc('send_friend_request_by_code', { p_friend_code: code });
            toast('Заявка отправлена');
            $('friendCodeInput').value = '';
            await loadIncoming();
        } catch (e) {
            toast(humanError(e), 4500);
        } finally {
            setLoading(false);
        }
    }

    // Принятие заявки
    async function acceptRequest(id) {
        try {
            await rpc('accept_friend_request', { p_request_id: id });
            toast('Друг добавлен');
            await loadFriends();
            await loadIncoming();
            await loadFriendLocations();
        } catch (e) {
            toast(humanError(e), 4500);
        }
    }

    // Отклонение заявки
    async function rejectRequest(id) {
        try {
            await rpc('reject_friend_request', { p_request_id: id });
            toast('Заявка отклонена');
            await loadIncoming();
        } catch (e) {
            toast(humanError(e), 4500);
        }
    }

    // Удаление друга
    async function removeFriend(id) {
        if (!confirm('Удалить этого друга?')) return;
        try {
            await rpc('remove_friend', { p_friend_id: id });
            toast('Друг удалён');
            await loadFriends();
            await loadFriendLocations();
        } catch (e) {
            toast(humanError(e), 4500);
        }
    }

    // Отрисовка панели друзей
    function renderFriends() {
        const p = $('friendsPanel');
        if (p.classList.contains('hidden')) return;

        p.innerHTML = `
            <div class="panel-head">
                <h2>Друзья</h2>
                <button class="close" onclick="closePanels()">×</button>
            </div>
            <div class="card">
                <div class="muted">Твой 4-значный код</div>
                <div class="row" style="margin-top:7px">
                    <div class="code">${esc(profile?.friend_code || '----')}</div>
                    <button class="small-btn" onclick="copyCode()">Копировать</button>
                </div>
                <div class="muted" style="margin-top:7px">Отправь этот код другу, чтобы он добавил тебя.</div>
            </div>
            <div class="card">
                <div class="muted" style="margin-bottom:9px">Добавить друга</div>
                <div class="row">
                    <input id="friendCodeInput" inputmode="numeric" maxlength="4" placeholder="1234" style="flex:1;padding:13px;border-radius:13px;background:#181818;border:1px solid #333;color:#fff">
                    <button class="small-btn" onclick="sendFriendRequest()">Отправить</button>
                </div>
            </div>
            ${incoming.length ? `<h3>Входящие заявки (${incoming.length})</h3>
            ${incoming.map(r => `
                <div class="card">
                    <div class="friend">
                        <div class="avatar">${initials(r.username)}</div>
                        <div class="friend-info">
                            <div class="friend-name">${esc(r.username || 'Пользователь')}</div>
                            <div class="friend-code">Код: ${esc(r.friend_code || '----')}</div>
                        </div>
                    </div>
                    <div class="request-actions">
                        <button class="accept" onclick="acceptRequest('${esc(r.id)}')">Принять</button>
                        <button class="reject" onclick="rejectRequest('${esc(r.id)}')">Отклонить</button>
                    </div>
                </div>
            `).join('')}` : ''}
            <h3>Мои друзья (${friends.length})</h3>
            ${friends.length ? friends.map(f => `
                <div class="card">
                    <div class="friend">
                        <div class="avatar">${initials(f.username)}</div>
                        <div class="friend-info">
                            <div class="friend-name">${esc(f.username || 'Пользователь')}</div>
                            <div class="friend-code">Код: ${esc(f.friend_code || '----')}</div>
                        </div>
                        <button class="small-btn danger" onclick="removeFriend('${esc(f.id)}')">×</button>
                    </div>
                </div>
            `).join('') : '<div class="card muted">Пока нет друзей. Добавь человека по его 4-значному коду.</div>'}
        `;
    }

    function updateBadge() {
        const n = incoming.length;
        const badge = $('requestBadge');
        badge.textContent = n;
        badge.classList.toggle('hidden', !n);
    }

    async function copyCode() {
        try {
            await navigator.clipboard.writeText(profile.friend_code);
            toast('Код скопирован');
        } catch {
            toast(profile.friend_code);
        }
    }

    // Загрузка сохранённых мест
    async function loadPlaces() {
        const r = await db.from('saved_places').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
        if (r.error) {
            console.warn('saved_places:', r.error);
            return;
        }
        r.data.forEach(addPlaceMarker);
    }

    function addPlaceMarker(p) {
        const icon = L.divIcon({
            className: '',
            html: '<div style="font-size:25px">📍</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 28]
        });
        const m = L.marker([p.latitude, p.longitude], { icon })
            .addTo(map)
            .bindPopup(`<b>${esc(p.name)}</b><br><span style="color:#888">${esc(p.type || 'Место')}</span>`);
        placeMarkers.set(p.id, m);
    }

    function toggleAddPlace() {
        addPlaceMode = !addPlaceMode;
        $('addPlaceBtn').classList.toggle('active', addPlaceMode);
        toast(addPlaceMode ? 'Нажми на карту там, где сохранить место' : 'Добавление места отменено');
    }

    async function savePlaceAt(lat, lng) {
        openModal(`
            <h3>Новое место</h3>
            <input id="placeName" placeholder="Название места">
            <input id="placeType" style="margin-top:10px" placeholder="Тип: дом, кафе, школа…">
            <div class="modal-actions">
                <button class="reject" onclick="closeModal()">Отмена</button>
                <button class="accept" onclick="confirmPlace(${lat}, ${lng})">Сохранить</button>
            </div>
        `);
    }

    async function confirmPlace(lat, lng) {
        const name = $('placeName').value.trim();
        const type = $('placeType').value.trim() || 'Место';
        if (!name) {
            toast('Введи название');
            return;
        }
        const r = await db.from('saved_places').insert({
            user_id: user.id,
            name,
            type,
            latitude: lat,
            longitude: lng
        }).select().single();
        if (r.error) {
            toast(humanError(r.error), 4500);
            return;
        }
        addPlaceMarker(r.data);
        closeModal();
        toast('Место сохранено');
    }

    // Профиль
    function renderProfile() {
        const p = $('profilePanel');
        p.innerHTML = `
            <div class="panel-head">
                <h2>Профиль</h2>
                <button class="close" onclick="closePanels()">×</button>
            </div>
            <div class="card">
                <div class="friend">
                    <div class="avatar">${initials(profile?.username)}</div>
                    <div>
                        <div class="friend-name">${esc(profile?.username || 'Пользователь')}</div>
                        <div class="friend-code">${esc(user?.email || '')}</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="muted">Мой код</div>
                <div class="code" style="margin-top:8px">${esc(profile?.friend_code || '----')}</div>
            </div>
        `;
    }

    // Настройки
    function renderSettings() {
        const p = $('settingsPanel');
        p.innerHTML = `
            <div class="panel-head">
                <h2>Настройки</h2>
                <button class="close" onclick="closePanels()">×</button>
            </div>
            <div class="card">
                <div class="row">
                    <div>
                        <b>Показывать местоположение</b>
                        <div class="muted">Друзья смогут видеть твою позицию.</div>
                    </div>
                    <button class="small-btn" id="sharingBtn" onclick="toggleSharing()">${profile?.location_sharing_enabled === false ? 'Выкл' : 'Вкл'}</button>
                </div>
            </div>
            <div class="card">
                <button class="primary" onclick="logout()">Выйти из аккаунта</button>
            </div>
        `;
    }

    async function toggleSharing() {
        const value = profile?.location_sharing_enabled === false;
        const r = await db.from('profiles').update({
            location_sharing_enabled: value,
            updated_at: new Date().toISOString()
        }).eq('id', user.id);
        if (r.error) {
            toast(humanError(r.error));
            return;
        }
        profile.location_sharing_enabled = value;
        renderSettings();
        toast(value ? 'Местоположение включено' : 'Местоположение выключено');
    }

    async function logout() {
        await db.auth.signOut();
        user = null;
        profile = null;
        showAuth();
        setAuthMode(false);
    }

    // Управление панелями
    function openPanel(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        if (id === 'friendsPanel') renderFriends();
        if (id === 'profilePanel') renderProfile();
        if (id === 'settingsPanel') renderSettings();
        if (id !== 'mapPanel') $(id).classList.remove('hidden');
        document.querySelectorAll('.nav').forEach(n =>
            n.classList.toggle('active', n.dataset.panel === id || (id === 'mapPanel' && n.dataset.panel === 'mapPanel'))
        );
    }

    function closePanels() {
        document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        document.querySelectorAll('.nav').forEach(n => n.classList.toggle('active', n.dataset.panel === 'mapPanel'));
    }

    document.querySelectorAll('.nav').forEach(n => n.onclick = () => openPanel(n.dataset.panel));

    // Модальное окно
    function openModal(html) {
        $('modal').innerHTML = html;
        $('modalWrap').classList.remove('hidden');
    }

    function closeModal() {
        $('modalWrap').classList.add('hidden');
    }

    $('modalWrap').onclick = e => {
        if (e.target === $('modalWrap')) closeModal();
    };

    // Подписка на изменения в реальном времени
    function subscribeRealtime() {
        unsubscribeRealtime();

        locationChannel = db.channel('blink-locations')
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'locations'
            }, payload => {
                if (payload.new?.user_id !== user?.id) loadFriendLocations();
            })
            .subscribe((status, err) => {
                if (status === 'SUBSCRIBED') console.log('✅ Realtime locations');
                if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') console.warn('Realtime locations:', status, err);
            });

        requestChannel = db.channel('blink-requests')
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'friend_requests'
            }, payload => {
                loadIncoming();
                loadFriends();
            })
            .subscribe((status, err) => {
                if (status === 'SUBSCRIBED') console.log('✅ Realtime requests');
                if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') console.warn('Realtime requests:', status, err);
            });
    }

    function unsubscribeRealtime() {
        if (locationChannel) {
            db.removeChannel(locationChannel);
            locationChannel = null;
        }
        if (requestChannel) {
            db.removeChannel(requestChannel);
            requestChannel = null;
        }
    }

    // Обработка изменений состояния аутентификации
    db.auth.onAuthStateChange(async (event, session) => {
        if (session?.user && !user) {
            user = session.user;
            try {
                await ensureProfile();
                await enterApp();
            } catch (e) {
                console.error(e);
            }
        }
        if (!session) {
            user = null;
            profile = null;
        }
    });

    // Автоматический вход при наличии сессии
    (async () => {
        const { data } = await db.auth.getSession();
        if (data.session) {
            user = data.session.user;
            await enterApp();
        }
    })();
</script>
</body>
</html>
