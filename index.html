<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>LINK — друзья и чат</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
:root{
  --bg:#080808;
  --card:#121212;
  --card2:#191919;
  --text:#fff;
  --muted:#989898;
  --line:#292929;
  --accent:#fff;
  --danger:#ff6178;
  --ok:#70ffad;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#111;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* TOP */

.topbar{
  position:absolute;
  z-index:1000;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  pointer-events:none;
}

.brand,.status{
  pointer-events:auto;
  background:rgba(10,10,10,.88);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  border-radius:18px;
  padding:10px 14px;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

.brand{
  font-weight:1000;
  letter-spacing:1px;
}

.status{
  max-width:62%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#ddd;
  font-size:12px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:7px;
}

.dot.live{
  background:var(--ok);
  box-shadow:0 0 12px var(--ok);
}

/* MAP BUTTONS */

.map-actions{
  position:absolute;
  z-index:1000;
  right:12px;
  bottom:110px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.round-btn{
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;
  background:rgba(8,8,8,.9);
  color:#fff;
  font-size:20px;
  backdrop-filter:blur(15px);
}

/* BOTTOM NAV */

.bottom{
  position:absolute;
  z-index:1000;
  left:8px;
  right:8px;
  bottom:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  padding:6px;
  background:rgba(8,8,8,.93);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  border-radius:25px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.navbtn{
  position:relative;
  border:0;
  background:transparent;
  color:#969696;
  border-radius:18px;
  padding:8px 2px;
}

.navbtn.active{
  background:#fff;
  color:#000;
}

.navicon{
  display:block;
  font-size:18px;
  line-height:21px;
}

.navtext{
  display:block;
  font-size:9px;
  font-weight:900;
}

.badge{
  position:absolute;
  top:3px;
  right:15%;
  min-width:17px;
  height:17px;
  line-height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#ff4862;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

/* PANELS */

.panel{
  position:absolute;
  z-index:3000;
  inset:0;
  display:flex;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(4px);
}

.sheet{
  width:100%;
  max-height:89dvh;
  overflow:auto;
  background:#0d0d0d;
  border:1px solid #292929;
  border-bottom:0;
  border-radius:28px 28px 0 0;
  padding:18px 16px 32px;
  animation:up .22s ease-out;
}

@keyframes up{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

.handle{
  width:42px;
  height:4px;
  border-radius:20px;
  background:#444;
  margin:0 auto 16px;
}

.sheet h2{
  margin:4px 0 16px;
  font-size:22px;
}

.close{
  float:right;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:22px;
}

/* INPUTS */

.field{margin:11px 0}
.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:6px;
}

input{
  width:100%;
  border:1px solid #303030;
  background:#171717;
  color:#fff;
  border-radius:14px;
  padding:13px;
  outline:none;
}

input:focus{border-color:#777}

.btn{
  border:0;
  border-radius:15px;
  padding:13px 15px;
  background:#fff;
  color:#000;
  font-weight:900;
}

.btn.full{
  width:100%;
  margin-top:8px;
}

.btn.secondary{
  background:#222;
  color:#fff;
  border:1px solid #333;
}

.btn.danger{
  background:#2b1115;
  color:#ff91a0;
  border:1px solid #57202b;
}

.btn.small{
  padding:8px 10px;
  border-radius:11px;
  font-size:11px;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.grow{
  flex:1;
  min-width:0;
}

/* AUTH */

.auth{
  position:absolute;
  z-index:9000;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#080808;
}

.authbox{
  width:min(430px,100%);
  background:#111;
  border:1px solid #292929;
  border-radius:28px;
  padding:25px;
}

.logo{
  font-size:46px;
  font-weight:1000;
  letter-spacing:-2px;
}

.subtitle{
  color:#999;
  margin:6px 0 20px;
}

.auth-status{
  min-height:22px;
  color:#aaa;
  font-size:13px;
  margin-top:12px;
}

/* AVATARS */

.avatar{
  width:64px;
  height:64px;
  flex:none;
  object-fit:cover;
  border-radius:50%;
  background:#222;
  border:2px solid #fff;
}

.avatar.small{
  width:48px;
  height:48px;
  border-width:1px;
}

.avatar.tiny{
  width:28px;
  height:28px;
  border-width:1px;
}

/* FRIENDS */

.friend,.request,.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #242424;
}

.friend-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.code{
  margin-top:3px;
  color:#999;
  font-size:12px;
}

.empty{
  padding:35px 10px;
  color:#888;
  text-align:center;
}

.section-title{
  margin:20px 0 7px;
  color:#aaa;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.online-status{
  display:inline-block;
  width:8px;
  height:8px;
  margin-left:6px;
  border-radius:50%;
  background:#777;
}

.online-status.online{
  background:var(--ok);
  box-shadow:0 0 8px var(--ok);
}

/* MAP MARKERS */

.leaflet-control-attribution{
  font-size:8px!important;
}

.user-pin,.friend-pin{
  background:transparent;
  border:0;
}

.pin{
  position:relative;
  width:48px;
  height:48px;
  overflow:visible;
}

.pin img{
  position:relative;
  z-index:2;
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:3px solid #fff;
  box-shadow:0 5px 20px rgba(0,0,0,.55);
}

.pin .ring{
  position:absolute;
  z-index:1;
  inset:-8px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:50%;
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:.15;
  }
}

/* TOAST */

.toast{
  position:absolute;
  z-index:12000;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  max-width:90%;
  padding:11px 15px;
  border-radius:14px;
  background:#fff;
  color:#000;
  font-size:13px;
  font-weight:900;
  text-align:center;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

/* REACTIONS */

.reaction-picker{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:12px 0;
}

.reaction-choice{
  min-height:64px;
  border:1px solid #333;
  border-radius:18px;
  background:#171717;
  color:#fff;
  font-size:29px;
}

.reaction-choice.selected,
.reaction-choice:active{
  background:#fff;
  color:#000;
  transform:scale(.95);
}

.reaction-info{
  padding:13px;
  border:1px solid #292929;
  border-radius:16px;
  background:#141414;
  color:#aaa;
  font-size:12px;
  line-height:1.5;
}

/* CHATS */

.chat-preview{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  max-width:190px;
}

.chat-unread{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:20px;
  background:#fff;
  color:#000;
  font-size:10px;
  font-weight:1000;
}

.chat-page{
  position:absolute;
  z-index:4500;
  inset:0;
  display:flex;
  flex-direction:column;
  background:#080808;
}

.chat-header{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));
  border-bottom:1px solid #242424;
  background:rgba(8,8,8,.96);
}

.chat-back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#1c1c1c;
  color:#fff;
  font-size:23px;
}

.chat-title{
  min-width:0;
  flex:1;
}

.chat-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:1000;
}

.chat-status{
  margin-top:2px;
  color:#999;
  font-size:11px;
}

.chat-map-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:16px 12px 120px;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message{
  position:relative;
  max-width:78%;
  padding:10px 12px;
  border-radius:18px;
  background:#1c1c1c;
  word-break:break-word;
  font-size:14px;
  line-height:1.35;
}

.message.mine{
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.message.theirs{
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;
  font-size:9px;
  opacity:.55;
  text-align:right;
}

.message-reactions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:5px;
}

.message-reaction{
  border:0;
  border-radius:999px;
  padding:4px 7px;
  background:#292929;
  color:#fff;
  font-size:12px;
}

.message.mine .message-reaction{
  background:#ddd;
  color:#000;
}

.chat-reaction-bar{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:73px;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  padding:7px;
  max-width:94vw;
  overflow:auto;
  border:1px solid #303030;
  border-radius:20px;
  background:#171717;
  box-shadow:0 10px 35px #000;
}

.quick-reaction{
  width:42px;
  height:42px;
  flex:none;
  border:0;
  border-radius:14px;
  background:#222;
  color:#fff;
  font-size:21px;
}

.chat-input-area{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:7px;
  align-items:flex-end;
  padding:10px 10px max(10px,env(safe-area-inset-bottom));
  background:rgba(8,8,8,.96);
  border-top:1px solid #242424;
}

.chat-input{
  min-height:48px;
  max-height:100px;
  resize:none;
  flex:1;
  border-radius:20px;
  padding:13px 15px;
}

.send-message{
  width:48px;
  height:48px;
  flex:none;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}

.typing{
  position:absolute;
  left:15px;
  bottom:116px;
  color:#aaa;
  font-size:11px;
}

/* REACTION LONG PRESS CARD */

.reaction-hold-overlay{
  position:fixed;
  z-index:15000;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
}

.reaction-hold-card{
  width:min(360px,100%);
  padding:25px;
  border:1px solid #383838;
  border-radius:30px;
  background:#111;
  text-align:center;
  animation:holdPop .25s ease;
}

@keyframes holdPop{
  from{transform:scale(.75);opacity:0}
  to{transform:scale(1);opacity:1}
}

.hold-avatar{
  width:90px;
  height:90px;
  border:3px solid #fff;
  border-radius:50%;
  object-fit:cover;
}

.hold-emoji{
  margin-top:12px;
  font-size:75px;
}

.hold-count{
  margin-top:8px;
  font-size:40px;
  font-weight:1000;
}

.hold-text{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

/* BIG REACTION */

#reactionOverlay{
  position:fixed;
  z-index:20000;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.reaction-dark{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
  animation:fadeReaction 4.7s ease forwards;
}

@keyframes fadeReaction{
  0%{opacity:0}
  10%{opacity:1}
  85%{opacity:1}
  100%{opacity:0}
}

.reaction-center{
  position:absolute;
  z-index:3;
  top:50%;
  left:50%;
  width:min(90vw,430px);
  text-align:center;
  transform:translate(-50%,-50%);
  animation:centerReaction 4.7s ease forwards;
}

@keyframes centerReaction{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  20%{transform:translate(-50%,-50%) scale(1)}
  85%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
}

.reaction-big{
  font-size:clamp(100px,30vw,180px);
  filter:drop-shadow(0 15px 35px #000);
  animation:emojiDance 1.1s infinite alternate ease-in-out;
}

@keyframes emojiDance{
  from{transform:rotate(-6deg) scale(.96)}
  to{transform:rotate(6deg) scale(1.08)}
}

.reaction-title{
  margin-top:10px;
  font-size:clamp(20px,6vw,30px);
  font-weight:1000;
}

.reaction-count{
  margin-top:5px;
  font-size:clamp(34px,11vw,60px);
  font-weight:1000;
}

.reaction-subtitle{
  margin-top:7px;
  color:#ddd;
  font-size:13px;
}

.reaction-particle{
  position:absolute;
  left:50%;
  top:50%;
  z-index:2;
  font-size:var(--size);
  transform:translate(-50%,-50%);
  animation:particleFly var(--duration) ease-out forwards;
  animation-delay:var(--delay);
}

@keyframes particleFly{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }
  8%{opacity:1}
  75%{opacity:1}
  100%{
    opacity:0;
    transform:
      translate(calc(-50% + var(--x)),calc(-50% + var(--y)))
      scale(var(--scale))
      rotate(var(--rotate));
  }
}

.reaction-counter-top{
  position:absolute;
  z-index:5;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 17px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(15px);
  font-weight:1000;
}

.reaction-map-burst{
  position:absolute;
  z-index:7000;
  pointer-events:none;
  font-size:42px;
  transform:translate(-50%,-50%);
  animation:mapBurst 1.5s ease-out forwards;
}

@keyframes mapBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}
  100%{opacity:0;transform:translate(-50%,-140%) scale(2.3)}
}

.toggle{
  position:relative;
  width:48px;
  height:28px;
  flex:none;
  border:0;
  border-radius:20px;
  background:#333;
}

.toggle i{
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{background:#fff}
.toggle.on i{left:23px;background:#000}

.note{
  margin-top:12px;
  color:#777;
  font-size:12px;
  line-height:1.5;
}

@media(min-width:700px){
  .bottom{
    left:50%;
    right:auto;
    width:600px;
    transform:translateX(-50%);
  }

  .panel{
    align-items:center;
    justify-content:center;
  }

  .sheet{
    width:540px;
    max-height:82vh;
    border:1px solid #292929;
    border-radius:28px;
  }

  .chat-page{
    left:50%;
    width:600px;
    transform:translateX(-50%);
    border-left:1px solid #292929;
    border-right:1px solid #292929;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">
    <div class="brand">LINK</div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Подключение…</span>
    </div>
  </div>

  <div class="map-actions">
    <button class="round-btn" id="centerMeBtn">⌖</button>
    <button class="round-btn" id="showAllBtn">⊙</button>
  </div>

  <nav class="bottom">

    <button class="navbtn active" data-page="map">
      <span class="navicon">🗺️</span>
      <span class="navtext">Карта</span>
    </button>

    <button class="navbtn" data-page="friends">
      <span class="navicon">👥</span>
      <span class="navtext">Друзья</span>
      <span id="requestBadge" class="badge hidden">0</span>
    </button>

    <button class="navbtn" data-page="chats">
      <span class="navicon">💬</span>
      <span class="navtext">Чаты</span>
      <span id="chatBadge" class="badge hidden">0</span>
    </button>

    <button class="navbtn" data-page="profile">
      <span class="navicon">👤</span>
      <span class="navtext">Профиль</span>
    </button>

    <button class="navbtn" data-page="settings">
      <span class="navicon">⚙️</span>
      <span class="navtext">Настройки</span>
    </button>

  </nav>

  <div id="panel" class="panel hidden">
    <div id="sheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<div id="reactionOverlay"></div>

<div id="auth" class="auth">
  <div class="authbox">
    <div class="logo">LINK</div>
    <div class="subtitle">Друзья рядом. Карта. Реакции. Чаты.</div>

    <button id="startBtn" class="btn full">Начать</button>

    <div id="authStatus" class="auth-status">
      Подключаем Firebase…
    </div>

    <div class="note">
      Аккаунт создаётся автоматически.
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  push,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================================

/* =========================================

========================================= */

function escapeHtml(s){

  return String(s ?? "")
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}

function defaultAvatar(name=""){

  const letter =
    String(name||"?")
      .trim()
      .slice(0,1)
      .toUpperCase() || "?";

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
      <rect width="160" height="160" fill="#242424"/>
      <text x="80" y="105"
      text-anchor="middle"
      font-family="Arial"
      font-size="72"
      fill="white">${letter}</text>
      </svg>`
    );

}

function avatarUrl(p){
  return p?.avatar || defaultAvatar(p?.name||"?");
}

function markerIcon(p,isMe=false){

  return L.divIcon({

    className:isMe
      ?"user-pin"
      :"friend-pin",

    html:`
      <div class="pin">
        ${isMe?'<div class="ring"></div>':""}
        <img src="${avatarUrl(p)}">
      </div>
    `,

    iconSize:[48,48],
    iconAnchor:[24,24]

  });

}

function renderMeMarker(){

  if(!lastPosition || !profile) return;

  const pos=[
    lastPosition.lat,
    lastPosition.lng
  ];

  if(!meMarker){

    meMarker=L.marker(pos,{
      icon:markerIcon(profile,true),
      zIndexOffset:1000
    }).addTo(map);

    meMarker.bindPopup("<b>Ты</b>");

  }else{

    meMarker.setLatLng(pos);
    meMarker.setIcon(markerIcon(profile,true));

  }

}

function upsertFriendMarker(
  friendId,
  friendProfile,
  location
){

  const lat=Number(location.lat);
  const lng=Number(location.lng);

  if(!Number.isFinite(lat)||!Number.isFinite(lng)){
    return;
  }

  if(!friendMarkers.has(friendId)){

    const marker=L.marker([lat,lng],{
      icon:markerIcon(friendProfile),
      zIndexOffset:500
    }).addTo(map);

    marker.on("click",()=>{
      openFriendReactionPanel(friendId);
    });

    friendMarkers.set(friendId,marker);

  }else{

    const marker=friendMarkers.get(friendId);

    marker.setLatLng([lat,lng]);
    marker.setIcon(markerIcon(friendProfile));

  }

}

function removeFriendMarker(friendId,unsubscribe=true){

  const marker=friendMarkers.get(friendId);

  if(marker){
    map.removeLayer(marker);
    friendMarkers.delete(friendId);
  }

  if(
    unsubscribe &&
    friendLocationListeners.has(friendId)
  ){

    friendLocationListeners.get(friendId)();

    friendLocationListeners.delete(friendId);

  }

}

async function ensureProfile(){

  const profileRef=
    ref(db,`profiles/${user.uid}`);

  const snap=await get(profileRef);

  if(!snap.exists()){

    const code=
      await createUniqueFriendCode();

    profile={
      name:`LINK ${Math.floor(100+Math.random()*900)}`,
      friendCode:code,
      avatar:"",
      locationSharing:true,
      createdAt:Date.now(),
      lastActive:Date.now()
    };

    await update(ref(db),{
      [`profiles/${user.uid}`]:profile,
      [`friendCodes/${code}`]:user.uid
    });

  }else{

    profile=snap.val();

    if(!profile.friendCode){

      const code=
        await createUniqueFriendCode();

      await update(ref(db),{
        [`profiles/${user.uid}/friendCode`]:code,
        [`friendCodes/${code}`]:user.uid
      });

      profile.friendCode=code;

    }

    await update(profileRef,{
      lastActive:Date.now()
    });

  }

}

async function createUniqueFriendCode(){

  for(let i=0;i<30;i++){

    const code=String(
      Math.floor(1000+Math.random()*9000)
    );

    const snap=await get(
      ref(db,`friendCodes/${code}`)
    );

    if(!snap.exists()) return code;

  }

  throw new Error(
    "Не удалось создать свободный код."
  );

}

function subscribeProfile(){

  if(profileUnsubscribe) profileUnsubscribe();

  profileUnsubscribe=onValue(
    ref(db,`profiles/${user.uid}`),
    snap=>{

      if(!snap.exists()) return;

      profile=snap.val();

      renderMeMarker();

      if(currentPage==="profile"){
        renderProfile();
      }

    }
  );

}


/* =========================================
   FRIENDS
========================================= */

function subscribeFriends(){

  if(friendsUnsubscribe) friendsUnsubscribe();

  friendsUnsubscribe=onValue(
    ref(db,`friends/${user.uid}`),
    snap=>{

      const next=snap.val()||{};

      for(const id of Object.keys(friends)){
        if(!next[id]){
          removeFriendMarker(id);
        }
      }

      friends=next;

      Object.keys(friends)
        .forEach(subscribeFriendLocation);

      if(currentPage==="friends"){
        renderFriends();
      }

      if(currentPage==="chats"){
        renderChats();
      }

    }
  );

}

function subscribeFriendLocation(friendId){

  if(friendLocationListeners.has(friendId)) return;

  const unsubscribe=onValue(
    ref(db,`locations/${friendId}`),
    async snap=>{

      const location=snap.val();

      if(!location){
        removeFriendMarker(friendId,false);
        return;
      }

      if(Date.now()-location.updatedAt>5*60*1000){
        removeFriendMarker(friendId,false);
        return;
      }

      const profileSnap=await get(
        ref(db,`profiles/${friendId}`)
      );

      if(!profileSnap.exists()) return;

      upsertFriendMarker(
        friendId,
        profileSnap.val(),
        location
      );

    }
  );

  friendLocationListeners.set(
    friendId,
    unsubscribe
  );

}

async function sendFriendRequest(){

  const code=$("friendCodeInput").value
    .replace(/\D/g,"")
    .slice(0,4);

  if(!/^\d{4}$/.test(code)){
    toast("Введи 4 цифры.");
    return;
  }

  const codeSnap=await get(
    ref(db,`friendCodes/${code}`)
  );

  if(!codeSnap.exists()){
    toast("Пользователь не найден.");
    return;
  }

  const targetUid=codeSnap.val();

  if(targetUid===user.uid){
    toast("Нельзя добавить себя.");
    return;
  }

  const existing=await get(
    ref(db,`friends/${user.uid}/${targetUid}`)
  );

  if(existing.exists()){
    toast("Этот пользователь уже твой друг.");
    return;
  }

  await set(
    ref(
      db,
      `friendRequests/${targetUid}/${user.uid}`
    ),
    {
      fromUid:user.uid,
      createdAt:Date.now(),
      profile:{
        name:profile.name,
        friendCode:profile.friendCode,
        avatar:profile.avatar||""
      }
    }
  );

  toast("Заявка отправлена ✨");

}

window.acceptRequest=async fromUid=>{

  const req=incomingRequests[fromUid];

  if(!req) return;

  const fromProfile=req.profile||{};

  const myProfile={
    name:profile.name,
    friendCode:profile.friendCode,
    avatar:profile.avatar||""
  };

  const chatId=getChatId(user.uid,fromUid);

  await update(ref(db),{

    [`friends/${user.uid}/${fromUid}`]:{
      since:Date.now(),
      profile:fromProfile
    },

    [`friends/${fromUid}/${user.uid}`]:{
      since:Date.now(),
      profile:myProfile
    },

    [`friendRequests/${user.uid}/${fromUid}`]:null,

    [`chats/${chatId}/participants/${user.uid}`]:true,
    [`chats/${chatId}/participants/${fromUid}`]:true,

    [`userChats/${user.uid}/${chatId}`]:{
      friendUid:fromUid,
      friendProfile:fromProfile,
      updatedAt:Date.now()
    },

    [`userChats/${fromUid}/${chatId}`]:{
      friendUid:user.uid,
      friendProfile:myProfile,
      updatedAt:Date.now()
    }

  });

  toast("Друг добавлен 🎉");

};

window.rejectRequest=async fromUid=>{
  await remove(
    ref(
      db,
      `friendRequests/${user.uid}/${fromUid}`
    )
  );

  toast("Заявка отклонена.");
};

window.removeFriend=async friendUid=>{

  await update(ref(db),{

    [`friends/${friendUid}/${user.uid}`]:null

};


/* =========================================
   GEOLOCATION
========================================= */

function startLocation(){

  if(!navigator.geolocation){

    toast("Геолокация не поддерживается.");
    return;

  }

  if(watchId!==null){

    navigator.geolocation.clearWatch(watchId);

  }

  watchId=navigator.geolocation.watchPosition(

    async pos=>{

      lastPosition={
        lat:pos.coords.latitude,
        lng:pos.coords.longitude,
        accuracy:pos.coords.accuracy||0,
        updatedAt:Date.now()
      };

      renderMeMarker();

      await set(
        ref(db,`locations/${user.uid}`),
        lastPosition
      );

      setStatus(
        "Геолокация в реальном времени",
        true
      );

    },

    error=>{

      if(error.code===1){

        setStatus(
          "Разреши геолокацию",
          false
        );

      }else{

        setStatus(
          "GPS временно недоступен",
          false
        );

      }

    },

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }

  );

}

function getChatId(uid1,uid2){

  return [uid1,uid2]
    .sort()
    .join("_");

}

   CHATS LIST
========================================= */

function subscribeChats(){

  if(chatsUnsubscribe) chatsUnsubscribe();

  chatsUnsubscribe=onValue(
    ref(db,`userChats/${user.uid}`),
    snap=>{

      chatMeta=snap.val()||{};

      updateChatBadge();

      if(currentPage==="chats"){
        renderChats();
      }

  );

}

function updateChatBadge(){

  let count=0;

  Object.values(chatMeta).forEach(chat=>{
    count+=Number(
      chat.unread?.[user.uid]||0
    );
  });

  $("chatBadge").textContent=
    count>99?"99+":count;

  $("chatBadge")
    .classList
    .toggle("hidden",count===0);

}

function renderChats(){

  const entries=Object.entries(chatMeta)
    .sort((a,b)=>
      (b[1].updatedAt||0)-
      (a[1].updatedAt||0)
    );

  const html=entries.length
  ?entries.map(([chatId,chat])=>{

    const p=chat.friendProfile||{};
    const unread=
      Number(chat.unread?.[user.uid]||0);

    return `
      <div class="chat-item"
      onclick="openChat('${chat.friendUid}')">

        <img class="avatar small"
        src="${avatarUrl(p)}">

        <div class="grow">

          <b>
            ${escapeHtml(p.name||"Друг")}
          </b>

          <div class="code chat-preview">
            ${escapeHtml(
              chat.lastText||"Начните общение"
            )}
          </div>

        </div>

        ${unread
          ?`<div class="chat-unread">
              ${unread>99?"99+":unread}
            </div>`
          :""
        }

      </div>
    `;

  }).join("")
  :`
    <div class="empty">
      Здесь появятся чаты с друзьями 💬
    </div>
  `;

  openPanel(`

    <button class="close"
    onclick="closePanel()">×</button>

    <h2>Чаты</h2>

    ${html}

  `);

}

function subscribeCurrentChat(){

  const chatId=currentChatId;

  if(!chatId) return;

  if(chatUnsubscribers.has(chatId)){

    chatUnsubscribers
      .get(chatId)();

    chatUnsubscribers
      .delete(chatId);

  }

  const unsubscribe=onValue(
    ref(db,`chats/${chatId}/messages`),
    snap=>{

      if(currentChatId!==chatId) return;

      renderMessages(snap.val()||{});

    }
  );

  chatUnsubscribers.set(
    chatId,
    unsubscribe
  );

  subscribeTyping(chatId);

}

function renderMessages(messages){

  const container=$("messages");

  if(!container) return;

  const nearBottom=
    container.scrollHeight-
    container.scrollTop-
    container.clientHeight<150;

  const entries=Object.entries(messages)
    .sort((a,b)=>
      (a[1].createdAt||0)-
      (b[1].createdAt||0)
    );

  container.innerHTML=entries.length
  ?entries.map(([id,message])=>{

    const mine=
      message.senderUid===user.uid;

    const reactions=
      message.reactions||{};

    const reactionHtml=Object.entries(reactions)
      .map(([emoji,data])=>`

        <button class="message-reaction"
        onclick="reactToMessage(
          '${id}',
          '${encodeURIComponent(emoji)}'
        )">

          ${emoji} ${data?.count||1}

        </button>

      `).join("");

    return `

      <div class="message-row
      ${mine?"mine":"theirs"}">

        <div class="message
        ${mine?"mine":"theirs"}"
        ${mine?`
          oncontextmenu="
            deleteMessage('${id}');
            return false;
          "
        `:""}>

          ${message.type==="reaction"
            ?`<div style="font-size:40px">
                ${escapeHtml(message.emoji||"❤️")}
              </div>`
            :escapeHtml(message.text||"")
          }

          ${reactionHtml
            ?`<div class="message-reactions">
                ${reactionHtml}
              </div>`
            :""
          }

          <div class="message-time">
            ${formatTime(message.createdAt)}
          </div>

        </div>

      </div>

    `;

  }).join("")
  :`
    <div class="empty">
      Напиши первое сообщение 👋
    </div>
  `;

  if(nearBottom){
    requestAnimationFrame(()=>{
      container.scrollTop=
        container.scrollHeight;
    });
  }

  markChatRead();

}

async function sendChatMessage(){

  const input=$("chatInput");

  if(!input||!currentChatId) return;

async function reactToMessage(
  messageId,
  encodedEmoji
){

  const emoji=
    decodeURIComponent(encodedEmoji);

  if(!currentChatId) return;

  const path=
    `chats/${currentChatId}/messages/${messageId}/reactions/${emoji}`;

  const snap=await get(ref(db,path));

  const old=snap.val()||{
    count:0,
    users:{}
  };

  old.count=(old.count||0)+1;

  old.users=old.users||{};

  old.users[user.uid]=
    (old.users[user.uid]||0)+1;

  await set(ref(db,path),old);

  incrementReactionStats(
    currentChatFriendId,
    emoji
  );

}

async function updateChatMeta(
  chatId,
  lastText
){

  const friendUid=currentChatFriendId;

  const friendProfile=
    friends[friendUid]?.profile||{};

  const myProfile={
    name:profile.name,
    friendCode:profile.friendCode,
    avatar:profile.avatar||""
  };

  const oldUnread=
    Number(
      chatMeta[chatId]?.unread?.[friendUid]||0
    );

  const updates={

    [`userChats/${user.uid}/${chatId}/friendUid`]:
      friendUid,

    [`userChats/${user.uid}/${chatId}/friendProfile`]:
      friendProfile,

    [`userChats/${user.uid}/${chatId}/lastText`]:
      lastText,

    [`userChats/${user.uid}/${chatId}/updatedAt`]:
      Date.now(),

    [`userChats/${user.uid}/${chatId}/unread/${user.uid}`]:
      0,


    [`userChats/${friendUid}/${chatId}/friendUid`]:
      user.uid,

    [`userChats/${friendUid}/${chatId}/friendProfile`]:
      myProfile,

    [`userChats/${friendUid}/${chatId}/lastText`]:
      lastText,

    [`userChats/${friendUid}/${chatId}/updatedAt`]:
      Date.now(),

    [`userChats/${friendUid}/${chatId}/unread/${friendUid}`]:
      oldUnread+1

  };

  await update(ref(db),updates);

}

function subscribeIncomingReactions(){

  if(reactionsUnsubscribe){
    reactionsUnsubscribe();
  }

    ref(db,`reactions/${user.uid}`),
    async snap=>{

      const data=snap.val()||{};

          continue;
        }

        incomingReactions[reactionId]=true;

        const reaction=data[reactionId];

        await playIncomingReaction(
          reaction,
          reactionId
        );

    }
  );

}

async function playIncomingReaction(
  reaction,
  reactionId
){

  createReactionExplosion({

      Math.min(

        Number(reaction.count)||1
      )
    ),

      reaction.fromName||"Друг",
    fromUid:
      reaction.fromUid||""
  });

    await remove(

      )

  }catch(error){

    console.error(error);

  }

function createReactionExplosion({
  emoji,
  count,
  fromName,
  fromUid
}){

  const overlay=$("reactionOverlay");

  overlay.innerHTML="";

  const dark=document.createElement("div");
  dark.className="reaction-dark";
  overlay.appendChild(dark);

  const counter=document.createElement("div");

  counter.className="reaction-counter-top";

  counter.textContent=
    `${emoji} × ${count.toLocaleString("ru-RU")}`;

  overlay.appendChild(counter);

  const center=document.createElement("div");

  center.className="reaction-center";

  center.innerHTML=`

    <div class="reaction-big">
      ${emoji}
    </div>

    <div class="reaction-title">
      ${escapeHtml(fromName)}
      отправил тебе реакцию
    </div>

    <div class="reaction-count">
      ×${count.toLocaleString("ru-RU")}
    </div>

    <div class="reaction-subtitle">
      Реакции разлетаются по карте ✨
    </div>

  `;

  overlay.appendChild(center);

  const particleCount=Math.min(
    420,
    Math.max(
      30,
      Math.floor(Math.sqrt(count)*4)
    )
  );

  for(let i=0;i<particleCount;i++){

    const particle=
      document.createElement("div");

    particle.className=
      "reaction-particle";

    particle.textContent=emoji;

    const angle=
      Math.random()*Math.PI*2;

    const distance=
      40+
      Math.random()*
      Math.max(
        innerWidth,
        innerHeight
      )*.9;

    particle.style.setProperty(
      "--x",
      `${Math.cos(angle)*distance}px`
    );

    particle.style.setProperty(
      "--y",
      `${Math.sin(angle)*distance}px`
    );

    particle.style.setProperty(
      "--size",
      `${18+Math.random()*34}px`
    );

    particle.style.setProperty(
      "--duration",
      `${2.2+Math.random()*2}s`
    );

    particle.style.setProperty(
      "--delay",
      `${Math.random()*.6}s`
    );

    particle.style.setProperty(
      "--scale",
      String(.6+Math.random()*1.8)
    );

    particle.style.setProperty(
      "--rotate",
      `${-360+Math.random()*720}deg`
    );

    overlay.appendChild(particle);

  }

  playMapReactionBurst(
    emoji,
    count,
    fromUid
  );

  if(navigator.vibrate){

    navigator.vibrate(
      count>=10000
        ?[80,40,100,40,160]
        :count>=1000
          ?[60,40,90]
          :[50]
    );

  }

  setTimeout(()=>{
    overlay.innerHTML="";
  },4800);

}

function playMapReactionBurst(
  emoji,
  count,
  fromUid
){

  if(!map) return;

  let point=null;

  const marker=
    friendMarkers.get(fromUid);

  if(marker){

    point=
      map.latLngToContainerPoint(
        marker.getLatLng()
      );

  }

  if(!point){

    point={
      x:innerWidth/2,
      y:innerHeight/2
    };

  }

  const visualCount=Math.min(
    50,
    Math.max(
      10,
      Math.floor(
        Math.log10(count+1)*13
      )
    )
  );

  for(let i=0;i<visualCount;i++){

    const item=
      document.createElement("div");

    item.className=
      "reaction-map-burst";

    item.textContent=emoji;

    const angle=
      Math.random()*Math.PI*2;

    const distance=
      30+Math.random()*260;

    item.style.left=
      point.x+
      Math.cos(angle)*distance+"px";

    item.style.top=
      point.y+
      Math.sin(angle)*distance+"px";

    $("map").appendChild(item);

    setTimeout(
      ()=>item.remove(),
      2200
    );

  }

}

    return;
  }

  const avatar=
    await compressImage(file,256,.78);

function compressImage(
  file,
  maxSize=256,
  quality=.78
){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{

      const img=new Image();

      img.onload=()=>{

        const scale=Math.min(
          1,
          maxSize/
          Math.max(img.width,img.height)
        );

        const width=
          Math.round(img.width*scale);

        const height=
          Math.round(img.height*scale);

        const canvas=
          document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        canvas
          .getContext("2d")
          .drawImage(
            img,
            0,0,width,height
          );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );

      };

      img.onerror=reject;
      img.src=reader.result;

    };

    reader.onerror=reject;
    reader.readAsDataURL(file);

  });

}

function formatTime(timestamp){

  if(!timestamp) return "";

  try{

    return new Date(timestamp)
      .toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }catch(e){

    return "";

  }

}

function friendlyError(error){

  const code=error?.code||"";

  if(
    code.includes(
      "auth/operation-not-allowed"
    )
  ){
    return "В Firebase не включён Anonymous Authentication.";
  }

  if(
    code.includes("permission-denied")
  ){
    return "Firebase отклонил доступ. Проверь Database Rules.";
  }

  if(
    code.includes("network-request-failed")
  ){
    return "Нет подключения к интернету.";
  }

  return error?.message||
    "Неизвестная ошибка";

}

      navigator.geolocation

);
