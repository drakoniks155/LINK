<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>LINK — друзья на карте</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#080808;
  --card:#121212;
  --card2:#191919;
  --text:#fff;
  --muted:#9b9b9b;
  --line:#2b2b2b;
  --danger:#ff5d73;
  --ok:#70ffad;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#111;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* TOP */

.topbar{
  position:absolute;
  z-index:1000;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  pointer-events:none;
}

.brand,
.status{
  pointer-events:auto;
  background:rgba(10,10,10,.84);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:10px 14px;
  box-shadow:0 10px 35px rgba(0,0,0,.38);
}

.brand{
  font-weight:950;
  letter-spacing:.7px;
}

.status{
  font-size:12px;
  color:#ddd;
  max-width:58%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:7px;
}

.dot.live{
  background:var(--ok);
  box-shadow:0 0 13px var(--ok);
}

/* MAP BUTTONS */

.map-actions{
  position:absolute;
  z-index:1000;
  right:12px;
  bottom:104px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.round-btn{
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;
  background:rgba(10,10,10,.88);
  backdrop-filter:blur(14px);
  color:#fff;
  font-size:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* BOTTOM NAV */

.bottom{
  position:absolute;
  z-index:1000;
  left:10px;
  right:10px;
  bottom:10px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  padding:7px;

  background:rgba(8,8,8,.91);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;

  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.navbtn{
  position:relative;
  border:0;
  background:transparent;
  color:#999;
  border-radius:18px;
  padding:9px 3px;
  transition:.2s;
}

.navbtn.active{
  background:#fff;
  color:#000;
  transform:scale(.98);
}

.navicon{
  display:block;
  font-size:19px;
  line-height:22px;
}

.navtext{
  display:block;
  font-size:10px;
  font-weight:850;
}

.badge{
  position:absolute;
  top:5px;
  right:18%;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#ff4862;
  color:#fff;
  font-size:10px;
  line-height:17px;
  font-weight:900;
}

/* PANEL */

.panel{
  position:absolute;
  z-index:2000;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:flex-end;
}

.sheet{
  width:100%;
  max-height:88dvh;
  overflow:auto;

  background:#0d0d0d;
  border:1px solid #292929;
  border-bottom:0;

  border-radius:28px 28px 0 0;

  padding:18px 16px 32px;

  animation:up .22s ease-out;
}

@keyframes up{
  from{
    transform:translateY(30px);
    opacity:0;
  }

  to{
    transform:none;
    opacity:1;
  }
}

.handle{
  width:42px;
  height:4px;
  background:#444;
  border-radius:20px;
  margin:0 auto 16px;
}

.sheet h2{
  margin:4px 0 16px;
  font-size:22px;
}

.close{
  float:right;
  border:0;
  background:#222;
  color:#fff;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
}

/* FORMS */

.field{
  margin:11px 0;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:6px;
}

input{
  width:100%;
  border:1px solid #303030;
  background:#171717;
  color:#fff;
  border-radius:14px;
  padding:13px;
  outline:none;
}

input:focus{
  border-color:#777;
}

.btn{
  border:0;
  border-radius:15px;
  padding:13px 15px;
  background:#fff;
  color:#000;
  font-weight:900;
}

.btn.full{
  width:100%;
  margin-top:8px;
}

.btn.secondary{
  background:#222;
  color:#fff;
  border:1px solid #333;
}

.btn.danger{
  background:#2a1115;
  color:#ff8b9a;
  border:1px solid #54202a;
}

.btn.small{
  padding:9px 12px;
  border-radius:12px;
  font-size:12px;
}

/* AUTH */

.auth{
  position:absolute;
  z-index:5000;
  inset:0;
  background:#080808;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.authbox{
  width:min(430px,100%);
  background:#111;
  border:1px solid #292929;
  border-radius:28px;
  padding:25px;
  box-shadow:0 20px 80px #000;
}

.logo{
  font-size:46px;
  font-weight:1000;
  letter-spacing:-2px;
  margin-bottom:5px;
}

.subtitle{
  color:#999;
  margin-bottom:20px;
  line-height:1.45;
}

.auth-status{
  font-size:13px;
  min-height:22px;
  color:#aaa;
  margin-top:12px;
}

/* PROFILE */

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:2px solid #fff;
  display:block;
}

.avatar.small{
  width:47px;
  height:47px;
  border-width:1px;
}

.name{
  font-size:18px;
  font-weight:900;
}

.code{
  color:#999;
  font-size:12px;
  margin-top:3px;
}

.upload{
  position:relative;
  overflow:hidden;
  margin-top:8px;
}

.upload input{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.grow{
  flex:1;
  min-width:0;
}

/* FRIENDS */

.friend,
.request{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #242424;
}

.friend{
  cursor:pointer;
}

.friend:last-child,
.request:last-child{
  border-bottom:0;
}

.friend-actions{
  display:flex;
  gap:7px;
}

.empty{
  color:#888;
  text-align:center;
  padding:30px 10px;
}

.section-title{
  margin:20px 0 6px;
  font-size:13px;
  color:#aaa;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.last-reaction{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
  font-size:11px;
  color:#aaa;
}

.last-reaction .emoji{
  font-size:18px;
}

/* MAP */

.leaflet-control-attribution{
  font-size:8px!important;
}

.leaflet-control-zoom{
  margin-bottom:90px!important;
}

.user-pin,
.friend-pin{
  background:transparent;
  border:0;
}

.pin{
  width:48px;
  height:48px;
  border-radius:50%;
  overflow:hidden;
  background:#222;
  border:3px solid #fff;
  box-shadow:0 5px 20px rgba(0,0,0,.55);
  position:relative;
}

.pin img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pin .ring{
  position:absolute;
  inset:-8px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.16);
    opacity:.2;
  }
}

/* TOAST */

.toast{
  position:absolute;
  z-index:6000;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);

  background:#fff;
  color:#000;
  padding:11px 15px;
  border-radius:14px;

  font-weight:800;
  font-size:13px;

  box-shadow:0 12px 35px rgba(0,0,0,.4);
  max-width:90%;
  text-align:center;
}

/* SETTINGS */

.toggle{
  width:48px;
  height:28px;
  border:0;
  border-radius:20px;
  background:#333;
  position:relative;
  flex:none;
}

.toggle i{
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{
  background:#fff;
}

.toggle.on i{
  left:23px;
  background:#000;
}

.note{
  color:#777;
  font-size:12px;
  line-height:1.5;
  margin-top:12px;
}

.online-status{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-left:6px;
}

.online-status.online{
  background:#70ffad;
  box-shadow:0 0 8px #70ffad;
}

.online-status.offline{
  background:#777;
}

/* FRIEND CARD */

.friend-card-avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:5px auto 12px;
  border:3px solid #fff;
}

.friend-card-name{
  text-align:center;
  font-size:24px;
  font-weight:950;
}

.friend-card-code{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:4px;
}

.friend-status{
  text-align:center;
  margin:12px auto 20px;
  font-size:12px;
  color:#aaa;
}

.reaction-title{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin:18px 0 12px;
}

.reaction-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.reaction-btn{
  height:65px;
  border-radius:20px;
  border:1px solid #2b2b2b;
  background:#161616;
  color:#fff;
  font-size:30px;
  transition:.15s;
}

.reaction-btn:active{
  transform:scale(.88);
  background:#fff;
}

/* FULLSCREEN REACTION */

#reactionOverlay{
  position:fixed;
  z-index:10000;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.94);
  backdrop-filter:blur(18px);

  overflow:hidden;
}

.reaction-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.16),transparent 55%);
  animation:reactionBg 2s ease-in-out infinite alternate;
}

@keyframes reactionBg{
  from{
    transform:scale(1);
    opacity:.5;
  }

  to{
    transform:scale(1.25);
    opacity:1;
  }
}

.reaction-content{
  position:relative;
  z-index:2;
  width:100%;
  text-align:center;
  padding:30px;
}

.reaction-sender-avatar{
  width:82px;
  height:82px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  margin:0 auto 18px;

  animation:avatarReaction .6s cubic-bezier(.2,1.4,.4,1);
}

@keyframes avatarReaction{
  from{
    transform:scale(0);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.reaction-from{
  color:#aaa;
  font-size:14px;
  margin-bottom:4px;
}

.reaction-name{
  font-size:25px;
  font-weight:950;
  margin-bottom:20px;
}

.reaction-emoji{
  font-size:min(42vw,180px);
  line-height:1;

  animation:emojiReaction 1.8s cubic-bezier(.2,1.2,.3,1) infinite alternate;

  filter:drop-shadow(0 20px 30px rgba(255,255,255,.15));
}

@keyframes emojiReaction{
  0%{
    transform:scale(.55) rotate(-10deg);
    opacity:0;
  }

  35%{
    transform:scale(1.15) rotate(8deg);
    opacity:1;
  }

  100%{
    transform:scale(.92) rotate(-4deg);
  }
}

.reaction-text{
  margin-top:20px;
  font-size:17px;
  font-weight:850;
}

.reaction-close{
  margin-top:30px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:#fff;
  padding:13px 24px;
  border-radius:16px;
  font-weight:850;
}

.reaction-particle{
  position:absolute;
  z-index:1;
  font-size:30px;
  animation:particleFly 2.5s ease-out forwards;
  pointer-events:none;
}

@keyframes particleFly{
  from{
    transform:translate(0,0) scale(.4);
    opacity:1;
  }

  to{
    transform:translate(var(--x),var(--y)) scale(1.4) rotate(360deg);
    opacity:0;
  }
}

@media(min-width:700px){

  .bottom{
    left:50%;
    right:auto;
    width:520px;
    transform:translateX(-50%);
  }

  .panel{
    align-items:center;
    justify-content:center;
  }

  .sheet{
    width:520px;
    max-height:80vh;
    border:1px solid #292929;
    border-radius:28px;
  }

}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">
    <div class="brand">LINK</div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Подключение…</span>
    </div>
  </div>

  <div class="map-actions">
    <button class="round-btn" id="centerMeBtn">⌖</button>
    <button class="round-btn" id="showAllBtn">⊙</button>
  </div>

  <nav class="bottom">

    <button class="navbtn active" data-page="map">
      <span class="navicon">🗺️</span>
      <span class="navtext">Карта</span>
    </button>

    <button class="navbtn" data-page="friends">
      <span class="navicon">👥</span>
      <span class="navtext">Друзья</span>
      <span id="requestBadge" class="badge hidden">0</span>
    </button>

    <button class="navbtn" data-page="profile">
      <span class="navicon">👤</span>
      <span class="navtext">Профиль</span>
    </button>

    <button class="navbtn" data-page="settings">
      <span class="navicon">⚙️</span>
      <span class="navtext">Настройки</span>
    </button>

  </nav>

  <div id="panel" class="panel hidden">
    <div id="sheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<!-- FULLSCREEN REACTION -->

<div id="reactionOverlay" class="hidden">
  <div class="reaction-bg"></div>

  <div id="reactionParticles"></div>

  <div class="reaction-content">

    <img id="reactionSenderAvatar" class="reaction-sender-avatar">

    <div class="reaction-from">Тебе отправил реакцию</div>

    <div id="reactionSenderName" class="reaction-name">
      Друг
    </div>

    <div id="reactionEmoji" class="reaction-emoji">
      ❤️
    </div>

    <div class="reaction-text">
      Реакция специально для тебя
    </div>

    <button id="closeReactionBtn" class="reaction-close">
      Закрыть
    </button>

  </div>
</div>

<!-- AUTH -->

<div id="auth" class="auth">

  <div class="authbox">

    <div class="logo">LINK</div>

    <div class="subtitle">
      Друзья рядом. В реальном времени.
    </div>

    <button id="startBtn" class="btn full">
      Начать
    </button>

    <div id="authStatus" class="auth-status">
      Подключаем Firebase…
    </div>

    <div class="note">
      Аккаунт создаётся автоматически и работает без email и пароля.
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {
  apiKey:"AIzaSyACo_xpctW1MDfaGO_bmDzXfFhb4KfwV2w",
  authDomain:"link-69afb.firebaseapp.com",
  databaseURL:"https://link-69afb-default-rtdb.firebaseio.com",
  projectId:"link-69afb",
  storageBucket:"link-69afb.firebasestorage.app",
  messagingSenderId:"488681419482",
  appId:"1:488681419482:web:9c4cd030e20137a4946be3",
  measurementId:"G-6T5XDS5W43"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);


/* VARIABLES */

let user = null;
let profile = null;

let map;
let meMarker = null;

let friendMarkers = new Map();
let friendLocationListeners = new Map();

let friends = {};
let incomingRequests = {};

let watchId = null;
let lastPosition = null;

let locationSharing = true;

let currentPage = "map";

let profileUnsubscribe = null;
let friendsUnsubscribe = null;
let requestsUnsubscribe = null;
let reactionsUnsubscribe = null;

let locationCleanupInterval = null;

let currentReactionId = null;


/* HELPERS */

function defaultAvatar(name=""){

  const letter =
    String(name || "?")
    .trim()
    .slice(0,1)
    .toUpperCase() || "?";

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
        <rect width="160" height="160" fill="#242424"/>
        <text
          x="80"
          y="104"
          text-anchor="middle"
          font-family="Arial"
          font-size="72"
          fill="white"
        >${letter}</text>
      </svg>
    `);
}

function avatarUrl(p){
  return p?.avatar || defaultAvatar(p?.name || "?");
}

function escapeHtml(s){

  return String(s ?? "")
    .replace(/[&<>"']/g,c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[c]));

}


/* MAP */

function initMap(){

  map = L.map("map",{
    zoomControl:true
  }).setView([20,0],2);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap contributors"
    }
  ).addTo(map);

}


function markerIcon(p,isMe=false){

  const html = `
    <div class="pin">
      ${isMe ? '<div class="ring"></div>' : ""}
      <img src="${avatarUrl(p)}">
    </div>
  `;

  return L.divIcon({

    className:isMe ? "user-pin" : "friend-pin",

    html,

    iconSize:[48,48],

    iconAnchor:[24,24],

    popupAnchor:[0,-25]

  });

}


/* STATUS */

function setStatus(text,live=false){

  $("statusText").textContent = text;

  $("statusDot")
    .classList
    .toggle("live",!!live);

}


function toast(text){

  $("toast").textContent = text;

  $("toast").classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(()=>{

    $("toast").classList.add("hidden");

  },2800);

}


/* PANELS */

function openPanel(html){

  $("sheet").innerHTML =
    `<div class="handle"></div>${html}`;

  $("panel").classList.remove("hidden");

}


function closePanel(){

  $("panel").classList.add("hidden");

}

window.closePanel = closePanel;


$("panel").addEventListener("click",e=>{

  if(e.target === $("panel")){
    closePanel();
  }

});


/* NAVIGATION */

document
.querySelectorAll(".navbtn")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    openPage(btn.dataset.page);

  });

});


function openPage(page){

  currentPage = page;

  document
  .querySelectorAll(".navbtn")
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.page === page
    );

  });


  if(page === "map"){

    closePanel();

    setTimeout(()=>{

      map.invalidateSize();

    },100);

  }

/* PROFILE */

async function ensureProfile(){

  const profileRef =
    ref(db,`profiles/${user.uid}`);

  const snap =
    await get(profileRef);


  if(!snap.exists()){

    const code =
      await createUniqueFriendCode();

    const newProfile = {

      name:`LINK ${Math.floor(100 + Math.random()*900)}`,

      friendCode:code,

      avatar:"",

      createdAt:Date.now(),

      locationSharing:true,

      lastActive:Date.now()

    };


    await update(ref(db),{

      [`profiles/${user.uid}`]:newProfile,

      [`friendCodes/${code}`]:user.uid

    });

    profile = newProfile;

  }

  else{

    profile = snap.val();

    if(!profile.friendCode){

      const code =
        await createUniqueFriendCode();

      await update(ref(db),{

        [`profiles/${user.uid}/friendCode`]:code,

        [`friendCodes/${code}`]:user.uid

      });

      profile.friendCode = code;

    }

    await update(
      ref(db,`profiles/${user.uid}`),
      {
        lastActive:Date.now()
      }
    );

  }

}


async function createUniqueFriendCode(){

  for(let i=0;i<30;i++){

    const code =
      String(
        Math.floor(
          1000 + Math.random()*9000
        )
      );

    const existing =
      await get(
        ref(db,`friendCodes/${code}`)
      );

    if(!existing.exists()){
      return code;
    }

  }

  throw new Error(
    "Не удалось создать свободный код."
  );

}

/* PROFILE SUBSCRIBE */

function subscribeProfile(){

  const profileRef =
    ref(db,`profiles/${user.uid}`);

  profileUnsubscribe =
    onValue(profileRef,snap=>{

      if(!snap.exists()) return;

      profile = snap.val();

      if(meMarker){
        renderMeMarker();
      }

      if(currentPage === "profile"){
        renderProfile();
      }

    });

}


/* FRIENDS SUBSCRIBE */

function subscribeFriends(){

  const friendsRef =
    ref(db,`friends/${user.uid}`);

  friendsUnsubscribe =
    onValue(
      friendsRef,
      snap=>{

        const nextFriends =
          snap.val() || {};

        const oldIds =
          Object.keys(friends);


        for(const id of oldIds){

          if(!nextFriends[id]){

            removeFriendMarker(id);

          }

        }


        friends = nextFriends;


        for(
          const friendId of Object.keys(friends)
        ){

          subscribeFriendLocation(friendId);

        }


        if(currentPage === "friends"){

          renderFriends();

        }

      }
    );

}


/* REQUESTS */

function subscribeIncomingRequests(){

  const requestRef =
    ref(db,`friendRequests/${user.uid}`);

  requestsUnsubscribe =
    onValue(requestRef,snap=>{

        snap.val() || {};

/* REACTIONS SUBSCRIBE */

function subscribeReactions(){

  const reactionsRef =
    ref(db,`reactions/${user.uid}`);

  reactionsUnsubscribe =
    onValue(
      reactionsRef,
      async snap=>{

        const reactions =
          snap.val() || {};

        const reactionEntries =
          Object.entries(reactions)
          .sort((a,b)=>
            (b[1]?.createdAt || 0) -
            (a[1]?.createdAt || 0)
          );


        if(!reactionEntries.length){
          return;
        }


        const [reactionId,reaction] =
          reactionEntries[0];


        if(!reaction){
          return;
        }


        if(currentReactionId === reactionId){
          return;
        }


        currentReactionId = reactionId;


        showFullscreenReaction(
          reactionId,
          reaction
        );

      }
    );

}

/* FRIEND LOCATION */

function subscribeFriendLocation(friendId){

  if(
    friendLocationListeners
    .has(friendId)
  ){
    return;
  }


  const locationRef =
    ref(
      db,
      `locations/${friendId}`
    );


  const unsubscribe =
    onValue(
      locationRef,
      async snap=>{

        const location =
          snap.val();


        if(!location){

          removeFriendMarker(
            friendId,
            false
          );

          return;
        }


        const isStale =
          Date.now() -
          location.updatedAt
          >
          5 * 60 * 1000;


        if(isStale){

          removeFriendMarker(
            friendId,
            false
          );

          return;
        }


        const profileSnap =
          await get(
            ref(
              db,
              `profiles/${friendId}`
            )
          );


        if(!profileSnap.exists()){
          return;
        }


        const friendProfile =
          profileSnap.val();


        upsertFriendMarker(
          friendId,
          friendProfile,
          location
        );

      }
    );


  friendLocationListeners.set(
    friendId,
    unsubscribe
  );

}


function upsertFriendMarker(
  friendId,
  friendProfile,
  location
){

  const lat =
    Number(location.lat);

  const lng =
    Number(location.lng);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){
    return;
  }


  if(
    !friendMarkers.has(friendId)
  ){

    const marker =
      L.marker(
        [lat,lng],
        {
          icon:
            markerIcon(friendProfile),
          zIndexOffset:500
        }
      ).addTo(map);


    marker.on(
      "click",
      ()=>{

        showFriendProfile(
          friendId
        );

      }
    );


    friendMarkers.set(
      friendId,
      marker
    );

  }

  else{

    const marker =
      friendMarkers.get(friendId);

    marker.setLatLng(
      [lat,lng]
    );

    marker.setIcon(
      markerIcon(friendProfile)
    );

  }

}


function removeFriendMarker(
  friendId,
  unsubscribe=true
){

  const marker =
    friendMarkers.get(friendId);

  if(marker){

    map.removeLayer(marker);

    friendMarkers.delete(friendId);

  }


  if(
    unsubscribe &&
    friendLocationListeners.has(friendId)
  ){

    friendLocationListeners
      .get(friendId)();

    friendLocationListeners
      .delete(friendId);

  }

}

/* GEOLOCATION */

function startLocation(){

  if(!navigator.geolocation){

    setStatus(
      "GPS не поддерживается",
      false
    );

    toast(
      "Этот браузер не поддерживает геолокацию."
    );

    return;
  }


  if(watchId !== null){

    navigator.geolocation
      .clearWatch(watchId);

  }


  setStatus(
    "Получаем геолокацию…",
    true
  );


  watchId =
    navigator.geolocation
    .watchPosition(

      async pos=>{

        const {
          latitude,
          longitude,
          accuracy
        } = pos.coords;


        lastPosition = {

          lat:latitude,

          lng:longitude,

          accuracy:accuracy || 0,

          updatedAt:Date.now()

        };


        renderMeMarker();


        setStatus(
          "Геолокация в реальном времени",
          true
        );


        try{

          await set(
            ref(
              db,
              `locations/${user.uid}`
            ),
            {
              lat:latitude,
              lng:longitude,
              accuracy:accuracy || 0,
              updatedAt:Date.now()
            }
          );

        }

        catch(error){

          console.error(error);

          setStatus(
            "Ошибка отправки GPS",
            false
          );

        }

      },


      error=>{

        if(error.code === 1){

          setStatus(
            "Разреши геолокацию",
            false
          );

          toast(
            "Разреши доступ к геолокации."
          );

        }

        else{

          setStatus(
            "GPS временно недоступен",
            false
          );

        }

      },


      {

        enableHighAccuracy:true,

        maximumAge:3000,

        timeout:15000

      }

    );

}


/* CLEANUP LOCATIONS */

async function cleanupOldLocations(){

  try{

    const snapshot =
      await get(
        ref(db,"locations")
      );


    if(!snapshot.exists()){
      return;
    }


    const locations =
      snapshot.val();

    const now =
      Date.now();


    for(
      const [uid,location]
      of Object.entries(locations)
    ){

      if(uid === user.uid){
        continue;
      }


      if(
        now - location.updatedAt
        >
        10 * 60 * 1000
      ){

        await remove(
          ref(
            db,
            `locations/${uid}`
          )
        );

        removeFriendMarker(uid);

      }

    }

  }

  catch(error){

    console.error(
      "Cleanup error:",
      error
    );

  }

}

/* SEND FRIEND REQUEST */

async function sendFriendRequest(){

  const code =
    $("friendCodeInput")
    .value
    .replace(/\D/g,"")
    .slice(0,4);


  $("friendCodeInput").value = code;


  if(!/^\d{4}$/.test(code)){

    toast(
      "Введи 4 цифры."
    );

    return;
  }


  try{

    const codeSnap =
      await get(
        ref(
          db,
          `friendCodes/${code}`
        )
      );


    if(!codeSnap.exists()){

      toast(
        "Пользователь с таким кодом не найден."
      );

      return;
    }


    const targetUid =
      codeSnap.val();


    if(targetUid === user.uid){

      toast(
        "Нельзя добавить самого себя."
      );

      return;
    }


    const friendSnap =
      await get(
        ref(
          db,
          `friends/${user.uid}/${targetUid}`
        )
      );


    if(friendSnap.exists()){

      toast(
        "Этот пользователь уже у тебя в друзьях."
      );

      return;
    }


    await set(
      ref(
        db,
        `friendRequests/${targetUid}/${user.uid}`
      ),
      {

        fromUid:user.uid,

        createdAt:Date.now(),

        profile:{

          name:
            profile.name ||
            "Пользователь",

          friendCode:
            profile.friendCode ||
            "",

          avatar:
            profile.avatar ||
            ""

        }

      }
    );


    $("friendCodeInput").value = "";

    toast(
      "Заявка в друзья отправлена ✨"
    );

  }

  catch(error){

    console.error(error);

    toast(
      "Ошибка: " +
      friendlyError(error)
    );

  }

}

  const myProfile = {

      ref(
        db,
        `profiles/${user.uid}`

    .forEach(friendUid=>{

/* AVATAR */

async function uploadAvatar(event){

  const file =
    event.target.files?.[0];

  if(!file){
    return;
  }


  if(!file.type.startsWith("image/")){

    toast(
      "Выбери изображение."
    );

    return;
  }


  if(file.size > 8 * 1024 * 1024){

    toast(
      "Фото должно быть меньше 8 МБ."
    );

    return;
  }


  try{

    toast(
      "Обрабатываем фотографию…"
    );


    const avatar =
      await compressImage(
        file,
        256,
        .78
      );


    await update(
      ref(
        db,
        `profiles/${user.uid}`
      ),
      {
        avatar
      }
    );


    profile.avatar = avatar;


    const updates = {};

    Object.keys(friends)
    .forEach(friendUid=>{

      updates[
        `friends/${friendUid}/${user.uid}/profile/avatar`
      ] = avatar;

    });


    if(Object.keys(updates).length){

      await update(
        ref(db),
        updates
      );

    }


    $("profileAvatar").src =
      avatar;


    renderMeMarker();


    toast(
      "Фото профиля обновлено ✨"
    );

  }

  catch(error){

    console.error(error);

    toast(
      "Не удалось обработать фотографию."
    );

  }

}


function compressImage(
  file,
  maxSize=256,
  quality=.78
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload = ()=>{

        const img =
          new Image();


        img.onload = ()=>{

          const scale =
            Math.min(
              1,
              maxSize /
              Math.max(
                img.width,
                img.height
              )
            );


          const width =
            Math.max(
              1,
              Math.round(
                img.width * scale
              )
            );


          const height =
            Math.max(
              1,
              Math.round(
                img.height * scale
              )
            );


          const canvas =
            document.createElement("canvas");


          canvas.width = width;

          canvas.height = height;


          const ctx =
            canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


        img.onerror = reject;

        img.src = reader.result;

      };


      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}

async function toggleLocation(){

  locationSharing =
    !locationSharing;


  try{

    await update(
      ref(
        db,
        `profiles/${user.uid}`
      ),
      {
        locationSharing
      }
    );


    if(locationSharing){

      startLocation();

      setStatus(
        "Получаем геолокацию…",
        true
      );

    }

    else{

      if(watchId !== null){

        navigator.geolocation
          .clearWatch(watchId);

        watchId = null;

      }


      await remove(
        ref(
          db,
          `locations/${user.uid}`
        )
      );


      if(meMarker){

        map.removeLayer(meMarker);

        meMarker = null;

      }


      setStatus(
        "Геолокация выключена",
        false
      );

    }


    renderSettings();

  }

  catch(error){

    locationSharing =
      !locationSharing;

    toast(
      "Ошибка: " +
      friendlyError(error)
    );

  }

}

/* ERRORS */

function friendlyError(error){

  const code =
    error?.code || "";

  const message =
    error?.message ||
    String(
      error ||
      "Неизвестная ошибка"
    );


  if(
    code.includes(
      "auth/operation-not-allowed"
    )
  ){

    return "В Firebase не включена Anonymous Authentication.";

  }


  if(
    code.includes(
      "permission-denied"
    )
  ){

    return "Firebase Database отклонил доступ. Проверь Rules.";

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return "Нет подключения к интернету.";

  }


  if(
    code.includes(
      "auth/requires-recent-login"
    )
  ){

    return "Требуется повторный вход.";

  }


  return message;

}
