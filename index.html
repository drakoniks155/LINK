<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BLINK</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================================
   AUTH
========================================================= */

#authScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 20%,
      #252525 0,
      #0b0b0b 42%,
      #000 100%
    );
}

.auth-box {
  width: 100%;
  max-width: 430px;

  padding: 28px;

  background: rgba(15,15,15,.96);

  border: 1px solid #333;
  border-radius: 30px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.7);
}

.logo {
  text-align: center;

  font-size: 38px;
  font-weight: 1000;
  letter-spacing: 5px;

  margin-bottom: 5px;
}

.logo-sub {
  text-align: center;

  color: #777;
  font-size: 12px;

  margin-bottom: 28px;
}

.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 5px;

  background: #111;
  padding: 5px;

  border-radius: 15px;

  margin-bottom: 20px;
}

.auth-tab {
  border: 0;

  padding: 11px;

  color: #777;

  background: transparent;

  border-radius: 11px;

  font-weight: 900;
}

.auth-tab.active {
  background: white;
  color: black;
}

.auth-error {
  background: #321313;
  color: #ff9696;

  border: 1px solid #542323;

  padding: 11px;

  border-radius: 13px;

  font-size: 12px;

  margin-bottom: 12px;
}


/* =========================================================
   APP
========================================================= */

#app {
  width: 100%;
  height: 100%;
}


/* =========================================================
   MAP
========================================================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}


/* =========================================================
   TOP
========================================================= */

.topbar {
  position: absolute;

  z-index: 2000;

  top: 12px;
  left: 12px;
  right: 12px;

  display: flex;

  justify-content: space-between;

  pointer-events: none;
}

.badge {
  background: rgba(8,8,8,.92);

  backdrop-filter: blur(15px);

  border: 1px solid #333;

  border-radius: 18px;

  padding: 10px 14px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.5);
}

.brand {
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  font-size: 12px;
}

.dot {
  display: inline-block;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #777;

  margin-right: 7px;
}

.dot.live {
  background: #4cff8a;

  box-shadow:
    0 0 12px #4cff8a;
}


/* =========================================================
   CONTROLS
========================================================= */

.map-controls {
  position: absolute;

  z-index: 2000;

  right: 14px;
  top: 125px;

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.zoom-controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-button,
.map-style-button,
.add-place-map-button,
.center-button {
  width: 50px;
  height: 50px;

  border: 1px solid #333;

  border-radius: 16px;

  background: #050505;

  color: white;

  box-shadow:
    0 8px 25px rgba(0,0,0,.55);
}

.zoom-button {
  font-size: 30px;
  font-weight: 700;
}

.map-style-button,
.add-place-map-button,
.center-button {
  font-size: 20px;
}

.zoom-button:active,
.map-style-button:active,
.add-place-map-button:active,
.center-button:active {
  transform: scale(.94);
}

.map-style-box {
  position: relative;
}

.map-styles {
  position: absolute;

  right: 58px;
  top: 0;

  width: 155px;

  background: rgba(5,5,5,.97);

  border: 1px solid #333;

  border-radius: 16px;

  padding: 6px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.6);
}

.map-styles button {
  width: 100%;

  border: 0;

  background: transparent;

  color: white;

  text-align: left;

  padding: 11px;

  border-radius: 11px;

  font-size: 13px;
}

.map-styles button:hover {
  background: #222;
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom {
  position: absolute;

  z-index: 3000;

  bottom: 10px;

  left: 10px;
  right: 10px;

  background: rgba(8,8,8,.95);

  border: 1px solid #333;

  border-radius: 24px;

  padding: 7px;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 5px;
}

.nav {
  border: 0;

  background: transparent;

  color: #999;

  border-radius: 17px;

  padding: 8px 3px;
}

.nav.active {
  background: white;
  color: black;
}

.nav span {
  display: block;
}

.nav .icon {
  font-size: 19px;
}

.nav .txt {
  font-size: 10px;
  font-weight: bold;
}


/* =========================================================
   PANEL
========================================================= */

.panel {
  position: fixed;

  z-index: 5000;

  inset: 0;

  background: rgba(0,0,0,.65);

  display: flex;

  align-items: flex-end;

  backdrop-filter: blur(4px);
}

.sheet {
  width: 100%;

  max-height: 90dvh;

  overflow-y: auto;

  background: #0d0d0d;

  border: 1px solid #292929;

  border-radius: 28px 28px 0 0;

  padding: 18px 16px 30px;
}

.handle {
  width: 42px;
  height: 4px;

  background: #444;

  border-radius: 10px;

  margin: 0 auto 16px;
}

.close {
  float: right;

  border: 0;

  background: #222;

  color: white;

  width: 36px;
  height: 36px;

  border-radius: 50%;

  font-size: 22px;
}


/* =========================================================
   FORM
========================================================= */

.field {
  margin: 12px 0;
}

.field label {
  display: block;

  color: #aaa;

  font-size: 12px;

  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;

  background: #171717;

  color: white;

  border: 1px solid #333;

  border-radius: 14px;

  padding: 12px;

  outline: none;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #777;
}

.btn {
  width: 100%;

  border: 0;

  border-radius: 15px;

  padding: 13px;

  background: white;

  color: black;

  font-weight: 900;

  margin-top: 8px;
}

.btn.secondary {
  background: #222;
  color: white;

  border: 1px solid #333;
}

.btn.danger {
  background: #351515;
  color: #ff8b8b;

  border: 1px solid #552222;
}

.row {
  display: flex;

  gap: 8px;

  align-items: center;
}

.grow {
  flex: 1;
}


/* =========================================================
   PROFILE
========================================================= */

.profile {
  display: flex;

  align-items: center;

  gap: 14px;

  margin: 15px 0;
}

.avatar {
  width: 70px;
  height: 70px;

  border-radius: 50%;

  object-fit: cover;

  background: #222;

  border: 2px solid white;
}

.avatar.small {
  width: 46px;
  height: 46px;

  border-width: 1px;
}

.code {
  font-size: 12px;
  color: #999;
}

.my-code-box {
  margin-top: 10px;

  padding: 14px;

  border: 1px solid #333;

  border-radius: 16px;

  background: #151515;

  text-align: center;
}

.my-code {
  font-size: 32px;

  letter-spacing: 8px;

  font-weight: 1000;
}


/* =========================================================
   FRIENDS
========================================================= */

.friend {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 11px 0;

  border-bottom: 1px solid #252525;
}

.empty {
  text-align: center;

  color: #888;

  padding: 25px;
}

.note {
  color: #777;

  font-size: 12px;

  line-height: 1.5;
}


/* =========================================================
   PLACES
========================================================= */

.place-item {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px 0;

  border-bottom: 1px solid #252525;
}

.place-icon {
  width: 46px;
  height: 46px;

  min-width: 46px;

  border: 1px solid #333;

  border-radius: 14px;

  background: #171717;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 22px;
}

.place-name {
  font-weight: 900;
  font-size: 15px;
}

.place-type {
  color: #888;
  font-size: 11px;
  margin-top: 3px;
}


/* =========================================================
   MARKERS
========================================================= */

.pin {
  width: 46px;
  height: 46px;

  border: 3px solid white;

  border-radius: 50%;

  background: #222;

  position: relative;

  box-shadow:
    0 5px 20px rgba(0,0,0,.6);
}

.pin img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.ring {
  position: absolute;

  inset: -8px;

  border: 2px solid white;

  border-radius: 50%;

  animation: pulse 1.5s infinite;
}

@keyframes pulse {

  50% {
    transform: scale(1.2);
    opacity: .15;
  }

}

.speed-label {
  position: absolute;

  top: 50px;
  left: 50%;

  transform: translateX(-50%);

  white-space: nowrap;

  background: #000;

  border: 1px solid #333;

  border-radius: 8px;

  padding: 3px 7px;

  font-size: 10px;

  font-weight: 900;
}

.direction-arrow {
  position: absolute;

  left: 50%;
  top: -27px;

  transform: translateX(-50%);

  font-size: 18px;

  text-shadow:
    0 2px 5px #000;
}

.place-marker {
  width: 44px;
  height: 44px;

  border: 2px solid white;

  border-radius: 50%;

  background: #080808;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 21px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.65);
}


/* =========================================================
   TOAST
========================================================= */

.toast {
  position: fixed;

  z-index: 9000;

  left: 50%;
  bottom: 92px;

  transform: translateX(-50%);

  background: white;

  color: black;

  padding: 11px 15px;

  border-radius: 14px;

  font-size: 13px;

  font-weight: 800;

  max-width: 90%;

  text-align: center;
}


/* =========================================================
   CHAT
========================================================= */

.chat-message {
  padding: 9px 12px;

  border-radius: 15px;

  margin: 7px 0;

  max-width: 82%;
}

.chat-message.mine {
  background: white;
  color: black;

  margin-left: auto;
}

.chat-message.other {
  background: #222;
  color: white;

  margin-right: auto;
}

.chat-time {
  font-size: 9px;
  opacity: .55;

  margin-top: 3px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width:700px) {

  .bottom {
    width: 520px;

    left: 50%;
    right: auto;

    transform: translateX(-50%);
  }

  .panel {
    align-items: center;
    justify-content: center;
  }

  .sheet {
    width: 520px;

    border-radius: 28px;

    max-height: 80vh;
  }

}

</style>
</head>

<body>


<!-- =======================================================
     AUTH
======================================================= -->

<div id="authScreen">

  <div class="auth-box">

    <div class="logo">
      ⚡ BLINK
    </div>

    <div class="logo-sub">
      Твои друзья. Твоя карта. В реальном времени.
    </div>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        onclick="switchAuth('login')"
      >
        Вход
      </button>

      <button
        id="registerTab"
        class="auth-tab"
        onclick="switchAuth('register')"
      >
        Регистрация
      </button>

    </div>


    <div
      id="authError"
      class="auth-error hidden"
    ></div>


    <div
      id="registerNameField"
      class="field hidden"
    >

      </label>

      <input
        id="registerName"

      >

    </div>


    <div class="field">

<!-- =======================================================
     APP
======================================================= -->

<div
  id="app"
  class="hidden"
>


<div id="map"></div>


<div class="topbar">

  </div>

  <div class="badge status">

    >

</div>


<div class="bottom">

  <button
    class="nav active"

  >
    <span class="icon">🗺️</span>
    <span class="txt">Карта</span>
  </button>


  <button
    class="nav"
    data-page="friends"
  >
    <span class="icon">👥</span>

  >

>

  <div

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mqY9TwP0DuU3_b8kNswqYg_SQT1rEKt";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let myProfile = null;

let map = null;

let marker = null;

let lastPosition = null;

let watchId = null;

let locationEnabled = true;

let friends = [];

let friendMarkers = {};

let savedPlaces = [];

let placeMarkers = {};

let realtimeChannel = null;

let currentChatId = null;


/* =========================================================
   AUTH MODE
========================================================= */

let authMode = "login";


function switchAuth(mode) {

  authMode = mode;

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      mode === "login"
    );

  document
    .getElementById("registerTab")
    .classList.toggle(
      "active",
      mode === "register"
    );

  document
    .getElementById("registerNameField")
    .classList.toggle(
      "hidden",
      mode !== "register"
    );

  document
    .getElementById("authButton")
    .textContent =
      mode === "login"
        ? "Войти"
        : "Создать аккаунт";

  hideAuthError();

}


/* =========================================================
   AUTH ERROR
========================================================= */

function showAuthError(message) {

  const box =
    document.getElementById(
      "authError"
    );

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

}


function hideAuthError() {

  document
    .getElementById(
      "authError"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================================================
   AUTH SUBMIT
========================================================= */

async function submitAuth() {

  hideAuthError();

  const email =
    document
      .getElementById("authEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("authPassword")
      .value;

  if (!email) {

    showAuthError(
      "Введи email."
    );

    return;

  }

  if (password.length < 6) {

    showAuthError(
      "Пароль должен содержать минимум 6 символов."
    );

    return;

  }


  const button =
    document.getElementById(
      "authButton"
    );

  button.disabled = true;

  button.textContent =
    "Подождите...";


  try {

    if (
      authMode === "login"
    ) {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if (error) {

        throw error;

      }


      if (
        data &&
        data.user
      ) {

        currentUser =
          data.user;

      }

    }

    else {

      const username =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim()
        ||
        "Пользователь";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email,
          password,

          options: {

            data: {
              username: username
            }

          }

        });


      if (error) {

        throw error;

      }


      if (
        data.session
      ) {

        currentUser =
          data.user;

        await ensureProfile(
          currentUser,
          username
        );

        await startApp();

      }

      else {

        showAuthError(
          "Аккаунт создан. Проверь email и подтверди регистрацию, затем войди."
        );

      }

    }

  }

  catch(error) {

    console.error(
      error
    );

    showAuthError(
      readableError(
        error
      )
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      authMode === "login"
        ? "Войти"
        : "Создать аккаунт";

  }

}


/* =========================================================
   ERROR TEXT
========================================================= */

function readableError(
  error
) {

  const message =
    error?.message ||
    String(error);

  if (
    message
      .toLowerCase()
      .includes(
        "invalid login credentials"
      )
  ) {

    return "Неверный email или пароль.";

  }

  if (
    message
      .toLowerCase()
      .includes(
        "email not confirmed"
      )
  ) {

    return "Сначала подтверди email.";

  }

  if (
    message
      .toLowerCase()
      .includes(
        "user already registered"
      )
  ) {

    return "Такой email уже зарегистрирован.";

  }

  return message;

}


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    const {
      data
    } =
      await supabaseClient.auth.getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await startApp();

    }

  }

  catch(error) {

    console.error(
      error
    );

  }


  supabaseClient.auth.onAuthStateChange(

    async function(
      event,
      session
    ) {

      if (
        event === "SIGNED_IN" &&
        session
      ) {

        currentUser =
          session.user;

        await startApp();

      }


      if (
        event === "SIGNED_OUT"
      ) {

        currentUser =
          null;

        document
          .getElementById("app")
          .classList.add(
            "hidden"
          );

        document
          .getElementById("authScreen")
          .classList.remove(
            "hidden"
          );

      }

    }

  );

}


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  if (
    !currentUser

/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(
  user,
  preferredName
) {

  if (
    !user
  ) {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (error) {

    throw error;

  }


  if (data) {

    return data;

  }


  const username =
    preferredName ||
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "Пользователь";


  let profile = null;


  for (
    let attempt = 0;
    attempt < 10;
    attempt++
  ) {

    const code =
      generateFriendCode();


    const {
      data: created,
      error: createError
    } =
      await supabaseClient
        .from("profiles")
        .insert({

          id:
            user.id,

          username:
            username,

          friend_code:
            code,

          avatar_url:
            null,

          bio:
            "",

          notifications_enabled:
            true,

          location_sharing_enabled:
            true

        })
        .select("*")
        .single();


    if (
      !createError
    ) {

      profile =
        created;

      break;

    }


    if (
      !String(
        createError.message
      )
        .toLowerCase()
        .includes("duplicate")
    ) {

      throw createError;

    }

  }


  if (
    !profile
  ) {

    throw new Error(
      "Не удалось создать уникальный код пользователя."
    );

  }


  return profile;

}

function setMapStyle(
  style
) {

  if (!map) {
    return;
  }


  [
    lightMap,
    darkMap,
    satelliteMap,
    labelsMap

  ].forEach(
    layer => {

      if (
        map.hasLayer(layer)
      ) {

        map.removeLayer(
          layer
        );

      }

    }
  );


  if (
    style === "light"
  ) {

    lightMap.addTo(map);

  }

  else if (
    style === "dark"
  ) {

    darkMap.addTo(map);

  }

  else {

    satelliteMap.addTo(map);
    labelsMap.addTo(map);

  }


  localStorage.setItem(
    "blink_map_style",
    style
  );

  document
    .getElementById(
      "mapStyles"
    )
    .style.display =
      "none";

}

    encodeURIComponent(

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[c];

    }
  );

}


/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (
    !locationEnabled
  ) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }


  if (
    !navigator.geolocation
  ) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  setStatus(
    "Получаем GPS...",
    true
  );


  watchId =
    navigator.geolocation.watchPosition(

      onPosition,

      onPositionError,

      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000
      }

    );

}


/* =========================================================
   GPS POSITION
========================================================= */

async function onPosition(
  position
) {

  const c =
    position.coords;


  let speedMs =
    Number.isFinite(
      c.speed
    )
      ? Math.max(0,c.speed)
      : null;


  let direction =
    lastPosition
      ? lastPosition.direction
      : 0;


  if (
    lastPosition
  ) {

    const seconds =
      (
        position.timestamp -
        lastPosition.time
      ) / 1000;


    if (
      seconds > 0
    ) {

      const meters =
        calculateDistance(

          lastPosition.lat,
          lastPosition.lng,

          c.latitude,
          c.longitude

        );


      if (
        speedMs === null
      ) {

        speedMs =
          meters / seconds;

      }


      if (
        meters > 1
      ) {

        direction =
          calculateBearing(

            lastPosition.lat,
            lastPosition.lng,

            c.latitude,
            c.longitude

          );

      }

    }

  }


  const speedKmh =
    (speedMs || 0) * 3.6;


  lastPosition = {

    lat:
      c.latitude,

    lng:
      c.longitude,

    time:
      position.timestamp,

    direction:
      direction,

    speed:
      speedKmh

  };


  updateUserMarker(
    c.latitude,
    c.longitude,
    speedKmh,
    direction
  );


  setStatus(
    "GPS • " +
    directionName(direction),
    true
  );


  try {

    await saveLocation(
      c.latitude,
      c.longitude,
      c.accuracy,
      speedKmh,
      direction
    );

  }

  catch(error) {

    console.error(
      "Location save error:",
      error
    );

  }

}

) {

  }


  const {

  } =
    await supabaseClient
      .from("locations")
      .upsert(

        {

          user_id:
            currentUser.id,

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            Number.isFinite(accuracy)
              ? accuracy
              : null,

          speed:
            Number.isFinite(speed)
              ? speed
              : 0,

          heading:
            Number.isFinite(heading)
              ? heading
              : 0,

          updated_at:
            new Date().toISOString()

        },

        {
          onConflict:
            "user_id"
        }

      );


  if (error) {

    throw error;

  }

}

function updateUserMarker(
  lat,
  lng,
  speed,
  direction
) {

  if (
    !map
  ) {

    return;

  }


  if (
    !marker
  ) {

    marker =
      L.marker(

        [lat,lng],

        {
          icon:

              speed,
              direction
            ),

          zIndexOffset:
            1000
        }

    marker.setLatLng(
      [lat,lng]
    );

    marker.setIcon(
      userIcon(
        speed,
        direction
      )
    );

    marker
      .getPopup()
      .setContent(
        buildMyPopup(
          speed,
          direction
        )
      );

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2-lat1)*rad;

  const dLon =
    (lon2-lon1)*rad;

  const a =
    Math.sin(dLat/2)**2 +

    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *
    Math.sin(dLon/2)**2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );

}


/* =========================================================
   BEARING
========================================================= */

function calculateBearing(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const rad =
    Math.PI / 180;


  const y =
    Math.sin(
      (lon2-lon1)*rad
    ) *
    Math.cos(
      lat2*rad
    );


  const x =
    Math.cos(
      lat1*rad
    ) *
    Math.sin(
      lat2*rad
    ) -

    Math.sin(
      lat1*rad
    ) *
    Math.cos(
      lat2*rad
    ) *
    Math.cos(
      (lon2-lon1)*rad
    );


  return (
    Math.atan2(y,x) *
    180 /
    Math.PI +
    360
  ) % 360;

}


function directionName(
  degrees
) {

  const names = [
    "С",
    "СВ",
    "В",
    "ЮВ",
    "Ю",
    "ЮЗ",
    "З",
    "СЗ"
  ];

  return names[
    Math.round(
      degrees / 45
    ) % 8
  ];

}

async function loadFriends() {

      .from("friendships")

      )

        row => row.friend_id
      );

    !ids.length
  ) {

    return;

  }


  const {
    data: profiles,
    error:
      profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );


  if (
    profileError
  ) {

    throw profileError;

  }


  friends =
    profiles || [];


  renderFriendMarkers();

}


/* =========================================================
   FRIEND REQUEST
========================================================= */

async function sendFriendRequestByCode() {

  const code =
    document
      .getElementById(
        "friendCodeInput"
      )
      .value
      .trim();


  if (
    !/^\d{4}$/.test(code)
  ) {

    toast(
      "Код должен состоять из 4 цифр."
    );

    return;

  }


  if (
    code === myProfile.friend_code
  ) {

    toast(
      "Нельзя добавить самого себя."
    );

    return;

  }


  const {
    data: target,
    error: targetError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,friend_code,avatar_url"
      )
      .eq(
        "friend_code",
        code
      )
      .maybeSingle();


  if (
    targetError
  ) {

    toast(
      readableError(
        targetError
      )
    );

    return;

  }


  if (
    !target
  ) {

    toast(
      "Пользователь с таким кодом не найден."
    );

    return;

  }


  const {
    data: existing,
    error:
      existingError
  } =
    await supabaseClient
      .from("friendships")
      .select("id")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "friend_id",
        target.id
      )
      .maybeSingle();


  if (
    existingError
  ) {

    console.error(
      existingError
    );

  }


  if (
    existing
  ) {

    toast(
      "Этот пользователь уже у тебя в друзьях."
    );

    return;

  }


  const {
    data: request,
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          target.id,

        status:
          "pending"

      })
      .select()
      .single();


  if (error) {

    if (
      String(
        error.message
      )
        .toLowerCase()
        .includes(
          "duplicate"
        )
    ) {

      toast(
        "Заявка уже отправлена."
      );

      return;

    }

    toast(
      readableError(error)
    );

    return;

  }


  await createNotification(

    target.id,

    "friend_request",

    "Новая заявка в друзья",

    `${myProfile.username} хочет добавить тебя в друзья.`,

    {
      request_id:
        request?.id || null
    }

  );


  toast(
    "Заявка отправлена!"
  );

}


/* =========================================================
   INCOMING REQUESTS
========================================================= */

async function getIncomingRequests() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .select(
        "*"
      )
      .eq(
        "receiver_id",
        currentUser.id
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    throw error;

  }


  if (
    !data?.length
  ) {

    return [];

  }


  const ids =
    data.map(
      r => r.sender_id
    );


  const {
    data: senders,
    error:
      senderError
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );


  if (
    senderError
  ) {

    throw senderError;

  }


  return data.map(
    request => ({

      ...request,

      sender:
        senders.find(
          p =>
            p.id ===
            request.sender_id
        )

    })
  );

}

async function acceptFriendRequest(
  requestId
) {

    data: request,
    error
  } =

      .from("friend_requests")
      .select("*")
      .eq(
        "id",

        "receiver_id",
        currentUser.id
      )
      .single();


  if (error) {

    toast(
      readableError(error)
    );

    return;

  }


  const senderId =
    request.sender_id;


  const {
    error:
      firstError
  } =
    await supabaseClient
      .from("friendships")
      .upsert(
        {

          user_id:
            currentUser.id,

          friend_id:
            senderId

        },
        {
          onConflict:
            "user_id,friend_id"
        }
      );


  if (
    firstError
  ) {

    toast(
      readableError(firstError)
    );

    return;

  }


  const {
    error:
      secondError
  } =
    await supabaseClient
      .from("friendships")
      .upsert(
        {

          user_id:
            senderId,

          friend_id:
            currentUser.id

        },
        {
          onConflict:
            "user_id,friend_id"
        }
      );


  if (
    secondError
  ) {

    toast(
      readableError(secondError)
    );

    return;

  }


  await supabaseClient
    .from("friend_requests")
    .update({
      status:
        "accepted",
      updated_at:
        new Date().toISOString()
    })
    .eq(
      "id",
      requestId
    );


  await createNotification(

    senderId,

    "friend_accepted",

    "Заявка принята",

    `${myProfile.username} принял(а) твою заявку.`,

    {}

  );


  await loadFriends();

  showFriends();

  toast(
    "Теперь вы друзья!"
  );

}

async function removeFriend(
  friendId
) {

  if (
    !confirm(
      "Удалить этого друга?"
    )
  ) {

    return;

  }


  await supabaseClient
    .from("friendships")
    .delete()
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "friend_id",
      friendId
    );


  await supabaseClient
    .from("friendships")
    .delete()
    .eq(
      "user_id",
      friendId

    );

========================================================= */

function renderFriendLocations(
  locations
) {

  Object
    .values(friendMarkers)
    .forEach(
      m => {

        if (
          map.hasLayer(m)
        ) {

          map.removeLayer(m);

        }

      }
    );


  friendMarkers = {};


  locations.forEach(
    location => {

      const friend =
        friends.find(
          f =>
            f.id ===
            location.user_id
        );


      if (
        !friend
      ) {

        return;

      }


      const m =
        L.marker(

          [
            location.latitude,
            location.longitude
          ],

          {
            icon:
              friendIcon(
                friend.avatar_url
              ),

            zIndexOffset:
              800

          }

        )
        .addTo(map);


      m.bindPopup(`

        <b>
          ${escapeHtml(
            friend.username
          )}
        </b>

        <br>

        Код:
        ${escapeHtml(
          friend.friend_code
        )}

        <br>

        🚀
        ${Number(
          location.speed || 0
        ).toFixed(1)}
        км/ч

      `);


      friendMarkers[
        location.user_id
      ] =
        m;

    }
  );

}

/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile() {

  const name =
    document
      .getElementById(
        "profileName"
      )
      .value
      .trim()
    ||
    "Пользователь";


  const bio =
    document
      .getElementById(
        "profileBio"
      )
      .value
      .trim();


  const photoInput =
    document.getElementById(
      "profilePhoto"
    );


  let avatarUrl =
    myProfile?.avatar_url ||
    null;


  if (
    photoInput.files.length
  ) {

    const file =
      photoInput.files[0];


    if (
      file.size >
      5 * 1024 * 1024
    ) {

      toast(
        "Фото должно быть меньше 5 МБ."
      );

      return;

    }


    avatarUrl =
      await fileToDataUrl(
        file
      );

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .update({

        username:
          name,

        bio:
          bio,

        avatar_url:
          avatarUrl,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentUser.id
      )
      .select()
      .single();


  if (error) {

    toast(
      readableError(error)
    );

    return;

  }


  myProfile =
    data;


  if (
    marker &&
    lastPosition
  ) {

    marker.setIcon(
      userIcon(
        lastPosition.speed,
        lastPosition.direction
      )
    );

  }


  toast(
    "Профиль сохранён."
  );

  closePanel();

}


function fileToDataUrl(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

      !locationEnabled;

    );

    return;

  myProfile.location_sharing_enabled =
    locationEnabled;


  if (
    locationEnabled
  ) {

    startGPS();

  }

  else {

    if (
      watchId !== null
    ) {

      navigator.geolocation
        .clearWatch(
          watchId
        );

    }

    watchId =
      null;

    setStatus(
      "Геолокация выключена",
      false
    );

  }


  showSettings();

      );


  if (error) {

    throw error;

  }


  const myChatIds =
    (myMembers || [])
      .map(
        x => x.chat_id
      );


  if (
    myChatIds.length
  ) {

    const {
      data: theirMembers
    } =
      await supabaseClient
        .from("chat_members")
        .select("chat_id")
        .eq(
          "user_id",
          friendId
        )
        .in(
          "chat_id",
          myChatIds
        );


    if (
      theirMembers?.length
    ) {

      return theirMembers[0].chat_id;

    }

  }


  const {
    data: chat,
    error:
      chatError
  } =
    await supabaseClient
      .from("chats")
      .insert({
        type:
          "direct"
      })
      .select()
      .single();


  if (chatError) {

    throw chatError;

  }


  const {
    error:
      memberError
  } =
    await supabaseClient
      .from("chat_members")
      .insert([

        {
          chat_id:
            chat.id,

          user_id:
            currentUser.id

        },

        {
          chat_id:
            chat.id,

          user_id:
            friendId

        }

      ]);


  if (memberError) {

    throw memberError;

  }


  return chat.id;

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(
  friendId
) {

  try {

    currentChatId =
      await getOrCreateChat(
        friendId
      );


    await showChat(
      friendId
    );

  }

  catch(error) {

    console.error(
      error
    );

    toast(
      readableError(error)
    );

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

async function showChat(
  friendId
) {

  const friend =
    friends.find(
      f =>
        f.id === friendId
    );


  if (
    !friend
  ) {

    return;

  }


  const {
    data: messages,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "chat_id",
        currentChatId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    toast(
      readableError(error)
    );

    return;

  }


  const messagesHtml =
    (messages || []).map(
      message => `

        <div class="chat-message ${
          message.sender_id ===
          currentUser.id
            ? "mine"
            : "other"
        }">

          <div>
            ${escapeHtml(
              message.body
            )}
          </div>

          <div class="chat-time">

            ${new Date(
              message.created_at
            ).toLocaleTimeString(
              [],
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )}

          </div>

        </div>

      `
    ).join("");


  openPanel(`

    <button
      class="close"
      onclick="showFriends()"
    >
      ×
    </button>

    <h2>
      💬 ${escapeHtml(
        friend.username
      )}
    </h2>


    <div
      id="chatMessages"
      style="
        min-height:200px;
        max-height:45vh;
        overflow-y:auto;
        margin:10px 0;
      "
    >

      ${
        messagesHtml ||

        `<div class="empty">
          Пока нет сообщений.
        </div>`
      }

    </div>


    <div class="row">

      <input
        id="chatInput"
        placeholder="Написать сообщение..."
        onkeydown="
          if(event.key==='Enter'){
            event.preventDefault();
            sendMessage();
          }
        "
      >

      <button
        class="btn"
        style="
          width:auto;
          margin:0;
        "
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  `);


  setTimeout(
    scrollChatToBottom,
    50
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "chatInput"
    );


  if (
    !input ||
    !currentChatId
  ) {

    return;

  }


  const body =
    input.value.trim();


  if (
    !body
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({

        chat_id:
          currentChatId,

        sender_id:
          currentUser.id,

        body:
          body

      });


  if (error) {

    toast(
      readableError(error)
    );

    return;

  }


  input.value = "";


  const friend =
    friends.find(
      f => {

        return f.id !==
          currentUser.id &&
          f.id ===
          getCurrentChatFriendId();

      }
    );


  if (friend) {

    await createNotification(

      friend.id,

      "message",

      "Новое сообщение",

      `${myProfile.username}: ${body}`,

      {
        chat_id:
          currentChatId
      }

    );

  }


  const currentFriend =
    friends.find(
      f =>
        document
          .querySelector(
            "#sheet h2"
          )
          ?.textContent
          ?.includes(
            f.username
          )
    );


  if (currentFriend) {

    await showChat(
      currentFriend.id
    );

  }

}


/* =========================================================
   CURRENT CHAT FRIEND
========================================================= */

function getCurrentChatFriendId() {

  const title =
    document
      .querySelector(
        "#sheet h2"
      )
      ?.textContent ||
      "";


  const friend =
    friends.find(
      f =>
        title.includes(
          f.username
        )
    );


  return friend?.id ||
    null;

}


/* =========================================================
   CHAT SCROLL
========================================================= */

function scrollChatToBottom() {

  const box =
    document.getElementById(
      "chatMessages"
    );


  if (
    box
  ) {

    box.scrollTop =
      box.scrollHeight;

  }

}


/* =========================================================
   REALTIME
========================================================= */

function startRealtime() {

  if (
    realtimeChannel
  ) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "blink-live-" +
        currentUser.id
      );


  realtimeChannel
    .on(

      "postgres_changes",

      {
        event:
          "*",

        schema:
          "public",

        table:
          "friend_requests",

        filter:
          "receiver_id=eq." +
          currentUser.id

      },

      async function() {

        toast(
          "🔔 Новая заявка в друзья!"
        );

        await loadFriends();

      }

    )


    .on(

      "postgres_changes",

      {
        event:
          "INSERT",

        schema:
          "public",

        table:
          "locations"

      },

      async function() {

        await loadFriendLocations();

      }

    )


    .on(

      "postgres_changes",

      {
        event:
          "INSERT",

        schema:
          "public",

        table:
          "notifications",

        filter:
          "user_id=eq." +
          currentUser.id

      },

      function(payload) {

        toast(
          "🔔 " +
          (
            payload.new?.title ||
            "Новое уведомление"
          )
        );

      }

    )


    .subscribe();

}


/* =========================================================
   PANELS
========================================================= */

function openPanel(
  html
) {

  document
    .getElementById(
      "sheet"
    )
    .innerHTML =
      '<div class="handle"></div>' +
      html;


  document
    .getElementById(
      "panel"
    )
    .style.display =
      "flex";

}


function closePanel() {

  document
    .getElementById(
      "panel"
    )
    .style.display =
      "none";

}


document
  .getElementById(
    "panel"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target.id ===
        "panel"
      ) {

        closePanel();

      }

    }
  );


/* =========================================================
   NAV
========================================================= */

document
  .querySelectorAll(
    ".nav"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        async function() {

          document
            .querySelectorAll(
              ".nav"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          const page =
            button.dataset.page;


          if (
            page === "map"
          ) {

            closePanel();

            setTimeout(
              () => {

                if (map) {
                  map.invalidateSize();
                }

              },
              100
            );

          }


          if (
            page === "friends"
          ) {

            await showFriends();

          }


          if (
            page === "profile"
          ) {

            showProfile();

          }


          if (
            page === "settings"
          ) {

            showSettings();

          }

        }
      );

    }
  );


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  if (
    !confirm(
      "Выйти из аккаунта?"
    )
  ) {

    return;

  }


  if (
    watchId !== null
  ) {

    navigator.geolocation
      .clearWatch(
        watchId
      );

  }


  watchId =
    null;


  if (
    realtimeChannel
  ) {

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }


  await supabaseClient.auth.signOut();

}


/* =========================================================
   START
========================================================= */

init();

</script>
