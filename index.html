<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>⚡ Blink</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080808;

    color: white;

    font-family:
        Arial,
        sans-serif;
}

button,
input {

    font: inherit;
}

button {

    cursor: pointer;
}

#map {

    position: fixed;

    inset: 0;

    z-index: 1;
}


/* =====================================================
AUTH
===================================================== */

.auth {

    position: fixed;

    inset: 0;

    z-index: 99999;

    background:
        radial-gradient(
            circle at 50% 20%,
            #222,
            #080808 60%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.auth.hidden {

    display: none;
}

.auth-box {

    width: 100%;

    max-width: 420px;

    background:
        rgba(15,15,15,.96);

    border:
        1px solid #333;

    border-radius: 30px;

    padding: 28px 20px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.7);
}

.logo {

    text-align: center;

    font-size: 34px;

    font-weight: 900;

    margin-bottom: 8px;
}

.logo span {

    color: #fff;
}

.auth-subtitle {

    text-align: center;

    color: #888;

    font-size: 13px;

    margin-bottom: 25px;
}

.auth-tabs {

    display: grid;

    grid-template-columns: 1fr 1fr;

    background: #171717;

    border-radius: 15px;

    padding: 4px;

    margin-bottom: 20px;
}

.auth-tab {

    border: 0;

    background: transparent;

    color: #888;

    padding: 11px;

    border-radius: 12px;

    font-weight: 800;
}

.auth-tab.active {

    background: white;

    color: black;
}

.auth-error {

    background: #351515;

    color: #ff8c8c;

    border: 1px solid #552222;

    padding: 11px;

    border-radius: 12px;

    font-size: 12px;

    margin-bottom: 12px;

    display: none;
}

.field {

    margin: 12px 0;
}

.field label {

    display: block;

    color: #aaa;

    font-size: 12px;

    margin-bottom: 6px;
}

input {

    width: 100%;

    background: #171717;

    color: white;

    border: 1px solid #333;

    border-radius: 14px;

    padding: 13px;

    outline: none;
}

input:focus {

    border-color: white;
}

.btn {

    width: 100%;

    border: 0;

    border-radius: 15px;

    padding: 14px;

    background: white;

    color: black;

    font-weight: 900;

    margin-top: 8px;
}

.btn:active {

    transform: scale(.98);
}

.btn.secondary {

    background: #222;

    color: white;

    border: 1px solid #333;
}

.btn.danger {

    background: #351515;

    color: #ff8888;

    border: 1px solid #552222;
}


/* =====================================================
TOP
===================================================== */

.topbar {

    position: fixed;

    z-index: 2000;

    top: 12px;

    left: 12px;

    right: 12px;

    display: flex;

    justify-content: space-between;

    pointer-events: none;
}

.badge {

    background:
        rgba(8,8,8,.92);

    border:
        1px solid #333;

    border-radius: 20px;

    padding: 10px 14px;

    backdrop-filter: blur(15px);
}

.brand {

    font-weight: 900;

    font-size: 20px;
}

.status {

    font-size: 12px;
}

.dot {

    display: inline-block;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #777;

    margin-right: 6px;
}

.dot.live {

    background: #4cff8a;

    box-shadow:
        0 0 12px #4cff8a;
}


/* =====================================================
CONTROLS
===================================================== */

.map-controls {

    position: fixed;

    z-index: 2000;

    right: 14px;

    top: 125px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.map-button {

    width: 50px;

    height: 50px;

    border: 1px solid #333;

    border-radius: 16px;

    background: #050505;

    color: white;

    font-size: 24px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.55);
}

.map-button:active {

    transform: scale(.93);
}

.map-styles {

    position: absolute;

    right: 58px;

    top: 0;

    width: 160px;

    background: #090909;

    border: 1px solid #333;

    border-radius: 16px;

    padding: 6px;
}

.map-styles button {

    width: 100%;

    background: transparent;

    color: white;

    border: 0;

    text-align: left;

    padding: 11px;

    border-radius: 10px;
}


/* =====================================================
BOTTOM
===================================================== */

.bottom {

    position: fixed;

    z-index: 3000;

    left: 10px;

    right: 10px;

    bottom: 10px;

    background: rgba(8,8,8,.96);

    border: 1px solid #333;

    border-radius: 26px;

    padding: 7px;

    display: grid;

    grid-template-columns:
        repeat(4,1fr);
}

.nav {

    border: 0;

    background: transparent;

    color: #888;

    border-radius: 18px;

    padding: 8px 3px;
}

.nav.active {

    background: white;

    color: black;
}

.nav .icon {

    display: block;

    font-size: 20px;
}

.nav .txt {

    display: block;

    font-size: 10px;

    font-weight: 900;
}


/* =====================================================
PANELS
===================================================== */

.panel {

    position: fixed;

    z-index: 5000;

    inset: 0;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(5px);

    display: flex;

    align-items: flex-end;
}

.sheet {

    width: 100%;

    max-height: 88dvh;

    overflow-y: auto;

    background: #0d0d0d;

    border: 1px solid #292929;

    border-radius: 28px 28px 0 0;

    padding: 18px 16px 30px;
}

.handle {

    width: 42px;

    height: 4px;

    background: #444;

    border-radius: 10px;

    margin: 0 auto 16px;
}

.close {

    float: right;

    border: 0;

    background: #222;

    color: white;

    width: 36px;

    height: 36px;

    border-radius: 50%;

    font-size: 22px;
}

.note {

    color: #777;

    font-size: 12px;

    line-height: 1.5;
}


/* =====================================================
PROFILE
===================================================== */

.profile {

    display: flex;

    align-items: center;

    gap: 14px;

    margin: 15px 0;
}

.avatar {

    width: 70px;

    height: 70px;

    border-radius: 50%;

    object-fit: cover;

    background: #222;

    border: 2px solid white;
}

.avatar.small {

    width: 46px;

    height: 46px;

    border-width: 1px;
}

.code {

    color: #888;

    font-size: 12px;

    margin-top: 3px;
}


/* =====================================================
FRIENDS
===================================================== */

.friend {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px 0;

    border-bottom: 1px solid #252525;
}

.grow {

    flex: 1;
}

.empty {

    text-align: center;

    color: #777;

    padding: 30px 15px;
}


/* =====================================================
PIN
===================================================== */

.pin {

    width: 46px;

    height: 46px;

    border: 3px solid white;

    border-radius: 50%;

    background: #222;

    position: relative;

    box-shadow:
        0 5px 20px rgba(0,0,0,.6);
}

.pin img {

    width: 100%;

    height: 100%;

    border-radius: 50%;

    object-fit: cover;
}

.ring {

    position: absolute;

    inset: -8px;

    border: 2px solid white;

    border-radius: 50%;

    animation: pulse 1.5s infinite;
}

@keyframes pulse {

    50% {

        transform: scale(1.2);

        opacity: .15;
    }
}

.speed-label {

    position: absolute;

    top: 50px;

    left: 50%;

    transform: translateX(-50%);

    white-space: nowrap;

    background: black;

    border: 1px solid #333;

    border-radius: 8px;

    padding: 3px 7px;

    font-size: 10px;

    font-weight: 900;
}


/* =====================================================
TOAST
===================================================== */

.toast {

    position: fixed;

    z-index: 99999;

    left: 50%;

    bottom: 95px;

    transform: translateX(-50%);

    background: white;

    color: black;

    padding: 12px 16px;

    border-radius: 14px;

    font-size: 13px;

    font-weight: 800;

    max-width: 90%;

    text-align: center;
}


/* =====================================================
DESKTOP
===================================================== */

@media (min-width: 700px) {

    .bottom {

        width: 520px;

        left: 50%;

        right: auto;

        transform: translateX(-50%);
    }

    .panel {

        align-items: center;

        justify-content: center;
    }

    .sheet {

        width: 520px;

        border-radius: 28px;

        max-height: 80vh;
    }

}

</style>

</head>


<body>


<!-- =====================================================
AUTH
===================================================== -->

<div id="auth" class="auth">

    <div class="auth-box">

        <div class="logo">
            ⚡ BLINK
        </div>

        <div class="auth-subtitle">
            Карта друзей в реальном времени
        </div>


        <div class="auth-tabs">

            <button
                id="loginTab"
                class="auth-tab active"

            >
                Вход
            </button>

            <button
                id="registerTab"
                class="auth-tab"
                onclick="showRegister()"
            >
                Регистрация
            </button>

        </div>


        <div
            id="authError"
            class="auth-error"
        ></div>

            id="registerUsername"

            style="display:none"
        >

            <label>

            <input
                id="username"
                maxlength="30"

<!-- =====================================================
MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
TOP
===================================================== -->

    </div>

    <div class="badge status">

        <span
            id="statusDot"
            class="dot"
        ></span>

        <span id="statusText">

        </span>

<!-- =====================================================
CONTROLS
===================================================== -->

<div class="map-controls">

    <button
        class="map-button"

    <button

</div>


<!-- =====================================================
BOTTOM
===================================================== -->

<div class="bottom">

    <button
        class="nav active"

        <span class="icon">
            🗺️
        </span>

    </button>


    <button

        data-page="friends"
    >

        <span class="icon">
            👥
        </span>

            Друзья

<!-- =====================================================
PANEL
===================================================== -->

<div
    id="panel"
    class="panel"
    style="display:none"
>

    <div
        id="sheet"
        class="sheet"
    ></div>

</div>


<div
    id="toast"
    class="toast"
    style="display:none"
></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
STATE
========================================================= */

let currentUser = null;

let profile = null;

let friends = [];

let watchId = null;

let marker = null;

let lastPosition = null;

let savedPlaces = [];

let placeMarkers = {};

let currentMapStyle =
    localStorage.getItem("blink_map_style")
    || "dark";


/* =========================================================
MAP
========================================================= */

const map =
    L.map("map")
    .setView(
        [44.8176, 20.4633],
        12
    );


const lightMap =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "© OpenStreetMap"
        }
    );


const darkMap =
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 20,
            attribution: "© OpenStreetMap © CARTO"
        }
    );


const satelliteMap =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: "© Esri"
        }
    );


const labelsMap =
    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 20,
            attribution: "© OpenStreetMap © CARTO"
        }
    );


function setMapStyle(style) {

    [
        lightMap,
        darkMap,
        satelliteMap,
        labelsMap
    ].forEach(layer => {

        if (map.hasLayer(layer)) {

            map.removeLayer(layer);

        }

    });


    if (style === "light") {

        lightMap.addTo(map);

    }


    if (style === "dark") {

        darkMap.addTo(map);

    }


    if (style === "hybrid") {

        satelliteMap.addTo(map);

        labelsMap.addTo(map);

    }


    currentMapStyle = style;

    localStorage.setItem(
        "blink_map_style",
        style
    );

    document.getElementById(
        "mapStyles"
    ).style.display = "none";
}


function toggleMapStyles() {

    const menu =
        document.getElementById("mapStyles");

    menu.style.display =
        menu.style.display === "none"
        ? "block"
        : "none";
}


setMapStyle(currentMapStyle);


/* =========================================================
HELPERS
========================================================= */

function toast(text) {

    const box =
        document.getElementById("toast");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.blinkToast);

    window.blinkToast =
        setTimeout(() => {

            box.style.display = "none";

        }, 3000);
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            c => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[c])
        );
}


function avatar(src) {

    if (src) return src;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg"
                  width="160"
                  height="160">

                <rect width="160"
                      height="160"
                      fill="#222"/>

                <text x="80"
                      y="108"
                      text-anchor="middle"
                      font-size="70"
                      fill="white">
                    👤
                </text>

            </svg>`
        );
}


function setStatus(text, live) {

    document.getElementById(
        "statusText"
    ).textContent = text;

    document.getElementById(
        "statusDot"
    ).classList.toggle(
        "live",
        !!live
    );
}


/* =========================================================
AUTH UI
========================================================= */

let authMode = "login";


function showLogin() {

    authMode = "login";

    document.getElementById(
        "loginTab"
    ).classList.add("active");

    document.getElementById(
        "registerTab"
    ).classList.remove("active");

    document.getElementById(
        "registerUsername"
    ).style.display = "none";

    document.getElementById(
        "authButton"
    ).textContent = "Войти";

    clearAuthError();
}


function showRegister() {

    authMode = "register";

    document.getElementById(
        "registerTab"
    ).classList.add("active");

    document.getElementById(
        "loginTab"
    ).classList.remove("active");

    document.getElementById(
        "registerUsername"
    ).style.display = "block";

    document.getElementById(
        "authButton"
    ).textContent = "Создать аккаунт";

    clearAuthError();
}


function showAuthError(text) {

    const box =
        document.getElementById("authError");

    box.textContent = text;

    box.style.display = "block";
}


function clearAuthError() {

    document.getElementById(
        "authError"
    ).style.display = "none";
}


/* =========================================================
AUTH
========================================================= */

async function submitAuth() {

    clearAuthError();

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    if (!email) {

        showAuthError(
            "Введите email."
        );

        return;
    }


    if (
        password.length < 6
    ) {

        showAuthError(
            "Пароль должен содержать минимум 6 символов."
        );

        return;
    }


    const button =
        document.getElementById(
            "authButton"
        );

    button.disabled = true;

    button.textContent =
        "Подождите…";


    try {

        if (authMode === "register") {

            if (!username) {

                throw new Error(
                    "Введите имя."
                );

            }


            const result =
                await supabaseClient.auth.signUp({

                    email,

                    password,

                    options: {

                        data: {

                            username

                        }

                    }

                });


            if (result.error) {

                throw result.error;

            }


            if (!result.data.session) {

                showAuthError(
                    "Аккаунт создан. Проверь email для подтверждения регистрации."
                );

                return;

            }

            currentUser =
                result.data.user;

        }

        else {

            const result =
                await supabaseClient.auth.signInWithPassword({

                    email,

                    password

                });


            if (result.error) {

                throw result.error;

            }


            currentUser =
                result.data.user;

        }


        await initializeApp();


    }

    catch (error) {

        console.error(error);

        showAuthError(
            translateError(
                error.message
            )
        );

    }

    finally {

        button.disabled = false;

        button.textContent =
            authMode === "login"
            ? "Войти"
            : "Создать аккаунт";

    }
}


function translateError(message) {

    if (!message) {

        return "Произошла ошибка.";

    }

    if (
        message.includes(
            "Invalid login credentials"
        )
    ) {

        return "Неверный email или пароль.";

    }

    if (
        message.includes(
            "User already registered"
        )
    ) {

        return "Такой аккаунт уже существует.";

    }

    if (
        message.includes(
            "Password should be at least"
        )
    ) {

        return "Пароль слишком короткий.";

    }

    if (
        message.includes(
            "Email not confirmed"
        )
    ) {

        return "Подтверди email перед входом.";

    }

    if (
        message.includes(
            "permission denied"
        )
    ) {

        return "Supabase запрещает доступ к таблице. Выполни supabase.sql.";

    }

    return message;
}


/* =========================================================
PROFILE
========================================================= */

async function loadProfile() {

    if (!currentUser) return null;


    let result =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if (result.error) {

        console.error(
            "PROFILE ERROR:",
            result.error
        );

        throw result.error;

    }


    if (!result.data) {

        const username =
            currentUser.user_metadata?.username
            || "Пользователь";


        const insert =
            await supabaseClient
                .from("profiles")
                .insert({

                    id:
                        currentUser.id,

                    username:
                        username,

                    friend_code:
                        await generateLocalCode()

                })
                .select()
                .single();


        if (insert.error) {

            throw insert.error;

        }


        profile =
            insert.data;

    }

    else {

        profile =
            result.data;

    }


    return profile;
}


async function generateLocalCode() {

    for (let i = 0; i < 20; i++) {

        const code =
            String(
                Math.floor(
                    1000 +
                    Math.random() * 9000
                )
            );


        const result =
            await supabaseClient
                .from("profiles")
                .select("id")
                .eq(
                    "friend_code",
                    code
                )
                .maybeSingle();


        if (!result.data) {

            return code;

        }

    }


    return String(
        Math.floor(
            1000 +
            Math.random() * 9000
        )
    );
}

========================================================= */

async function loadFriends() {

    const result =
        await supabaseClient
            .from("friendships")
            .select(`
                id,
                user_id,
                friend_id
            `);


    if (result.error) {

        throw result.error;

    }


    const rows =
        result.data || [];


    const ids =
        rows
            .filter(
                row =>
                    row.user_id === currentUser.id
                    ||
                    row.friend_id === currentUser.id
            )
            .map(
                row =>
                    row.user_id === currentUser.id
                    ? row.friend_id
                    : row.user_id
            );


    friends = [];


    for (
        const id of ids
    ) {

        const p =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .maybeSingle();


        if (
            p.data
        ) {

            friends.push(
                p.data
            );

        }

    }

}


async function addFriend() {

    const input =
        document.getElementById(
            "friendCodeInput"
        );


    const code =
        input.value.trim();


    if (
        !/^\d{4}$/.test(code)
    ) {

        toast(
            "Код должен состоять из 4 цифр."
        );

        return;
    }


    if (
        profile.friend_code === code
    ) {

        toast(
            "Нельзя добавить самого себя."
        );

        return;
    }


    const target =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "friend_code",
                code
            )
            .maybeSingle();


    if (target.error) {

        toast(
            translateError(
                target.error.message
            )
        );

        return;
    }


    if (!target.data) {

        toast(
            "Пользователь с таким кодом не найден."
        );

        return;
    }


    const receiver =
        target.data;


    const existing =
        await supabaseClient
            .from("friend_requests")
            .select("id,status")
            .or(
                `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiver.id}),and(sender_id.eq.${receiver.id},receiver_id.eq.${currentUser.id})`
            );


    if (
        existing.data &&
        existing.data.length
    ) {

        toast(
            "Запрос уже существует."
        );

        return;
    }


    const request =
        await supabaseClient
            .from("friend_requests")
            .insert({

                sender_id:
                    currentUser.id,

                receiver_id:
                    receiver.id

            });


    if (request.error) {

        toast(
            translateError(
                request.error.message
            )
        );

        return;
    }


    await supabaseClient
        .from("notifications")
        .insert({

            user_id:
                receiver.id,

            type:
                "friend_request",

            title:
                "Новый запрос в друзья",

            body:
                `${profile.username} хочет добавить тебя в друзья.`,

            data:
                {
                    sender_id:
                        currentUser.id
                }

        });


    toast(
        "Запрос отправлен!"
    );

    showFriends();

}

/* =========================================================
GPS
========================================================= */

function startGPS() {

    if (
        !navigator.geolocation
    ) {

        setStatus(
            "GPS не поддерживается",
            false
        );

        return;
    }


    setStatus(
        "Получаем GPS…",
        true
    );


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    watchId =
        navigator.geolocation.watchPosition(

            onPosition,

            onPositionError,

            {

                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 15000

            }

        );

}


async function onPosition(position) {

    const c =
        position.coords;


    let speed =
        Number.isFinite(c.speed)
        ? Math.max(0,c.speed)
        : 0;


    let heading =
        Number.isFinite(c.heading)
        ? c.heading
        : 0;


    if (
        !Number.isFinite(c.speed)
        &&
        lastPosition
    ) {

        const meters =
            calculateDistance(

                lastPosition.lat,
                lastPosition.lng,

                c.latitude,
                c.longitude

            );


        const seconds =
            (
                position.timestamp
                -
                lastPosition.time
            ) / 1000;


        if (
            seconds > 0
        ) {

            speed =
                meters / seconds;

            if (
                meters > 1
            ) {

                heading =
                    calculateBearing(

                        lastPosition.lat,
                        lastPosition.lng,

                        c.latitude,
                        c.longitude

                    );

            }

        }

    }


    const speedKmh =
        speed * 3.6;


    lastPosition = {

        lat:
            c.latitude,

        lng:
            c.longitude,

        time:
            position.timestamp,

        speed:
            speedKmh,

        heading:
            heading

    };


    updateMarker(
        c.latitude,
        c.longitude,
        speedKmh,
        heading
    );


    setStatus(
        "GPS • " + directionName(heading),
        true
    );


    if (
        currentUser
    ) {

        const result =
            await supabaseClient
                .from("locations")
                .upsert({

                    user_id:
                        currentUser.id,

                    latitude:
                        c.latitude,

                    longitude:
                        c.longitude,

                    accuracy:
                        c.accuracy,

                    speed:
                        speedKmh,

                    heading:
                        heading,

                    updated_at:
                        new Date().toISOString()

                });


        if (
            result.error
        ) {

            console.error(
                "LOCATION ERROR:",
                result.error
            );

        }

    }

}


function onPositionError(error) {

    if (
        error.code === 1
    ) {

        setStatus(
            "Разреши геолокацию",
            false
        );

        toast(
            "Разреши браузеру доступ к GPS."
        );

    }

    else {

        setStatus(
            "GPS недоступен",
            false
        );

    }

}


/* =========================================================
LOCATION HELPERS
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const rad = Math.PI / 180;

    const dLat =
        (lat2-lat1)*rad;

    const dLon =
        (lon2-lon1)*rad;

    const a =
        Math.sin(dLat/2)**2
        +
        Math.cos(lat1*rad)
        *
        Math.cos(lat2*rad)
        *
        Math.sin(dLon/2)**2;

    return 2*R*Math.asin(
        Math.sqrt(a)
    );
}


function calculateBearing(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const rad =
        Math.PI/180;

    const y =
        Math.sin(
            (lon2-lon1)*rad
        )
        *
        Math.cos(
            lat2*rad
        );

    const x =
        Math.cos(
            lat1*rad
        )
        *
        Math.sin(
            lat2*rad
        )
        -
        Math.sin(
            lat1*rad
        )
        *
        Math.cos(
            lat2*rad
        )
        *
        Math.cos(
            (lon2-lon1)*rad
        );

    return (
        Math.atan2(y,x)
        *180/Math.PI
        +360
    )%360;
}


function directionName(degrees) {

    const names = [
        "С",
        "СВ",
        "В",
        "ЮВ",
        "Ю",
        "ЮЗ",
        "З",
        "СЗ"
    ];

    return names[
        Math.round(degrees/45)%8
    ];
}


/* =========================================================
USER MARKER
========================================================= */

function updateMarker(
    lat,
    lng,
    speed,
    heading
) {

    if (!marker) {

        marker =
            L.marker(
                [lat,lng],
                {
                    icon:
                        userIcon(
                            speed,
                            heading
                        ),
                    zIndexOffset: 1000
                }
            ).addTo(map);


        marker.bindPopup("");

        map.setView(
            [lat,lng],
            16
        );

    }

    else {

        marker.setLatLng(
            [lat,lng]
        );

        marker.setIcon(
            userIcon(
                speed,
                heading
            )
        );

    }


    marker
        .getPopup()
        .setContent(`

            <b>
                ${escapeHtml(profile?.username || "Я")}
            </b>

            <br>

            🚀 ${speed.toFixed(1)} км/ч

            <br>

            🧭 ${directionName(heading)}

        `);

}


function userIcon(
    speed,
    heading
) {

    return L.divIcon({

        className: "",

        html: `

            <div class="pin">

                <div class="ring"></div>

                <img
                    src="${avatar(profile?.avatar_url)}"
                >

            </div>

            <div class="speed-label">

                ${speed.toFixed(1)} км/ч

            </div>

        `,

        iconSize: [46,70],

        iconAnchor: [23,23]

    });

}

/* =========================================================
REALTIME
========================================================= */

function subscribeRealtime() {

    supabaseClient
        .channel(
            "blink-location"
        )
        .on(

            "postgres_changes",

            {
                event: "*",

                schema: "public",

                table: "locations"

            },

            payload => {

                if (
                    payload.new?.user_id
                    ===
                    currentUser?.id
                ) {

                    return;

                }

                loadFriendMarkers();

            }

        )
        .subscribe();


    supabaseClient
        .channel(
            "blink-notifications"
        )
        .on(

            "postgres_changes",

            {
                event: "INSERT",

                schema: "public",

                table: "notifications",

                filter:
                    `user_id=eq.${currentUser.id}`

            },

            payload => {

                toast(
                    payload.new.title
                    ||
                    "Новое уведомление"
                );

            }

        )
        .subscribe();

}


/* =========================================================
FRIEND MARKERS
========================================================= */

async function loadFriendMarkers() {

    if (!friends.length) return;


    for (
        const friend of friends
    ) {

        const result =
            await supabaseClient
                .from("locations")
                .select("*")
                .eq(
                    "user_id",
                    friend.id
                )
                .maybeSingle();


        if (
            !result.data
        ) continue;


        const location =
            result.data;


        if (
            window.friendMarkers
            &&
            window.friendMarkers[friend.id]
        ) {

            window.friendMarkers[
                friend.id
            ].setLatLng([

                location.latitude,

                location.longitude

            ]);

        }

        else {

            if (!window.friendMarkers) {

                window.friendMarkers = {};

            }


            const friendMarker =
                L.marker(

                    [
                        location.latitude,
                        location.longitude
                    ],

                    {

                        icon:
                            L.divIcon({

                                className: "",

                                html: `

                                    <div
                                        style="
                                            width:44px;
                                            height:44px;
                                            border:2px solid white;
                                            border-radius:50%;
                                            background:#111;
                                            overflow:hidden;
                                        "
                                    >

                                        <img
                                            src="${avatar(friend.avatar_url)}"
                                            style="
                                                width:100%;
                                                height:100%;
                                                object-fit:cover;
                                            "
                                        >

                                    </div>

                                `,

                                iconSize:
                                    [44,44],

                                iconAnchor:
                                    [22,22]

                            })

                    }

                ).addTo(map);


            friendMarker.bindPopup(`

                <b>
                    ${escapeHtml(friend.username)}
                </b>

                <br>

                🚀
                ${(location.speed || 0).toFixed(1)}
                км/ч

            `);


            window.friendMarkers[
                friend.id
            ] =
                friendMarker;

        }

    }

}

document
    .querySelectorAll(".nav")
    .forEach(button => {

        button.onclick = async () => {

            document
                .querySelectorAll(".nav")
                .forEach(
                    b =>
                        b.classList.remove(
                            "active"
                        )
                );


            button.classList.add("active");


            const page =
                button.dataset.page;


            if (
                page === "map"
            ) {

                closePanel();

            }


            if (
                page === "friends"
            ) {

                await showFriends();

            }


            if (
                page === "profile"
            ) {

                showProfile();

            }


            if (
                page === "settings"
            ) {

                showSettings();

            }

        };

    });
