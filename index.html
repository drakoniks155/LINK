<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#050505">

  <title>LINK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050505;
      color: #fff;
      font-family: "Inter", sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    button {
      font-family: inherit;
    }


    /* =========================================================
       APP
    ========================================================= */

    #app {
      position: fixed;
      inset: 0;
      background: #050505;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #101010;
    }


    /* =========================================================
       LOADING SCREEN
    ========================================================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #050505;

      transition:
        opacity .6s ease,
        visibility .6s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -5px;

      animation:
        logoPulse 1.4s ease-in-out infinite;
    }

    @keyframes logoPulse {

      0%,
      100% {
        opacity: .35;
        transform: scale(.96);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================================
       TOP BAR
    ========================================================= */

    .top-bar {
      position: absolute;

      top: 15px;
      left: 15px;
      right: 15px;

      z-index: 500;

      display: flex;
      align-items: center;
      justify-content: space-between;

      pointer-events: none;
    }

    .logo {
      padding: 12px 15px;

      border-radius: 17px;

      background: rgba(5, 5, 5, .76);
      border: 1px solid rgba(255, 255, 255, .1);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      font-size: 20px;
      font-weight: 800;

      letter-spacing: -1.6px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, .2);

      pointer-events: auto;
    }


    /* =========================================================
       PROFILE BUTTON
    ========================================================= */

    .profile-button {
      width: 46px;
      height: 46px;

      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 50%;

      background: rgba(5, 5, 5, .76);
      color: #fff;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      pointer-events: auto;

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .profile-button:active {
      transform: scale(.92);
    }

    .profile-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* =========================================================
       LEAFLET
    ========================================================= */

    .leaflet-control-zoom {
      border: none !important;

      margin-top: 78px !important;
      margin-right: 15px !important;
    }

    .leaflet-control-zoom a {
      width: 42px !important;
      height: 42px !important;

      line-height: 40px !important;

      background: rgba(7, 7, 7, .84) !important;
      color: #fff !important;

      border: 1px solid rgba(255, 255, 255, .1) !important;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .leaflet-control-zoom a:first-child {
      border-radius: 13px 13px 0 0 !important;
    }

    .leaflet-control-zoom a:last-child {
      border-radius: 0 0 13px 13px !important;
    }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, .45) !important;
      color: #777 !important;
    }

    .leaflet-control-attribution a {
      color: #999 !important;
    }


    /* =========================================================
       LOCATION CARD
    ========================================================= */

    .location-card {
      position: absolute;

      left: 50%;
      bottom: 19px;

      transform: translateX(-50%);

      z-index: 500;

      width: min(410px, calc(100% - 30px));

      min-height: 76px;

      padding: 13px 15px;

      display: flex;
      align-items: center;

      gap: 12px;

      border-radius: 23px;

      background: rgba(7, 7, 7, .80);

      border: 1px solid rgba(255, 255, 255, .11);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 20px 70px rgba(0, 0, 0, .4);
    }


    /* =========================================================
       MINI AVATAR
    ========================================================= */

    .mini-avatar {
      width: 47px;
      height: 47px;

      flex: 0 0 47px;

      border-radius: 50%;

      background: #fff;
      color: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-size: 14px;
      font-weight: 700;

      border: 2px solid rgba(255, 255, 255, .8);
    }

    .mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* =========================================================
       LOCATION INFO
    ========================================================= */

    .location-info {
      flex: 1;
      min-width: 0;
    }

    .location-name {
      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-status {
      margin-top: 5px;

      font-size: 11px;

      color: #8d8d8d;

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 0 10px rgba(255, 255, 255, .8);

      animation:
        statusPulse 1.7s ease-in-out infinite;
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: .4;
      }

      50% {
        opacity: 1;
      }

    }


    /* =========================================================
       BATTERY
    ========================================================= */

    .battery {
      min-width: 75px;

      text-align: right;

      color: #888;

      font-size: 10px;
      line-height: 1.5;
    }

    .battery strong {
      color: #fff;
      font-size: 14px;
    }


    /* =========================================================
       LOCATION PERMISSION
    ========================================================= */

    .permission-overlay {
      position: absolute;
      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, .42);

      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .permission-overlay.visible {
      display: flex;
    }

    .permission-box {
      width: min(390px, 100%);

      padding: 27px;

      border-radius: 29px;

      background: rgba(12, 12, 12, .95);

      border: 1px solid rgba(255, 255, 255, .12);

      box-shadow:
        0 30px 100px rgba(0, 0, 0, .6);

      text-align: center;

      animation:
        permissionIn .35s ease;
    }

    @keyframes permissionIn {

      from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }

    .permission-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      border-radius: 23px;

      background: #fff;
      color: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      box-shadow:
        0 12px 40px rgba(255, 255, 255, .08);
    }

    .permission-box h2 {
      margin: 0;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: -.5px;
    }

    .permission-box p {
      margin: 11px 0 22px;

      color: #888;

      font-size: 13px;
      line-height: 1.55;
    }

    .location-button {
      width: 100%;
      height: 54px;

      border: 0;
      border-radius: 17px;

      background: #fff;
      color: #000;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform .2s ease;
    }

    .location-button:active {
      transform: scale(.97);
    }


    /* =========================================================
       ERROR / STATUS
    ========================================================= */

    .error-message {
      position: absolute;

      top: 82px;
      left: 50%;

      transform: translateX(-50%) translateY(-10px);

      z-index: 1500;

      width: min(370px, calc(100% - 30px));

      padding: 13px 16px;

      border-radius: 15px;

      background: rgba(10, 10, 10, .88);

      border: 1px solid rgba(255, 255, 255, .1);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      color: #bbb;

      text-align: center;

      font-size: 12px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .error-message.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================================================
       USER MAP MARKER
    ========================================================= */

    .link-marker {
      position: relative;

      width: 82px;
      height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-pulse {
      position: absolute;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, .23);

      animation:
        pulseMain 2s ease-in-out infinite;
    }

    .marker-pulse-ring {
      position: absolute;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      border: 1px solid rgba(255, 255, 255, .25);

      animation:
        pulseRing 2.3s ease-out infinite;
    }

    .marker-core {
      position: relative;

      z-index: 5;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      background: #fff;
      color: #000;

      border: 3px solid #fff;

      box-shadow:
        0 6px 28px rgba(0, 0, 0, .55),
        0 0 0 3px rgba(0, 0, 0, .28);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      animation:
        markerFloat 2s ease-in-out infinite;
    }

    .marker-core img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .marker-core span {
      font-size: 14px;
      font-weight: 800;
    }

    .marker-name {
      position: absolute;

      top: 72px;
      left: 50%;

      transform: translateX(-50%);

      white-space: nowrap;

      padding: 5px 9px;

      border-radius: 10px;

      background: rgba(0, 0, 0, .78);

      border: 1px solid rgba(255, 255, 255, .08);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: #fff;

      font-size: 10px;
      font-weight: 600;
    }

    @keyframes pulseMain {

      0%,
      100% {
        transform: scale(.78);
        opacity: .34;
      }

      50% {
        transform: scale(1.18);
        opacity: .1;
      }

    }

    @keyframes pulseRing {

      0% {
        transform: scale(.7);
        opacity: .65;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }

    }

    @keyframes markerFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .top-bar {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .location-card {
        bottom: 14px;

        width:
          calc(100% - 24px);
      }

      .leaflet-control-zoom {
        margin-top: 72px !important;
        margin-right: 12px !important;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       APP
  ======================================================== -->

  <main id="app">

    <div id="map"></div>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">

      <div class="logo">
        LINK
      </div>

      <button
        class="profile-button"
        id="profileButton"
        type="button"
        aria-label="Профиль"
      >
        <span id="profileInitial">?</span>
      </button>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
      class="error-message"
      id="errorMessage"
    ></div>


    <!-- =====================================================
         LOCATION CARD
    ====================================================== -->

    <div class="location-card">

      <div
        class="mini-avatar"
        id="miniAvatar"
      >
        <span id="miniInitial">?</span>
      </div>


      <div class="location-info">

        <div
          class="location-name"
          id="userName"
        >
          Ты
        </div>

        <div class="location-status">

          <span class="status-dot"></span>

          <span id="locationStatus">
            Определяем геопозицию...
          </span>

        </div>

      </div>


      <div
        class="battery"
        id="batteryInfo"
      >
        🔋 <strong>—</strong>
      </div>

    </div>


    <!-- =====================================================
         LOCATION PERMISSION
    ====================================================== -->

    <div
      class="permission-overlay"
      id="permissionOverlay"
    >

      <div class="permission-box">

        <div class="permission-icon">
          ◎
        </div>

        <h2>
          Твоя геопозиция
        </h2>

        <p>
          Link покажет твоё местоположение
          на карте. Для этого разреши браузеру
          доступ к геопозиции устройства.
        </p>

        <button
          class="location-button"
          id="locationButton"
          type="button"
        >
          Разрешить геопозицию
        </button>

      </div>

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div id="loadingScreen">

      <div class="loading-logo">
        LINK
      </div>

    </div>

  </main>


  <!-- =======================================================
       LEAFLET
  ======================================================== -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <script>

    /* =========================================================
       LINK — CONFIGURATION
    ========================================================= */

    const CONFIG = {

      /*
        Имя пользователя.

        Позже его можно заменить на имя
        из профиля Link.
      */

      username: "Ты",

      /*
        URL аватарки.

        Если оставить пустым — будет
        белый круг с первой буквой имени.
      */

      avatarUrl: "",

      /*
        Показывать ли запрос геопозиции
        автоматически.
      */

      requestLocationAutomatically: true

    };


    /* =========================================================
       STATE
    ========================================================= */

    let map = null;

    let userMarker = null;

    let locationWatchId = null;

    let hasCenteredMap = false;

    let battery = null;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loadingScreen =
      document.getElementById(
        "loadingScreen"
      );

    const permissionOverlay =
      document.getElementById(
        "permissionOverlay"
      );

    const locationButton =
      document.getElementById(
        "locationButton"
      );

    const userName =
      document.getElementById(
        "userName"
      );

    const locationStatus =
      document.getElementById(
        "locationStatus"
      );

    const batteryInfo =
      document.getElementById(
        "batteryInfo"
      );

    const profileButton =
      document.getElementById(
        "profileButton"
      );

    const profileInitial =
      document.getElementById(
        "profileInitial"
      );

    const miniAvatar =
      document.getElementById(
        "miniAvatar"
      );

    const miniInitial =
      document.getElementById(
        "miniInitial"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /* =========================================================
       INITIALIZE PROFILE
    ========================================================= */

    function initializeProfile() {

      const name =
        CONFIG.username ||
        "Ты";

      const firstLetter =
        name
          .trim()
          .charAt(0)
          .toUpperCase() ||
        "?";


      userName.textContent =
        name;

      profileInitial.textContent =
        firstLetter;

      miniInitial.textContent =
        firstLetter;


      if (CONFIG.avatarUrl) {

        profileButton.innerHTML =
          `
            <img
              src="${escapeHtml(CONFIG.avatarUrl)}"
              alt=""
            >
          `;

        miniAvatar.innerHTML =
          `
            <img
              src="${escapeHtml(CONFIG.avatarUrl)}"
              alt=""
            >
          `;

      }

    }


    /* =========================================================
       INITIALIZE MAP
    ========================================================= */

    function initializeMap() {

      if (map) {
        return;
      }


      /*
        Стартовая позиция.

        Она нужна только до получения
        реальной геопозиции.
      */

      map = L.map(
        "map",
        {
          zoomControl: true,
          attributionControl: true
        }
      ).setView(
        [54.7104, 20.4522],
        13
      );


      /*
        Тёмная карта.
      */

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          maxZoom: 20,

          attribution:
            '&copy; OpenStreetMap &copy; CARTO'
        }
      ).addTo(map);


      /*
        Исправляем размер карты
        после загрузки.
      */

      setTimeout(
        () => {
          map.invalidateSize();
        },
        500
      );

    }


    /* =========================================================
       LOCATION PERMISSION
    ========================================================= */

    function askForLocation() {

      if (!navigator.geolocation) {

        showError(
          "Твой браузер не поддерживает геопозицию."
        );

        locationStatus.textContent =
          "Геопозиция недоступна";

        hideLoading();

        return;
      }


      /*
        Показываем собственный красивый экран
        перед системным запросом браузера.
      */

      permissionOverlay.classList.add(
        "visible"
      );

    }


    /* =========================================================
       START LOCATION
    ========================================================= */

    function startLocation() {

      permissionOverlay.classList.remove(
        "visible"
      );


      locationStatus.textContent =
        "Получаем геопозицию...";


      /*
        Получаем позицию сразу.
      */

      navigator.geolocation.getCurrentPosition(
        onLocationSuccess,
        onLocationError,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 5000
        }
      );


      /*
        Затем продолжаем следить за пользователем.
      */

      locationWatchId =
        navigator.geolocation.watchPosition(
          onLocationSuccess,
          onLocationError,
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 3000
          }
        );

    }


    /* =========================================================
       LOCATION BUTTON
    ========================================================= */

    locationButton.addEventListener(
      "click",
      startLocation
    );


    /* =========================================================
       LOCATION SUCCESS
    ========================================================= */

    function onLocationSuccess(
      position
    ) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      console.log(
        "LINK location:",
        {
          latitude,
          longitude,
          accuracy
        }
      );


      locationStatus.textContent =
        "Геопозиция активна";


      /*
        Создаём маркер.
      */

      if (!userMarker) {

        userMarker =
          L.marker(
            [
              latitude,
              longitude
            ],
            {
              icon:
                createUserMarker()
            }
          ).addTo(map);

      } else {

        /*
          Обновляем положение.
        */

        userMarker.setLatLng(
          [
            latitude,
            longitude
          ]
        );

      }


      /*
        При первом получении координат
        центрируем карту.
      */

      if (!hasCenteredMap) {

        map.setView(
          [
            latitude,
            longitude
          ],
          17,
          {
            animate: true
          }
        );

        hasCenteredMap = true;

      }


      hideLoading();

    }


    /* =========================================================
       LOCATION ERROR
    ========================================================= */

    function onLocationError(
      error
    ) {

      console.warn(
        "Location error:",
        error
      );


      if (error.code === 1) {

        locationStatus.textContent =
          "Доступ к геопозиции запрещён";

        showError(
          "Разреши доступ к геопозиции в настройках браузера."
        );

      }


      else if (error.code === 2) {

        locationStatus.textContent =
          "Не удалось определить геопозицию";

        showError(
          "Не удалось определить твоё местоположение."
        );

      }


      else if (error.code === 3) {

        locationStatus.textContent =
          "Истекло время ожидания";

        showError(
          "Получение геопозиции заняло слишком много времени."
        );

      }


      else {

        locationStatus.textContent =
          "Ошибка геопозиции";

        showError(
          "Не удалось получить геопозицию."
        );

      }


      hideLoading();

    }


    /* =========================================================
       CREATE USER MARKER
    ========================================================= */

    function createUserMarker() {

      const name =
        CONFIG.username ||
        "Ты";


      const firstLetter =
        name
          .trim()
          .charAt(0)
          .toUpperCase() ||
        "?";


      let core;


      /*
        Если аватарки нет —
        белый круг с именем/буквой.

        Если аватарка есть —
        показываем фотографию.
      */

      if (CONFIG.avatarUrl) {

        core =
          `
            <img
              src="${escapeHtml(CONFIG.avatarUrl)}"
              alt=""
            >
          `;

      } else {

        core =
          `
            <span>
              ${escapeHtml(firstLetter)}
            </span>
          `;

      }


      return L.divIcon({

        className: "",

        html:
          `
            <div class="link-marker">

              <div
                class="marker-pulse"
              ></div>

              <div
                class="marker-pulse-ring"
              ></div>

              <div
                class="marker-core"
              >
                ${core}
              </div>

              <div
                class="marker-name"
              >
                ${escapeHtml(name)}
              </div>

            </div>
          `,

        iconSize:
          [82, 105],

        iconAnchor:
          [41, 42]

      });

    }


    /* =========================================================
       BATTERY
    ========================================================= */

    async function initializeBattery() {

      /*
        Battery Status API доступен
        не во всех браузерах.
      */

      if (
        !("getBattery" in navigator)
      ) {

        batteryInfo.innerHTML =
          `
            🔋 <strong>—</strong>
          `;

        return;

      }


      try {

        battery =
          await navigator.getBattery();


        updateBattery();


        battery.addEventListener(
          "levelchange",
          updateBattery
        );


        battery.addEventListener(
          "chargingchange",
          updateBattery
        );


      } catch (error) {

        console.warn(
          "Battery API unavailable:",
          error
        );

      }

    }


    /* =========================================================
       UPDATE BATTERY
    ========================================================= */

    function updateBattery() {

      if (!battery) {
        return;
      }


      const percent =
        Math.round(
          battery.level * 100
        );


      const charging =
        battery.charging;


      batteryInfo.innerHTML =
        `
          🔋 <strong>${percent}%</strong><br>
          ${charging
            ? "Заряжается"
            : "Не заряжается"
          }
        `;

    }


    /* =========================================================
       PROFILE BUTTON
    ========================================================= */

    profileButton.addEventListener(
      "click",
      () => {

        showError(
          "Профиль Link появится здесь."
        );

      }
    );


    /* =========================================================
       SHOW ERROR
    ========================================================= */

    let errorTimer = null;

    function showError(
      text
    ) {

      errorMessage.textContent =
        text;

      errorMessage.classList.add(
        "show"
      );


      clearTimeout(
        errorTimer
      );


      errorTimer =
        setTimeout(
          () => {

            errorMessage.classList.remove(
              "show"
            );

          },
          4500
        );

    }


    /* =========================================================
       HIDE LOADING
    ========================================================= */

    function hideLoading() {

      setTimeout(
        () => {

          loadingScreen.classList.add(
            "hidden"
          );

        },
        300
      );

    }


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================================
       START LINK
    ========================================================= */

    function startLink() {

      initializeProfile();

      initializeMap();

      initializeBattery();


      /*
        Небольшая задержка,
        чтобы карта успела загрузиться.
      */

      setTimeout(
        () => {

          hideLoading();


          if (
            CONFIG.requestLocationAutomatically
          ) {

            askForLocation();

          }

        },
        700
      );

    }


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      startLink
    );

  </script>

</body>
