<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Blink</title>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #111;
    }

    /* =========================
       TOP
    ========================= */

    .topbar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      pointer-events: none;
    }

    .brand,
    .status {
      pointer-events: auto;

      background: rgba(8,8,8,.85);
      backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 18px;

      padding: 10px 14px;

      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .brand {
      font-weight: 900;
      letter-spacing: 1px;
    }

    .status {
      font-size: 12px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      margin-right: 7px;
    }

    .dot.live {
      background: #4cff8a;
      box-shadow: 0 0 12px #4cff8a;
    }

    /* =========================
       SPEED
    ========================= */

    .speed-card {
      position: absolute;
      z-index: 1000;

      top: 76px;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(8,8,8,.88);
      backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 22px;

      padding: 10px 20px;

      text-align: center;

      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    .speed-card b {
      font-size: 25px;
    }

    .speed-card small {
      display: block;
      color: #999;
      font-size: 9px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom {
      position: absolute;
      z-index: 1000;

      left: 10px;
      right: 10px;
      bottom: 10px;

      background: rgba(8,8,8,.92);
      backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;

      padding: 7px;

      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .navbtn {
      border: 0;
      background: transparent;
      color: #999;

      border-radius: 18px;

      padding: 9px 3px;
    }

    .navbtn.active {
      background: white;
      color: black;
    }

    .navicon {
      display: block;
      font-size: 19px;
    }

    .navtext {
      display: block;
      font-size: 10px;
      font-weight: bold;
    }

    /* =========================
       AUTH
    ========================= */

    .auth {
      position: absolute;
      z-index: 5000;

      inset: 0;

      background: #080808;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .authbox {
      width: min(430px,100%);

      background: #111;

      border: 1px solid #292929;
      border-radius: 28px;

      padding: 24px;

      box-shadow: 0 20px 80px black;
    }

    .logo {
      font-size: 45px;
      font-weight: 1000;
      letter-spacing: -3px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 22px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;

      background: #181818;

      padding: 4px;

      border-radius: 14px;

      margin-bottom: 15px;
    }

    .tabs button {
      border: 0;
      background: transparent;

      color: #999;

      padding: 10px;

      border-radius: 11px;
      font-weight: bold;
    }

    .tabs button.active {
      background: white;
      color: black;
    }

    .field {
      margin: 10px 0;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;

      border: 1px solid #303030;
      background: #171717;
      color: white;

      border-radius: 14px;

      padding: 12px;

      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    .btn {
      width: 100%;

      border: 0;
      border-radius: 15px;

      padding: 13px;

      background: white;
      color: black;

      font-weight: 900;

      margin-top: 8px;
    }

    .btn.secondary {
      background: #222;
      color: white;
      border: 1px solid #333;
    }

    .btn.danger {
      background: #2a1115;
      color: #ff8798;
    }

    .msg {
      min-height: 18px;
      margin-top: 10px;

      font-size: 13px;
      color: #ff8798;
    }

    /* =========================
       PANELS
    ========================= */

    .panel {
      position: absolute;
      z-index: 2000;

      inset: 0;

      background: rgba(0,0,0,.58);

      backdrop-filter: blur(4px);

      display: flex;
      align-items: flex-end;
    }

    .sheet {
      width: 100%;

      max-height: 88dvh;

      overflow-y: auto;

      background: #0d0d0d;

      border-radius: 28px 28px 0 0;
      border: 1px solid #292929;

      padding: 18px 16px 30px;
    }

    .handle {
      width: 42px;
      height: 4px;

      background: #444;

      border-radius: 20px;

      margin: 0 auto 16px;
    }

    .sheet h2 {
      margin: 4px 0 16px;
    }

    .close {
      float: right;

      width: 36px;
      height: 36px;

      border: 0;

      border-radius: 50%;

      background: #222;
      color: white;

      font-size: 22px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-head {
      display: flex;
      align-items: center;

      gap: 14px;

      margin-bottom: 16px;
    }

    .avatar {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      object-fit: cover;

      background: #222;

      border: 2px solid white;
    }

    .avatar.small {
      width: 45px;
      height: 45px;

      border-width: 1px;
    }

    .name {
      font-size: 18px;
      font-weight: 900;
    }

    .code {
      color: #999;
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .friend {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px 0;

      border-bottom: 1px solid #242424;
    }

    .grow {
      flex: 1;
    }

    .friend .speed {
      font-weight: 900;
      font-size: 12px;
    }

    .empty {
      color: #888;
      text-align: center;

      padding: 30px 10px;
    }

    /* =========================
       MAP MARKERS
    ========================= */

    .user-pin,
    .friend-pin {
      background: transparent;
      border: 0;
    }

    .pin {
      position: relative;

      width: 46px;
      height: 46px;

      border-radius: 50%;

      overflow: hidden;

      background: #222;

      border: 3px solid white;

      box-shadow:
        0 5px 20px rgba(0,0,0,.6);
    }

    .pin img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .ring {
      position: absolute;

      inset: -8px;

      border: 2px solid rgba(255,255,255,.7);

      border-radius: 50%;

      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.2);
        opacity: .2;
      }
    }

    .speed-label {
      position: absolute;

      top: 50px;
      left: 50%;

      transform: translateX(-50%);

      white-space: nowrap;

      background: black;
      color: white;

      border: 1px solid #333;

      border-radius: 9px;

      padding: 3px 7px;

      font-size: 10px;
      font-weight: 900;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: absolute;
      z-index: 6000;

      left: 50%;
      bottom: 92px;

      transform: translateX(-50%);

      background: white;
      color: black;

      padding: 11px 15px;

      border-radius: 14px;

      font-weight: 800;
      font-size: 13px;

      max-width: 90%;

      text-align: center;
    }

    /* =========================
       TOGGLE
    ========================= */

    .toggle {
      width: 48px;
      height: 28px;

      border: 0;

      border-radius: 20px;

      background: #333;

      position: relative;
    }

    .toggle i {
      position: absolute;

      top: 3px;
      left: 3px;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background: white;

      transition: .2s;
    }

    .toggle.on {
      background: white;
    }

    .toggle.on i {
      left: 23px;
      background: black;
    }

    .leaflet-control-attribution {
      font-size: 8px !important;
    }

    .leaflet-control-zoom {
      margin-bottom: 90px !important;
    }

    @media(min-width:700px) {

      .bottom {
        left: 50%;
        right: auto;

        width: 520px;

        transform: translateX(-50%);
      }

      .panel {
        align-items: center;
        justify-content: center;
      }

      .sheet {
        width: 520px;

        max-height: 80vh;

        border-radius: 28px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">

    <div class="brand">
      ⚡ BLINK
    </div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">
        Ожидание GPS
      </span>
    </div>

  </div>

  <div class="speed-card">

    <b id="mySpeed">
      0.0 км/ч
    </b>

    <small>
      МОЯ СКОРОСТЬ
    </small>

  </div>

  <div class="bottom">

    <button class="navbtn active" data-page="map">
      <span class="navicon">🗺️</span>
      <span class="navtext">Карта</span>
    </button>

    <button class="navbtn" data-page="friends">
      <span class="navicon">👥</span>
      <span class="navtext">Друзья</span>
    </button>

    <button class="navbtn" data-page="profile">
      <span class="navicon">👤</span>
      <span class="navtext">Профиль</span>
    </button>

    <button class="navbtn" data-page="settings">
      <span class="navicon">⚙️</span>
      <span class="navtext">Настройки</span>
    </button>

  </div>

  <div id="panel" class="panel hidden">

    <div id="sheet" class="sheet"></div>

  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<!-- AUTH -->

<div id="auth" class="auth">

  <div class="authbox">

    <div class="logo">
      blink
    </div>

    <div class="subtitle">
      Друзья рядом. В реальном времени.
    </div>

    <div class="tabs">

      <button id="loginTab" class="active">
        Войти
      </button>

      <button id="signupTab">
        Регистрация
      </button>

    </div>

    <div class="field">

      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
      >

    </div>

    <div class="field">

      <label>
        Пароль
      </label>

      <input
        id="password"
        type="password"
        placeholder="••••••••"
      >

    </div>

    <div
      id="usernameField"
      class="field hidden"
    >

      <label>
        Имя
      </label>

      <input
        id="username"
        maxlength="30"
        placeholder="Твоё имя"
      >

    </div>

    <button
      id="authBtn"
      class="btn"
    >
      Войти
    </button>

    <div
      id="authMsg"
      class="msg"
    ></div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   STATE
===================================================== */

let user = null;
let profile = null;

let map = null;

let myMarker = null;

let friendMarkers = new Map();

let myTrail = [];

let friendTrails = new Map();

let trailLayers = [];

let watchId = null;

let lastPosition = null;

let locationChannel = null;

let locationSharing = true;

let authMode = "login";

let friendsData = [];


/* =====================================================
   DOM
===================================================== */

const $ = id =>
document.getElementById(id);


/* =====================================================
   MAP
===================================================== */

function initMap() {

  map =
  L.map("map")
   .setView(
     [52.2297,21.0122],
     13
   );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
      "© OpenStreetMap"
    }
  ).addTo(map);

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

function avatarUrl(url) {

  if (url) {
    return url;
  }

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="160"
           height="160">

        <rect
          width="160"
          height="160"
          fill="#222"
        />

        <text
          x="80"
          y="105"
          text-anchor="middle"
          font-size="70"
          fill="white">
          👤
        </text>

      </svg>
    `);

}


/* =====================================================
   MAP ICON
===================================================== */

function markerIcon(
  avatar,
  speed,
  isMe
) {

  return L.divIcon({

    className:
      isMe
      ? "user-pin"
      : "friend-pin",

    html:`

      <div class="pin">

        ${
          isMe
          ? `<div class="ring"></div>`
          : ""
        }

        <img
          src="${avatarUrl(avatar)}"
          onerror="
            this.src='${avatarUrl(null)}'
          "
        >

      </div>

      <div class="speed-label">

        ${Number(speed || 0).toFixed(1)}
        км/ч

      </div>
    `,

    iconSize:[
      46,
      70
    ],

    iconAnchor:[
      23,
      23
    ]

  });

}


/* =====================================================
   RAINBOW TRAIL
===================================================== */

const rainbowColors = [

  "#ff004c",
  "#ff7a00",
  "#ffe600",
  "#42ff00",
  "#00e5ff",
  "#2575ff",
  "#9b4dff",
  "#ff2bd6"

];


function clearTrails() {

  trailLayers.forEach(
    layer => map.removeLayer(layer)
  );

  trailLayers = [];

}


function drawRainbowTrail(
  points,
  width
) {

  if (
    !points ||
    points.length < 2
  ) {
    return;
  }

  /*
    Светящееся основание.
  */

  const glow =
  L.polyline(
    points,
    {
      color:"#ffffff",
      weight:width + 8,
      opacity:.15,
      lineCap:"round",
      lineJoin:"round"
    }
  ).addTo(map);

  trailLayers.push(glow);


  /*
    Радужные сегменты.
  */

  const count =
    Math.min(
      points.length - 1,
      24
    );

  const start =
    Math.max(
      0,
      points.length - 1 - count
    );


  for (
    let i = start;
    i < points.length - 1;
    i++
  ) {

    const progress =
      (i-start) /
      Math.max(
        1,
        points.length - 2 - start
      );

    const index =
      Math.floor(
        progress *
        (rainbowColors.length - 1)
      );

    const line =
    L.polyline(
      [
        points[i],
        points[i+1]
      ],
      {
        color:
          rainbowColors[index],

        weight:width,

        opacity:.9,

        lineCap:"round",

        lineJoin:"round"
      }
    ).addTo(map);

    trailLayers.push(line);

  }

}


function redrawTrails() {

  clearTrails();

  drawRainbowTrail(
    myTrail,
    8
  );

  for (
    const trail of friendTrails.values()
  ) {

    drawRainbowTrail(
      trail,
      6
    );

  }

}


/* =====================================================
   AUTH MODE
===================================================== */

$("loginTab").onclick =
() => {

  authMode = "login";

  $("loginTab")
    .classList.add("active");

  $("signupTab")
    .classList.remove("active");

  $("usernameField")
    .classList.add("hidden");

  $("authBtn")
    .textContent = "Войти";

};


$("signupTab").onclick =
() => {

  authMode = "signup";

  $("signupTab")
    .classList.add("active");

  $("loginTab")
    .classList.remove("active");

  $("usernameField")
    .classList.remove("hidden");

  $("authBtn")
    .textContent = "Создать аккаунт";

};


/* =====================================================
   LOGIN / REGISTER
===================================================== */

$("authBtn").onclick =
async () => {

  $("authMsg").textContent =
    "Подождите…";

  try {

    const email =
      $("email")
      .value
      .trim();

    const password =
      $("password")
      .value;


    if (!email || !password) {

      throw new Error(
        "Введите email и пароль."
      );

    }


    if (authMode === "login") {

      const result =
        await supabaseClient.auth
        .signInWithPassword({

          email,
          password

        });


      if (result.error) {

        throw result.error;

      }

    }

    else {

      const username =
        $("username")
        .value
        .trim();


      if (!username) {

        throw new Error(
          "Введите имя."
        );

      }


      const result =
        await supabaseClient.auth
        .signUp({

          email,
          password,

          options:{
            data:{
              username
            }
          }

        });


      if (result.error) {

        throw result.error;

      }


      if (
        result.data.user &&
        result.data.session
      ) {

        await ensureProfile(
          result.data.user,
          username
        );

      }


      $("authMsg")
        .style.color =
        "#64ff9a";

      $("authMsg")
        .textContent =
        "Аккаунт создан.";

    }

  }

  catch(error) {

    $("authMsg")
      .style.color =
      "#ff8798";

    $("authMsg")
      .textContent =
      error.message ||
      "Ошибка";

  }

};


/* =====================================================
   SESSION
===================================================== */

async function loadSession() {

  const result =
    await supabaseClient.auth
    .getSession();

  if (
    result.data.session
  ) {

    await boot(
      result.data.session.user
    );

  }

}


supabaseClient.auth
.onAuthStateChange(
  async (event,session) => {

    if (
      session &&
      !user
    ) {

      setTimeout(
        () => boot(session.user),
        0
      );

    }

    if (
      event ===
      "SIGNED_OUT"
    ) {

      location.reload();

    }

  }
);


/* =====================================================
   PROFILE
===================================================== */

async function ensureProfile(
  currentUser,
  username
) {

  let result =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();


  if (
    result.data
  ) {

    return result.data;

  }


  result =
    await supabaseClient
    .from("profiles")
    .insert({

      id:
        currentUser.id,

      username:
        username ||
        currentUser.user_metadata?.username ||
        "Blink user",

      location_sharing_enabled:
        true

    })
    .select()
    .single();


  if (result.error) {

    throw result.error;

  }

  return result.data;

}


/* =====================================================
   BOOT
===================================================== */

async function boot(
  currentUser
) {

  user =
    currentUser;


  try {

    profile =
      await ensureProfile(
        user,
        user.user_metadata?.username
      );


    locationSharing =
      profile.location_sharing_enabled !== false;


    $("auth")
      .classList.add("hidden");


    updateStatus();


    startLocation();


    subscribeRealtime();


    await loadFriends();


  }

  catch(error) {

    toast(
      "Ошибка: " +
      error.message
    );

  }

}


/* =====================================================
   FRIENDS
===================================================== */

async function loadFriends() {

  const result =
    await supabaseClient
    .rpc("get_my_friends");


  if (result.error) {

    console.warn(
      result.error
    );

    return;

  }


  friendsData =
    result.data || [];


  friendsData.forEach(
    friend => {

      if (
        !friendTrails.has(
          friend.id
        )
      ) {

        friendTrails.set(
          friend.id,
          []
        );

      }

    }
  );


  const locations =
    await supabaseClient
    .rpc(
      "get_friend_locations"
    );


  if (
    locations.data
  ) {

    locations.data
      .forEach(
        updateFriendLocation
      );

  }

}


/* =====================================================
   FRIEND LOCATION
===================================================== */

function updateFriendLocation(
  location
) {

  const id =
    location.user_id;


  if (!id || id === user.id) {
    return;
  }


  const latitude =
    Number(
      location.latitude
    );

  const longitude =
    Number(
      location.longitude
    );


  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    return;

  }


  const trail =
    friendTrails.get(id) || [];


  trail.push([
    latitude,
    longitude
  ]);


  if (
    trail.length > 35
  ) {

    trail.shift();

  }


  friendTrails.set(
    id,
    trail
  );


  const friend =
    friendsData.find(
      f => f.id === id
    );


  const avatar =
    friend?.avatar_url ||
    location.avatar_url;


  const name =
    friend?.username ||
    location.username ||
    "Друг";


  const speed =
    Number(
      location.speed || 0
    );


  if (
    !friendMarkers.has(id)
  ) {

    const marker =
      L.marker(
        [
          latitude,
          longitude
        ],
        {
          icon:
            markerIcon(
              avatar,
              speed,
              false
            )
        }
      )
      .addTo(map);


    marker.bindPopup(
      `<b>${escapeHtml(name)}</b>
       <br>
       🚀 ${speed.toFixed(1)} км/ч`
    );


    friendMarkers.set(
      id,
      marker
    );

  }

  else {

    const marker =
      friendMarkers.get(id);


    marker.setLatLng([
      latitude,
      longitude
    ]);


    marker.setIcon(
      markerIcon(
        avatar,
        speed,
        false
      )
    );


    marker.getPopup()
      ?.setContent(
        `<b>${escapeHtml(name)}</b>
         <br>
         🚀 ${speed.toFixed(1)} км/ч`
      );

  }


  redrawTrails();

}


/* =====================================================

===================================================== */

}


/* =====================================================
   GPS
===================================================== */

function startLocation() {

  if (
    !navigator.geolocation
  ) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }


  if (!locationSharing) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    navigator.geolocation
    .clearWatch(
      watchId
    );

  }


  watchId =
    navigator.geolocation
    .watchPosition(

      onPosition,

      onGeoError,

      {
        enableHighAccuracy:true,

        maximumAge:2000,

        timeout:15000
      }

    );


  setStatus(
    "Получаем GPS…",
    true
  );

}


/* =====================================================
   GPS POSITION
===================================================== */

async function onPosition(
  position
) {

  const coords =
    position.coords;


  let speedMs =
    Number.isFinite(
      coords.speed
    )
    ? Math.max(
        0,
        coords.speed
      )
    : null;


  /*
    Если GPS не сообщает скорость,
    рассчитываем её сами.
  */

  if (
    speedMs === null &&
    lastPosition
  ) {

    const seconds =
      (
        position.timestamp -
        lastPosition.timestamp
      ) / 1000;


    if (
      seconds > 0
    ) {

      const meters =
        distance(
          lastPosition.latitude,
          lastPosition.longitude,
          coords.latitude,
          coords.longitude
        );


      speedMs =
        meters / seconds;

    }

  }


  if (
    speedMs === null
  ) {

    speedMs = 0;

  }


  const speedKmh =
    speedMs * 3.6;


  lastPosition = {

    latitude:
      coords.latitude,

    longitude:
      coords.longitude,

    accuracy:
      coords.accuracy || 0,

    speed:
      speedKmh,

    timestamp:
      position.timestamp

  };


  /*
    Добавляем точку в радужный хвост.
  */

  myTrail.push([
    coords.latitude,
    coords.longitude
  ]);


  if (
    myTrail.length > 45
  ) {

    myTrail.shift();

  }


  $("mySpeed")
    .textContent =
    speedKmh.toFixed(1) +
    " км/ч";


  setStatus(
    "GPS в реальном времени",
    true
  );


  renderMyMarker();


  /*
    Отправляем положение в Supabase.
  */

  const result =
    await supabaseClient
    .from("locations")
    .upsert({

      user_id:
        user.id,

      latitude:
        coords.latitude,

      longitude:
        coords.longitude,

      accuracy:
        coords.accuracy || 0,

      speed:
        speedKmh,

      updated_at:
        new Date()
        .toISOString()

    });


  if (
    result.error
  ) {

    console.warn(
      "Location error:",
      result.error
    );

  }

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2-lat1) *
    rad;

  const dLon =
    (lon2-lon1) *
    rad;


  const a =
    Math.sin(dLat/2)**2 +

    Math.cos(
      lat1*rad
    ) *

    Math.cos(
      lat2*rad
    ) *

    Math.sin(
      dLon/2
    )**2;


  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );

}


/* =====================================================
   GPS ERROR
===================================================== */

function onGeoError(
  error
) {

  if (
    error.code === 1
  ) {

    setStatus(
      "Разреши геолокацию",
      false
    );

    toast(
      "Разреши доступ к геолокации."
    );

  }

  else {

    setStatus(
      "Ошибка GPS",
      false
    );

  }

}


/* =====================================================
   REALTIME
===================================================== */

function subscribeRealtime() {

  if (
    locationChannel
  ) {

    supabaseClient
      .removeChannel(
        locationChannel
      );

  }


  locationChannel =
    supabaseClient
    .channel(
      "blink-locations"
    )

    .on(

      "postgres_changes",

      {
        event:"INSERT",
        schema:"public",
        table:"locations"
      },

      payload => {

        if (
          payload.new.user_id !==
          user.id
        ) {

          updateFriendLocation(
            payload.new
          );

        }

      }

    )

    .on(

      "postgres_changes",

      {
        event:"UPDATE",
        schema:"public",
        table:"locations"
      },

      payload => {

        if (
          payload.new.user_id !==
          user.id
        ) {

          updateFriendLocation(
            payload.new
          );

        }

      }

    )

    .subscribe();

}

/* =====================================================
   UPLOAD PHOTO
===================================================== */

async function uploadAvatar(
  event
) {

  const file =
    event.target.files?.[0];


  if (!file) {
    return;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    toast(
      "Выбери фотографию."
    );

    return;

  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    toast(
      "Фотография должна быть меньше 5 МБ."
    );

    return;

  }


  toast(
    "Загружаем фотографию…"
  );


  /*
    Один файл на пользователя.
    Поэтому новая фотография заменяет старую.
  */

  const path =
    `${user.id}.jpg`;


  const upload =
    await supabaseClient
    .storage
    .from("avatars")
    .upload(
      path,
      file,
      {
        upsert:true,
        contentType:file.type,
        cacheControl:"3600"
      }
    );


  if (
    upload.error
  ) {

    toast(
      "Ошибка загрузки: " +
      upload.error.message
    );

    return;

  }


  const publicUrl =
    supabaseClient
    .storage
    .from("avatars")
    .getPublicUrl(path)
    .data
    .publicUrl;


  const url =
    publicUrl +
    "?v=" +
    Date.now();


  const update =
    await supabaseClient
    .from("profiles")
    .update({
      avatar_url:url
    })
    .eq(
      "id",
      user.id
    );


  if (
    update.error
  ) {

    toast(
      "Ошибка сохранения: " +
      update.error.message
    );

    return;

  }


  profile.avatar_url =
    url;


  $("profileAvatar")
    .src =
    url;


  renderMyMarker();


  toast(
    "Фотография обновлена ✨"
  );

}

/* =====================================================
   ADD FRIEND
===================================================== */

async function addFriend() {

  const code =
    $("friendCode")
    .value
    .trim();


  if (
    !/^\d{4}$/.test(code)
  ) {

    toast(
      "Код должен состоять из 4 цифр."
    );

    return;

  }


  const result =
    await supabaseClient
    .rpc(
      "send_friend_request_by_code",
      {
        p_code:code
      }
    );


  if (
    result.error
  ) {

    toast(
      result.error.message
    );

    return;

  }


  toast(
    "Заявка отправлена 💫"
  );

}


/* =====================================================
   FRIEND SPEED
===================================================== */

function getFriendSpeed(
  id
) {

  const marker =
    friendMarkers.get(id);


  if (!marker) {

    return "—";

  }


  const element =
    marker.getElement();


  if (!element) {

    return "—";

  }


  const label =
    element.querySelector(
      ".speed-label"
    );


  return label
    ? label.textContent
    : "—";

}

/* =====================================================
   TOGGLE LOCATION
===================================================== */

async function toggleLocation() {

  locationSharing =
    !locationSharing;


  const result =
    await supabaseClient
    .from("profiles")
    .update({
      location_sharing_enabled:
        locationSharing
    })
    .eq(
      "id",
      user.id
    );


  if (
    result.error
  ) {

    locationSharing =
      !locationSharing;

    toast(
      result.error.message
    );

    return;

  }


  if (
    locationSharing
  ) {

    startLocation();

  }

  else {

    if (
      watchId !== null
    ) {

      navigator.geolocation
      .clearWatch(
        watchId
      );

    }


    watchId = null;


    await supabaseClient
      .from("locations")
      .delete()
      .eq(
        "user_id",
        user.id
      );


    if (myMarker) {

      map.removeLayer(
        myMarker
      );

      myMarker = null;

    }


    setStatus(
      "Геолокация выключена",
      false
    );

  }


  renderSettings();

}

/* =====================================================
   PANEL
===================================================== */

function openPanel(
  html
) {

  $("sheet")
    .innerHTML =
    `<div class="handle"></div>` +
    html;


  $("panel")
    .classList
    .remove("hidden");

}


function closePanel() {

  $("panel")
    .classList
    .add("hidden");

}


$("panel")
.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      $("panel")
    ) {

      closePanel();

    }

  }
);


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  live
) {

  $("statusText")
    .textContent =
    text;


  $("statusDot")
    .classList
    .toggle(
      "live",
      live
    );

}


function updateStatus() {

  setStatus(
    locationSharing
      ? "GPS включён"
      : "Геолокация выключена",

    locationSharing
  );

}


/* =====================================================
   TOAST
===================================================== */

function toast(
  text
) {

  const element =
    $("toast");


  element.textContent =
    text;


  element.classList
    .remove("hidden");


  clearTimeout(
    window.__toast
  );


  window.__toast =
    setTimeout(
      () => {

        element.classList
          .add("hidden");

      },
      2500
    );

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])

  );

}


function escapeAttr(
  value
) {

  return escapeHtml(
    value
  );

}
