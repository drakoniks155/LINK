<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080808">
  <title>LINK — друзья и чат</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    /* ... весь CSS оставляем без изменений ... */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #080808;
      --card: #121212;
      --card2: #191919;
      --text: #fff;
      --muted: #989898;
      --line: #292929;
      --accent: #fff;
      --danger: #ff6178;
      --ok: #70ffad;
      --radius: 18px;
      --shadow: 0 10px 35px rgba(0, 0, 0, .4);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --card: #ffffff;
      --card2: #f0f0f0;
      --text: #000000;
      --muted: #666666;
      --line: #dddddd;
      --accent: #000000;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    button,
    input,
    textarea,
    select {
      font: inherit;
      border: 0;
      outline: none;
    }
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: none;
    }
    .hidden {
      display: none !important;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .topbar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .brand,
    .status {
      pointer-events: auto;
      background: rgba(10, 10, 10, .88);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow);
    }
    .brand {
      font-weight: 1000;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      max-width: 62%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ddd;
      font-size: 12px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      margin-right: 7px;
    }
    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 12px var(--ok);
    }
    .map-actions {
      position: absolute;
      z-index: 1000;
      right: 12px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .round-btn {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 17px;
      background: rgba(8, 8, 8, .9);
      color: #fff;
      font-size: 20px;
      backdrop-filter: blur(15px);
    }
    .bottom {
      position: absolute;
      z-index: 1000;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 6px;
      background: rgba(8, 8, 8, .93);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .5);
    }
    .navbtn {
      position: relative;
      border: 0;
      background: transparent;
      color: #969696;
      border-radius: var(--radius);
      padding: 8px 2px;
    }
    .navbtn.active {
      background: #fff;
      color: #000;
    }
    .navicon {
      display: block;
      font-size: 18px;
      line-height: 21px;
    }
    .navtext {
      display: block;
      font-size: 9px;
      font-weight: 900;
    }
    .badge {
      position: absolute;
      top: 3px;
      right: 15%;
      min-width: 17px;
      height: 17px;
      line-height: 17px;
      padding: 0 4px;
      border-radius: 20px;
      background: #ff4862;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
    }
    .panel {
      position: absolute;
      z-index: 3000;
      inset: 0;
      display: flex;
      align-items: flex-end;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(4px);
    }
    .sheet {
      width: 100%;
      max-height: 89dvh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 18px 16px 32px;
      animation: up .22s ease-out;
    }
    @keyframes up {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: none;
        opacity: 1;
      }
    }
    .handle {
      width: 42px;
      height: 4px;
      border-radius: 20px;
      background: #444;
      margin: 0 auto 16px;
    }
    .sheet h2 {
      margin: 4px 0 16px;
      font-size: 22px;
    }
    .close {
      float: right;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 22px;
    }
    .field {
      margin: 11px 0;
    }
    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      border-radius: 14px;
      padding: 13px;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }
    .btn {
      border: 0;
      border-radius: 15px;
      padding: 13px 15px;
      background: #fff;
      color: #000;
      font-weight: 900;
    }
    .btn.full {
      width: 100%;
      margin-top: 8px;
    }
    .btn.secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn.danger {
      background: #2b1115;
      color: #ff91a0;
      border: 1px solid #57202b;
    }
    .btn.small {
      padding: 8px 10px;
      border-radius: 11px;
      font-size: 11px;
    }
    .btn.primary {
      background: var(--ok);
      color: #000;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .grow {
      flex: 1;
      min-width: 0;
    }
    .auth {
      position: absolute;
      z-index: 9000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }
    .authbox {
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 25px;
    }
    .logo {
      font-size: 46px;
      font-weight: 1000;
      letter-spacing: -2px;
    }
    .subtitle {
      color: var(--muted);
      margin: 6px 0 20px;
    }
    .auth-status {
      min-height: 22px;
      color: #aaa;
      font-size: 13px;
      margin-top: 12px;
    }
    .avatar {
      width: 64px;
      height: 64px;
      flex: none;
      object-fit: cover;
      border-radius: 50%;
      background: var(--card2);
      border: 2px solid var(--accent);
    }
    .avatar.small {
      width: 48px;
      height: 48px;
      border-width: 1px;
    }
    .avatar.tiny {
      width: 28px;
      height: 28px;
      border-width: 1px;
    }
    .avatar.large {
      width: 80px;
      height: 80px;
      border-width: 3px;
    }
    .avatar.animated {
      animation: avatarPulse 3s ease-in-out infinite;
    }
    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .avatar.wave {
      animation: avatarWave 2s ease-in-out infinite;
    }
    @keyframes avatarWave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    .avatar.bounce {
      animation: avatarBounce 1.5s ease-in-out infinite;
    }
    @keyframes avatarBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .friend,
    .request,
    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .friend-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .code {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }
    .empty {
      padding: 35px 10px;
      color: var(--muted);
      text-align: center;
    }
    .section-title {
      margin: 20px 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .online-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 6px;
      border-radius: 50%;
      background: #777;
    }
    .online-status.online {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }
    .leaflet-control-attribution {
      font-size: 8px !important;
    }
    .user-pin,
    .friend-pin {
      background: transparent;
      border: 0;
    }
    .pin {
      position: relative;
      width: 48px;
      height: 48px;
      overflow: visible;
    }
    .pin img {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card2);
      border: 3px solid #fff;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .55);
    }
    .pin .ring {
      position: absolute;
      z-index: 1;
      inset: -8px;
      border: 2px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      50% {
        transform: scale(1.2);
        opacity: .15;
      }
    }
    .toast {
      position: absolute;
      z-index: 12000;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 11px 15px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .5);
    }
    .reaction-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .reaction-choice {
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card2);
      color: var(--text);
      font-size: 29px;
    }
    .reaction-choice.selected,
    .reaction-choice:active {
      background: #fff;
      color: #000;
      transform: scale(.95);
    }
    .reaction-info {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .chat-preview {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .chat-unread {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 20px;
      background: #fff;
      color: #000;
      font-size: 10px;
      font-weight: 1000;
    }
    .chat-page {
      position: absolute;
      z-index: 4500;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
      background: rgba(8, 8, 8, .96);
    }
    .chat-back {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 23px;
    }
    .chat-title {
      min-width: 0;
      flex: 1;
    }
    .chat-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 1000;
    }
    .chat-status {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }
    .chat-actions {
      display: flex;
      gap: 6px;
    }
    .chat-action-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 18px;
    }
    .chat-action-btn.primary {
      background: #fff;
      color: #000;
    }
    .messages {
      flex: 1;
      overflow: auto;
      padding: 16px 12px 120px;
    }
    .message-row {
      display: flex;
      margin: 7px 0;
    }
    .message-row.mine {
      justify-content: flex-end;
    }
    .message-row.theirs {
      justify-content: flex-start;
    }
    .message {
      position: relative;
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--card2);
      word-break: break-word;
      font-size: 14px;
      line-height: 1.35;
    }
    .message.mine {
      background: #fff;
      color: #000;
      border-bottom-right-radius: 5px;
    }
    .message.theirs {
      border-bottom-left-radius: 5px;
    }
    .message-time {
      margin-top: 4px;
      font-size: 9px;
      opacity: .55;
      text-align: right;
    }
    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .message-reaction {
      border: 0;
      border-radius: 999px;
      padding: 4px 7px;
      background: var(--card2);
      color: var(--text);
      font-size: 12px;
    }
    .message.mine .message-reaction {
      background: #ddd;
      color: #000;
    }
    .chat-reaction-bar {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 73px;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 7px;
      max-width: 94vw;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 10px 35px #000;
    }
    .quick-reaction {
      width: 42px;
      height: 42px;
      flex: none;
      border: 0;
      border-radius: 14px;
      background: var(--card2);
      color: var(--text);
      font-size: 21px;
    }
    .quick-reaction.recording {
      background: #ff4444;
      color: #fff;
      animation: pulse-rec 0.8s infinite;
    }
    @keyframes pulse-rec {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }
    .chat-input-area {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 7px;
      align-items: flex-end;
      padding: 10px 10px max(10px, env(safe-area-inset-bottom));
      background: rgba(8, 8, 8, .96);
      border-top: 1px solid var(--line);
    }
    .chat-input {
      min-height: 48px;
      max-height: 100px;
      resize: none;
      flex: 1;
      border-radius: 20px;
      padding: 13px 15px;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .send-message {
      width: 48px;
      height: 48px;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 18px;
    }
    .typing {
      position: absolute;
      left: 15px;
      bottom: 116px;
      color: var(--muted);
      font-size: 11px;
    }
    .voice-message {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--card2);
      border-radius: 12px;
      min-width: 140px;
    }
    .voice-message.mine {
      background: #e0e0e0;
    }
    .voice-play {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 14px;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice-timeline {
      flex: 1;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .voice-timeline .progress {
      height: 100%;
      background: var(--ok);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s;
    }
    .voice-time {
      font-size: 10px;
      color: var(--muted);
      flex: none;
      min-width: 32px;
      text-align: center;
    }
    .recording-indicator {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulse-rec 0.8s infinite;
    }
    .recording-indicator .dot-rec {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
    }
    .sticker-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
    }
    .sticker {
      font-size: 38px;
      padding: 6px;
      border-radius: 12px;
      background: var(--card2);
      border: 1px solid var(--line);
      transition: transform .15s;
    }
    .sticker:active {
      transform: scale(.9);
    }
    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      flex: none;
      border: 0;
      border-radius: 20px;
      background: #333;
    }
    .toggle i {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: .2s;
    }
    .toggle.on {
      background: #fff;
    }
    .toggle.on i {
      left: 23px;
      background: #000;
    }
    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .stories-bar {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar {
      display: none;
    }
    .story-avatar {
      position: relative;
      flex: none;
      cursor: pointer;
    }
    .story-avatar .avatar {
      border: 3px solid #ff6b6b;
      border-radius: 50%;
    }
    .story-avatar .add-story {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #4ecdc4;
      color: #fff;
      font-size: 16px;
      border: 2px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-avatar .seen {
      border-color: #888;
    }
    .story-viewer {
      position: fixed;
      z-index: 10000;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .story-viewer .story-content {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 16px;
    }
    .story-viewer .story-text {
      font-size: 32px;
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    .story-viewer .story-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 32px;
      color: #fff;
      background: none;
      border: none;
    }
    .story-viewer .story-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255,255,255,0.3);
    }
    .story-viewer .story-progress .fill {
      height: 100%;
      background: #fff;
      transition: width 0.1s linear;
    }
    .story-viewer .story-info {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      opacity: 0.7;
    }
    .drawing-canvas {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      touch-action: none;
    }
    .drawing-tools {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;

</head>
<body>

  <div id="app">
    <div id="map"></div>

    <div class="topbar">
      <div class="brand"><span>LINK</span><span id="themeToggle" style="font-size:16px;cursor:pointer;">🌙</span></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Подключение…</span></div>
    </div>

    <div class="map-actions">
      <button class="round-btn" id="centerMeBtn">⌖</button>
      <button class="round-btn" id="showAllBtn">⊙</button>
    </div>

    <nav class="bottom">
      <button class="navbtn active" data-page="map"><span class="navicon">🗺️</span><span class="navtext">Карта</span></button>
      <button class="navbtn" data-page="friends"><span class="navicon">👥</span><span class="navtext">Друзья</span><span id="requestBadge" class="badge hidden">0</span></button>
      <button class="navbtn" data-page="chats"><span class="navicon">💬</span><span class="navtext">Чаты</span><span id="chatBadge" class="badge hidden">0</span></button>
      <button class="navbtn" data-page="profile"><span class="navicon">👤</span><span class="navtext">Профиль</span></button>
      <button class="navbtn" data-page="settings"><span class="navicon">⚙️</span><span class="navtext">Настройки</span></button>
      <button class="navbtn" data-page="more"><span class="navicon">➕</span><span class="navtext">Ещё</span></button>
    </nav>

    <div id="panel" class="panel hidden"><div id="sheet" class="sheet"></div></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <div id="reactionOverlay"></div>

  <div id="auth" class="auth">
    <div class="authbox">
      <div class="logo">LINK</div>
      <div class="subtitle">Друзья рядом. Карта. Чаты. Голосовые сообщения.</div>
      <button id="startBtn" class="btn full">Начать</button>
      <div id="authStatus" class="auth-status">Подключаем Firebase…</div>
      <div class="note">Аккаунт создаётся автоматически.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { getDatabase, ref, get, set, update, remove, push, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACo_xpctW1MDfaGO_bmDzXfFhb4KfwV2w",
      authDomain: "link-69afb.firebaseapp.com",
      databaseURL: "https://link-69afb-default-rtdb.firebaseio.com",
      projectId: "link-69afb",
      storageBucket: "link-69afb.firebasestorage.app",
      messagingSenderId: "488681419482",
      appId: "1:488681419482:web:9c4cd030e20137a4946be3",
      measurementId: "G-6T5XDS5W43"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const $ = id => document.getElementById(id);

    // ===== VARIABLES =====
    let user = null;
    let profile = null;
    let map = null;
    let meMarker = null;
    let friendMarkers = new Map();
    let friendLocationListeners = new Map();
    let friends = {};
    let incomingRequests = {};
    let incomingReactions = {};
    let chatMeta = {};
    let chatUnsubscribers = new Map();
    let watchId = null;
    let lastPosition = null;
    let locationSharing = true;
    let currentPage = "map";
    let profileUnsubscribe = null;
    let friendsUnsubscribe = null;
    let requestsUnsubscribe = null;
    let reactionsUnsubscribe = null;
    let chatsUnsubscribe = null;
    let selectedReaction = "❤️";
    let currentChatFriendId = null;
    let currentChatId = null;
    let typingTimer = null;
    let typingStopTimer = null;
    let isDarkTheme = true;
    let storiesUnsubscribe = null;
    let hideOnlineSettings = {};
    let currentFont = 'default';

    // ===== VOICE RECORDING =====
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingTimer = null;
    let recordingSeconds = 0;
    let recordingStartTime = 0;
    let stream = null;

    const REACTIONS = ["❤️", "🔥", "😂", "🎉", "😱", "⚡", "👋", "😎", "💀", "🥳", "💯", "✨"];
    const STICKERS = ["😊", "😂", "🥰", "😍", "🤩", "😎", "🤔", "😏", "😅", "🤗", "😇", "🤪", "🥳", "😭", "😤", "🤯"];
    const FONTS = ['default', 'comic', 'serif', 'mono', 'emoji', 'bold', 'italic', 'underline', 'strike'];
    const ANIMATIONS = ['none', 'pulse', 'wave', 'bounce'];

    // ===== MAP =====
    function initMap() {
      map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);
    }

    // ===== HELPERS =====
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }

    function defaultAvatar(name = "") {
      const letter = String(name || "?").trim().slice(0, 1).toUpperCase() || "?";
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" fill="#242424"/><text x="80" y="105" text-anchor="middle" font-family="Arial" font-size="72" fill="white">${letter}</text></svg>`
      );
    }

    function avatarUrl(p) {
      return p?.avatar || defaultAvatar(p?.name || "?");
    }

    function setStatus(text, live = false) {
      $("statusText").textContent = text;
      $("statusDot").classList.toggle("live", !!live);
    }

    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 2800);
    }

    function openPanel(html) {
      $("sheet").innerHTML = `<div class="handle"></div>${html}`;
      $("panel").classList.remove("hidden");
    }

    function closePanel() { $("panel").classList.add("hidden"); }
    window.closePanel = closePanel;
    $("panel").onclick = e => { if (e.target === $("panel")) closePanel(); };

    function formatTime(timestamp) {
      if (!timestamp) return "";
      try { return new Date(timestamp).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m > 0 ? `${m}:${s.toString().padStart(2, "0")}` : `${s}s`;
    }

    function friendlyError(error) {
      const code = error?.code || "";
      if (code.includes("auth/operation-not-allowed")) return "В Firebase не включён Anonymous Authentication.";
      if (code.includes("permission-denied")) return "Firebase отклонил доступ. Проверь Database Rules.";
      if (code.includes("network-request-failed")) return "Нет подключения к интернету.";
      return error?.message || "Неизвестная ошибка";
    }

    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    function compressImage(file, maxSize = 256, quality = .78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const width = Math.round(img.width * scale);
            const height = Math.round(img.height * scale);
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ===== NAVIGATION =====
    document.querySelectorAll(".navbtn").forEach(btn => {
      btn.onclick = () => openPage(btn.dataset.page);
    });

    function openPage(page) {
      currentPage = page;
      document.querySelectorAll(".navbtn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });
      if (page === "map") { closePanel();
        setTimeout(() => map.invalidateSize(), 100); }
      if (page === "friends") renderFriends();
      if (page === "chats") renderChats();
      if (page === "profile") renderProfile();
      if (page === "settings") renderSettings();
      if (page === "more") renderMore();
    }

    // ===== MAP MARKERS =====
    function markerIcon(p, isMe = false) {
      return L.divIcon({
        className: isMe ? "user-pin" : "friend-pin",
        html: `<div class="pin">${isMe ? '<div class="ring"></div>' : ""}<img src="${avatarUrl(p)}"></div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      });
    }

    function renderMeMarker() {
      if (!lastPosition || !profile) return;
      const pos = [lastPosition.lat, lastPosition.lng];
      if (!meMarker) {
        meMarker = L.marker(pos, { icon: markerIcon(profile, true), zIndexOffset: 1000 }).addTo(map);
        meMarker.bindPopup("<b>Ты</b>");
      } else {
        meMarker.setLatLng(pos);
        meMarker.setIcon(markerIcon(profile, true));
      }
    }

    function upsertFriendMarker(friendId, friendProfile, location) {
      const lat = Number(location.lat);
      const lng = Number(location.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      if (!friendMarkers.has(friendId)) {
        const marker = L.marker([lat, lng], { icon: markerIcon(friendProfile), zIndexOffset: 500 }).addTo(map);
        marker.on("click", () => openFriendReactionPanel(friendId));
        friendMarkers.set(friendId, marker);
      } else {
        const marker = friendMarkers.get(friendId);
        marker.setLatLng([lat, lng]);
        marker.setIcon(markerIcon(friendProfile));
      }
    }

    function removeFriendMarker(friendId, unsubscribe = true) {
      const marker = friendMarkers.get(friendId);
      if (marker) { map.removeLayer(marker);
        friendMarkers.delete(friendId); }
      if (unsubscribe && friendLocationListeners.has(friendId)) {
        friendLocationListeners.get(friendId)();
        friendLocationListeners.delete(friendId);
      }
    }

    $("centerMeBtn").onclick = () => {
      if (!lastPosition) { toast("Геолокация ещё не получена."); return; }
      map.setView([lastPosition.lat, lastPosition.lng], 17);
    };

    $("showAllBtn").onclick = () => {
      const markers = [meMarker, ...friendMarkers.values()].filter(Boolean);
      if (!markers.length) { toast("Нет активных пользователей."); return; }
      map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [60, 60] });
    };

    // ===== AUTH =====
    $("startBtn").onclick = async () => {
      $("startBtn").disabled = true;
      try {
        $("authStatus").textContent = "Входим в LINK…";
        await signInAnonymously(auth);
      } catch (error) {
        console.error(error);
        $("authStatus").textContent = "Ошибка: " + friendlyError(error);
        $("startBtn").disabled = false;
      }
    };

    onAuthStateChanged(auth, async firebaseUser => {
      if (!firebaseUser) return;
      if (user?.uid === firebaseUser.uid) return;
      try {
        user = firebaseUser;
        $("authStatus").textContent = "Создаём профиль…";
        await ensureProfile();
        $("auth").classList.add("hidden");
        subscribeProfile();
        subscribeFriends();
        subscribeIncomingRequests();
        subscribeIncomingReactions();
        subscribeChats();
        subscribeStories();
        loadHideOnlineSettings();

        if (profile.locationSharing !== false) {
          locationSharing = true;
          startLocation();
        } else {
          locationSharing = false;
          setStatus("Геолокация выключена", false);
        }
        setStatus("LINK подключён", true);
      } catch (error) {
        console.error(error);
        $("authStatus").textContent = "Ошибка: " + friendlyError(error);
        $("auth").classList.remove("hidden");
        $("startBtn").disabled = false;
      }
    });

    // ===== PROFILE =====
    async function ensureProfile() {
      const profileRef = ref(db, `profiles/${user.uid}`);
      const snap = await get(profileRef);
      if (!snap.exists()) {
        const code = await createUniqueFriendCode();
        profile = {
          name: `LINK ${Math.floor(100 + Math.random() * 900)}`,
          friendCode: code,
          avatar: "",
          locationSharing: true,
          createdAt: Date.now(),
          lastActive: Date.now(),
          avatarAnimation: "none",
          fontPreference: "default"
        };
        await update(ref(db), {
          [`profiles/${user.uid}`]: profile,
          [`friendCodes/${code}`]: user.uid
        });
      } else {
        profile = snap.val();
        if (!profile.friendCode) {
          const code = await createUniqueFriendCode();
          await update(ref(db), {
            [`profiles/${user.uid}/friendCode`]: code,
            [`friendCodes/${code}`]: user.uid
          });
          profile.friendCode = code;
        }
        await update(profileRef, { lastActive: Date.now() });
      }
    }

    async function createUniqueFriendCode() {
      for (let i = 0; i < 30; i++) {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        const snap = await get(ref(db, `friendCodes/${code}`));
        if (!snap.exists()) return code;
      }
      throw new Error("Не удалось создать свободный код.");
    }

    function subscribeProfile() {
      if (profileUnsubscribe) profileUnsubscribe();
      profileUnsubscribe = onValue(ref(db, `profiles/${user.uid}`), snap => {
        if (!snap.exists()) return;
        profile = snap.val();
        renderMeMarker();
        if (currentPage === "profile") renderProfile();
      });
    }

    // ===== FRIENDS =====
    function subscribeFriends() {
      if (friendsUnsubscribe) friendsUnsubscribe();
      friendsUnsubscribe = onValue(ref(db, `friends/${user.uid}`), snap => {
        const next = snap.val() || {};
        for (const id of Object.keys(friends)) {
          if (!next[id]) removeFriendMarker(id);
        }
        friends = next;
        Object.keys(friends).forEach(subscribeFriendLocation);
        if (currentPage === "friends") renderFriends();
        if (currentPage === "chats") renderChats();
      });
    }

    function subscribeFriendLocation(friendId) {
      if (friendLocationListeners.has(friendId)) return;
      const unsubscribe = onValue(ref(db, `locations/${friendId}`), async snap => {
        const location = snap.val();
        if (!location) { removeFriendMarker(friendId, false); return; }
        if (Date.now() - location.updatedAt > 5 * 60 * 1000) { removeFriendMarker(friendId, false); return; }
        const profileSnap = await get(ref(db, `profiles/${friendId}`));
        if (!profileSnap.exists()) return;
        upsertFriendMarker(friendId, profileSnap.val(), location);
      });
      friendLocationListeners.set(friendId, unsubscribe);
    }

    // ===== FRIEND REQUESTS =====
    function subscribeIncomingRequests() {
      if (requestsUnsubscribe) requestsUnsubscribe();
      requestsUnsubscribe = onValue(ref(db, `friendRequests/${user.uid}`), snap => {
        incomingRequests = snap.val() || {};
        const count = Object.keys(incomingRequests).length;
        $("requestBadge").textContent = count;
        $("requestBadge").classList.toggle("hidden", count === 0);
        if (currentPage === "friends") renderFriends();
      });
    }

    function renderFriends() {
      const requestIds = Object.keys(incomingRequests);
      const friendIds = Object.keys(friends);

      const requestsHtml = requestIds.length ? `
        <div class="section-title">Входящие заявки</div>
        ${requestIds.map(uid => {
          const p = incomingRequests[uid]?.profile || {};
          return `<div class="request">
            <img class="avatar small" src="${avatarUrl(p)}">
            <div class="grow"><b>${escapeHtml(p.name || "Пользователь")}</b><div class="code">Хочет добавить тебя в друзья</div></div>
            <button class="btn small" onclick="window.acceptRequest('${uid}')">✓</button>
            <button class="btn small secondary" onclick="window.rejectRequest('${uid}')">×</button>
          </div>`;
        }).join("")}
      ` : "";

      const friendsHtml = friendIds.length ? `
        <div class="section-title">Мои друзья</div>
        ${friendIds.map(uid => {
          const p = friends[uid]?.profile || {};
          const online = friendMarkers.has(uid);
          return `<div class="friend">
            <img class="avatar small ${profile?.avatarAnimation && profile.avatarAnimation !== 'none' ? profile.avatarAnimation : ''}" src="${avatarUrl(p)}">
            <div class="grow"><b>${escapeHtml(p.name || "Друг")}</b><div class="code">#${escapeHtml(p.friendCode || "")} <span class="online-status ${online ? "online" : ""}"></span></div></div>
            <div class="friend-actions">
              <button class="btn small" onclick="window.openChat('${uid}')">💬</button>
              <button class="btn small secondary" onclick="window.openFriendReactionPanel('${uid}')">💜</button>
              <button class="btn small danger" onclick="window.removeFriend('${uid}')">×</button>
            </div>
          </div>`;
        }).join("")}
      ` : `<div class="empty">Пока нет друзей.<br>Добавь друга по коду!</div>`;

      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Друзья</h2>
        <div class="field">
          <label>Добавить друга по 4-значному коду</label>
          <div class="row">
            <input id="friendCodeInput" maxlength="4" inputmode="numeric" placeholder="1234">
            <button id="sendRequestBtn" class="btn">Добавить</button>
          </div>
        </div>
        ${requestsHtml}
        ${friendsHtml}
      `);

      $("sendRequestBtn").onclick = sendFriendRequest;
    }

    async function sendFriendRequest() {
      const code = $("friendCodeInput").value.replace(/\D/g, "").slice(0, 4);
      if (!/^\d{4}$/.test(code)) { toast("Введи 4 цифры."); return; }
      const codeSnap = await get(ref(db, `friendCodes/${code}`));
      if (!codeSnap.exists()) { toast("Пользователь не найден."); return; }
      const targetUid = codeSnap.val();
      if (targetUid === user.uid) { toast("Нельзя добавить себя."); return; }
      const existing = await get(ref(db, `friends/${user.uid}/${targetUid}`));
      if (existing.exists()) { toast("Этот пользователь уже твой друг."); return; }
      await set(ref(db, `friendRequests/${targetUid}/${user.uid}`), {
        fromUid: user.uid,
        createdAt: Date.now(),
        profile: { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" }
      });
      toast("Заявка отправлена ✨");
    }

    window.acceptRequest = async fromUid => {
      const req = incomingRequests[fromUid];
      if (!req) return;
      const fromProfile = req.profile || {};
      const myProfile = { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" };
      const chatId = getChatId(user.uid, fromUid);
      await update(ref(db), {
        [`friends/${user.uid}/${fromUid}`]: { since: Date.now(), profile: fromProfile },
        [`friends/${fromUid}/${user.uid}`]: { since: Date.now(), profile: myProfile },
        [`friendRequests/${user.uid}/${fromUid}`]: null,
        [`chats/${chatId}/participants/${user.uid}`]: true,
        [`chats/${chatId}/participants/${fromUid}`]: true,
        [`userChats/${user.uid}/${chatId}`]: { friendUid: fromUid, friendProfile: fromProfile, updatedAt: Date.now() },
        [`userChats/${fromUid}/${chatId}`]: { friendUid: user.uid, friendProfile: myProfile, updatedAt: Date.now() }
      });
      toast("Друг добавлен 🎉");
    };

    window.rejectRequest = async fromUid => {
      await remove(ref(db, `friendRequests/${user.uid}/${fromUid}`));
      toast("Заявка отклонена.");
    };

    window.removeFriend = async friendUid => {
      if (!confirm("Удалить друга?")) return;
      await update(ref(db), {
        [`friends/${user.uid}/${friendUid}`]: null,
        [`friends/${friendUid}/${user.uid}`]: null
      });
      toast("Друг удалён.");
    };

    // ===== GEOLOCATION =====
    function startLocation() {
      if (!navigator.geolocation) { toast("Геолокация не поддерживается."); return; }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        async pos => {
          lastPosition = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy || 0,
            updatedAt: Date.now()
          };

    async function createStory() {
      const type = confirm("Опубликовать фото? (OK - фото, Отмена - текст)");
      if (type) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const data = await compressImage(file, 800, 0.7);
          const storyRef = push(ref(db, `stories/${user.uid}`));
          await set(storyRef, {
            type: "image",
            data: data,
            createdAt: Date.now(),
            expiresAt: Date.now() + 86400000,
            views: {}
          });
          toast("История опубликована 📸");
        };
        input.click();
      } else {
        const text = prompt("Введите текст истории:");
        if (text && text.trim()) {
          const storyRef = push(ref(db, `stories/${user.uid}`));
          await set(storyRef, {
            type: "text",
            data: text.trim(),
            createdAt: Date.now(),
            expiresAt: Date.now() + 86400000,
            views: {}
          });
          toast("История опубликована ✍️");
        }
      }
    }

    function viewStory(uid, stories) {
      const storyList = Object.values(stories)
        .filter(s => Date.now() < s.expiresAt)
        .sort((a,b) => a.createdAt - b.createdAt);
      
      if (!storyList.length) { toast("Нет активных историй"); return; }

      let index = 0;
      const viewer = document.createElement("div");
      viewer.className = "story-viewer";
      
      function showStory() {
        const story = storyList[index];
        if (!story) { viewer.remove(); return; }
        
        viewer.innerHTML = `
          <div class="story-progress"><div class="fill" style="width:0%"></div></div>
          <button class="story-close" onclick="this.closest('.story-viewer').remove()">✕</button>
          ${story.type === "image" ? `<img class="story-content" src="${story.data}">` : `<div class="story-text">${escapeHtml(story.data)}</div>`}
          <div class="story-info">${index+1}/${storyList.length}</div>
        `;

        // Mark as viewed
        const storyKey = Object.keys(stories)[index];
        if (storyKey) {
          update(ref(db, `stories/${uid}/${storyKey}/views/${user.uid}`), true);
        }

        let progress = 0;
        const interval = setInterval(() => {
          progress += 2;
          const fill = viewer.querySelector('.fill');
          if (fill) fill.style.width = progress + '%';
          if (progress >= 100) {
            clearInterval(interval);
            index++;
            if (index < storyList.length) showStory();
            else viewer.remove();
          }
        }, 50);

        viewer.onclick = (e) => {
          if (e.target === viewer) {
            clearInterval(interval);
            viewer.remove();
          }
        };
      }

      document.body.appendChild(viewer);
      showStory();
    }

    // ===== DRAWING IN CHATS (НОМЕР 35) =====
    window.openDrawing = function() {
      const container = document.createElement("div");
      container.id = "drawingContainer";
      
      let isDrawing = false;
      let lastX = 0, lastY = 0;
      let color = '#000000';
      let size = 3;

      container.innerHTML = `
        <div style="background:var(--card);border-radius:20px;padding:20px;max-width:500px;width:100%;">
          <h3 style="color:#fff;margin-bottom:10px;">🎨 Рисование</h3>
          <canvas id="drawCanvas" class="drawing-canvas" width="400" height="400"></canvas>
          <div class="drawing-tools">
            <input type="color" id="drawColor" class="color-picker" value="#000000">
            <input type="range" id="drawSize" min="1" max="20" value="3" style="width:80px;">
            <button class="btn small" id="clearDrawBtn">🗑️</button>
            <button class="btn small primary" id="sendDrawBtn">📤 Отправить</button>
            <button class="btn small secondary" id="closeDrawBtn">✕</button>
          </div>
        </div>
      `;

      document.body.appendChild(container);

      const canvas = document.getElementById("drawCanvas");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX || e.touches?.[0]?.clientX || 0) - rect.left) * (canvas.width / rect.width);
        const y = ((e.clientY || e.touches?.[0]?.clientY || 0) - rect.top) * (canvas.height / rect.height);
        return { x, y };
      }

      function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = "round";
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function endDraw(e) {
        isDrawing = false;
      }

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", endDraw);
      canvas.addEventListener("mouseleave", endDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", endDraw);

      document.getElementById("drawColor").onchange = (e) => { color = e.target.value; };
      document.getElementById("drawSize").onchange = (e) => { size = e.target.value; };
      
      document.getElementById("clearDrawBtn").onclick = () => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      document.getElementById("sendDrawBtn").onclick = async () => {
        const data = canvas.toDataURL("image/png");
        if (!currentChatId) { toast("Открой чат сначала"); return; }
        const messageRef = push(ref(db, `chats/${currentChatId}/messages`));
        await set(messageRef, {
          senderUid: user.uid,
          type: "image",
          data: data,
          createdAt: Date.now()
        });
        await updateChatMeta(currentChatId, "🎨 Рисунок");
        container.remove();
        toast("Рисунок отправлен");
      };

      document.getElementById("closeDrawBtn").onclick = () => container.remove();
    };

    // ===== VOICE RECORDING =====
    async function toggleVoiceRecording() {
      if (isRecording) {
        stopVoiceRecording();
        return;
      }
      await startVoiceRecording();
    }

    async function startVoiceRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          if (blob.size > 1000) {
            const reader = new FileReader();
            reader.onload = async () => {
              const base64 = reader.result;
              await sendVoiceMessage(base64, recordingSeconds);
            };
            reader.readAsDataURL(blob);
          } else {
            toast("Запись слишком короткая");
          }
          cleanupRecording();
        };

        mediaRecorder.start(100);
        isRecording = true;
        recordingSeconds = 0;
        recordingStartTime = Date.now();

        const voiceBtn = document.getElementById("voiceBtn");
        if (voiceBtn) {
          voiceBtn.textContent = "⏹️";
          voiceBtn.classList.add("recording");
        }

        const indicator = document.createElement("div");
        indicator.id = "recordingIndicator";
        indicator.className = "recording-indicator";
        indicator.innerHTML = `<span class="dot-rec"></span> Запись: <span id="recordingTime">0s</span>`;
        document.getElementById("chatPage")?.appendChild(indicator);

        recordingTimer = setInterval(() => {
          recordingSeconds = Math.floor((Date.now() - recordingStartTime) / 1000);
          const timeEl = document.getElementById("recordingTime");
          if (timeEl) timeEl.textContent = formatDuration(recordingSeconds);
          if (recordingSeconds >= 60) {
            toast("Максимум 60 секунд");
            stopVoiceRecording();
          }
        }, 200);

        toast("🎤 Запись началась...");

      } catch (e) {
        console.error(e);
        toast("Нет доступа к микрофону");
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
      }
      cleanupRecording();
    }

    function cleanupRecording() {
      isRecording = false;
      clearInterval(recordingTimer);
      const voiceBtn = document.getElementById("voiceBtn");
      if (voiceBtn) {
        voiceBtn.textContent = "🎤";
        voiceBtn.classList.remove("recording");
      }
      const indicator = document.getElementById("recordingIndicator");
      if (indicator) indicator.remove();
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    // ===== CHAT MESSAGES =====
    function subscribeCurrentChat() {
      const chatId = currentChatId;
      if (!chatId) return;
      if (chatUnsubscribers.has(chatId)) {
        chatUnsubscribers.get(chatId)();
        chatUnsubscribers.delete(chatId);
      }
      const unsubscribe = onValue(ref(db, `chats/${chatId}/messages`), snap => {
        if (currentChatId !== chatId) return;
        renderMessages(snap.val() || {});
      });
      chatUnsubscribers.set(chatId, unsubscribe);
      subscribeTyping(chatId);
    }

    function renderMessages(messages) {
      const container = document.getElementById("messages");
      if (!container) return;
      const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
      const entries = Object.entries(messages)
        .filter(([id, msg]) => {
          if (msg.type === "self_destruct" && Date.now() > msg.expiresAt) return false;
          return true;
        })
        .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

      const fontClass = profile?.fontPreference ? getFontClass(profile.fontPreference) : '';

      container.innerHTML = entries.length ? entries.map(([id, message]) => {
        const mine = message.senderUid === user.uid;
        const reactions = message.reactions || {};
        const reactionHtml = Object.entries(reactions).map(([emoji, data]) =>
          `<button class="message-reaction" onclick="window.addMessageReaction('${id}','${encodeURIComponent(emoji)}')">${emoji} ${data?.count || 1}</button>`
        ).join("");

        let content = "";
        if (message.type === "reaction") {
          content = `<div style="font-size:40px">${escapeHtml(message.emoji || "❤️")}</div>`;
        } else if (message.type === "sticker") {
          content = `<div style="font-size:58px">${escapeHtml(message.emoji || "😊")}</div>`;
        } else if (message.type === "image") {
          content = `<img src="${message.data}" style="max-width:200px;border-radius:12px;">`;
        } else if (message.type === "voice") {
          const duration = message.duration || 3;
          const data = message.data || "";
          content = `
            <div class="voice-message ${mine ? "mine" : ""}">
              <button class="voice-play" onclick="window.toggleVoicePlay(this, '${escapeHtml(data)}')">▶</button>
              <div class="voice-timeline" onclick="window.seekVoice(this, event)">
                <div class="progress" style="width:0%"></div>
              </div>
              <span class="voice-time">${formatDuration(duration)}</span>
            </div>
          `;
        } else if (message.type === "self_destruct") {
          content = `💣 ${escapeHtml(message.text || "")}`;
        } else {
          content = escapeHtml(message.text || "");
        }

        const isSelfDestruct = message.type === "self_destruct" && Date.now() < message.expiresAt;
        const timeLeft = isSelfDestruct ? Math.ceil((message.expiresAt - Date.now()) / 1000) : 0;

        return `
          <div class="message-row ${mine ? "mine" : "theirs"}">
            <div class="message ${mine ? "mine" : "theirs"} ${fontClass}" ${mine ? `oncontextmenu="window.deleteMessage('${id}');return false;"` : ""}>
              ${content}
              ${isSelfDestruct ? `<div style="font-size:9px;color:var(--muted);">⏱️ ${timeLeft}s</div>` : ""}
              ${reactionHtml ? `<div class="message-reactions">${reactionHtml}</div>` : ""}
              <div class="message-time">${formatTime(message.createdAt)}</div>
            </div>
          </div>
        `;
      }).join("") : `<div class="empty">Напиши первое сообщение 👋</div>`;

      if (nearBottom) {
        requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
      }
      markChatRead();
    }

    // ===== VOICE PLAYER =====
    window.toggleVoicePlay = function(btn, data) {
      if (!data) { toast("Аудио недоступно"); return; }
      try {
        const audioData = data.split(",")[1] || data;
        const byteCharacters = atob(audioData);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: "audio/webm" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        const timeline = btn.parentElement.querySelector(".voice-timeline");
        const progress = timeline?.querySelector(".progress");

        if (btn._audio && !btn._audio.paused) {
          btn._audio.pause();
          btn.textContent = "▶";
          return;
        }

        btn._audio = audio;
        audio.play();
        btn.textContent = "⏸";

        audio.ontimeupdate = () => {
          if (progress && audio.duration) {
            progress.style.width = (audio.currentTime / audio.duration * 100) + "%";
          }
        };

        audio.onended = () => {
          btn.textContent = "▶";
          if (progress) progress.style.width = "0%";
        };

        audio.onerror = () => {
          toast("Ошибка воспроизведения");
          btn.textContent = "▶";
        };

      } catch (e) {
        console.error(e);
        toast("Ошибка воспроизведения");
      }
    };

    window.seekVoice = function(timeline, event) {
      const rect = timeline.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const btn = timeline.parentElement.querySelector(".voice-play");
      if (btn && btn._audio && btn._audio.duration) {
        btn._audio.currentTime = x * btn._audio.duration;
      }
    };

    async function updateChatMeta(chatId, lastText) {
      const friendUid = currentChatFriendId;

      const myProfile = { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" };
      const oldUnread = Number(chatMeta[chatId]?.unread?.[friendUid] || 0);

      await update(ref(db), {

        [`userChats/${user.uid}/${chatId}/friendProfile`]: friendProfile,
        [`userChats/${user.uid}/${chatId}/lastText`]: lastText,
        [`userChats/${user.uid}/${chatId}/updatedAt`]: Date.now(),
        [`userChats/${user.uid}/${chatId}/unread/${user.uid}`]: 0,
        [`userChats/${friendUid}/${chatId}/friendUid`]: user.uid,
        [`userChats/${friendUid}/${chatId}/friendProfile`]: myProfile,
        [`userChats/${friendUid}/${chatId}/lastText`]: lastText,
        [`userChats/${friendUid}/${chatId}/updatedAt`]: Date.now(),

    // ===== INCOMING BIG REACTIONS =====
    function subscribeIncomingReactions() {
      if (reactionsUnsubscribe) reactionsUnsubscribe();
      reactionsUnsubscribe = onValue(ref(db, `reactions/${user.uid}`), async snap => {
        const data = snap.val() || {};
        for (const reactionId of Object.keys(data)) {
          if (incomingReactions[reactionId]) continue;
          incomingReactions[reactionId] = true;
          const reaction = data[reactionId];
          await playIncomingReaction(reaction, reactionId);
        }
      });
    }

    async function playIncomingReaction(reaction, reactionId) {
      if (!reaction) return;
      openPage("map");
      createReactionExplosion({
        emoji: reaction.emoji || "❤️",
        count: Math.max(1, Math.min(20000, Number(reaction.count) || 1)),
        fromName: reaction.fromName || "Друг",
        fromUid: reaction.fromUid || ""
      });
      try { await remove(ref(db, `reactions/${user.uid}/${reactionId}`)); } catch (e) {}
    }

    function createReactionExplosion({ emoji, count, fromName, fromUid }) {
      const overlay = document.getElementById("reactionOverlay");

      const dark = document.createElement("div");
      dark.style.cssText = "position:absolute;inset:0;background:rgba(0,0,0,.28);animation:fadeReaction 4.7s ease forwards;";

      counter.style.cssText = "position:absolute;z-index:5;top:20px;left:50%;transform:translateX(-50%);padding:10px 17px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(15px);font-weight:1000;";
      counter.textContent = `${emoji} × ${count.toLocaleString("ru-RU")}`;
      overlay.appendChild(counter);

      const center = document.createElement("div");
      center.style.cssText = "position:absolute;z-index:3;top:50%;left:50%;width:min(90vw,430px);text-align:center;transform:translate(-50%,-50%);animation:centerReaction 4.7s ease forwards;";
      center.innerHTML = `
        <div style="font-size:clamp(100px,30vw,180px);filter:drop-shadow(0 15px 35px #000);animation:emojiDance 1.1s infinite alternate ease-in-out;">${emoji}</div>
        <div style="margin-top:10px;font-size:clamp(20px,6vw,30px);font-weight:1000;">${escapeHtml(fromName)} отправил тебе реакцию</div>
        <div style="margin-top:5px;font-size:clamp(34px,11vw,60px);font-weight:1000;">×${count.toLocaleString("ru-RU")}</div>
        <div style="margin-top:7px;color:#ddd;font-size:13px;">Реакции разлетаются по карте ✨</div>
      `;
      overlay.appendChild(center);

      const particleCount = Math.min(420, Math.max(30, Math.floor(Math.sqrt(count) * 4)));
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");
        particle.style.cssText = `
          position:absolute;left:50%;top:50%;z-index:2;font-size:${18 + Math.random() * 34}px;
          transform:translate(-50%,-50%);
          animation:particleFly ${2.2 + Math.random() * 2}s ease-out forwards;
          animation-delay:${Math.random() * .6}s;
        `;
        particle.textContent = emoji;
        const angle = Math.random() * Math.PI * 2;
        const distance = 40 + Math.random() * Math.max(innerWidth, innerHeight) * .9;
        particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--scale", String(.6 + Math.random() * 1.8));
        particle.style.setProperty("--rotate", `${-360 + Math.random() * 720}deg`);
        overlay.appendChild(particle);
      }

      const style = document.createElement("style");
      style.textContent = `
        @keyframes fadeReaction { 0%{opacity:0} 10%{opacity:1} 85%{opacity:1} 100%{opacity:0} }
        @keyframes centerReaction { 0%{opacity:0;transform:translate(-50%,-50%) scale(.3)} 12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)} 20%{transform:translate(-50%,-50%) scale(1)} 85%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(.8)} }
        @keyframes emojiDance { from{transform:rotate(-6deg) scale(.96)} to{transform:rotate(6deg) scale(1.08)} }
        @keyframes particleFly { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2)} 8%{opacity:1} 75%{opacity:1} 100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rotate))} }
      `;
      overlay.appendChild(style);

      if (navigator.vibrate) {
        navigator.vibrate(count >= 10000 ? [80, 40, 100, 40, 160] : count >= 1000 ? [60, 40, 90] : [50]);
      }
      setTimeout(() => { overlay.innerHTML = ""; }, 4800);
    }

    // ===== SHOW FRIEND ON MAP =====
    window.showFriendOnMap = async function(friendUid) {
      const snap = await get(ref(db, `locations/${friendUid}`));
      if (!snap.exists()) { toast("Геолокация друга недоступна."); return; }
      const loc = snap.val();
      closePanel();
      openPage("map");
      map.setView([Number(loc.lat), Number(loc.lng)], 17);
      friendMarkers.get(friendUid)?.openPopup();
    };

    // ===== PROFILE PAGE =====
    function renderProfile() {
      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Профиль</h2>
        <div class="friend">
          <img id="profileAvatar" class="avatar ${profile?.avatarAnimation && profile.avatarAnimation !== 'none' ? profile.avatarAnimation : ''}" src="${avatarUrl(profile)}">
          <div class="grow"><b>${escapeHtml(profile.name)}</b><div class="code">Код друга: <b>${profile.friendCode}</b></div></div>
        </div>
        <div class="field"><label>Имя</label><input id="profileNameInput" maxlength="30" value="${escapeHtml(profile.name || "")}"></div>
        <div class="field"><label>Фото профиля</label><input id="avatarInput" type="file" accept="image/*"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button class="btn secondary" onclick="renderAvatarSettings()">✨ Аватар</button>
          <button class="btn secondary" onclick="renderFontSettings()">🔤 Шрифт</button>
        </div>
        <button id="saveProfileBtn" class="btn full">Сохранить</button>
      `);

      document.getElementById("saveProfileBtn").onclick = saveProfile;
      document.getElementById("avatarInput").onchange = uploadAvatar;
    }

    async function saveProfile() {
      const name = document.getElementById("profileNameInput").value.trim();
      if (!name) { toast("Введите имя."); return; }
      await update(ref(db, `profiles/${user.uid}`), { name });
      toast("Профиль сохранён.");
    }

    async function uploadAvatar(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) { toast("Выбери изображение."); return; }
      const avatar = await compressImage(file, 256, .78);
      await update(ref(db, `profiles/${user.uid}`), { avatar });
      profile.avatar = avatar;
      document.getElementById("profileAvatar").src = avatar;
      renderMeMarker();
      toast("Аватар обновлён ✨");
    }

    // ===== SETTINGS =====
    function renderSettings() {
      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Настройки</h2>
        <div class="friend" style="border:0">
          <div class="grow"><b>📍 Показывать геолокацию</b><div class="code">Друзья смогут видеть тебя на карте.</div></div>
          <button id="locationToggle" class="toggle ${locationSharing ? "on" : ""}"><i></i></button>
        </div>
        <div class="friend" style="border:0">
          <div class="grow"><b>🌙 Тёмная тема</b><div class="code">Переключить тему приложения</div></div>
          <button id="themeToggleBtn" class="toggle ${isDarkTheme ? "on" : ""}"><i></i></button>
        </div>
        <button class="btn full secondary" onclick="renderHideOnlineSettings()">👻 Скрыть "В сети"</button>
        <button class="btn full secondary" onclick="renderStickerPacks()">🎨 Мои стикерпаки</button>
        <button class="btn full secondary" onclick="renderPlaylists()">🎵 Плейлисты</button>
        <button class="btn full primary" onclick="window.startHideSeek()">🕵️ Прятки с друзьями</button>
        <button id="hideLocationBtn" class="btn full secondary">Скрыть текущую геолокацию</button>
        <div class="note">Версия 2.0 • ${Object.keys(friends).length} друзей</div>
      `);

      document.getElementById("locationToggle").onclick = toggleLocation;
      document.getElementById("hideLocationBtn").onclick = async () => {
        await remove(ref(db, `locations/${user.uid}`));
        toast("Геолокация скрыта.");
      };
      document.getElementById("themeToggleBtn").onclick = toggleTheme;
    }

    async function toggleLocation() {
      locationSharing = !locationSharing;
      await update(ref(db, `profiles/${user.uid}`), { locationSharing });
      if (locationSharing) {
        startLocation();
      } else {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId);
          watchId = null; }
        await remove(ref(db, `locations/${user.uid}`));
        if (meMarker) { map.removeLayer(meMarker);
          meMarker = null; }
        setStatus("Геолокация выключена", false);
      }
      renderSettings();
    }

    function toggleTheme() {
      isDarkTheme = !isDarkTheme;
      document.documentElement.setAttribute("data-theme", isDarkTheme ? "dark" : "light");
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.classList.toggle("on", isDarkTheme);
      document.getElementById("themeToggle").textContent = isDarkTheme ? "🌙" : "☀️";
      localStorage.setItem("link_theme", isDarkTheme ? "dark" : "light");
    }

    // ===== MORE PAGE =====
    function renderMore() {
      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Ещё возможности</h2>
        <div class="section-title">🎯 Статистика</div>
        <div class="friend" style="border:0"><div class="grow"><b>Друзей</b><div class="code">${Object.keys(friends).length} человек</div></div></div>
        <div class="section-title">📱 Быстрый доступ</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;">
          <button class="btn secondary small" onclick="openPage('map');closePanel();">🗺️ Карта</button>
          <button class="btn secondary small" onclick="openPage('friends');closePanel();">👥 Друзья</button>
          <button class="btn secondary small" onclick="openPage('chats');closePanel();">💬 Чаты</button>
          <button class="btn secondary small" onclick="openPage('profile');closePanel();">👤 Профиль</button>
          <button class="btn secondary small" onclick="openPage('settings');closePanel();">⚙️ Настройки</button>
        </div>
        <div class="section-title">🎨 О приложении</div>
        <div class="reaction-info"><b>LINK v2.0</b><br>Друзья рядом. Карта в реальном времени. Чаты с реакциями.<br><br>🎨 Новое: истории, плейлисты, прятки, стикерпаки, анимированные аватары, рисование, шрифты, реакции, отмена отправки, самоуничтожение, скрытие "в сети"!</div>
      `);
    }

    // ===== THEME INIT =====
    const savedTheme = localStorage.getItem("link_theme");
    if (savedTheme) {
      isDarkTheme = savedTheme === "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    // ===== CLEANUP =====
    window.addEventListener("beforeunload", () => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      stopTyping();
      stopVoiceRecording();
    });

    window.addEventListener("online", () => {
      toast("Интернет восстановлен.");
      if (locationSharing && watchId === null) startLocation();
    });
    window.addEventListener("offline", () => setStatus("Нет интернета", false));

    // ===== START =====
    initMap();
  </script>
</body>
</html>
