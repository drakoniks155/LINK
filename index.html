<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Blink</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* MAP */

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

/* TOP */

.top{
    position:fixed;
    z-index:1000;
    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.pill{
    background:rgba(8,8,8,.9);
    border:1px solid #333;
    border-radius:18px;
    padding:10px 14px;
    backdrop-filter:blur(14px);
    box-shadow:0 10px 30px #0008;
}

.brand{
    font-weight:900;
    letter-spacing:1px;
}

.status{
    font-size:12px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#666;
    margin-right:6px;
}

.dot.live{
    background:#45ff88;
    box-shadow:0 0 12px #45ff88;
}

/* SPEED */

.speed-box{
    position:fixed;
    z-index:1000;

    top:70px;
    left:50%;

    transform:translateX(-50%);

    background:#080808e8;
    border:1px solid #333;
    border-radius:20px;

    padding:9px 18px;

    text-align:center;
    backdrop-filter:blur(15px);
}

.speed-number{
    font-size:25px;
    font-weight:900;
}

.speed-caption{
    color:#888;
    font-size:9px;
}

/* BOTTOM */

.bottom{
    position:fixed;
    z-index:1000;

    left:10px;
    right:10px;
    bottom:10px;

    background:#080808ee;
    border:1px solid #333;
    border-radius:24px;

    padding:7px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;

    backdrop-filter:blur(15px);
}

.nav{
    border:0;
    background:transparent;
    color:#888;
    border-radius:17px;
    padding:8px 2px;
}

.nav.active{
    background:#fff;
    color:#000;
}

.nav-icon{
    display:block;
    font-size:18px;
}

.nav-text{
    display:block;
    font-size:10px;
    font-weight:bold;
}

/* AUTH */

#auth{
    position:fixed;
    z-index:5000;
    inset:0;

    background:#070707;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.auth-box{
    width:min(430px,100%);

    background:#111;
    border:1px solid #292929;

    border-radius:28px;

    padding:25px;

    box-shadow:0 20px 80px #000;
}

.logo{
    font-size:48px;
    font-weight:1000;
    letter-spacing:-4px;
}

.subtitle{
    margin:0 0 20px;
    color:#999;
    font-size:18px;
}

.auth-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;

    background:#181818;
    padding:4px;

    border-radius:15px;
    margin-bottom:15px;
}

.auth-tabs button{
    border:0;
    background:transparent;
    color:#999;

    padding:11px;

    border-radius:11px;
    font-weight:bold;
}

.auth-tabs button.active{
    background:#fff;
    color:#000;
}

.field{
    margin:12px 0;
}

.field label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin-bottom:6px;
}

input{
    width:100%;

    background:#171717;
    color:#fff;

    border:1px solid #333;

    border-radius:14px;

    padding:13px;

    outline:none;
}

input:focus{
    border-color:#777;
}

.main-button{
    width:100%;

    border:0;
    border-radius:15px;

    padding:14px;

    background:#fff;
    color:#000;

    font-weight:900;

    margin-top:8px;
}

.error{
    min-height:20px;

    margin-top:9px;

    color:#ff7890;

    font-size:13px;
}

/* PANEL */

.panel{
    position:fixed;
    z-index:3000;
    inset:0;

    background:#0008;

    display:flex;
    align-items:flex-end;

    backdrop-filter:blur(3px);
}

.sheet{
    width:100%;
    max-height:88vh;
    overflow:auto;

    background:#0d0d0d;

    border:1px solid #292929;
    border-radius:28px 28px 0 0;

    padding:16px 16px 30px;
}

.handle{
    width:45px;
    height:4px;

    background:#444;
    border-radius:20px;

    margin:0 auto 15px;
}

.close{
    float:right;

    width:36px;
    height:36px;

    border:0;
    border-radius:50%;

    background:#222;
    color:#fff;

    font-size:22px;
}

.profile-head{
    display:flex;
    align-items:center;
    gap:14px;

    margin-bottom:18px;
}

.avatar{
    width:70px;
    height:70px;

    border-radius:50%;

    object-fit:cover;

    background:#222;

    border:2px solid white;
}

.avatar-small{
    width:48px;
    height:48px;

    border-radius:50%;

    object-fit:cover;

    background:#222;
}

.profile-name{
    font-size:20px;
    font-weight:900;
}

.muted{
    color:#888;
    font-size:12px;
}

.friend-row{
    display:flex;
    align-items:center;
    gap:10px;

    padding:11px 0;

    border-bottom:1px solid #242424;
}

.grow{
    flex:1;
}

.secondary{
    background:#222;
    color:#fff;

    border:1px solid #333;
}

.danger{
    background:#2a1115;
    color:#ff8295;
}

/* TOAST */

.toast{
    position:fixed;
    z-index:7000;

    left:50%;
    bottom:90px;

    transform:translateX(-50%);

    max-width:90%;

    background:white;
    color:black;

    padding:11px 15px;

    border-radius:14px;

    font-weight:bold;
    font-size:13px;

    text-align:center;
}

/* MAP MARKERS */

.blink-marker{
    position:relative;

    width:48px;
    height:48px;

    border-radius:50%;

    background:#222;

    border:3px solid #fff;

    box-shadow:0 5px 20px #000b;
}

.blink-marker img{
    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;
}

.marker-pulse{
    position:absolute;
    inset:-10px;

    border:2px solid white;
    border-radius:50%;

    animation:pulse 1.6s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.25);
        opacity:.1;
    }
}

.marker-speed{
    position:absolute;

    top:51px;
    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    background:#050505;

    border:1px solid #333;
    border-radius:8px;

    padding:3px 6px;

    color:white;

    font-size:10px;
    font-weight:900;
}

.leaflet-control-zoom{
    margin-bottom:95px!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

@media(min-width:700px){

    .bottom{
        width:520px;

        left:50%;
        right:auto;

        transform:translateX(-50%);
    }

    .panel{
        align-items:center;
        justify-content:center;
    }

    .sheet{
        width:520px;
        border-radius:28px;
        max-height:80vh;
    }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ytmdvlqcrqqeblxbnzno.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_irhX2HtmV_Ygk6bV_LDKQA_yPuTi4op";

const supabaseClient =
    supabase.createClient(

    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentProfile = null;

let map = null;

let myMarker = null;

let gpsWatch = null;

let previousPosition = null;

let myTrail = [];

let friends = [];

let friendMarkers = {};

let friendTrails = {};

let trailLayers = [];

let authMode = "login";

let realtimeChannel = null;

let sharingLocation = true;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    return String(value || "")
        .replace(/[&<>"']/g,function(char){

            const map = {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            };

            return map[char];

        });

}


function showToast(text){

    const toast = $("toast");

    toast.textContent = text;

    toast.classList.remove("hidden");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(function(){

            toast.classList.add("hidden");

        },3000);

}


function setStatus(text,online){

    $("statusText").textContent = text;

    $("statusDot").classList.toggle(
        "live",
        Boolean(online)
    );

}


function closePanel(){

    $("panel").classList.add("hidden");

}

);


/* =========================================================
   MAP
========================================================= */

function initializeMap(){

    map =
        L.map("map").setView(
            [0,0],

        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

/* =========================================================
   AVATAR
========================================================= */

function getAvatar(url){

    if(url){
        return url;
    }

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="200"
                 height="200">

                <rect width="200"
                      height="200"
                      fill="#222"/>

                <text x="100"
                      y="125"
                      text-anchor="middle"
                      font-size="80"
                      fill="white">
                    👤
                </text>

            </svg>
        `);

}


/* =========================================================
   MARKER
========================================================= */

function createMarkerIcon(
    avatarURL,
    speed,
    isMe
){

    return L.divIcon({

        className:"blink-custom-icon",

        html:`

            <div class="blink-marker">

                ${
                    isMe
                    ? `<div class="marker-pulse"></div>`
                    : ""
                }

                <img src="${getAvatar(avatarURL)}">

            </div>

            <div class="marker-speed">

                ${Number(speed || 0).toFixed(1)}
                км/ч

            </div>

        `,

        iconSize:[48,72],

        iconAnchor:[24,24]

    });

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const rad =
        Math.PI / 180;

    const dLat =
        (lat2-lat1)*rad;

    const dLon =
        (lon2-lon1)*rad;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(lat1*rad) *
        Math.cos(lat2*rad) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    return 2 *
        R *
        Math.asin(
            Math.sqrt(a)
        );

}


/* =========================================================
   SPEED
========================================================= */

function calculateSpeed(
    position
){

    const coords =
        position.coords;

    let metersPerSecond =
        Number(coords.speed);


    if(
        !Number.isFinite(
            metersPerSecond
        ) ||
        metersPerSecond < 0
    ){

        metersPerSecond = null;

    }


    if(
        metersPerSecond === null &&
        previousPosition
    ){

        const meters =
            distanceMeters(

                previousPosition.latitude,
                previousPosition.longitude,

                coords.latitude,
                coords.longitude

            );


        const seconds =
            (
                position.timestamp -
                previousPosition.timestamp
            ) / 1000;


        if(seconds > 0){

            metersPerSecond =
                meters / seconds;

        }else{

            metersPerSecond = 0;

        }

    }


    if(metersPerSecond === null){

        metersPerSecond = 0;

    }


    return Math.max(
        0,
        metersPerSecond * 3.6
    );

}


/* =========================================================
   RAINBOW TRAIL
========================================================= */

const rainbowColors = [
    "#ff0055",
    "#ff7700",
    "#ffee00",
    "#33ff00",
    "#00e5ff",
    "#1769ff",
    "#8b38ff",
    "#ff25d4"
];


function clearTrailLayers(){

    trailLayers.forEach(
        function(layer){

            map.removeLayer(
                layer
            );

        }
    );

    trailLayers = [];

}


function drawRainbowTrail(
    points,
    width
){

    if(
        !points ||
        points.length < 2
    ){
        return;
    }


    const start =
        Math.max(
            0,
            points.length - 35
        );


    for(
        let i=start;
        i<points.length-1;
        i++
    ){

        const ratio =
            (i-start) /
            Math.max(
                1,
                points.length-2-start
            );


        const colorIndex =
            Math.min(
                rainbowColors.length-1,
                Math.floor(
                    ratio *
                    rainbowColors.length
                )
            );


        const line =
            L.polyline(

                [
                    points[i],
                    points[i+1]
                ],

                {
                    color:
                        rainbowColors[colorIndex],

                    weight:width,

                    opacity:
                        .95 *
                        (
                            .35 +
                            ratio*.65
                        ),

                    lineCap:"round",

                    lineJoin:"round"
                }

            ).addTo(map);


        trailLayers.push(
            line
        );

    }

}


function redrawAllTrails(){

    clearTrailLayers();

    drawRainbowTrail(
        myTrail,
        7
    );


    Object.keys(friendTrails)
        .forEach(function(id){

            drawRainbowTrail(
                friendTrails[id],
                6
            );

        });

}


/* =========================================================
   PROFILE
========================================================= */

async function loadMyProfile(){

    const result =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    if(result.error){
        throw result.error;
    }


    if(result.data){

        return result.data;

    }


    /*
       Создаём профиль.
       friend_code генерируем на клиенте,
       если твоя таблица позволяет
       задавать это поле.
    */

    const code =
        String(
            Math.floor(
                1000 +
                Math.random()*9000
            )
        );


    const inserted =
        await supabaseClient
            .from("profiles")
            .insert({

                id:
                    currentUser.id,

                username:
                    currentUser.user_metadata
                        ?.username ||
                    "Blink",

                friend_code:
                    code,

                location_sharing_enabled:
                    true

            })
            .select()
            .single();


    if(inserted.error){

        throw inserted.error;

    }


    return inserted.data;

}


/* =========================================================
   AUTH
========================================================= */

$("loginTab").onclick =
function(){

    authMode = "login";

    $("loginTab")
        .classList
        .add("active");

    $("registerTab")
        .classList
        .remove("active");

    $("usernameField")
        .classList
        .add("hidden");

    $("authButton")
        .textContent =
        "Войти";

};


$("registerTab").onclick =
function(){

    authMode = "register";

    $("registerTab")
        .classList
        .add("active");

    $("loginTab")
        .classList
        .remove("active");

    $("usernameField")
        .classList
        .remove("hidden");

    $("authButton")
        .textContent =
        "Создать аккаунт";

};


$("authButton").onclick =
async function(){

    const email =
        $("email")
            .value
            .trim();

    const password =
        $("password")
            .value;

    const username =
        $("username")
            .value
            .trim();


    $("authError").textContent =
        "";


    try{

        if(!email){

            throw new Error(
                "Введите email."
            );

        }


        if(password.length < 6){

            throw new Error(
                "Пароль должен быть минимум 6 символов."
            );

        }


        if(
            authMode ===
            "register"
        ){

            if(!username){

                throw new Error(
                    "Введите имя."
                );

            }


            const result =
                await supabaseClient
                    .auth
                    .signUp({

                        email:email,

                        password:password,

                        options:{

                            data:{
                                username:username
                            }

                        }

                    });


            if(result.error){

                throw result.error;

            }


            /*
               При выключенном Confirm email
               Supabase должен вернуть session.
            */

            if(result.data.session){

                await startApplication(
                    result.data.session.user
                );

            }else{

                $("authError")
                    .textContent =
                    "Регистрация создана. Проверь настройку Confirm email в Supabase.";

            }

        }else{

            const result =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:email,

                        password:password

                    });


            if(result.error){

                throw result.error;

            }


            await startApplication(
                result.data.user
            );

        }

    }catch(error){

        console.error(error);

        $("authError")
            .textContent =
            error.message ||
            "Произошла ошибка.";

    }

};


/* =========================================================
   START APPLICATION
========================================================= */

}

   SESSION
========================================================= */

    const result =
        await supabaseClient
            .auth

    if(result.data.session){

        await startApplication(
            result.data.session.user
        );

}

    .auth

/* =========================================================
   GPS
========================================================= */

function startGPS(){

    if(
        !navigator.geolocation
    ){

        setStatus(
            "GPS недоступен",
            false
        );

        return;

    }


    if(!sharingLocation){

        setStatus(
            "Геолокация выключена",
            false
        );

        return;

    }


    if(gpsWatch !== null){

        navigator.geolocation.clearWatch(
            gpsWatch
        );

    }


    gpsWatch =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleGPSError,

            {
                enableHighAccuracy:true,

                maximumAge:1000,

                timeout:15000
            }

        );

}


/* =========================================================
   POSITION
========================================================= */

async function handlePosition(
    position
){

    const coords =
        position.coords;


    const latitude =
        coords.latitude;

    const longitude =
        coords.longitude;


    const speed =
        calculateSpeed(
            position
        );


    previousPosition = {

        latitude:latitude,

        longitude:longitude,

        timestamp:
            position.timestamp

    };


    $("mySpeed")
        .textContent =
        speed.toFixed(1) +
        " км/ч";


    setStatus(
        "GPS в реальном времени",
        true
    );


    /*
       Добавляем точку
       в мой радужный хвост.
    */

    myTrail.push(
        [
            latitude,
            longitude
        ]
    );


    if(
        myTrail.length > 45
    ){

        myTrail.shift();

    }


    /* MARKER */

    if(!myMarker){

        myMarker =
            L.marker(

                [
                    latitude,
                    longitude
                ],

                {

                    icon:
                        createMarkerIcon(

                            currentProfile
                                ?.avatar_url,

                            speed,

                            true

                        ),

                    zIndexOffset:1000

                }

            ).addTo(map);


        map.setView(

            [
                latitude,
                longitude
            ],

            16

        );

    }else{

        myMarker.setLatLng(

            [
                latitude,
                longitude
            ]

        );


        myMarker.setIcon(

            createMarkerIcon(

                currentProfile
                    ?.avatar_url,

                speed,

                true

            )

        );

    }


    redrawAllTrails();


    /*
       Отправляем геопозицию
       в Supabase.
    */

    const result =
        await supabaseClient
            .from("locations")
            .upsert({

                user_id:
                    currentUser.id,

                latitude:
                    latitude,

                longitude:
                    longitude,

                accuracy:
                    coords.accuracy || 0,

                speed:
                    speed,

                updated_at:
                    new Date()
                        .toISOString()

            });


    if(result.error){

        console.error(
            "Location error:",
            result.error
        );

    }

}


function handleGPSError(error){

    console.error(error);

    if(error.code === 1){

        setStatus(
            "Разреши GPS",
            false
        );

        showToast(
            "Разреши браузеру доступ к геолокации."
        );

    }else{

        setStatus(
            "Ошибка GPS",
            false
        );

    }

}


/* =========================================================
   FRIENDS
========================================================= */

async function loadFriends(){

    const result =
        await supabaseClient
            .rpc(
                "get_my_friends"
            );


    if(result.error){

        console.error(
            "Friends:",
            result.error
        );

        return;

    }


    friends =
        result.data || [];


    friends.forEach(
        function(friend){

            if(
                !friendTrails[
                    friend.id
                ]
            ){

                friendTrails[
                    friend.id
                ] = [];

            }

        }
    );


    const locations =
        await supabaseClient
            .rpc(
                "get_friend_locations"
            );


    if(
        !locations.error &&
        locations.data
    ){

        locations.data.forEach(
            updateFriendLocation
        );

    }

}


/* =========================================================
   FRIEND LOCATION
========================================================= */

function updateFriendLocation(
    location
){

    const id =
        location.user_id;


    if(
        !id ||
        id === currentUser.id
    ){

        return;

    }


    const latitude =
        Number(
            location.latitude
        );

    const longitude =
        Number(
            location.longitude
        );


    if(
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
    ){

        return;

    }


    if(
        !friendTrails[id]
    ){

        friendTrails[id] = [];

    }


    friendTrails[id].push(
        [
            latitude,
            longitude
        ]
    );


    if(
        friendTrails[id].length > 40
    ){

        friendTrails[id].shift();

    }


    const friend =
        friends.find(
            function(item){

                return item.id === id;

            }
        );


    const name =
        friend?.username ||
        location.username ||
        "Друг";


    const avatarURL =
        friend?.avatar_url ||
        location.avatar_url ||
        null;


    const speed =
        Number(
            location.speed || 0
        );


    if(
        !friendMarkers[id]
    ){

        const marker =
            L.marker(

                [
                    latitude,
                    longitude
                ],

                {

                    icon:
                        createMarkerIcon(

                            avatarURL,

                            speed,

                            false

                        )

                }

            ).addTo(map);


        marker.bindPopup(

            `<b>${escapeHTML(name)}</b>
             <br>
             🚀 ${speed.toFixed(1)} км/ч`

        );


        friendMarkers[id] =
            marker;

    }else{

        const marker =
            friendMarkers[id];


        marker.setLatLng(

            [
                latitude,
                longitude
            ]

        );


        marker.setIcon(

            createMarkerIcon(

                avatarURL,

                speed,

                false

            )

        );


        marker.setPopupContent(

            `<b>${escapeHTML(name)}</b>
             <br>
             🚀 ${speed.toFixed(1)} км/ч`

        );

    }


    redrawAllTrails();

}


/* =========================================================
   REALTIME
========================================================= */

function startRealtime(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "blink-locations"
            )


            .on(

                "postgres_changes",

                {
                    event:"INSERT",
                    schema:"public",
                    table:"locations"
                },

                function(payload){

                    if(
                        payload.new.user_id !==
                        currentUser.id
                    ){

                        updateFriendLocation(
                            payload.new
                        );

                    }

                }

            )


            .on(

                "postgres_changes",

                {
                    event:"UPDATE",
                    schema:"public",
                    table:"locations"
                },

                function(payload){

                    if(
                        payload.new.user_id !==
                        currentUser.id
                    ){

                        updateFriendLocation(
                            payload.new
                        );

                    }

                }

            )


            .subscribe();

}

/* =========================================================
   UPLOAD AVATAR
========================================================= */

async function uploadAvatar(event){

    const file =
        event.target.files?.[0];


    if(!file){
        return;
    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        showToast(
            "Выбери фотографию."
        );

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        showToast(
            "Фото должно быть меньше 5 МБ."
        );

        return;

    }


    showToast(
        "Загружаю фотографию..."
    );


    /*
       Имя файла одно и то же для
       каждого пользователя.
       Поэтому у пользователя
       всегда одна фотография.
    */

    const path =
        currentUser.id +
        ".jpg";


    const upload =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(

                path,

                file,

                {
                    upsert:true,

                    contentType:
                        file.type,

                    cacheControl:
                        "3600"

                }

            );


    if(upload.error){

        showToast(
            upload.error.message
        );

        return;

    }


    const publicURL =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(path)
            .data
            .publicUrl
        +
        "?v=" +
        Date.now();


    const update =
        await supabaseClient
            .from("profiles")
            .update({

                avatar_url:
                    publicURL

            })
            .eq(
                "id",
                currentUser.id
            );


    if(update.error){

        showToast(
            update.error.message
        );

        return;

    }


    currentProfile.avatar_url =
        publicURL;


    $("profileAvatar").src =
        publicURL;


    if(myMarker){

        myMarker.setIcon(

            createMarkerIcon(

                publicURL,

                previousPosition
                    ? calculateSpeed({
                        coords:{
                            speed:0
                        },
                        timestamp:
                            Date.now()
                    })
                    : 0,

                true

            )

        );

    }


    showToast(
        "Фотография сохранена."
    );

}

/* =========================================================
   ADD FRIEND
========================================================= */

async function addFriend(){

    const code =
        $("friendCode")
            .value
            .trim();


    if(
        !/^[0-9]{4}$/.test(code)
    ){

        showToast(
            "Код должен содержать 4 цифры."
        );

        return;

    }


    const result =
        await supabaseClient
            .rpc(
                "send_friend_request_by_code",
                {
                    p_code:code
                }
            );


    if(result.error){

        showToast(
            result.error.message
        );

        return;

    }


    showToast(
        "Заявка отправлена."
    );

}

/* =========================================================
   LOCATION TOGGLE
========================================================= */

async function toggleLocation(){

    sharingLocation =
        !sharingLocation;


    const result =
        await supabaseClient
            .from("profiles")
            .update({

                location_sharing_enabled:
                    sharingLocation

            })
            .eq(
                "id",
                currentUser.id
            );


    if(result.error){

        sharingLocation =
            !sharingLocation;

        showToast(
            result.error.message
        );

        return;

    }


    if(sharingLocation){

        startGPS();

        showToast(
            "Геолокация включена."
        );

    }else{

        if(
            gpsWatch !== null
        ){

            navigator
                .geolocation
                .clearWatch(
                    gpsWatch
                );

        }


        gpsWatch =
            null;


        await supabaseClient
            .from("locations")
            .delete()
            .eq(
                "user_id",
                currentUser.id
            );


        if(myMarker){

            map.removeLayer(
                myMarker
            );

            myMarker =
                null;

        }


        myTrail = [];

        redrawAllTrails();

        $("mySpeed")
            .textContent =
            "0.0 км/ч";


        setStatus(
            "Геолокация выключена",
            false
        );

    }


    showSettings();

}
