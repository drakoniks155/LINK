<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Blink</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

.topbar{
  position:absolute;
  z-index:1000;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.badge{
  background:rgba(5,5,5,.9);
  backdrop-filter:blur(15px);
  border:1px solid #333;
  border-radius:18px;
  padding:10px 14px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}

.brand{
  font-weight:900;
  letter-spacing:1px;
}

.status{
  font-size:12px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
  margin-right:6px;
}

.dot.live{
  background:#4cff8a;
  box-shadow:0 0 12px #4cff8a;
}

.map-controls{
  position:absolute;
  z-index:2000;
  right:14px;
  top:125px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.map-btn{
  width:50px;
  height:50px;
  border:1px solid #333;
  border-radius:16px;
  background:#050505;
  color:white;
  font-size:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.55);
}

.map-btn:active{
  transform:scale(.94);
}

.bottom{
  position:absolute;
  z-index:3000;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(8,8,8,.96);
  border:1px solid #333;
  border-radius:24px;
  padding:7px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.nav{
  border:0;
  background:transparent;
  color:#888;
  border-radius:17px;
  padding:8px 3px;
}

.nav.active{
  background:white;
  color:black;
}

.nav .icon{
  display:block;
  font-size:19px;
}

.nav .txt{
  display:block;
  font-size:10px;
  font-weight:bold;
}

.panel{
  position:absolute;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:flex-end;
  backdrop-filter:blur(4px);
}

.sheet{
  width:100%;
  max-height:90dvh;
  overflow-y:auto;
  background:#0d0d0d;
  border:1px solid #292929;
  border-radius:28px 28px 0 0;
  padding:18px 16px 30px;
}

.handle{
  width:42px;
  height:4px;
  background:#444;
  border-radius:10px;
  margin:0 auto 16px;
}

.close{
  float:right;
  border:0;
  background:#222;
  color:white;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:22px;
}

h1,h2,h3{
  margin-top:5px;
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  background:#171717;
  color:white;
  border:1px solid #333;
  border-radius:14px;
  padding:12px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:13px;
  background:white;
  color:black;
  font-weight:900;
  margin-top:8px;
}

.btn.secondary{
  background:#222;
  color:white;
  border:1px solid #333;
}

.btn.danger{
  background:#351515;
  color:#ff8b8b;
  border:1px solid #552222;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.grow{
  flex:1;
}

.profile{
  display:flex;
  align-items:center;
  gap:14px;
  margin:15px 0;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:2px solid white;
}

.avatar.small{
  width:46px;
  height:46px;
  border-width:1px;
}

.code{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.friend{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #252525;
}

.empty{
  text-align:center;
  color:#888;
  padding:25px;
}

.note{
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.request{
  background:#151515;
  border:1px solid #292929;
  border-radius:16px;
  padding:12px;
  margin:8px 0;
}

.place{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #252525;
}

.place-icon{
  width:45px;
  height:45px;
  min-width:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171717;
  border:1px solid #333;
  border-radius:14px;
  font-size:21px;
}

.toast{
  position:absolute;
  z-index:9000;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:white;
  color:black;
  padding:11px 15px;
  border-radius:14px;
  font-size:13px;
  font-weight:800;
  max-width:90%;
  text-align:center;
}

.auth-screen{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#0e0e0e;
  border:1px solid #292929;
  border-radius:28px;
  padding:25px;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.logo{
  font-size:30px;
  font-weight:900;
  text-align:center;
  margin-bottom:5px;
}

.auth-sub{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:25px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#171717;
  border-radius:15px;
  padding:4px;
  margin-bottom:15px;
}

.auth-tab{
  border:0;
  background:transparent;
  color:#777;
  padding:10px;
  border-radius:12px;
}

.auth-tab.active{
  background:white;
  color:black;
  font-weight:bold;
}

.error{
  background:#321616;
  color:#ff9b9b;
  border:1px solid #562525;
  border-radius:13px;
  padding:10px;
  font-size:12px;
  margin:10px 0;
  display:none;
}

.loading{
  opacity:.6;
  pointer-events:none;
}

.user-marker{
  width:48px;
  height:48px;
  border:3px solid white;
  border-radius:50%;
  background:#222;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  position:relative;
}

.user-marker img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.user-ring{
  position:absolute;
  inset:-8px;
  border:2px solid white;
  border-radius:50%;
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.2);
    opacity:.1;
  }
}

.friend-marker{
  width:46px;
  height:46px;
  border:3px solid white;
  border-radius:50%;
  background:#222;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  overflow:hidden;
}

.friend-marker img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.place-marker{
  width:44px;
  height:44px;
  border:2px solid white;
  border-radius:50%;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  box-shadow:0 5px 20px rgba(0,0,0,.65);
}

@media(min-width:700px){
  .bottom{
    width:520px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }

  .panel{
    align-items:center;
    justify-content:center;
  }

  .sheet{
    width:520px;
    border-radius:28px;
    max-height:80vh;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">

    <div class="logo">⚡ BLINK</div>

    <div class="auth-sub">
      Друзья рядом. В реальном времени.
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active">
        Вход
      </button>

      <button id="registerTab" class="auth-tab">
        Регистрация
      </button>
    </div>

    <div id="authError" class="error"></div>

    <div id="registerNameField" class="field" style="display:none">
      <label>Имя</label>
      <input
        id="authName"
        maxlength="30"
        placeholder="Твоё имя"
      >
    </div>

    <div class="field">
      <label>Email</label>
      <input
        id="authEmail"
        type="email"
        autocomplete="email"
        placeholder="example@mail.com"
      >
    </div>

    <div class="field">
      <label>Пароль</label>
      <input
        id="authPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Минимум 6 символов"
      >
    </div>

    <button id="authButton" class="btn">
      Войти
    </button>

  </div>
</div>

<div id="map"></div>

<div class="topbar">

  <div class="badge brand">
    ⚡ BLINK
  </div>

  <div class="badge status">
    <span id="statusDot" class="dot"></span>
    <span id="statusText">Ожидание GPS</span>
  </div>

</div>

<div class="map-controls">

  <button class="map-btn" onclick="centerMe()">
    🎯
  </button>

  <button class="map-btn" onclick="zoomIn()">
    +
  </button>

  <button class="map-btn" onclick="zoomOut()">
    −
  </button>

  <button class="map-btn" onclick="showPlaces()">
    📍
  </button>

</div>

<div class="bottom">

  <button class="nav active" data-page="map">
    <span class="icon">🗺️</span>
    <span class="txt">Карта</span>
  </button>

  <button class="nav" data-page="friends">
    <span class="icon">👥</span>
    <span class="txt">Друзья</span>
  </button>

  <button class="nav" data-page="profile">
    <span class="icon">👤</span>
    <span class="txt">Профиль</span>
  </button>

  <button class="nav" data-page="settings">
    <span class="icon">⚙️</span>
    <span class="txt">Настройки</span>
  </button>

</div>

<div id="panel" class="panel" style="display:none">
  <div id="sheet" class="sheet"></div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://pfglyeeiydnnfrkjkglk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_mqY9TwP0DuU3_b8kNswqYg_SQT1rEKt";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let myProfile = null;

let myMarker = null;
let myPosition = null;
let watchId = null;

let friendMarkers = {};
let placeMarkers = {};

let friends = [];
let incomingRequests = [];
let savedPlaces = [];


/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map").setView(
    [44.8,20.45],
    6
  );

const satellite =
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom:19,
      attribution:"© Esri"
    }
  );

const labels =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
    {
      maxZoom:20,
      attribution:"© OpenStreetMap © CARTO"
    }
  );

satellite.addTo(map);
labels.addTo(map);


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}


function avatar(src){

  if(src){
    return src;
  }

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
        <rect width="160" height="160" fill="#222"/>
        <text x="80" y="108"
          text-anchor="middle"
          font-size="70"
          fill="white">👤</text>
      </svg>`
    );
}


function toast(text){

  const box =
    document.getElementById("toast");

  box.textContent = text;
  box.style.display = "block";

  clearTimeout(window.blinkToast);

  window.blinkToast =
    setTimeout(() => {
      box.style.display = "none";
    },2500);
}


function setStatus(text,live=false){

  document.getElementById(
    "statusText"
  ).textContent = text;

  document.getElementById(
    "statusDot"
  ).classList.toggle(
    "live",
    live
  );
}


/* =========================================================
   AUTH UI
========================================================= */

let authMode = "login";


function setAuthMode(mode){

  authMode = mode;

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const nameField =
    document.getElementById("registerNameField");

  const button =
    document.getElementById("authButton");

  loginTab.classList.toggle(
    "active",
    mode === "login"
  );

  registerTab.classList.toggle(
    "active",
    mode === "register"
  );

  nameField.style.display =
    mode === "register"
      ? "block"
      : "none";

  button.textContent =
    mode === "register"
      ? "Создать аккаунт"
      : "Войти";

  clearAuthError();
}


function showAuthError(message){

  const box =
    document.getElementById("authError");

  box.textContent = message;
  box.style.display = "block";
}


function clearAuthError(){

  document.getElementById(
    "authError"
  ).style.display = "none";
}


document.getElementById(
  "loginTab"
).onclick = () =>
  setAuthMode("login");


document.getElementById(
  "registerTab"
).onclick = () =>
  setAuthMode("register");


document.getElementById(
  "authButton"
).onclick = authenticate;


async function authenticate(){

  clearAuthError();

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  const button =
    document.getElementById(
      "authButton"
    );

  if(!email || !password){

    showAuthError(
      "Заполни email и пароль."
    );

    return;
  }

  button.classList.add("loading");

  try{

    if(authMode === "register"){

      const username =
        document.getElementById(
          "authName"
        ).value.trim() || "Пользователь";

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password,
          options:{
            data:{
              username
            }
          }
        });

      if(error){
        throw error;
      }

      if(!data.session){

        showAuthError(
          "Аккаунт создан. Проверь почту и подтверди email, затем войди."
        );

        return;
      }

    }else{

      const {
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error){
        throw error;
      }
    }

  }catch(error){

    console.error(error);

    showAuthError(
      error.message ||
      "Не удалось выполнить вход."
    );

  }finally{

    button.classList.remove(
      "loading"
    );

  }
}


/* =========================================================
   AUTH STATE
========================================================= */

async function checkAuth(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await initializeApp();

  }else{

    document.getElementById(
      "authScreen"
    ).style.display = "flex";

  }
}


supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(
      session &&
      !currentUser
    ){

      currentUser =
        session.user;

      await initializeApp();

    }

    if(event === "SIGNED_OUT"){

      currentUser = null;
      myProfile = null;

      document.getElementById(
        "authScreen"
      ).style.display = "flex";

    }

  }
);


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    throw error;
  }

  myProfile = data;

  /*
    Если профиль ещё не создан триггером,
    создаём его сами.
  */

  if(!myProfile){

    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Пользователь";

    const friendCode =
      String(
        Math.floor(
          1000 +
          Math.random()*9000
        )
      );

    const {
      data:newProfile,
      error:createError
    } =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          username,
          friend_code:friendCode,
          notifications_enabled:true,
          location_sharing_enabled:true
        })
        .select()
        .single();

    if(createError){
      throw createError;
    }

    myProfile =
      newProfile;
  }

  return myProfile;
}


/* =========================================================
   FRIENDS
========================================================= */

async function loadFriends(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("friendships")
      .select("*")
      .or(
        `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
      );

  if(error){
    console.error("friendships:",error);
    friends = [];
    return;
  }

  const ids =
    (data || []).map(row =>
      row.user_id === currentUser.id
        ? row.friend_id
        : row.user_id
    );

  if(!ids.length){

    friends = [];
    return;
  }

  const {
    data:profiles,
    error:profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,friend_code,avatar_url,bio"
      )
      .in("id",ids);

  if(profileError){

    console.error(
      "friend profiles:",
      profileError
    );

    friends = [];
    return;
  }

  friends =
    profiles || [];

  await loadFriendLocations();
}


async function loadFriendLocations(){

  Object.values(friendMarkers)
    .forEach(marker => {

      if(map.hasLayer(marker)){
        map.removeLayer(marker);
      }

    });

  friendMarkers = {};

  if(!friends.length){
    return;
  }

  const ids =
    friends.map(friend =>
      friend.id
    );

  const {
    data,
    error
  } =
    await supabaseClient
      .from("locations")
      .select("*")
      .in("user_id",ids);

  if(error){

    console.error(
      "locations:",
      error
    );

    return;
  }

  (data || []).forEach(location => {

    const friend =
      friends.find(
        f => f.id === location.user_id
      );

    if(!friend){
      return;
    }

    const marker =
      L.marker(
        [
          location.latitude,
          location.longitude
        ],
        {
          icon:friendIcon(
            friend.avatar_url
          ),
          zIndexOffset:800
        }
      ).addTo(map);

    marker.bindPopup(`
      <b>${escapeHtml(friend.username)}</b>
      <br>
      Код: ${escapeHtml(friend.friend_code)}
      <br>
      🚀 ${
        Number(location.speed || 0).toFixed(1)
      } км/ч
    `);

    friendMarkers[friend.id] =
      marker;
  });
}


function friendIcon(photo){

  return L.divIcon({

    className:"",

    html:
      `<div class="friend-marker">
        <img src="${avatar(photo)}">
      </div>`,

    iconSize:[46,46],
    iconAnchor:[23,23]

  });
}


/* =========================================================
   SEND FRIEND REQUEST
========================================================= */

async function sendFriendRequest(){

  const input =
    document.getElementById(
      "friendCodeInput"
    );

  const code =
    input.value.trim();

  if(!/^\d{4}$/.test(code)){

    toast(
      "Код должен состоять из 4 цифр."
    );

    return;
  }

  if(
    myProfile &&
    code === myProfile.friend_code
  ){

    toast(
      "Нельзя добавить самого себя."
    );

    return;
  }

  try{

    /*
      Сначала находим пользователя
      по 4-значному коду.
    */

    const {
      data:profile,
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("id,username,friend_code")
        .eq("friend_code",code)
        .maybeSingle();

    if(profileError){
      throw profileError;
    }

    if(!profile){

      toast(
        "Пользователь с таким кодом не найден."
      );

      return;
    }

    /*
      Проверяем, нет ли уже дружбы.
    */

    const {
      data:existingFriendship
    } =
      await supabaseClient
        .from("friendships")
        .select("id")
        .or(
          `and(user_id.eq.${currentUser.id},friend_id.eq.${profile.id}),and(user_id.eq.${profile.id},friend_id.eq.${currentUser.id})`
        )
        .maybeSingle();

    if(existingFriendship){

      toast(
        "Вы уже друзья."
      );

      return;
    }

    /*
      Проверяем существующую заявку.
    */

    const {
      data:existingRequest
    } =
      await supabaseClient
        .from("friend_requests")
        .select("id,status")
        .eq("sender_id",currentUser.id)
        .eq("receiver_id",profile.id)
        .eq("status","pending")
        .maybeSingle();

    if(existingRequest){

      toast(
        "Заявка уже отправлена."
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .insert({
          sender_id:currentUser.id,
          receiver_id:profile.id,
          status:"pending"
        });

    if(error){
      throw error;
    }

    toast(
      "Заявка отправлена!"
    );

    input.value = "";

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Не удалось отправить заявку."
    );
  }
}

/* =========================================================
   ACCEPT REQUEST
========================================================= */

async function acceptRequest(id){

  try{

    const {
      data:request,
      error:requestError
    } =
      await supabaseClient
        .from("friend_requests")
        .select("*")
        .eq("id",id)
        .eq("receiver_id",currentUser.id)
        .single();

    if(requestError){
      throw requestError;
    }

    /*
      Создаём две записи:
      A -> B
      B -> A

      Это позволяет обоим пользователям
      легко находить друг друга.
    */

    const {
      error:friendError
    } =
      await supabaseClient
        .from("friendships")
        .insert([
          {
            user_id:currentUser.id,
            friend_id:request.sender_id
          },
          {
            user_id:request.sender_id,
            friend_id:currentUser.id
          }
        ]);

    if(friendError){

      /*
        Если UNIQUE уже существует,
        всё равно обновляем заявку.
      */

      console.warn(
        "friendship insert:",
        friendError
      );
    }

    const {
      error:updateError
    } =
      await supabaseClient
        .from("friend_requests")
        .update({
          status:"accepted",
          updated_at:new Date().toISOString()
        })
        .eq("id",id)
        .eq("receiver_id",currentUser.id);

    if(updateError){
      throw updateError;
    }

    toast(
      "Теперь вы друзья!"
    );

    await loadFriends();
    await loadIncomingRequests();

    showFriends();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Не удалось принять заявку."
    );
  }
}

/* =========================================================
   LOCATION
========================================================= */

async function updateMyLocation(position){

  if(!currentUser){
    return;
  }

  const c =
    position.coords;

  const latitude =
    c.latitude;

  const longitude =
    c.longitude;

  const accuracy =
    Number(c.accuracy || 0);

  const speed =
    Number.isFinite(c.speed)
      ? Math.max(0,c.speed)
      : 0;

  const heading =
    Number.isFinite(c.heading)
      ? c.heading
      : null;

  myPosition = {
    latitude,
    longitude,
    accuracy,
    speed,
    heading
  };

  updateMyMarker();

  setStatus(
    "GPS • онлайн",
    true
  );

  /*
    Сохраняем координаты в Supabase.
  */

  const {
    error
  } =
    await supabaseClient
      .from("locations")
      .upsert(
        {
          user_id:currentUser.id,
          latitude,
          longitude,
          accuracy,
          speed,
          heading,
          updated_at:new Date().toISOString()
        },
        {
          onConflict:"user_id"
        }
      );

  if(error){

    console.error(
      "LOCATION SAVE:",
      error
    );

  }
}


function updateMyMarker(){

  if(!myPosition){
    return;
  }

  const lat =
    myPosition.latitude;

  const lng =
    myPosition.longitude;

  if(!myMarker){

    myMarker =
      L.marker(
        [lat,lng],
        {
          icon:userIcon(),
          zIndexOffset:1000
        }
      ).addTo(map);

    myMarker.bindPopup(
      "<b>Ты</b><br>Твоё текущее местоположение."
    );

    map.setView(
      [lat,lng],
      16
    );

  }else{

    myMarker.setLatLng(
      [lat,lng]
    );
  }
}


function userIcon(){

  return L.divIcon({

    className:"",

    html:`
      <div class="user-marker">

        <div class="user-ring"></div>

        <img src="${avatar(
          myProfile?.avatar_url
        )}">

      </div>
    `,

    iconSize:[48,48],
    iconAnchor:[24,24]

  });
}


function startGPS(){

  if(
    !navigator.geolocation
  ){

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;
  }

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );
  }

  setStatus(
    "Получаем GPS…",
    false
  );

  watchId =
    navigator.geolocation.watchPosition(

      updateMyLocation,

      error => {

        console.error(
          "GPS:",
          error
        );

        if(error.code === 1){

          setStatus(
            "Разреши геолокацию",
            false
          );

          toast(
            "Разреши браузеру доступ к геолокации."
          );

        }else{

          setStatus(
            "GPS недоступен",
            false
          );
        }
      },

      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:15000
      }
    );
}

  work:{

  },

  school:{
    name:"Школа",

};


async function loadPlaces(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("saved_places")
      .select("*")
      .eq("user_id",currentUser.id)
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(
      "places:",
      error
    );

    savedPlaces = [];

    return;
  }

  savedPlaces =
    data || [];

  renderPlaces();
}


function renderPlaces(){

  Object.values(placeMarkers)
    .forEach(marker => {

      if(map.hasLayer(marker)){
        map.removeLayer(marker);
      }

    });

  placeMarkers = {};

  savedPlaces.forEach(place => {

    const type =
      placeTypes[place.type] ||
      placeTypes.other;

    const marker =
      L.marker(
        [
          place.latitude,
          place.longitude
        ],
        {
          icon:placeIcon(
            place.type
          ),
          zIndexOffset:500
        }
      ).addTo(map);

    marker.bindPopup(`
      <b>${escapeHtml(place.name)}</b>
      <br>
      ${type.icon} ${type.name}
    `);

    placeMarkers[place.id] =
      marker;
  });
}


function placeIcon(type){

  const data =
    placeTypes[type] ||
    placeTypes.other;

  return L.divIcon({

    className:"",

    html:
      `<div class="place-marker">
        ${data.icon}
      </div>`,

    iconSize:[44,44],
    iconAnchor:[22,22]

  });
}

async function savePlace(

  longitude
){

  const name =
    document.getElementById(
      "placeName"
    ).value.trim();

  const type =
    document.getElementById(
      "placeType"
    ).value;

  if(!name){

    toast(
      "Введи название места."
    );

    return;
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("saved_places")
        .insert({
          user_id:currentUser.id,
          name,
          type,
          latitude,
          longitude
        });

    if(error){
      throw error;
    }

    await loadPlaces();

    closePanel();

    map.setView(
      [latitude,longitude],
      Math.max(
        map.getZoom(),
        16
      )
    );

    toast(
      "Место сохранено."
    );

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Не удалось сохранить место."
    );
  }
}

function focusPlace(id){

    savedPlaces.find(
      p => p.id === id

  closePanel();

  map.setView(

      place.latitude,
      place.longitude

    17
  );

  setTimeout(() => {

    if(placeMarkers[id]){
      placeMarkers[id].openPopup();
    }

  },300);
}

document
  .querySelectorAll(".nav")
  .forEach(button => {

    button.onclick = async () => {

      document
        .querySelectorAll(".nav")
        .forEach(
          b => b.classList.remove("active")
        );

      button.classList.add("active");

      const page =
        button.dataset.page;

      if(page === "map"){

        closePanel();
      }

      if(page === "friends"){

        await showFriends();
      }

      if(page === "profile"){

        showProfile();
      }

      if(page === "settings"){

        showSettings();
      }

    };

  });


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeApp(){

  try{

    document.getElementById(
      "authScreen"
    ).style.display =
      "none";

    await loadProfile();

    await loadFriends();

    await loadIncomingRequests();

    await loadPlaces();

    startGPS();

    subscribeLocations();

    /*
      Периодически обновляем координаты друзей.
      Это дополнительная страховка к Realtime.
    */

    setInterval(
      async () => {

        if(currentUser){

          await loadFriends();

        }

      },
      10000
    );

  }catch(error){

    console.error(
      "BLINK INIT ERROR:",
      error
    );

    document.getElementById(
      "authScreen"
    ).style.display =
      "flex";

    showAuthError(
      "Не удалось загрузить Blink: " +
      (error.message || "неизвестная ошибка")
    );
  }
}


/* =========================================================
   START
========================================================= */

checkAuth();

</script>
