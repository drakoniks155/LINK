<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080808">
  <title>LINK — звонки с видео</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #080808;
      --card: #121212;
      --card2: #191919;
      --text: #fff;
      --muted: #989898;
      --line: #292929;
      --accent: #fff;
      --danger: #ff6178;
      --ok: #70ffad;
      --radius: 18px;
      --shadow: 0 10px 35px rgba(0, 0, 0, .4);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --card: #ffffff;
      --card2: #f0f0f0;
      --text: #000000;
      --muted: #666666;
      --line: #dddddd;
      --accent: #000000;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    button,
    input,
    textarea,
    select {
      font: inherit;
      border: 0;
      outline: none;
    }
    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: none;
    }
    .hidden {
      display: none !important;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: var(--bg);
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .topbar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .brand,
    .status {
      pointer-events: auto;
      background: rgba(10, 10, 10, .88);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(18px);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow);
    }
    .brand {
      font-weight: 1000;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      max-width: 62%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ddd;
      font-size: 12px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      margin-right: 7px;
    }
    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 12px var(--ok);
    }

    .map-actions {
      position: absolute;
      z-index: 1000;
      right: 12px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .round-btn {
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 17px;
      background: rgba(8, 8, 8, .9);
      color: #fff;
      font-size: 20px;
      backdrop-filter: blur(15px);
    }

    .bottom {
      position: absolute;
      z-index: 1000;
      left: 8px;
      right: 8px;
      bottom: 8px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 6px;
      background: rgba(8, 8, 8, .93);
      border: 1px solid rgba(255, 255, 255, .12);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .5);
    }
    .navbtn {
      position: relative;
      border: 0;
      background: transparent;
      color: #969696;
      border-radius: var(--radius);
      padding: 8px 2px;
    }
    .navbtn.active {
      background: #fff;
      color: #000;
    }
    .navicon {
      display: block;
      font-size: 18px;
      line-height: 21px;
    }
    .navtext {
      display: block;
      font-size: 9px;
      font-weight: 900;
    }
    .badge {
      position: absolute;
      top: 3px;
      right: 15%;
      min-width: 17px;
      height: 17px;
      line-height: 17px;
      padding: 0 4px;
      border-radius: 20px;
      background: #ff4862;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
    }

    .panel {
      position: absolute;
      z-index: 3000;
      inset: 0;
      display: flex;
      align-items: flex-end;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(4px);
    }
    .sheet {
      width: 100%;
      max-height: 89dvh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 18px 16px 32px;
      animation: up .22s ease-out;
    }
    @keyframes up {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: none;
        opacity: 1;
      }
    }
    .handle {
      width: 42px;
      height: 4px;
      border-radius: 20px;
      background: #444;
      margin: 0 auto 16px;
    }
    .sheet h2 {
      margin: 4px 0 16px;
      font-size: 22px;
    }
    .close {
      float: right;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 22px;
    }

    .field {
      margin: 11px 0;
    }
    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      border-radius: 14px;
      padding: 13px;
    }
    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }
    .btn {
      border: 0;
      border-radius: 15px;
      padding: 13px 15px;
      background: #fff;
      color: #000;
      font-weight: 900;
    }
    .btn.full {
      width: 100%;
      margin-top: 8px;
    }
    .btn.secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn.danger {
      background: #2b1115;
      color: #ff91a0;
      border: 1px solid #57202b;
    }
    .btn.small {
      padding: 8px 10px;
      border-radius: 11px;
      font-size: 11px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .grow {
      flex: 1;
      min-width: 0;
    }

    .auth {
      position: absolute;
      z-index: 9000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }
    .authbox {
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 25px;
    }
    .logo {
      font-size: 46px;
      font-weight: 1000;
      letter-spacing: -2px;
    }
    .subtitle {
      color: var(--muted);
      margin: 6px 0 20px;
    }
    .auth-status {
      min-height: 22px;
      color: #aaa;
      font-size: 13px;
      margin-top: 12px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      flex: none;
      object-fit: cover;
      border-radius: 50%;
      background: var(--card2);
      border: 2px solid var(--accent);
    }
    .avatar.small {
      width: 48px;
      height: 48px;
      border-width: 1px;
    }
    .avatar.tiny {
      width: 28px;
      height: 28px;
      border-width: 1px;
    }
    .avatar.large {
      width: 80px;
      height: 80px;
      border-width: 3px;
    }

    .friend,
    .request,
    .chat-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .friend-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .code {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }
    .empty {
      padding: 35px 10px;
      color: var(--muted);
      text-align: center;
    }
    .section-title {
      margin: 20px 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .online-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 6px;
      border-radius: 50%;
      background: #777;
    }
    .online-status.online {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .leaflet-control-attribution {
      font-size: 8px !important;
    }
    .user-pin,
    .friend-pin {
      background: transparent;
      border: 0;
    }
    .pin {
      position: relative;
      width: 48px;
      height: 48px;
      overflow: visible;
    }
    .pin img {
      position: relative;
      z-index: 2;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card2);
      border: 3px solid #fff;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .55);
    }
    .pin .ring {
      position: absolute;
      z-index: 1;
      inset: -8px;
      border: 2px solid rgba(255, 255, 255, .8);
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      50% {
        transform: scale(1.2);
        opacity: .15;
      }
    }

    .toast {
      position: absolute;
      z-index: 12000;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 11px 15px;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .5);
    }

    .reaction-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .reaction-choice {
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card2);
      color: var(--text);
      font-size: 29px;
    }
    .reaction-choice.selected,
    .reaction-choice:active {
      background: #fff;
      color: #000;
      transform: scale(.95);
    }
    .reaction-info {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .chat-preview {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 190px;
    }
    .chat-unread {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 20px;
      background: #fff;
      color: #000;
      font-size: 10px;
      font-weight: 1000;
    }

    .chat-page {
      position: absolute;
      z-index: 4500;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
      background: rgba(8, 8, 8, .96);
    }
    .chat-back {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 23px;
    }
    .chat-title {
      min-width: 0;
      flex: 1;
    }
    .chat-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 1000;
    }
    .chat-status {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }
    .chat-actions {
      display: flex;
      gap: 6px;
    }
    .chat-action-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--card2);
      color: var(--text);
      font-size: 18px;
    }
    .chat-action-btn.primary {
      background: #fff;
      color: #000;
    }
    .messages {
      flex: 1;
      overflow: auto;
      padding: 16px 12px 120px;
    }
    .message-row {
      display: flex;
      margin: 7px 0;
    }
    .message-row.mine {
      justify-content: flex-end;
    }
    .message-row.theirs {
      justify-content: flex-start;
    }
    .message {
      position: relative;
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 18px;
      background: var(--card2);
      word-break: break-word;
      font-size: 14px;
      line-height: 1.35;
    }
    .message.mine {
      background: #fff;
      color: #000;
      border-bottom-right-radius: 5px;
    }
    .message.theirs {
      border-bottom-left-radius: 5px;
    }
    .message-time {
      margin-top: 4px;
      font-size: 9px;
      opacity: .55;
      text-align: right;
    }
    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .message-reaction {
      border: 0;
      border-radius: 999px;
      padding: 4px 7px;
      background: var(--card2);
      color: var(--text);
      font-size: 12px;
    }
    .message.mine .message-reaction {
      background: #ddd;
      color: #000;
    }

    .chat-reaction-bar {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 73px;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 7px;
      max-width: 94vw;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 10px 35px #000;
    }
    .quick-reaction {
      width: 42px;
      height: 42px;
      flex: none;
      border: 0;
      border-radius: 14px;
      background: var(--card2);
      color: var(--text);
      font-size: 21px;
    }
    .quick-reaction.recording {
      background: #ff4444;
      color: #fff;
      animation: pulse-rec 0.8s infinite;
    }
    @keyframes pulse-rec {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    .chat-input-area {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 7px;
      align-items: flex-end;
      padding: 10px 10px max(10px, env(safe-area-inset-bottom));
      background: rgba(8, 8, 8, .96);
      border-top: 1px solid var(--line);
    }
    .chat-input {
      min-height: 48px;
      max-height: 100px;
      resize: none;
      flex: 1;
      border-radius: 20px;
      padding: 13px 15px;
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .send-message {
      width: 48px;
      height: 48px;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 18px;
    }
    .typing {
      position: absolute;
      left: 15px;
      bottom: 116px;
      color: var(--muted);
      font-size: 11px;
    }

    .voice-message {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--card2);
      border-radius: 12px;
      min-width: 140px;
    }
    .voice-message.mine {
      background: #e0e0e0;
    }
    .voice-play {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 14px;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice-timeline {
      flex: 1;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .voice-timeline .progress {
      height: 100%;
      background: var(--ok);
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s;
    }
    .voice-time {
      font-size: 10px;
      color: var(--muted);
      flex: none;
      min-width: 32px;
      text-align: center;
    }

    .recording-indicator {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.9);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulse-rec 0.8s infinite;
    }
    .recording-indicator .dot-rec {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
    }

    .sticker-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
    }
    .sticker {
      font-size: 38px;
      padding: 6px;
      border-radius: 12px;
      background: var(--card2);
      border: 1px solid var(--line);
      transition: transform .15s;
    }
    .sticker:active {
      transform: scale(.9);
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      flex: none;
      border: 0;
      border-radius: 20px;
      background: #333;
    }
    .toggle i {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: .2s;
    }
    .toggle.on {
      background: #fff;
    }
    .toggle.on i {
      left: 23px;
      background: #000;
    }
    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ===== CALL UI ===== */
    .call-overlay {
      position: fixed;
      z-index: 20000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(24px);
      animation: callIn 0.4s ease;
    }
    @keyframes callIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .call-card {
      text-align: center;
      padding: 30px 24px 40px;
      max-width: 400px;
      width: 100%;
    }
    .call-card .avatar.large {
      width: 100px;
      height: 100px;
      border-width: 4px;
      border-color: #fff;
      margin-bottom: 12px;
    }
    .call-card .call-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .call-card .call-status {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .call-card .call-status.incoming {
      color: #70ffad;
      animation: callPulse 1s infinite;
    }
    .call-card .call-status.ringing {
      color: #ffd93d;
      animation: callPulse 0.8s infinite;
    }
    @keyframes callPulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    .call-actions {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }
    .call-actions .btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
    }
    .call-actions .btn-accept {
      background: #34c759;
      color: #fff;
      box-shadow: 0 4px 20px rgba(52, 199, 89, 0.4);
    }
    .call-actions .btn-accept:hover {
      transform: scale(1.05);
    }
    .call-actions .btn-reject {
      background: #ff3b30;
      color: #fff;
      box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
    }
    .call-actions .btn-reject:hover {
      transform: scale(1.05);
    }
    .call-actions .btn-end {
      background: #ff3b30;
      color: #fff;
      box-shadow: 0 4px 20px rgba(255, 59, 48, 0.4);
    }
    .call-actions .btn-mute {
      background: var(--card2);
      color: var(--text);
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .call-actions .btn-mute.active {
      background: #ff3b30;
      color: #fff;
    }

    .call-timer {
      font-size: 16px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 12px;
    }

    /* Video call - picture in picture */
    .call-video-container {
      position: fixed;
      z-index: 20001;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .call-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .call-video-container .local-video {

      bottom: 100px;
      right: 20px;
      width: 120px;
      height: 160px;

      align-items: center;
      justify-content: center;
      border: 0;

    .call-video-container .call-controls .btn-end {

      color: #fff;
    }
    .call-video-container .call-controls .btn-mute {

    .call-video-container .call-controls .btn-mute.active {

    .call-video-container .call-controls .btn-switch {

    .call-notification {
      position: fixed;
      z-index: 15000;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;

    .call-notification .call-info {

    .call-notification .call-info .name {

    .call-notification .call-info .type {

    .call-notification .call-btns {

    .call-notification .call-btns .btn {

      height: 44px;

    .call-notification .call-btns .btn-accept {

      color: #fff;

    .call-notification .call-btns .btn-reject {
      background: #ff3b30;
      color: #fff;

    /* Call status overlay on video */
    .call-status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-align: center;
      color: #fff;
    }
    .call-status-overlay .big-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 16px;

    .call-status-overlay .status-text {
      font-size: 18px;
      font-weight: 600;
      opacity: 0.8;
    }
    .call-status-overlay .status-sub {
      font-size: 14px;
      opacity: 0.5;
      margin-top: 4px;
    }

    @media(min-width:700px) {
      .bottom {
        left: 50%;
        right: auto;
        width: 600px;
        transform: translateX(-50%);
      }
      .panel {
        align-items: center;
        justify-content: center;

      .sheet {

        border: 1px solid var(--line);
        border-radius: 28px;

        transform: translateX(-50%);
        border-left: 1px solid var(--line);
        border-right: 1px var(--line);

      .call-video-container .local-video {
        width: 180px;
        height: 240px;

  </style>
</head>
<body>

  <div id="app">
    <div id="map"></div>

    <div class="topbar">
      <div class="brand"><span>LINK</span><span id="themeToggle" style="font-size:16px;cursor:pointer;">🌙</span></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Подключение…</span></div>
    </div>

    <div class="map-actions">
      <button class="round-btn" id="centerMeBtn">⌖</button>
      <button class="round-btn" id="showAllBtn">⊙</button>
    </div>

    <nav class="bottom">
      <button class="navbtn active" data-page="map"><span class="navicon">🗺️</span><span class="navtext">Карта</span></button>
      <button class="navbtn" data-page="friends"><span class="navicon">👥</span><span class="navtext">Друзья</span><span id="requestBadge" class="badge hidden">0</span></button>
      <button class="navbtn" data-page="chats"><span class="navicon">💬</span><span class="navtext">Чаты</span><span id="chatBadge" class="badge hidden">0</span></button>
      <button class="navbtn" data-page="profile"><span class="navicon">👤</span><span class="navtext">Профиль</span></button>
      <button class="navbtn" data-page="settings"><span class="navicon">⚙️</span><span class="navtext">Настройки</span></button>
      <button class="navbtn" data-page="more"><span class="navicon">➕</span><span class="navtext">Ещё</span></button>
    </nav>

    <div id="panel" class="panel hidden"><div id="sheet" class="sheet"></div></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <div id="reactionOverlay"></div>

  <div id="auth" class="auth">
    <div class="authbox">
      <div class="logo">LINK</div>
      <div class="subtitle">Друзья рядом. Карта. Чаты. Видеозвонки.</div>
      <button id="startBtn" class="btn full">Начать</button>
      <div id="authStatus" class="auth-status">Подключаем Firebase…</div>
      <div class="note">Аккаунт создаётся автоматически.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { getDatabase, ref, get, set, update, remove, push, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACo_xpctW1MDfaGO_bmDzXfFhb4KfwV2w",
      authDomain: "link-69afb.firebaseapp.com",
      databaseURL: "https://link-69afb-default-rtdb.firebaseio.com",
      projectId: "link-69afb",
      storageBucket: "link-69afb.firebasestorage.app",
      messagingSenderId: "488681419482",
      appId: "1:488681419482:web:9c4cd030e20137a4946be3",
      measurementId: "G-6T5XDS5W43"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const $ = id => document.getElementById(id);

    // ===== VARIABLES =====
    let user = null;
    let profile = null;
    let map = null;
    let meMarker = null;
    let friendMarkers = new Map();
    let friendLocationListeners = new Map();
    let friends = {};
    let incomingRequests = {};
    let incomingReactions = {};
    let chatMeta = {};
    let chatUnsubscribers = new Map();
    let watchId = null;
    let lastPosition = null;
    let locationSharing = true;
    let currentPage = "map";
    let profileUnsubscribe = null;
    let friendsUnsubscribe = null;
    let requestsUnsubscribe = null;
    let reactionsUnsubscribe = null;
    let chatsUnsubscribe = null;
    let selectedReaction = "❤️";
    let currentChatFriendId = null;
    let currentChatId = null;
    let typingTimer = null;
    let typingStopTimer = null;
    let isDarkTheme = true;

    // ===== CALL VARIABLES =====
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let callData = null;
    let callTimer = null;
    let callSeconds = 0;
    let isCallActive = false;
    let isMuted = false;
    let isVideoCall = false;
    let callSubscriptions = [];
    let currentCallId = null;
    let isLocalVideoVisible = true;

    // ===== VOICE RECORDING =====
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingTimer = null;
    let recordingSeconds = 0;
    let recordingStartTime = 0;
    let stream = null;

    const REACTIONS = ["❤️", "🔥", "😂", "🎉", "😱", "⚡", "👋", "😎", "💀", "🥳", "💯", "✨"];
    const STICKERS = ["😊", "😂", "🥰", "😍", "🤩", "😎", "🤔", "😏", "😅", "🤗", "😇", "🤪", "🥳", "😭", "😤", "🤯"];

    // STUN servers for WebRTC
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" },
        { urls: "stun:stun3.l.google.com:19302" }
      ]
    };

    // ===== MAP =====
    function initMap() {
      map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);
    }

    // ===== HELPERS =====
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }

    function defaultAvatar(name = "") {
      const letter = String(name || "?").trim().slice(0, 1).toUpperCase() || "?";
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" fill="#242424"/><text x="80" y="105" text-anchor="middle" font-family="Arial" font-size="72" fill="white">${letter}</text></svg>`
      );
    }

    function avatarUrl(p) {
      return p?.avatar || defaultAvatar(p?.name || "?");
    }

    function setStatus(text, live = false) {
      $("statusText").textContent = text;
      $("statusDot").classList.toggle("live", !!live);
    }

    function toast(text) {
      $("toast").textContent = text;
      $("toast").classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 2800);
    }

    function openPanel(html) {
      $("sheet").innerHTML = `<div class="handle"></div>${html}`;
      $("panel").classList.remove("hidden");
    }

    function closePanel() { $("panel").classList.add("hidden"); }
    window.closePanel = closePanel;
    $("panel").onclick = e => { if (e.target === $("panel")) closePanel(); };

    function formatTime(timestamp) {
      if (!timestamp) return "";
      try { return new Date(timestamp).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
    }

    function formatDuration(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m > 0 ? `${m}:${s.toString().padStart(2, "0")}` : `${s}s`;
    }

    function friendlyError(error) {
      const code = error?.code || "";
      if (code.includes("auth/operation-not-allowed")) return "В Firebase не включён Anonymous Authentication.";
      if (code.includes("permission-denied")) return "Firebase отклонил доступ. Проверь Database Rules.";
      if (code.includes("network-request-failed")) return "Нет подключения к интернету.";
      return error?.message || "Неизвестная ошибка";
    }

    function getChatId(uid1, uid2) {
      return [uid1, uid2].sort().join("_");
    }

    function playCallSound() {
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 300]);
      }
    }

    // ===== NAVIGATION =====
    document.querySelectorAll(".navbtn").forEach(btn => {
      btn.onclick = () => openPage(btn.dataset.page);
    });

    function openPage(page) {
      currentPage = page;
      document.querySelectorAll(".navbtn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });
      if (page === "map") { closePanel();
        setTimeout(() => map.invalidateSize(), 100); }
      if (page === "friends") renderFriends();
      if (page === "chats") renderChats();
      if (page === "profile") renderProfile();
      if (page === "settings") renderSettings();
      if (page === "more") renderMore();
    }

    // ===== MAP MARKERS =====
    function markerIcon(p, isMe = false) {
      return L.divIcon({
        className: isMe ? "user-pin" : "friend-pin",
        html: `<div class="pin">${isMe ? '<div class="ring"></div>' : ""}<img src="${avatarUrl(p)}"></div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      });
    }

    function renderMeMarker() {
      if (!lastPosition || !profile) return;
      const pos = [lastPosition.lat, lastPosition.lng];
      if (!meMarker) {
        meMarker = L.marker(pos, { icon: markerIcon(profile, true), zIndexOffset: 1000 }).addTo(map);
        meMarker.bindPopup("<b>Ты</b>");
      } else {
        meMarker.setLatLng(pos);
        meMarker.setIcon(markerIcon(profile, true));
      }
    }

    function upsertFriendMarker(friendId, friendProfile, location) {
      const lat = Number(location.lat);
      const lng = Number(location.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
      if (!friendMarkers.has(friendId)) {
        const marker = L.marker([lat, lng], { icon: markerIcon(friendProfile), zIndexOffset: 500 }).addTo(map);
        marker.on("click", () => openFriendReactionPanel(friendId));
        friendMarkers.set(friendId, marker);
      } else {
        const marker = friendMarkers.get(friendId);
        marker.setLatLng([lat, lng]);
        marker.setIcon(markerIcon(friendProfile));
      }
    }

    function removeFriendMarker(friendId, unsubscribe = true) {
      const marker = friendMarkers.get(friendId);
      if (marker) { map.removeLayer(marker);
        friendMarkers.delete(friendId); }
      if (unsubscribe && friendLocationListeners.has(friendId)) {
        friendLocationListeners.get(friendId)();
        friendLocationListeners.delete(friendId);
      }
    }

    $("centerMeBtn").onclick = () => {
      if (!lastPosition) { toast("Геолокация ещё не получена."); return; }
      map.setView([lastPosition.lat, lastPosition.lng], 17);
    };

    $("showAllBtn").onclick = () => {
      const markers = [meMarker, ...friendMarkers.values()].filter(Boolean);
      if (!markers.length) { toast("Нет активных пользователей."); return; }
      map.fitBounds(L.featureGroup(markers).getBounds(), { padding: [60, 60] });
    };

    // ===== AUTH =====
    $("startBtn").onclick = async () => {
      $("startBtn").disabled = true;
      try {
        $("authStatus").textContent = "Входим в LINK…";
        await signInAnonymously(auth);
      } catch (error) {
        console.error(error);
        $("authStatus").textContent = "Ошибка: " + friendlyError(error);
        $("startBtn").disabled = false;
      }
    };

    onAuthStateChanged(auth, async firebaseUser => {
      if (!firebaseUser) return;
      if (user?.uid === firebaseUser.uid) return;
      try {
        user = firebaseUser;
        $("authStatus").textContent = "Создаём профиль…";
        await ensureProfile();
        $("auth").classList.add("hidden");
        subscribeProfile();
        subscribeFriends();
        subscribeIncomingRequests();
        subscribeIncomingReactions();
        subscribeChats();
        subscribeCalls();

        if (profile.locationSharing !== false) {
          locationSharing = true;
          startLocation();
        } else {
          locationSharing = false;
          setStatus("Геолокация выключена", false);
        }
        setStatus("LINK подключён", true);
      } catch (error) {
        console.error(error);
        $("authStatus").textContent = "Ошибка: " + friendlyError(error);
        $("auth").classList.remove("hidden");
        $("startBtn").disabled = false;
      }
    });

    // ===== PROFILE =====
    async function ensureProfile() {
      const profileRef = ref(db, `profiles/${user.uid}`);
      const snap = await get(profileRef);
      if (!snap.exists()) {
        const code = await createUniqueFriendCode();
        profile = {
          name: `LINK ${Math.floor(100 + Math.random() * 900)}`,
          friendCode: code,
          avatar: "",
          locationSharing: true,
          createdAt: Date.now(),
          lastActive: Date.now()
        };
        await update(ref(db), {
          [`profiles/${user.uid}`]: profile,
          [`friendCodes/${code}`]: user.uid
        });
      } else {
        profile = snap.val();
        if (!profile.friendCode) {
          const code = await createUniqueFriendCode();
          await update(ref(db), {
            [`profiles/${user.uid}/friendCode`]: code,
            [`friendCodes/${code}`]: user.uid
          });
          profile.friendCode = code;
        }
        await update(profileRef, { lastActive: Date.now() });
      }
    }

    async function createUniqueFriendCode() {
      for (let i = 0; i < 30; i++) {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        const snap = await get(ref(db, `friendCodes/${code}`));
        if (!snap.exists()) return code;
      }
      throw new Error("Не удалось создать свободный код.");
    }

    function subscribeProfile() {
      if (profileUnsubscribe) profileUnsubscribe();
      profileUnsubscribe = onValue(ref(db, `profiles/${user.uid}`), snap => {
        if (!snap.exists()) return;
        profile = snap.val();
        renderMeMarker();
        if (currentPage === "profile") renderProfile();
      });
    }

    // ===== FRIENDS =====
    function subscribeFriends() {
      if (friendsUnsubscribe) friendsUnsubscribe();
      friendsUnsubscribe = onValue(ref(db, `friends/${user.uid}`), snap => {
        const next = snap.val() || {};
        for (const id of Object.keys(friends)) {
          if (!next[id]) removeFriendMarker(id);
        }
        friends = next;
        Object.keys(friends).forEach(subscribeFriendLocation);
        if (currentPage === "friends") renderFriends();
        if (currentPage === "chats") renderChats();
      });
    }

    function subscribeFriendLocation(friendId) {
      if (friendLocationListeners.has(friendId)) return;
      const unsubscribe = onValue(ref(db, `locations/${friendId}`), async snap => {
        const location = snap.val();
        if (!location) { removeFriendMarker(friendId, false); return; }
        if (Date.now() - location.updatedAt > 5 * 60 * 1000) { removeFriendMarker(friendId, false); return; }
        const profileSnap = await get(ref(db, `profiles/${friendId}`));
        if (!profileSnap.exists()) return;
        upsertFriendMarker(friendId, profileSnap.val(), location);
      });
      friendLocationListeners.set(friendId, unsubscribe);
    }

    // ===== FRIEND REQUESTS =====
    function subscribeIncomingRequests() {
      if (requestsUnsubscribe) requestsUnsubscribe();
      requestsUnsubscribe = onValue(ref(db, `friendRequests/${user.uid}`), snap => {
        incomingRequests = snap.val() || {};
        const count = Object.keys(incomingRequests).length;
        $("requestBadge").textContent = count;
        $("requestBadge").classList.toggle("hidden", count === 0);
        if (currentPage === "friends") renderFriends();
      });
    }

    function renderFriends() {
      const requestIds = Object.keys(incomingRequests);
      const friendIds = Object.keys(friends);

      const requestsHtml = requestIds.length ? `
        <div class="section-title">Входящие заявки</div>
        ${requestIds.map(uid => {
          const p = incomingRequests[uid]?.profile || {};
          return `<div class="request">
            <img class="avatar small" src="${avatarUrl(p)}">
            <div class="grow"><b>${escapeHtml(p.name || "Пользователь")}</b><div class="code">Хочет добавить тебя в друзья</div></div>
            <button class="btn small" onclick="acceptRequest('${uid}')">✓</button>
            <button class="btn small secondary" onclick="rejectRequest('${uid}')">×</button>
          </div>`;
        }).join("")}
      ` : "";

      const friendsHtml = friendIds.length ? `
        <div class="section-title">Мои друзья</div>
        ${friendIds.map(uid => {
          const p = friends[uid]?.profile || {};
          const online = friendMarkers.has(uid);
          return `<div class="friend">
            <img class="avatar small" src="${avatarUrl(p)}">
            <div class="grow"><b>${escapeHtml(p.name || "Друг")}</b><div class="code">#${escapeHtml(p.friendCode || "")} <span class="online-status ${online ? "online" : ""}"></span></div></div>
            <div class="friend-actions">
              <button class="btn small" onclick="openChat('${uid}')">💬</button>
              <button class="btn small secondary" onclick="openFriendReactionPanel('${uid}')">💜</button>
              <button class="btn small danger" onclick="removeFriend('${uid}')">×</button>
            </div>
          </div>`;
        }).join("")}
      ` : `<div class="empty">Пока нет друзей.<br>Добавь друга по коду!</div>`;

      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Друзья</h2>
        <div class="field">
          <label>Добавить друга по 4-значному коду</label>
          <div class="row">
            <input id="friendCodeInput" maxlength="4" inputmode="numeric" placeholder="1234">
            <button id="sendRequestBtn" class="btn">Добавить</button>
          </div>
        </div>
        ${requestsHtml}
        ${friendsHtml}
      `);

      $("sendRequestBtn").onclick = sendFriendRequest;
    }

    async function sendFriendRequest() {
      const code = $("friendCodeInput").value.replace(/\D/g, "").slice(0, 4);
      if (!/^\d{4}$/.test(code)) { toast("Введи 4 цифры."); return; }
      const codeSnap = await get(ref(db, `friendCodes/${code}`));
      if (!codeSnap.exists()) { toast("Пользователь не найден."); return; }
      const targetUid = codeSnap.val();
      if (targetUid === user.uid) { toast("Нельзя добавить себя."); return; }
      const existing = await get(ref(db, `friends/${user.uid}/${targetUid}`));
      if (existing.exists()) { toast("Этот пользователь уже твой друг."); return; }
      await set(ref(db, `friendRequests/${targetUid}/${user.uid}`), {
        fromUid: user.uid,
        createdAt: Date.now(),
        profile: { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" }
      });
      toast("Заявка отправлена ✨");
    }

    window.acceptRequest = async fromUid => {
      const req = incomingRequests[fromUid];
      if (!req) return;
      const fromProfile = req.profile || {};
      const myProfile = { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" };
      const chatId = getChatId(user.uid, fromUid);
      await update(ref(db), {
        [`friends/${user.uid}/${fromUid}`]: { since: Date.now(), profile: fromProfile },
        [`friends/${fromUid}/${user.uid}`]: { since: Date.now(), profile: myProfile },
        [`friendRequests/${user.uid}/${fromUid}`]: null,
        [`chats/${chatId}/participants/${user.uid}`]: true,
        [`chats/${chatId}/participants/${fromUid}`]: true,
        [`userChats/${user.uid}/${chatId}`]: { friendUid: fromUid, friendProfile: fromProfile, updatedAt: Date.now() },
        [`userChats/${fromUid}/${chatId}`]: { friendUid: user.uid, friendProfile: myProfile, updatedAt: Date.now() }
      });
      toast("Друг добавлен 🎉");
    };

    window.rejectRequest = async fromUid => {
      await remove(ref(db, `friendRequests/${user.uid}/${fromUid}`));
      toast("Заявка отклонена.");
    };

    window.removeFriend = async friendUid => {
      if (!confirm("Удалить друга?")) return;
      await update(ref(db), {
        [`friends/${user.uid}/${friendUid}`]: null,
        [`friends/${friendUid}/${user.uid}`]: null
      });
      toast("Друг удалён.");
    };

    // ===== GEOLOCATION =====
    function startLocation() {
      if (!navigator.geolocation) { toast("Геолокация не поддерживается."); return; }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = navigator.geolocation.watchPosition(
        async pos => {
          lastPosition = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy || 0,
            updatedAt: Date.now()
          };
          renderMeMarker();
          await set(ref(db, `locations/${user.uid}`), lastPosition);
          setStatus("Геолокация в реальном времени", true);
        },
        error => {
          if (error.code === 1) setStatus("Разреши геолокацию", false);
          else setStatus("GPS временно недоступен", false);
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
      );
    }

    // ===== WEBRTC CALLS =====
    async function getMediaStream(video = false) {
      try {
        const constraints = {
          audio: true,
          video: video ? {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          } : false
        };
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (e) {
        console.error("Media error:", e);
        toast("Нет доступа к камере/микрофону");
        throw e;
      }
    }

    async function createPeerConnection() {
      const pc = new RTCPeerConnection(RTC_CONFIG);

      // Add local tracks
      if (localStream) {
        localStream.getTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
      }

      // Handle remote stream
      pc.ontrack = (event) => {
        remoteStream = event.streams[0];
        showRemoteStream(remoteStream);
        if (!isCallActive) {
          isCallActive = true;
          startCallTimer();
          updateCallUI("active");
        }
      };

      // ICE connection state
      pc.oniceconnectionstatechange = () => {
        console.log("ICE state:", pc.iceConnectionState);
        if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
          toast("Соединение потеряно");
          endCall();
        }
      };

      pc.onconnectionstatechange = () => {
        console.log("Connection state:", pc.connectionState);
        if (pc.connectionState === "connected") {
          toast("Соединение установлено!");
        }
      };

      return pc;
    }

    function showRemoteStream(stream) {
      const container = document.getElementById("callVideoContainer");
      if (container) {
        let remoteVideo = container.querySelector(".remote-video");
        if (!remoteVideo) {
          remoteVideo = document.createElement("video");
          remoteVideo.className = "remote-video";
          remoteVideo.autoplay = true;
          remoteVideo.playsInline = true;
          container.prepend(remoteVideo);
        }
        remoteVideo.srcObject = stream;
        console.log("Remote stream attached");
      }

      // Hide status overlay
      const overlay = document.querySelector(".call-status-overlay");
      if (overlay) overlay.style.display = "none";
    }

    function showLocalVideo(stream) {
      const container = document.getElementById("callVideoContainer");
      if (container && stream) {
        let localVideo = container.querySelector(".local-video");
        if (!localVideo) {
          localVideo = document.createElement("video");
          localVideo.className = "local-video";
          localVideo.autoplay = true;
          localVideo.playsInline = true;
          localVideo.muted = true;
          container.appendChild(localVideo);
        }
        localVideo.srcObject = stream;
        localVideo.classList.remove("hidden-video");
        console.log("Local video attached");
      }
    }

    // ===== MAKE CALL =====
    async function makeCall(friendUid, video = false) {
      if (isCallActive) { toast("Уже в вызове"); return; }
      if (!friends[friendUid]) { toast("Друг не найден"); return; }

      try {
        // Get local media
        localStream = await getMediaStream(video);
        isVideoCall = video;

        // Create peer connection
        peerConnection = await createPeerConnection();

        // Show local video if video call
        if (video) {
          showLocalVideo(localStream);
        }

        // Create offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        // Save call to Firebase
        const callId = push(ref(db, `calls/${friendUid}`)).key;
        currentCallId = callId;

        const call = {
          from: user.uid,
          to: friendUid,
          type: video ? "video" : "audio",
          status: "ringing",
          offer: JSON.stringify(offer),
          startedAt: Date.now(),
          fromName: profile.name,
          fromAvatar: profile.avatar || ""
        };

        await set(ref(db, `calls/${friendUid}/${callId}`), call);
        await set(ref(db, `calls/${user.uid}/${callId}`), {
          ...call,
          to: friendUid,
          toName: friends[friendUid].profile.name,
          toAvatar: friends[friendUid].profile.avatar || ""
        });

        toast(`📞 Вызов ${friends[friendUid].profile.name}...`);

        // Show call UI
        if (video) {
          showVideoCallUI(callId, call, friends[friendUid].profile, "outgoing");
        } else {
          showCallUI(callId, call, friends[friendUid].profile, "outgoing");
        }

        // Listen for answer
        const callRef = ref(db, `calls/${friendUid}/${callId}`);
        const unsubscribe = onValue(callRef, async snap => {
          const data = snap.val();
          if (!data) return;

          if (data.status === "active" && data.answer) {
            // Remote answered
            const answer = JSON.parse(data.answer);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            isCallActive = true;
            startCallTimer();
            updateCallUI("active");
            if (video) updateVideoCallUI("active");
            unsubscribe();
            toast("Собеседник ответил!");
          }

          if (data.status === "rejected" || data.status === "ended") {
            endCall();
            unsubscribe();
          }
        });
        callSubscriptions.push(unsubscribe);

        // Auto-end after 60 seconds
        setTimeout(() => {
          if (!isCallActive && document.getElementById("callOverlay")) {
            endCall();
            toast("Вызов не отвечен");
          }
        }, 60000);

      } catch (e) {
        console.error(e);
        toast("Ошибка вызова: " + e.message);
        cleanupCall();
      }
    }

    // ===== ANSWER CALL =====
    async function answerCall(callId, call) {
      try {
        const video = call.type === "video";
        isVideoCall = video;

        // Get local media
        localStream = await getMediaStream(video);

        // Create peer connection
        peerConnection = await createPeerConnection();

        // Show local video if video call
        if (video) {
          showLocalVideo(localStream);
        }

        // Set remote offer
        const offer = JSON.parse(call.offer);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

        // Create answer
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        // Send answer
        await update(ref(db), {
          [`calls/${user.uid}/${callId}/status`]: "active",
          [`calls/${user.uid}/${callId}/answer`]: JSON.stringify(answer),
          [`calls/${call.from}/${callId}/status`]: "active",
          [`calls/${call.from}/${callId}/answer`]: JSON.stringify(answer)
        });

        isCallActive = true;
        startCallTimer();
        if (video) updateVideoCallUI("active");
        toast("Вызов принят 🎉");

        // Cleanup notification and overlay
        document.getElementById("callNotification")?.remove();
        const overlay = document.getElementById("callOverlay");
        if (overlay) overlay.style.display = "none";

      } catch (e) {
        console.error(e);
        toast("Ошибка ответа: " + e.message);
        cleanupCall();
      }
    }

    // ===== REJECT CALL =====
    async function rejectCall(callId, call) {
      await update(ref(db), {
        [`calls/${user.uid}/${callId}/status`]: "rejected",
        [`calls/${call.from}/${callId}/status`]: "rejected"
      });
      toast("Вызов отклонён");
      cleanupCall();
    }

    // ===== END CALL =====
    async function endCall() {
      if (currentCallId) {
        try {
          const snap = await get(ref(db, `calls/${user.uid}/${currentCallId}`));
          const call = snap.val();
          if (call?.to) {
            await update(ref(db), {
              [`calls/${call.to}/${currentCallId}/status`]: "ended"
            });
          }
          await update(ref(db), {
            [`calls/${user.uid}/${currentCallId}/status`]: "ended"
          });
        } catch (e) {}
      }
      cleanupCall();
      toast("Вызов завершён");
    }

    function cleanupCall() {
      isCallActive = false;
      clearInterval(callTimer);
      callSeconds = 0;

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      remoteStream = null;

      document.getElementById("callOverlay")?.remove();
      document.getElementById("callVideoContainer")?.remove();
      document.getElementById("callNotification")?.remove();

      currentCallId = null;
      isVideoCall = false;
      isMuted = false;
    }

    function startCallTimer() {
      callSeconds = 0;
      clearInterval(callTimer);
      callTimer = setInterval(() => {
        callSeconds++;
        const display = document.getElementById("callTimerDisplay");
        if (display) display.textContent = formatDuration(callSeconds);
      }, 1000);
    }

    function updateCallUI(status) {
      const overlay = document.getElementById("callOverlay");
      if (!overlay) return;

      const statusEl = overlay.querySelector(".call-status");
      if (statusEl) {
        if (status === "active") {
          statusEl.textContent = "🟢 В разговоре";
          statusEl.className = "call-status";
        }
      }

      const actions = overlay.querySelector(".call-actions");
      if (actions) {
        actions.innerHTML = `
          <button class="btn btn-mute ${isMuted ? 'active' : ''}" id="callMuteBtn">${isMuted ? '🔇' : '🔊'}</button>
          <button class="btn btn-end" id="callEndBtn">⏹</button>
        `;
        document.getElementById("callEndBtn").onclick = endCall;
        document.getElementById("callMuteBtn").onclick = toggleMute;
      }
    }

    function updateVideoCallUI(status) {
      const container = document.getElementById("callVideoContainer");
      if (!container) return;

      // Update controls
      const controls = container.querySelector(".call-controls");
      if (controls) {
        controls.innerHTML = `
          <button class="btn btn-mute ${isMuted ? 'active' : ''}" id="videoMuteBtn">${isMuted ? '🔇' : '🔊'}</button>
          <button class="btn btn-switch" id="switchCameraBtn">🔄</button>
          <button class="btn btn-end" id="videoEndBtn">⏹</button>
        `;
        document.getElementById("videoEndBtn").onclick = endCall;
        document.getElementById("videoMuteBtn").onclick = toggleMute;
        document.getElementById("switchCameraBtn").onclick = switchCamera;
      }

      // Hide status overlay
      const overlay = container.querySelector(".call-status-overlay");
      if (overlay) overlay.style.display = "none";
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          track.enabled = !isMuted;
        });
      }
      const muteBtns = document.querySelectorAll(".btn-mute");
      muteBtns.forEach(btn => {
        btn.classList.toggle("active", isMuted);
        btn.textContent = isMuted ? "🔇" : "🔊";
      });
      toast(isMuted ? "Микрофон выключен" : "Микрофон включён");
    }

    async function switchCamera() {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (!videoTrack) return;

      const currentFacing = videoTrack.getSettings().facingMode || "user";
      const newFacing = currentFacing === "user" ? "environment" : "user";

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: { facingMode: newFacing }
        });

        // Replace video track
        const newVideoTrack = newStream.getVideoTracks()[0];
        const oldVideoTrack = localStream.getVideoTracks()[0];
        localStream.removeTrack(oldVideoTrack);
        localStream.addTrack(newVideoTrack);

        // Update peer connection
        if (peerConnection) {
          const senders = peerConnection.getSenders();
          for (const sender of senders) {
            if (sender.track?.kind === "video") {
              sender.replaceTrack(newVideoTrack);
            }
          }
        }

        // Update local video
        const localVideo = document.querySelector(".local-video");
        if (localVideo) {
          localVideo.srcObject = localStream;
        }

        oldVideoTrack.stop();
        toast("Камера переключена");

      } catch (e) {
        console.error(e);
        toast("Не удалось переключить камеру");
      }
    }

    // ===== SHOW CALL UI =====
    function showCallUI(callId, call, friendProfile, mode = "incoming") {
      const existing = document.getElementById("callOverlay");
      if (existing) existing.remove();

      const overlay = document.createElement("div");
      overlay.id = "callOverlay";
      overlay.className = "call-overlay";

      const statusText = mode === "incoming" ? "📞 Входящий вызов..." : "🔴 Вызов...";

      overlay.innerHTML = `
        <div class="call-card">
          <img class="avatar large" src="${avatarUrl(friendProfile)}">
          <div class="call-name">${escapeHtml(friendProfile.name || "Друг")}</div>
          <div class="call-status ${mode === "incoming" ? "incoming" : "ringing"}">${statusText}</div>
          <div class="call-timer" id="callTimerDisplay">${formatDuration(0)}</div>
          <div class="call-actions">
            ${mode === "incoming" ? `
              <button class="btn btn-accept" id="callAcceptBtn">✓</button>
              <button class="btn btn-reject" id="callRejectBtn">✕</button>
            ` : `
              <button class="btn btn-end" id="callEndBtn">⏹</button>
            `}
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      if (mode === "incoming") {
        document.getElementById("callAcceptBtn").onclick = () => answerCall(callId, call);
        document.getElementById("callRejectBtn").onclick = () => rejectCall(callId, call);
      } else {
        document.getElementById("callEndBtn").onclick = endCall;
      }
    }

    function showVideoCallUI(callId, call, friendProfile, mode = "incoming") {
      // Remove any existing overlay
      document.getElementById("callOverlay")?.remove();

      const container = document.createElement("div");
      container.id = "callVideoContainer";
      container.className = "call-video-container";

      const isVideo = call.type === "video";

      container.innerHTML = `
        <div class="call-status-overlay" id="callStatusOverlay">
          <img class="big-avatar" src="${avatarUrl(friendProfile)}">
          <div class="status-text">${mode === "incoming" ? "📞 Входящий вызов..." : "🔴 Вызов..."}</div>
          <div class="status-sub">${escapeHtml(friendProfile.name || "Друг")}</div>
          <div class="call-timer" id="callTimerDisplay">${formatDuration(0)}</div>
        </div>
        <video class="remote-video" autoplay playsinline style="display:none;"></video>
        <video class="local-video ${isVideo ? '' : 'hidden-video'}" autoplay playsinline muted></video>
        <div class="call-controls">
          ${mode === "incoming" ? `
            <button class="btn btn-accept" id="callAcceptBtn">✓</button>
            <button class="btn btn-reject" id="callRejectBtn">✕</button>
          ` : `
            <button class="btn btn-mute" id="videoMuteBtn">🔊</button>
            <button class="btn btn-switch" id="switchCameraBtn">🔄</button>
            <button class="btn btn-end" id="videoEndBtn">⏹</button>
          `}
        </div>
      `;

      document.body.appendChild(container);

      // Show local video if we have it
      if (localStream && isVideo) {
        const localVideo = container.querySelector(".local-video");
        if (localVideo) {
          localVideo.srcObject = localStream;
          localVideo.classList.remove("hidden-video");
        }
      }

      if (mode === "incoming") {
        document.getElementById("callAcceptBtn").onclick = () => {
          answerCall(callId, call);
        };
        document.getElementById("callRejectBtn").onclick = () => {
          rejectCall(callId, call);
        };
      } else {
        document.getElementById("videoEndBtn").onclick = endCall;
        document.getElementById("videoMuteBtn").onclick = toggleMute;
        document.getElementById("switchCameraBtn").onclick = switchCamera;
      }
    }

    // ===== SUBSCRIBE CALLS =====
    function subscribeCalls() {
      const callsRef = ref(db, `calls/${user.uid}`);
      const unsubscribe = onValue(callsRef, snap => {
        const data = snap.val() || {};
        for (const [callId, call] of Object.entries(data)) {
          if (call.to === user.uid && call.status === "ringing" && !call._processed) {
            call._processed = true;
            showIncomingCall(callId, call);
          }
        }
      });
      callSubscriptions.push(unsubscribe);
    }

    function showIncomingCall(callId, call) {
      playCallSound();

      const friendProfile = friends[call.from]?.profile || { name: "Друг" };

      // Show notification banner
      const notification = document.createElement("div");
      notification.className = "call-notification";
      notification.id = "callNotification";
      notification.innerHTML = `
        <img class="avatar tiny" src="${avatarUrl(friendProfile)}">
        <div class="call-info">
          <div class="name">${escapeHtml(friendProfile.name || "Друг")}</div>
          <div class="type">${call.type === "video" ? "📹 Видеозвонок" : "📞 Голосовой вызов"}</div>
        </div>
        <div class="call-btns">
          <button class="btn btn-accept" id="acceptCallBtn">✓</button>
          <button class="btn btn-reject" id="rejectCallBtn">✕</button>
        </div>
      `;
      document.body.appendChild(notification);

      // Show full UI
      if (call.type === "video") {
        showVideoCallUI(callId, call, friendProfile, "incoming");
      } else {
        showCallUI(callId, call, friendProfile, "incoming");
      }

      document.getElementById("acceptCallBtn").onclick = () => {
        if (call.type === "video") {
          answerCall(callId, call);
        } else {
          answerCall(callId, call);
        }
        notification.remove();
      };

      document.getElementById("rejectCallBtn").onclick = () => {
        rejectCall(callId, call);
        notification.remove();
      };

      // Auto-reject after 30 seconds
      setTimeout(() => {
        if (document.getElementById("callNotification")) {
          rejectCall(callId, call);
          notification.remove();
          document.getElementById("callOverlay")?.remove();
          document.getElementById("callVideoContainer")?.remove();
          toast("Вызов пропущен");
        }
      }, 30000);
    }

    // ===== CHATS =====
    function subscribeChats() {
      if (chatsUnsubscribe) chatsUnsubscribe();
      chatsUnsubscribe = onValue(ref(db, `userChats/${user.uid}`), snap => {
        chatMeta = snap.val() || {};
        updateChatBadge();
        if (currentPage === "chats") renderChats();
      });
    }

    function updateChatBadge() {
      let count = 0;
      Object.values(chatMeta).forEach(chat => {
        count += Number(chat.unread?.[user.uid] || 0);
      });
      $("chatBadge").textContent = count > 99 ? "99+" : count;
      $("chatBadge").classList.toggle("hidden", count === 0);
    }

    function renderChats() {
      const entries = Object.entries(chatMeta).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
      const html = entries.length ? entries.map(([chatId, chat]) => {
        const p = chat.friendProfile || {};
        const unread = Number(chat.unread?.[user.uid] || 0);
        return `<div class="chat-item" onclick="openChat('${chat.friendUid}')">
          <img class="avatar small" src="${avatarUrl(p)}">
          <div class="grow"><b>${escapeHtml(p.name || "Друг")}</b><div class="code chat-preview">${escapeHtml(chat.lastText || "Начните общение")}</div></div>
          ${unread ? `<div class="chat-unread">${unread > 99 ? "99+" : unread}</div>` : ""}
        </div>`;
      }).join("") : `<div class="empty">Здесь появятся чаты с друзьями 💬</div>`;
      openPanel(`
        <button class="close" onclick="closePanel()">×</button>
        <h2>Чаты</h2>
        ${html}
      `);
    }

          <button class="quick-reaction" id="stickerBtn">😊</button>
          <button class="quick-reaction" id="voiceBtn">🎤</button>
        </div>
        <div class="chat-input-area">
          <input id="chatInput" class="chat-input" maxlength="1000" placeholder="Сообщение…">

        </div>
      `;
      document.body.appendChild(page);

      $("chatBackBtn").onclick = closeChat;

      $("audioCallBtn").onclick = () => makeCall(friendUid, false);
      $("videoCallBtn").onclick = () => makeCall(friendUid, true);

        btn.addEventListener("touchstart", () => { timer = setTimeout(() => showReactionHold(emoji, friendUid), 600); }, { passive: true });
        btn.addEventListener("touchend", () => clearTimeout(timer));
        btn.addEventListener("mousedown", () => { timer = setTimeout(() => showReactionHold(emoji, friendUid), 600); });
        btn.addEventListener("mouseup", () => clearTimeout(timer));

    // ===== VOICE RECORDING =====
    async function toggleVoiceRecording() {
      if (isRecording) {
        stopVoiceRecording();
        return;
      }
      await startVoiceRecording();
    }

    async function startVoiceRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          if (blob.size > 1000) {
            const reader = new FileReader();
            reader.onload = async () => {
              const base64 = reader.result;
              await sendVoiceMessage(base64, recordingSeconds);
            };
            reader.readAsDataURL(blob);
          } else {
            toast("Запись слишком короткая");
          }
          cleanupRecording();
        };

        mediaRecorder.start(100);
        isRecording = true;
        recordingSeconds = 0;
        recordingStartTime = Date.now();

        const voiceBtn = $("voiceBtn");
        voiceBtn.textContent = "⏹️";
        voiceBtn.classList.add("recording");

        const indicator = document.createElement("div");
        indicator.id = "recordingIndicator";
        indicator.className = "recording-indicator";
        indicator.innerHTML = `<span class="dot-rec"></span> Запись: <span id="recordingTime">0s</span>`;
        document.getElementById("chatPage")?.appendChild(indicator);

        recordingTimer = setInterval(() => {
          recordingSeconds = Math.floor((Date.now() - recordingStartTime) / 1000);
          const timeEl = document.getElementById("recordingTime");
          if (timeEl) timeEl.textContent = formatDuration(recordingSeconds);
          if (recordingSeconds >= 60) {
            toast("Максимум 60 секунд");
            stopVoiceRecording();
          }
        }, 200);

        toast("🎤 Запись началась...");

      } catch (e) {
        console.error(e);
        toast("Нет доступа к микрофону");
      }
    }

    function stopVoiceRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
      }
      cleanupRecording();
    }

    function cleanupRecording() {
      isRecording = false;
      clearInterval(recordingTimer);
      const voiceBtn = $("voiceBtn");
      voiceBtn.textContent = "🎤";
      voiceBtn.classList.remove("recording");
      const indicator = document.getElementById("recordingIndicator");
      if (indicator) indicator.remove();
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    // ===== CHAT MESSAGES =====
    function subscribeCurrentChat() {
      const chatId = currentChatId;
      if (!chatId) return;
      if (chatUnsubscribers.has(chatId)) {
        chatUnsubscribers.get(chatId)();
        chatUnsubscribers.delete(chatId);
      }
      const unsubscribe = onValue(ref(db, `chats/${chatId}/messages`), snap => {
        if (currentChatId !== chatId) return;
        renderMessages(snap.val() || {});
      });
      chatUnsubscribers.set(chatId, unsubscribe);
      subscribeTyping(chatId);
    }

    function renderMessages(messages) {
      const container = $("messages");
      if (!container) return;
      const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
      const entries = Object.entries(messages).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

      container.innerHTML = entries.length ? entries.map(([id, message]) => {
        const mine = message.senderUid === user.uid;
        const reactions = message.reactions || {};
        const reactionHtml = Object.entries(reactions).map(([emoji, data]) =>
          `<button class="message-reaction" onclick="reactToMessage('${id}','${encodeURIComponent(emoji)}')">${emoji} ${data?.count || 1}</button>`
        ).join("");

        let content = "";
        if (message.type === "reaction") {
          content = `<div style="font-size:40px">${escapeHtml(message.emoji || "❤️")}</div>`;
        } else if (message.type === "sticker") {
          content = `<div style="font-size:58px">${escapeHtml(message.emoji || "😊")}</div>`;
        } else if (message.type === "voice") {
          const duration = message.duration || 3;
          const data = message.data || "";
          content = `
            <div class="voice-message ${mine ? "mine" : ""}">
              <button class="voice-play" onclick="toggleVoicePlay(this, '${escapeHtml(data)}')">▶</button>
              <div class="voice-timeline" onclick="seekVoice(this, event)">
                <div class="progress" style="width:0%"></div>
              </div>
              <span class="voice-time">${formatDuration(duration)}</span>
            </div>
          `;
        } else {
          content = escapeHtml(message.text || "");
        }

        return `
          <div class="message-row ${mine ? "mine" : "theirs"}">
            <div class="message ${mine ? "mine" : "theirs"}" ${mine ? `oncontextmenu="deleteMessage('${id}');return false;"` : ""}>
              ${content}
              ${reactionHtml ? `<div class="message-reactions">${reactionHtml}</div>` : ""}
              <div class="message-time">${formatTime(message.createdAt)}</div>
            </div>
          </div>
        `;
      }).join("") : `<div class="empty">Напиши первое сообщение 👋</div>`;

      if (nearBottom) {
        requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
      }
      markChatRead();
    }

    // ===== VOICE PLAYER =====
    window.toggleVoicePlay = function(btn, data) {
      if (!data) { toast("Аудио недоступно"); return; }
      try {
        const audioData = data.split(",")[1] || data;
        const byteCharacters = atob(audioData);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: "audio/webm" });
        const url = URL.createObjectURL(blob);

        const audio = new Audio(url);
        const timeline = btn.parentElement.querySelector(".voice-timeline");
        const progress = timeline?.querySelector(".progress");

        if (btn._audio && !btn._audio.paused) {
          btn._audio.pause();
          btn.textContent = "▶";
          return;
        }

        btn._audio = audio;
        audio.play();
        btn.textContent = "⏸";

        audio.ontimeupdate = () => {
          if (progress && audio.duration) {
            progress.style.width = (audio.currentTime / audio.duration * 100) + "%";
          }
        };

        audio.onended = () => {
          btn.textContent = "▶";
          if (progress) progress.style.width = "0%";
        };

        audio.onerror = () => {
          toast("Ошибка воспроизведения");
          btn.textContent = "▶";
        };

      } catch (e) {
        console.error(e);
        toast("Ошибка воспроизведения");
      }
    };

    window.seekVoice = function(timeline, event) {
      const rect = timeline.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const btn = timeline.parentElement.querySelector(".voice-play");
      if (btn && btn._audio && btn._audio.duration) {
        btn._audio.currentTime = x * btn._audio.duration;
      }
    };

      await set(messageRef, { senderUid: user.uid, type: "reaction", emoji, createdAt: Date.now() });

    async function reactToMessage(messageId, encodedEmoji) {
      const emoji = decodeURIComponent(encodedEmoji);
      if (!currentChatId) return;
      const path = `chats/${currentChatId}/messages/${messageId}/reactions/${emoji}`;
      const snap = await get(ref(db, path));
      const old = snap.val() || { count: 0, users: {} };
      old.count = (old.count || 0) + 1;
      old.users = old.users || {};
      old.users[user.uid] = (old.users[user.uid] || 0) + 1;
      await set(ref(db, path), old);
      incrementReactionStats(currentChatFriendId, emoji);
    }

    window.deleteMessage = async function(messageId) {
      if (!currentChatId) return;
      if (!confirm("Удалить сообщение?")) return;
      await remove(ref(db, `chats/${currentChatId}/messages/${messageId}`));
    };

    async function updateChatMeta(chatId, lastText) {
      const friendUid = currentChatFriendId;
      const friendProfile = friends[friendUid]?.profile || {};
      const myProfile = { name: profile.name, friendCode: profile.friendCode, avatar: profile.avatar || "" };
      const oldUnread = Number(chatMeta[chatId]?.unread?.[friendUid] || 0);

      await update(ref(db), {
        [`userChats/${user.uid}/${chatId}/friendUid`]: friendUid,
        [`userChats/${user.uid}/${chatId}/friendProfile`]: friendProfile,
        [`userChats/${user.uid}/${chatId}/lastText`]: lastText,
        [`userChats/${user.uid}/${chatId}/updatedAt`]: Date.now(),
        [`userChats/${user.uid}/${chatId}/unread/${user.uid}`]: 0,
        [`userChats/${friendUid}/${chatId}/friendUid`]: user.uid,
        [`userChats/${friendUid}/${chatId}/friendProfile`]: myProfile,
        [`userChats/${friendUid}/${chatId}/lastText`]: lastText,
        [`userChats/${friendUid}/${chatId}/updatedAt`]: Date.now(),
        [`userChats/${friendUid}/${chatId}/unread/${friendUid}`]: oldUnread + 1

    // ===== INCOMING BIG REACTIONS =====
    function subscribeIncomingReactions() {
      if (reactionsUnsubscribe) reactionsUnsubscribe();
      reactionsUnsubscribe = onValue(ref(db, `reactions/${user.uid}`), async snap => {
        const data = snap.val() || {};
        for (const reactionId of Object.keys(data)) {
          if (incomingReactions[reactionId]) continue;
          incomingReactions[reactionId] = true;
          const reaction = data[reactionId];
          await playIncomingReaction(reaction, reactionId);
        }
      });

    async function playIncomingReaction(reaction, reactionId) {
      if (!reaction) return;
      openPage("map");
      createReactionExplosion({
        emoji: reaction.emoji || "❤️",
        count: Math.max(1, Math.min(20000, Number(reaction.count) || 1)),
        fromName: reaction.fromName || "Друг",
        fromUid: reaction.fromUid || ""
      });
      try { await remove(ref(db, `reactions/${user.uid}/${reactionId}`)); } catch (e) {}
    }

    function createReactionExplosion({ emoji, count, fromName, fromUid }) {
      const overlay = $("reactionOverlay");
      overlay.innerHTML = "";

      const dark = document.createElement("div");
      dark.style.cssText = "position:absolute;inset:0;background:rgba(0,0,0,.28);animation:fadeReaction 4.7s ease forwards;";

      counter.textContent = `${emoji} × ${count.toLocaleString("ru-RU")}`;
      overlay.appendChild(counter);

      const center = document.createElement("div");
      center.style.cssText = "position:absolute;z-index:3;top:50%;left:50%;width:min(90vw,430px);text-align:center;transform:translate(-50%,-50%);animation:centerReaction 4.7s ease forwards;";

        <div style="margin-top:5px;font-size:clamp(34px,11vw,60px);font-weight:1000;">×${count.toLocaleString("ru-RU")}</div>
        <div style="margin-top:7px;color:#ddd;font-size:13px;">Реакции разлетаются по карте ✨</div>
      `;
      overlay.appendChild(center);

      const particleCount = Math.min(420, Math.max(30, Math.floor(Math.sqrt(count) * 4)));
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");
        particle.style.cssText = `
          position:absolute;left:50%;top:50%;z-index:2;font-size:${18 + Math.random() * 34}px;
