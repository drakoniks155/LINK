<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080808">
  <title>LINK — друзья на карте</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    *{box-sizing:border-box}

    :root{
      --bg:#080808;
      --card:#121212;
      --card2:#191919;
      --text:#fff;
      --muted:#9b9b9b;
      --line:#2b2b2b;
      --accent:#fff;
      --danger:#ff5d73;
      --ok:#70ffad;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    body{overflow:hidden}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    .hidden{display:none!important}

    #app{
      position:relative;
      width:100%;
      height:100dvh;
      overflow:hidden;
      background:#111;
    }

    #map{
      position:absolute;
      inset:0;
      z-index:1;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar{
      position:absolute;
      z-index:1000;
      top:12px;
      left:12px;
      right:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      pointer-events:none;
    }

    .brand,.status{
      pointer-events:auto;
      background:rgba(10,10,10,.84);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:10px 14px;
      box-shadow:0 10px 35px rgba(0,0,0,.38);
    }

    .brand{
      font-weight:950;
      letter-spacing:.7px;
    }

    .status{
      font-size:12px;
      color:#ddd;
      max-width:58%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .dot{
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#777;
      margin-right:7px;
    }

    .dot.live{
      background:var(--ok);
      box-shadow:0 0 13px var(--ok);
    }

    /* =========================
       MAP BUTTONS
    ========================= */

    .map-actions{
      position:absolute;
      z-index:1000;
      right:12px;
      bottom:104px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .round-btn{
      width:48px;
      height:48px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:17px;
      background:rgba(10,10,10,.88);
      backdrop-filter:blur(14px);
      color:#fff;
      font-size:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }

    /* =========================
       BOTTOM NAVIGATION
    ========================= */

    .bottom{
      position:absolute;
      z-index:1000;
      left:10px;
      right:10px;
      bottom:10px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:5px;
      padding:7px;
      background:rgba(8,8,8,.91);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      box-shadow:0 15px 50px rgba(0,0,0,.45);
    }

    .navbtn{
      position:relative;
      border:0;
      background:transparent;
      color:#999;
      border-radius:18px;
      padding:9px 3px;
      transition:.2s;
    }

    .navbtn.active{
      background:#fff;
      color:#000;
      transform:scale(.98);
    }

    .navicon{
      display:block;
      font-size:19px;
      line-height:22px;
    }

    .navtext{
      display:block;
      font-size:10px;
      font-weight:850;
    }

    .badge{
      position:absolute;
      top:5px;
      right:18%;
      min-width:17px;
      height:17px;
      padding:0 4px;
      border-radius:20px;
      background:#ff4862;
      color:#fff;
      font-size:10px;
      line-height:17px;
      font-weight:900;
    }

    /* =========================
       PANELS
    ========================= */

    .panel{
      position:absolute;
      z-index:2000;
      inset:0;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(4px);
      display:flex;
      align-items:flex-end;
    }

    .sheet{
      width:100%;
      max-height:88dvh;
      overflow:auto;
      background:#0d0d0d;
      border:1px solid #292929;
      border-bottom:0;
      border-radius:28px 28px 0 0;
      padding:18px 16px 32px;
      animation:up .22s ease-out;
    }

    @keyframes up{
      from{
        transform:translateY(30px);
        opacity:0;
      }
      to{
        transform:none;
        opacity:1;
      }
    }

    .handle{
      width:42px;
      height:4px;
      background:#444;
      border-radius:20px;
      margin:0 auto 16px;
    }

    .sheet h2{
      margin:4px 0 16px;
      font-size:22px;
    }

    .close{
      float:right;
      border:0;
      background:#222;
      color:#fff;
      border-radius:50%;
      width:36px;
      height:36px;
      font-size:22px;
    }

    /* =========================
       INPUTS
    ========================= */

    .field{
      margin:11px 0;
    }

    .field label{
      display:block;
      color:#aaa;
      font-size:12px;
      margin-bottom:6px;
    }

    input{
      width:100%;
      border:1px solid #303030;
      background:#171717;
      color:#fff;
      border-radius:14px;
      padding:13px;
      outline:none;
    }

    input:focus{
      border-color:#777;
    }

    .btn{
      border:0;
      border-radius:15px;
      padding:13px 15px;
      background:#fff;
      color:#000;
      font-weight:900;
    }

    .btn.full{
      width:100%;
      margin-top:8px;
    }

    .btn.secondary{
      background:#222;
      color:#fff;
      border:1px solid #333;
    }

    .btn.danger{
      background:#2a1115;
      color:#ff8b9a;
      border:1px solid #54202a;
    }

    .btn.small{
      padding:9px 12px;
      border-radius:12px;
      font-size:12px;
    }

    /* =========================
       AUTH
    ========================= */

    .auth{
      position:absolute;
      z-index:5000;
      inset:0;
      background:#080808;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .authbox{
      width:min(430px,100%);
      background:#111;
      border:1px solid #292929;
      border-radius:28px;
      padding:25px;
      box-shadow:0 20px 80px #000;
    }

    .logo{
      font-size:46px;
      font-weight:1000;
      letter-spacing:-2px;
      margin-bottom:5px;
    }

    .subtitle{
      color:#999;
      margin-bottom:20px;
      line-height:1.45;
    }

    .auth-status{
      font-size:13px;
      min-height:22px;
      color:#aaa;
      margin-top:12px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-head{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .avatar{
      width:64px;
      height:64px;
      border-radius:50%;
      object-fit:cover;
      background:#222;
      border:2px solid #fff;
      display:block;
    }

    .avatar.small{
      width:47px;
      height:47px;
      border-width:1px;
    }

    .name{
      font-size:18px;
      font-weight:900;
    }

    .code{
      color:#999;
      font-size:12px;
      margin-top:3px;
    }

    .upload{
      position:relative;
      overflow:hidden;
      margin-top:8px;
    }

    .upload input{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .grow{
      flex:1;
      min-width:0;
    }

    /* =========================
       FRIENDS
    ========================= */

    .friend,.request{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #242424;
    }

    .friend:last-child,
    .request:last-child{
      border-bottom:0;
    }

    .friend-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .empty{
      color:#888;
      text-align:center;
      padding:30px 10px;
    }

    .section-title{
      margin:20px 0 6px;
      font-size:13px;
      color:#aaa;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    /* =========================
       MAP MARKERS
    ========================= */

    .leaflet-control-attribution{
      font-size:8px!important;
    }

    .leaflet-control-zoom{
      margin-bottom:90px!important;
    }

    .user-pin,.friend-pin{
      background:transparent;
      border:0;
    }

    .pin{
      width:48px;
      height:48px;
      border-radius:50%;
      overflow:hidden;
      background:#222;
      border:3px solid #fff;
      box-shadow:0 5px 20px rgba(0,0,0,.55);
      position:relative;
    }

    .pin img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .pin .ring{
      position:absolute;
      inset:-8px;
      border:2px solid rgba(255,255,255,.7);
      border-radius:50%;
      animation:pulse 1.6s infinite;
    }

    @keyframes pulse{
      50%{
        transform:scale(1.16);
        opacity:.2;
      }
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:absolute;
      z-index:6000;
      left:50%;
      bottom:92px;
      transform:translateX(-50%);
      background:#fff;
      color:#000;
      padding:11px 15px;
      border-radius:14px;
      font-weight:800;
      font-size:13px;
      box-shadow:0 12px 35px rgba(0,0,0,.4);
      max-width:90%;
      text-align:center;
    }

    /* =========================
       SETTINGS
    ========================= */

    .toggle{
      width:48px;
      height:28px;
      border:0;
      border-radius:20px;
      background:#333;
      position:relative;
      flex:none;
    }

    .toggle i{
      position:absolute;
      top:3px;
      left:3px;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      transition:.2s;
    }

    .toggle.on{
      background:#fff;
    }

    .toggle.on i{
      left:23px;
      background:#000;
    }

    .note{
      color:#777;
      font-size:12px;
      line-height:1.5;
      margin-top:12px;
    }

    .online-status{
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:50%;
      margin-left:6px;
    }

    .online-status.online{
      background:#70ffad;
      box-shadow:0 0 8px #70ffad;
    }

    .online-status.offline{
      background:#777;
    }

    /* =========================
       REACTIONS
    ========================= */

    .reaction-picker{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin:12px 0 16px;
    }

    .reaction-choice{
      border:1px solid #333;
      background:#171717;
      color:#fff;
      border-radius:18px;
      min-height:65px;
      font-size:30px;
      transition:.18s;
    }

    .reaction-choice:active,
    .reaction-choice.selected{
      background:#fff;
      color:#000;
      transform:scale(.94);
    }

    .reaction-info{
      background:#141414;
      border:1px solid #292929;
      border-radius:16px;
      padding:13px;
      color:#aaa;
      font-size:12px;
      line-height:1.45;
    }

    /* =========================
       FULL SCREEN REACTION
    ========================= */

    #reactionOverlay{
      position:fixed;
      z-index:10000;
      inset:0;
      overflow:hidden;
      pointer-events:none;
    }

    .reaction-dark{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.18);
      backdrop-filter:blur(1px);
      animation:reactionDark 4.5s ease forwards;
    }

    @keyframes reactionDark{
      0%{opacity:0}
      10%{opacity:1}
      85%{opacity:1}
      100%{opacity:0}
    }

    .reaction-center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(88vw,430px);
      text-align:center;
      z-index:3;
      animation:reactionCenter 4.5s ease forwards;
    }

    @keyframes reactionCenter{
      0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
      }
      12%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.08);
      }
      20%{
        transform:translate(-50%,-50%) scale(1);
      }
      85%{
        opacity:1;
      }
      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.8);
      }
    }

    .reaction-big{
      font-size:clamp(90px,28vw,170px);
      line-height:1;
      filter:drop-shadow(0 15px 35px rgba(0,0,0,.6));
      animation:reactionEmoji 1.2s ease-in-out infinite alternate;
    }

    @keyframes reactionEmoji{
      from{
        transform:scale(.96) rotate(-5deg);
      }
      to{
        transform:scale(1.08) rotate(5deg);
      }
    }

    .reaction-title{
      margin-top:12px;
      font-size:clamp(20px,6vw,30px);
      font-weight:950;
      text-shadow:0 4px 20px #000;
    }

    .reaction-count{
      margin-top:6px;
      font-size:clamp(30px,10vw,58px);
      font-weight:1000;
      text-shadow:0 5px 25px #000;
    }

    .reaction-subtitle{
      margin-top:8px;
      color:#ddd;
      font-size:14px;
    }

    .reaction-particle{
      position:absolute;
      left:50%;
      top:50%;
      z-index:2;
      font-size:var(--size);
      will-change:transform,opacity;
      animation:particleFly var(--duration) cubic-bezier(.12,.75,.2,1) forwards;
      animation-delay:var(--delay);
      filter:drop-shadow(0 5px 10px rgba(0,0,0,.45));
      transform:translate(-50%,-50%);
    }

    @keyframes particleFly{
      0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2) rotate(0deg);
      }

      8%{
        opacity:1;
      }

      75%{
        opacity:1;
      }

      100%{
        opacity:0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(var(--scale))
          rotate(var(--rotate));
      }
    }

    .reaction-counter-top{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      z-index:5;
      padding:10px 17px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(15px);
      font-weight:900;
      animation:counterPop .5s ease;
    }

    @keyframes counterPop{
      from{
        transform:translateX(-50%) translateY(-20px) scale(.7);
        opacity:0;
      }

      to{
        transform:translateX(-50%) translateY(0) scale(1);
        opacity:1;
      }
    }

    .reaction-map-burst{
      position:absolute;
      z-index:7000;
      pointer-events:none;
      transform:translate(-50%,-50%);
      font-size:42px;
      animation:mapBurst 1.4s ease-out forwards;
      filter:drop-shadow(0 5px 12px rgba(0,0,0,.5));
    }

    @keyframes mapBurst{
      0%{
        transform:translate(-50%,-50%) scale(.2);
        opacity:0;
      }

      20%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.5);
      }

      100%{
        transform:translate(-50%,-120%) scale(2.2);
        opacity:0;
      }
    }

    @media(min-width:700px){
      .bottom{
        left:50%;
        right:auto;
        width:520px;
        transform:translateX(-50%);
      }

      .panel{
        align-items:center;
        justify-content:center;
      }

      .sheet{
        width:520px;
        max-height:80vh;
        border:1px solid #292929;
        border-radius:28px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">
    <div class="brand">LINK</div>

    <div class="status">
      <span id="statusDot" class="dot"></span>

  <div class="map-actions">
    <button class="round-btn" id="centerMeBtn">⌖</button>

  </div>

  <nav class="bottom">

    <button class="navbtn active" data-page="map">
      <span class="navicon">🗺️</span>

    <button class="navbtn" data-page="friends">

  </nav>

  <div id="panel" class="panel hidden">

  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<div id="reactionOverlay"></div>

<div id="auth" class="auth">

  <div class="authbox">

    <div class="logo">LINK</div>

    <div class="subtitle">
      Друзья рядом. В реальном времени.

    <button id="startBtn" class="btn full">

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* =========================================

/* =========================================
   MAP
========================================= */

function initMap(){

  map = L.map(
    "map",
    {
      zoomControl:true
    }
  ).setView([20,0],2);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap contributors"
    }
  ).addTo(map);

}


/* =========================================
   AVATAR
========================================= */

function defaultAvatar(name=""){

  const letter =
    String(name || "?")
    .trim()
    .slice(0,1)
    .toUpperCase() || "?";

  return
    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(

      `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">

        <rect width="160" height="160" fill="#242424"/>

        <text
          x="80"
          y="104"
          text-anchor="middle"
          font-family="Arial"
          font-size="72"
          fill="white"
        >
          ${letter}
        </text>

      </svg>`

    );

}


function avatarUrl(p){

  return p?.avatar ||
    defaultAvatar(p?.name || "?");

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(s){

  return String(s ?? "")

    .replace(/[&<>"']/g, c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[c]));

}


/* =========================================
   MARKERS
========================================= */

function markerIcon(p,isMe=false){

  const html = `

    <div class="pin">

      ${isMe ? '<div class="ring"></div>' : ''}

      <img src="${avatarUrl(p)}">

    </div>

  `;

  return L.divIcon({

    className:
      isMe
      ? "user-pin"
      : "friend-pin",

    html,

    iconSize:[48,48],

    iconAnchor:[24,24],

    popupAnchor:[0,-25]

  });

}

/* =========================================
   PROFILE
========================================= */

async function ensureProfile(){

  const profileRef =
    ref(
      db,
      `profiles/${user.uid}`
    );

  const snap =
    await get(profileRef);


  if(!snap.exists()){

    const code =
      await createUniqueFriendCode();


    const newProfile = {

      name:
        `LINK ${Math.floor(
          100 + Math.random() * 900
        )}`,

      friendCode:code,

      avatar:"",

      createdAt:Date.now(),

      locationSharing:true,

      lastActive:Date.now()

    };


    await update(
      ref(db),
      {

        [`profiles/${user.uid}`]:
          newProfile,

        [`friendCodes/${code}`]:
          user.uid

      }
    );


    profile = newProfile;

  }

  else{

    profile = snap.val();


    if(!profile.friendCode){

      const code =
        await createUniqueFriendCode();


      await update(
        ref(db),
        {

          [`profiles/${user.uid}/friendCode`]:
            code,

          [`friendCodes/${code}`]:
            user.uid

        }
      );


      profile.friendCode = code;

    }


    await update(
      ref(
        db,
        `profiles/${user.uid}`
      ),
      {
        lastActive:Date.now()
      }
    );

  }

}


/* =========================================
   FRIEND CODE
========================================= */

async function createUniqueFriendCode(){

  for(let i=0;i<30;i++){

    const code =
      String(
        Math.floor(
          1000 +
          Math.random()*9000
        )
      );


    const existing =
      await get(
        ref(
          db,
          `friendCodes/${code}`
        )
      );


    if(!existing.exists()){

      return code;

    }

  }


  throw new Error(
    "Не удалось создать свободный код."
  );

}

/* =========================================
   SUBSCRIBE PROFILE
========================================= */

function subscribeProfile(){

  if(profileUnsubscribe){

    profileUnsubscribe();

  }


  const profileRef =
    ref(
      db,
      `profiles/${user.uid}`
    );


  profileUnsubscribe =
    onValue(
      profileRef,
      snap => {

        if(!snap.exists()) return;


        profile = snap.val();


        if(meMarker){

          renderMeMarker();

        }


        if(currentPage === "profile"){

          renderProfile();

        }

      }
    );

}


/* =========================================
   SUBSCRIBE FRIENDS
========================================= */

function subscribeFriends(){

  if(friendsUnsubscribe){

    friendsUnsubscribe();

  }


  const friendsRef =
    ref(
      db,
      `friends/${user.uid}`
    );


  friendsUnsubscribe =
    onValue(
      friendsRef,
      snap => {

        const nextFriends =
          snap.val() || {};


        const oldIds =
          Object.keys(friends);


        for(const id of oldIds){

          if(!nextFriends[id]){

            removeFriendMarker(id);

          }

        }


        friends = nextFriends;


        for(
          const friendId
          of Object.keys(friends)
        ){

          subscribeFriendLocation(friendId);

        }


        if(currentPage === "friends"){

          renderFriends();

        }

      }
    );

}

/* =========================================
   REACTIONS REALTIME
========================================= */

function subscribeIncomingReactions(){

  if(reactionsUnsubscribe){

    reactionsUnsubscribe();

  }


  const reactionsRef =
    ref(
      db,
      `reactions/${user.uid}`
    );


  reactionsUnsubscribe =
    onValue(
      reactionsRef,
      async snap => {

        const data =
          snap.val() || {};


        for(
          const reactionId
          of Object.keys(data)
        ){

          if(incomingReactions[reactionId]){

            continue;

          }


          const reaction =
            data[reactionId];


          incomingReactions[reactionId] =
            true;


          await playIncomingReaction(
            reaction,
            reactionId
          );

        }

      }
    );

}


/* =========================================
   PLAY REACTION
========================================= */

async function playIncomingReaction(
  reaction,
  reactionId
){

  if(!reaction) return;


  const emoji =
    reaction.emoji || "❤️";


  const count =
    Math.max(
      1,
      Math.min(
        20000,
        Number(reaction.count) || 1
      )
    );


  const fromName =
    reaction.fromName ||
    "Твой друг";


  openPage("map");


  createReactionExplosion({

    emoji,

    count,

    fromName,

    fromUid:
      reaction.fromUid || ""

  });


  if(reactionId){

    try{

      await remove(
        ref(
          db,
          `reactions/${user.uid}/${reactionId}`
        )
      );

    }

    catch(error){

      console.error(
        "Reaction cleanup error:",
        error
      );

    }

  }

}


/* =========================================
   VISUAL EXPLOSION
========================================= */

function createReactionExplosion({

  emoji,
  count,
  fromName,
  fromUid

}){

  const overlay =
    $("reactionOverlay");


  overlay.innerHTML = "";


  const dark =
    document.createElement("div");

  dark.className =
    "reaction-dark";


  overlay.appendChild(dark);


  const topCounter =
    document.createElement("div");

  topCounter.className =
    "reaction-counter-top";

  topCounter.textContent =
    `${emoji} × ${count.toLocaleString("ru-RU")}`;


  overlay.appendChild(topCounter);


  const center =
    document.createElement("div");

  center.className =
    "reaction-center";


  center.innerHTML = `

    <div class="reaction-big">
      ${emoji}
    </div>

    <div class="reaction-title">
      ${escapeHtml(fromName)}
      отправил тебе реакцию
    </div>

    <div class="reaction-count">
      ×${count.toLocaleString("ru-RU")}
    </div>

    <div class="reaction-subtitle">
      Реакции разлетаются по карте ✨
    </div>

  `;


  overlay.appendChild(center);


  /*
    Не создаём 20 000 DOM элементов.

    Чем больше реакций — тем больше
    визуальных частиц, максимум 420.
  */

  const particleCount =
    Math.min(
      420,
      Math.max(
        30,
        Math.floor(
          Math.sqrt(count)*4
        )
      )
    );


  for(
    let i=0;
    i<particleCount;
    i++
  ){

    const particle =
      document.createElement("div");


    particle.className =
      "reaction-particle";


    particle.textContent = emoji;


    const angle =
      Math.random()*Math.PI*2;


    const distance =
      30 +
      Math.random()*
      Math.max(
        window.innerWidth,
        window.innerHeight
      )*.85;


    const x =
      Math.cos(angle)*
      distance;


    const y =
      Math.sin(angle)*
      distance;


    const size =
      18+
      Math.random()*32;


    const duration =
      2.2+
      Math.random()*2;


    const delay =
      Math.random()*.55;


    particle.style.setProperty(
      "--x",
      `${x}px`
    );

    particle.style.setProperty(
      "--y",
      `${y}px`
    );

    particle.style.setProperty(
      "--size",
      `${size}px`
    );

    particle.style.setProperty(
      "--duration",
      `${duration}s`
    );

    particle.style.setProperty(
      "--delay",
      `${delay}s`
    );

    particle.style.setProperty(
      "--scale",
      String(
        .6+Math.random()*1.8
      )
    );

    particle.style.setProperty(
      "--rotate",
      `${-360+Math.random()*720}deg`
    );


    overlay.appendChild(particle);

  }


  playMapReactionBurst(
    emoji,
    count,
    fromUid
  );


  if(navigator.vibrate){

    const vibration =
      count >= 10000
      ? [80,40,100,40,160]
      : count >= 1000
      ? [60,40,90]
      : [50];


    navigator.vibrate(vibration);

  }


  setTimeout(
    () => {

      overlay.innerHTML = "";

    },
    4800
  );

}


/* =========================================
   MAP BURST FROM FRIEND
========================================= */

function playMapReactionBurst(
  emoji,
  count,
  fromUid
){

  if(!map) return;


  let point = null;


  if(
    fromUid &&
    friendMarkers.has(fromUid)
  ){

    const marker =
      friendMarkers.get(fromUid);


    const latlng =
      marker.getLatLng();


    point =
      map.latLngToContainerPoint(
        latlng
      );

  }


  if(!point){

    point = {
      x:window.innerWidth/2,
      y:window.innerHeight/2
    };

  }


  const mapContainer =
    $("map");


  const visualCount =
    Math.min(
      45,
      Math.max(
        10,
        Math.floor(
          Math.log10(count+1)*12
        )
      )
    );


  for(
    let i=0;
    i<visualCount;
    i++
  ){

    const item =
      document.createElement("div");


    item.className =
      "reaction-map-burst";


    item.textContent = emoji;


    const spread =
      30+
      Math.random()*220;


    const angle =
      Math.random()*Math.PI*2;


    item.style.left =
      (
        point.x +
        Math.cos(angle)*spread
      )+"px";


    item.style.top =
      (
        point.y +
        Math.sin(angle)*spread
      )+"px";


    item.style.animationDelay =
      `${Math.random()*.5}s`;


    mapContainer.appendChild(item);


    setTimeout(
      () => item.remove(),
      2200
    );

  }

}


/* =========================================
   FRIEND LOCATION
========================================= */

function subscribeFriendLocation(friendId){

  if(
    friendLocationListeners
    .has(friendId)
  ){

    return;

  }


  const locationRef =
    ref(
      db,
      `locations/${friendId}`
    );


  const unsubscribe =
    onValue(
      locationRef,
      async snap => {

        const location =
          snap.val();


        if(!location){

          removeFriendMarker(
            friendId,
            false
          );

          return;

        }


        const isStale =
          (
            Date.now() -
            location.updatedAt
          ) >
          5*60*1000;


        if(isStale){

          removeFriendMarker(
            friendId,
            false
          );

          return;

        }


        const profileSnap =
          await get(
            ref(
              db,
              `profiles/${friendId}`
            )
          );


        if(!profileSnap.exists()){

          return;

        }


        const friendProfile =
          profileSnap.val();


        upsertFriendMarker(
          friendId,
          friendProfile,
          location
        );

      }
    );


  friendLocationListeners.set(
    friendId,
    unsubscribe
  );

}


function upsertFriendMarker(
  friendId,
  friendProfile,
  location
){

  const lat =
    Number(location.lat);

  const lng =
    Number(location.lng);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ){

    return;

  }


  if(!friendMarkers.has(friendId)){

    const marker =
      L.marker(
        [lat,lng],
        {
          icon:
            markerIcon(friendProfile),

          zIndexOffset:500
        }
      ).addTo(map);


    marker.bindPopup(
      `
      <b>
        ${escapeHtml(
          friendProfile.name || "Друг"
        )}
      </b>

      <br>

      Нажми, чтобы посмотреть
      `
    );


    marker.on(
      "click",
      () => {

        openFriendReactionPanel(
          friendId
        );

      }
    );


    friendMarkers.set(
      friendId,
      marker
    );

  }

  else{

    const marker =
      friendMarkers.get(friendId);


    marker.setLatLng([lat,lng]);


    marker.setIcon(
      markerIcon(friendProfile)
    );

  }

}


function removeFriendMarker(
  friendId,
  unsubscribe=true
){

  const marker =
    friendMarkers.get(friendId);


  if(marker){

    map.removeLayer(marker);

    friendMarkers.delete(friendId);

  }


  if(
    unsubscribe &&
    friendLocationListeners
    .has(friendId)
  ){

    friendLocationListeners
      .get(friendId)();


    friendLocationListeners
      .delete(friendId);

  }

}

/* =========================================
   GEOLOCATION
========================================= */

function startLocation(){

  if(!navigator.geolocation){

    setStatus(
      "GPS не поддерживается",
      false
    );

    toast(
      "Этот браузер не поддерживает геолокацию."
    );

    return;

  }


  if(watchId !== null){

    navigator.geolocation
      .clearWatch(watchId);

  }


  setStatus(
    "Получаем геолокацию…",
    true
  );


  watchId =
    navigator.geolocation.watchPosition(

      async pos => {

        const {
          latitude,
          longitude,
          accuracy
        } = pos.coords;


        lastPosition = {

          lat:latitude,

          lng:longitude,

          accuracy:
            accuracy || 0,

          updatedAt:
            Date.now()

        };


        renderMeMarker();


        setStatus(
          "Геолокация в реальном времени",
          true
        );


        try{

          await set(
            ref(
              db,
              `locations/${user.uid}`
            ),
            {

              lat:latitude,

              lng:longitude,

              accuracy:
                accuracy || 0,

              updatedAt:
                Date.now()

            }
          );

        }

        catch(error){

          console.error(error);

          setStatus(
            "Ошибка отправки GPS",
            false
          );

        }

      },


      error => {

        if(error.code === 1){

          setStatus(
            "Разреши геолокацию",
            false
          );

          toast(
            "Разреши доступ к геолокации."
          );

        }

        else{

          setStatus(
            "GPS временно недоступен",
            false
          );

        }

      },


      {

        enableHighAccuracy:true,

        maximumAge:3000,

        timeout:15000

      }

    );

}


/* =========================================
   CLEANUP
========================================= */

async function cleanupOldLocations(){

  try{

    const locationsRef =
      ref(db,"locations");


    const snapshot =
      await get(locationsRef);


    if(!snapshot.exists()){

      return;

    }


    const locations =
      snapshot.val();


    const now =
      Date.now();


    const staleThreshold =
      10*60*1000;


    for(
      const [uid,location]
      of Object.entries(locations)
    ){

      if(uid === user.uid){

        continue;

      }


      if(
        now -
        location.updatedAt >
        staleThreshold
      ){

        await remove(
          ref(
            db,
            `locations/${uid}`
          )
        );


        removeFriendMarker(uid);

      }

    }

  }

  catch(error){

    console.error(
      "Cleanup error:",
      error
    );

  }

}

/* =========================================
   SEND REACTION
========================================= */

async function sendReaction(friendUid){

  const countInput =
    $("reactionCount");


  let count =
    Number(countInput.value);


  if(!Number.isFinite(count)){

    count = 1;

  }


  count =
    Math.floor(count);


  if(count < 1){

    count = 1;

  }


  if(count > 20000){

    count = 20000;

  }


  countInput.value = count;


  const reactionId =
    `${Date.now()}_${Math.random()
      .toString(36)
      .slice(2,9)}`;


  $("sendReactionBtn").disabled =
    true;


  $("sendReactionBtn").textContent =
    "Отправляем…";


  try{

    await set(

      ref(
        db,
        `reactions/${friendUid}/${reactionId}`
      ),

      {

        emoji:
          selectedReaction,

        count,

        fromUid:
          user.uid,

        fromName:
          profile?.name ||
          "Друг",

        createdAt:
          Date.now()

      }

    );


    toast(
      `${selectedReaction} ×${count.toLocaleString("ru-RU")} отправлено!`
    );


    closePanel();

  }

  catch(error){

    console.error(error);


    toast(
      "Ошибка: " +
      friendlyError(error)
    );


    $("sendReactionBtn").disabled =
      false;


    $("sendReactionBtn").textContent =
      "Отправить реакцию";

  }

}


/* =========================================

========================================= */

async function sendFriendRequest(){

  const code =
    $("friendCodeInput")
    .value
    .replace(/\D/g,"")
    .slice(0,4);


  $("friendCodeInput").value =
    code;


  if(!/^\d{4}$/.test(code)){

    toast("Введи 4 цифры.");

    return;

  }


  try{

    const codeSnap =
      await get(
        ref(
          db,
          `friendCodes/${code}`
        )
      );


    if(!codeSnap.exists()){

      toast(
        "Пользователь с таким кодом не найден."
      );

      return;

    }


    const targetUid =
      codeSnap.val();


    if(targetUid === user.uid){

      toast(
        "Нельзя добавить самого себя."
      );

      return;

    }


    const [
      friendSnap,
      outgoingSnap,
      incomingSnap
    ] =
      await Promise.all([

        get(
          ref(
            db,
            `friends/${user.uid}/${targetUid}`
          )
        ),

        get(
          ref(
            db,
            `friendRequests/${targetUid}/${user.uid}`
          )
        ),

        get(
          ref(
            db,
            `friendRequests/${user.uid}/${targetUid}`
          )
        )

      ]);


    if(friendSnap.exists()){

      toast(
        "Этот пользователь уже у тебя в друзьях."
      );

      return;

    }


    if(outgoingSnap.exists()){

      toast(
        "Заявка уже отправлена."
      );

      return;

    }


    if(incomingSnap.exists()){

      toast(
        "У тебя уже есть заявка от этого пользователя."
      );

      return;

    }


    await set(

      ref(
        db,
        `friendRequests/${targetUid}/${user.uid}`
      ),

      {

        fromUid:
          user.uid,

        createdAt:
          Date.now(),

        profile:{

          name:
            profile.name ||
            "Пользователь",

          friendCode:
            profile.friendCode ||
            "",

          avatar:
            profile.avatar ||
            ""

        }

      }

    );


    $("friendCodeInput").value =
      "";


    toast(
      "Заявка в друзья отправлена ✨"
    );

  }

  catch(error){

    console.error(error);

    toast(
      "Ошибка: " +
      friendlyError(error)
    );

  }

}

window.acceptRequest =
async function(fromUid){

  const req =
    incomingRequests[fromUid];


  if(!req) return;


  const fromProfile =
    req.profile || {};


  const myProfile = {

    name:
      profile.name ||
      "Пользователь",

    friendCode:
      profile.friendCode ||
      "",

    avatar:
      profile.avatar ||
      ""

  };


  try{

    await update(
      ref(db),
      {

        [`friends/${user.uid}/${fromUid}`]:{

          since:Date.now(),

          profile:
            fromProfile

        },


        [`friends/${fromUid}/${user.uid}`]:{

          since:Date.now(),

          profile:
            myProfile

        },


        [`friendRequests/${user.uid}/${fromUid}`]:
          null

      }
    );


    toast("Друг добавлен 🎉");

  }

  catch(error){

    console.error(error);

    toast(
      "Ошибка: " +
      friendlyError(error)
    );

  }

};

/* =========================================
   AVATAR UPLOAD
========================================= */

async function uploadAvatar(event){

  const file =
    event.target.files?.[0];


  if(!file) return;


  if(
    !file.type.startsWith("image/")
  ){

    toast(
      "Выбери изображение."
    );

    return;

  }


  if(
    file.size >
    8*1024*1024
  ){

    toast(
      "Фото должно быть меньше 8 МБ."
    );

    return;

  }


  try{

    toast(
      "Обрабатываем фотографию…"
    );


    const avatar =
      await compressImage(
        file,
        256,
        .78
      );


    await update(
      ref(
        db,
        `profiles/${user.uid}`
      ),
      {
        avatar
      }
    );


    profile.avatar =
      avatar;


    $("profileAvatar").src =
      avatar;


    renderMeMarker();


    toast(
      "Фото профиля обновлено ✨"
    );

  }

  catch(error){

    console.error(error);

    toast(
      "Не удалось обработать фотографию."
    );

  }

}


function compressImage(
  file,
  maxSize=256,
  quality=.78
){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const img =
          new Image();


        img.onload = () => {

          const scale =
            Math.min(
              1,
              maxSize /
              Math.max(
                img.width,
                img.height
              )
            );


          const width =
            Math.max(
              1,
              Math.round(
                img.width*scale
              )
            );


          const height =
            Math.max(
              1,
              Math.round(
                img.height*scale
              )
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              quality
            )
          );

        };


        img.onerror =
          reject;


        img.src =
          reader.result;

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}

async function toggleLocation(){

  locationSharing =
    !locationSharing;


  try{

    await update(
      ref(
        db,
        `profiles/${user.uid}`
      ),
      {
        locationSharing
      }
    );


    if(locationSharing){

      startLocation();

      setStatus(
        "Получаем геолокацию…",
        true
      );

    }

    else{

      if(watchId !== null){

        navigator.geolocation
          .clearWatch(watchId);

        watchId = null;

      }


      await remove(
        ref(
          db,
          `locations/${user.uid}`
        )
      );


      if(meMarker){

        map.removeLayer(meMarker);

        meMarker = null;

      }


      setStatus(
        "Геолокация выключена",
        false
      );

    }


    renderSettings();

  }

  catch(error){

    locationSharing =
      !locationSharing;


    toast(
      "Ошибка: " +
      friendlyError(error)
    );

  }

}

/* =========================================
   ERRORS
========================================= */

function friendlyError(error){

  const code =
    error?.code || "";


  const message =
    error?.message ||
    String(
      error ||
      "Неизвестная ошибка"
    );


  if(
    code.includes(
      "auth/operation-not-allowed"
    )
  ){

    return
      "В Firebase не включена Anonymous Authentication.";

  }


  if(
    code.includes(
      "permission-denied"
    )
  ){

    return
      "Firebase Database отклонил доступ. Проверь Rules.";

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return
      "Нет подключения к интернету.";

  }


  return message;

}
