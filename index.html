<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Blink</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================
   MAP
========================= */

#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}


/* =========================
   TOP BAR
========================= */

.topbar {
  position: absolute;

  z-index: 1000;

  top: 12px;
  left: 12px;
  right: 12px;

  display: flex;
  justify-content: space-between;

  pointer-events: none;
}

.badge {
  background: rgba(8, 8, 8, 0.92);

  backdrop-filter: blur(15px);

  border: 1px solid #333;

  border-radius: 18px;

  padding: 10px 14px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.5);
}

.brand {
  font-weight: 900;
  letter-spacing: 1px;
}

.status {
  font-size: 12px;
}

.dot {
  display: inline-block;

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #777;

  margin-right: 7px;
}

.dot.live {
  background: #4cff8a;

  box-shadow:
    0 0 12px #4cff8a;
}


/* =========================
   SPEED
========================= */

.speed-card {
  position: absolute;

  z-index: 1000;

  top: 72px;
  left: 50%;

  transform: translateX(-50%);

  background: rgba(8,8,8,.92);

  backdrop-filter: blur(15px);

  border: 1px solid #333;

  border-radius: 20px;

  padding: 9px 20px;

  text-align: center;
}

.speed-card b {
  font-size: 24px;
}

.speed-card small {
  display: block;

  color: #999;

  font-size: 9px;
}


/* =========================
   MAP STYLE BUTTON
========================= */

.map-style-box {
  position: absolute;

  z-index: 2000;

  right: 14px;
  top: 130px;
}

.map-style-button {
  width: 50px;
  height: 50px;

  border: 1px solid #333;

  border-radius: 16px;

  background: #050505;

  color: white;

  font-size: 22px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.55);
}

.map-style-button:active {
  transform: scale(.94);
}

.map-styles {
  position: absolute;

  right: 58px;
  top: 0;

  width: 155px;

  background: rgba(5,5,5,.97);

  border: 1px solid #333;

  border-radius: 16px;

  padding: 6px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.6);
}

.map-styles button {
  width: 100%;

  border: 0;

  background: transparent;

  color: white;

  text-align: left;

  padding: 11px;

  border-radius: 11px;

  font-size: 13px;

  font-weight: bold;
}

.map-styles button:active {
  background: #333;
}


/* =========================
   BOTTOM MENU
========================= */

.bottom {
  position: absolute;

  z-index: 1000;

  bottom: 10px;

  left: 10px;
  right: 10px;

  background: rgba(8,8,8,.95);

  border: 1px solid #333;

  border-radius: 24px;

  padding: 7px;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 5px;
}

.nav {
  border: 0;

  background: transparent;

  color: #999;

  border-radius: 17px;

  padding: 8px 3px;
}

.nav.active {
  background: white;

  color: black;
}

.nav span {
  display: block;
}

.nav .icon {
  font-size: 19px;
}

.nav .txt {
  font-size: 10px;

  font-weight: bold;
}


/* =========================
   PANELS
========================= */

.panel {
  position: absolute;

  z-index: 3000;

  inset: 0;

  background: rgba(0,0,0,.62);

  display: flex;

  align-items: flex-end;

  backdrop-filter: blur(3px);
}

.sheet {
  width: 100%;

  max-height: 88dvh;

  overflow-y: auto;

  background: #0d0d0d;

  border:
    1px solid #292929;

  border-radius:
    28px 28px 0 0;

  padding:
    18px 16px 30px;
}

.handle {
  width: 42px;

  height: 4px;

  background: #444;

  border-radius: 10px;

  margin:
    0 auto 16px;
}

.close {
  float: right;

  border: 0;

  background: #222;

  color: white;

  width: 36px;
  height: 36px;

  border-radius: 50%;

  font-size: 22px;
}


/* =========================
   INPUTS
========================= */

.field {
  margin: 12px 0;
}

.field label {
  display: block;

  color: #aaa;

  font-size: 12px;

  margin-bottom: 6px;
}

input {
  width: 100%;

  background: #171717;

  color: white;

  border:
    1px solid #333;

  border-radius: 14px;

  padding: 12px;

  outline: none;
}


/* =========================
   BUTTONS
========================= */

.btn {
  width: 100%;

  border: 0;

  border-radius: 15px;

  padding: 13px;

  background: white;

  color: black;

  font-weight: 900;

  margin-top: 8px;
}

.btn.secondary {
  background: #222;

  color: white;

  border:
    1px solid #333;
}

.row {
  display: flex;

  gap: 8px;

  align-items: center;
}

.grow {
  flex: 1;
}


/* =========================
   PROFILE
========================= */

.profile {
  display: flex;

  align-items: center;

  gap: 14px;

  margin: 15px 0;
}

.avatar {
  width: 70px;
  height: 70px;

  border-radius: 50%;

  object-fit: cover;

  background: #222;

  border:
    2px solid white;
}

.avatar.small {
  width: 46px;
  height: 46px;

  border-width: 1px;
}

.code {
  font-size: 12px;

  color: #999;
}


/* =========================
   FRIENDS
========================= */

.friend {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 11px 0;

  border-bottom:
    1px solid #252525;
}

.empty {
  text-align: center;

  color: #888;

  padding: 25px;
}

.note {
  color: #777;

  font-size: 12px;

  line-height: 1.5;
}


/* =========================
   TOAST
========================= */

.toast {
  position: absolute;

  z-index: 5000;

  left: 50%;

  bottom: 92px;

  transform:
    translateX(-50%);

  background: white;

  color: black;

  padding:
    11px 15px;

  border-radius: 14px;

  font-size: 13px;

  font-weight: 800;

  max-width: 90%;

  text-align: center;
}


/* =========================
   USER MARKER
========================= */

.pin {
  width: 46px;
  height: 46px;

  border:
    3px solid white;

  border-radius: 50%;

  background: #222;

  position: relative;

  box-shadow:
    0 5px 20px rgba(0,0,0,.6);
}

.pin img {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  object-fit: cover;
}

.ring {
  position: absolute;

  inset: -8px;

  border:
    2px solid white;

  border-radius: 50%;

  animation:
    pulse 1.5s infinite;
}

@keyframes pulse {

  50% {
    transform: scale(1.2);

    opacity: .15;
  }

}

.speed-label {
  position: absolute;

  top: 50px;

  left: 50%;

  transform:
    translateX(-50%);

  white-space: nowrap;

  background: #000;

  border:
    1px solid #333;

  border-radius: 8px;

  padding:
    3px 7px;

  font-size: 10px;

  font-weight: 900;
}


/* DIRECTION ARROW */

.direction-arrow {
  position: absolute;

  left: 50%;

  top: -27px;

  transform:
    translateX(-50%);

  font-size: 18px;

  text-shadow:
    0 2px 5px #000;
}


/* =========================
   DESKTOP
========================= */

@media (min-width:700px) {

  .bottom {
    width: 520px;

    left: 50%;
    right: auto;

    transform:
      translateX(-50%);
  }

  .panel {
    align-items: center;

    justify-content: center;
  }

  .sheet {
    width: 520px;

    border-radius: 28px;

    max-height: 80vh;
  }

}

</style>
</head>


<body>


<!-- MAP -->

<div id="map"></div>


<!-- TOP BAR -->

<div class="topbar">

  <div class="badge brand">
    ⚡ BLINK
  </div>


  <div class="badge status">

    <span
      id="statusDot"
      class="dot"
    ></span>


    <span id="statusText">
      GPS не запущен
    </span>

  </div>

</div>


<!-- SPEED -->

<div class="speed-card">

  <b id="speed">
    0.0 км/ч
  </b>


  <small>
    МОЯ СКОРОСТЬ
  </small>

</div>


<!-- MAP BUTTON -->

<div class="map-style-box">

  <button
    id="mapStyleButton"
    class="map-style-button"
    onclick="toggleMapStyles()"
  >
    🗺️
  </button>


  <div
    id="mapStyles"
    class="map-styles"
    style="display:none"
  >

    <button
      onclick="setMapStyle('light')"
    >
      ⚪ Белая
    </button>


    <button
      onclick="setMapStyle('dark')"
    >
      ⚫ Тёмная
    </button>


    <button
      onclick="setMapStyle('hybrid')"
    >
      🛰️ Гибрид
    </button>

  </div>

</div>


<!-- BOTTOM MENU -->

<div class="bottom">

  <button
    class="nav active"
    data-page="map"
  >

    <span class="icon">
      🗺️
    </span>

    <span class="txt">
      Карта
    </span>

  </button>


  <button
    class="nav"
    data-page="friends"
  >

    <span class="icon">
      👥
    </span>

    <span class="txt">
      Друзья
    </span>

  </button>


  <button
    class="nav"
    data-page="profile"
  >

    <span class="icon">
      👤
    </span>

    <span class="txt">
      Профиль
    </span>

  </button>


  <button
    class="nav"
    data-page="settings"
  >

    <span class="icon">
      ⚙️
    </span>

    <span class="txt">
      Настройки
    </span>

  </button>

</div>


<!-- PANEL -->

<div
  id="panel"
  class="panel"
  style="display:none"
>

  <div
    id="sheet"
    class="sheet"
  ></div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
  style="display:none"
></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =========================================================
   BLINK

   БЕЗ БАЗЫ ДАННЫХ

   GPS
   СКОРОСТЬ
   НАПРАВЛЕНИЕ
   РАДУЖНЫЙ ШЛЕЙФ
   ПРОФИЛЬ
   ФОТО
   ДРУЗЬЯ
   СТИЛИ КАРТЫ
========================================================= */


/* =========================================================
   MAP
========================================================= */

const map =
  L.map("map")
   .setView(
     [0,0],
     2
   );


/* LIGHT */

const lightMap =
  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom: 19,

      attribution:
        "© OpenStreetMap"
    }

  );


/* DARK */

const darkMap =
  L.tileLayer(

    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

    {
      maxZoom: 20,

      attribution:
        "© OpenStreetMap © CARTO"
    }

  );


/* SATELLITE */

const satelliteMap =
  L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {
      maxZoom: 19,

      attribution:
        "© Esri"
    }

  );


/* SATELLITE LABELS */

const labelsMap =
  L.tileLayer(

    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",

    {
      maxZoom: 20,

      attribution:
        "© OpenStreetMap © CARTO"
    }

  );


/* CURRENT STYLE */

let currentMapStyle =
  localStorage.getItem(
    "blink_map_style"
  ) || "light";


function setMapStyle(
  style
) {

  [
    lightMap,
    darkMap,
    satelliteMap,
    labelsMap

  ].forEach(

    function(layer) {

      if (
        map.hasLayer(layer)
      ) {

        map.removeLayer(
          layer
        );

      }

    }

  );


  if (
    style === "light"
  ) {

    lightMap.addTo(
      map
    );

  }


  if (
    style === "dark"
  ) {

    darkMap.addTo(
      map
    );

  }


  if (
    style === "hybrid"
  ) {

    satelliteMap.addTo(
      map
    );

    labelsMap.addTo(
      map
    );

  }


  currentMapStyle =
    style;


  localStorage.setItem(
    "blink_map_style",
    style
  );


  document.getElementById(
    "mapStyles"
  ).style.display =
    "none";

}


function toggleMapStyles() {

  const menu =
    document.getElementById(
      "mapStyles"
    );


  menu.style.display =
    menu.style.display === "none"
      ? "block"
      : "none";

}


setMapStyle(
  currentMapStyle
);


/* =========================================================
   DATA
========================================================= */

let myName =
  localStorage.getItem(
    "blink_name"
  ) || "Я";


let myPhoto =
  localStorage.getItem(
    "blink_photo"
  ) || "";


let myCode =
  localStorage.getItem(
    "blink_code"
  );


if (
  !myCode
) {

  myCode =
    String(
      Math.floor(
        1000 +
        Math.random() *
        9000
      )
    );


  localStorage.setItem(
    "blink_code",
    myCode
  );

}


let friends =
  JSON.parse(
    localStorage.getItem(
      "blink_friends"
    ) || "[]"
  );


let locationEnabled =
  localStorage.getItem(
    "blink_location"
  ) !== "off";


let watchId =
  null;


let marker =
  null;


let lastPosition =
  null;


let trail =
  [];


let trailLayers =
  [];


/* RAINBOW COLORS */

const rainbow = [

  "#ff0055",

  "#ff7a00",

  "#ffe600",

  "#42ff00",

  "#00e5ff",

  "#2878ff",

  "#9b4dff",

  "#ff2bd6"

];


/* =========================================================
   HELPERS
========================================================= */

function avatar(
  src
) {

  if (
    src
  ) {

    return src;

  }


  return (

    "data:image/svg+xml;charset=UTF-8," +

    encodeURIComponent(

      '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">' +

      '<rect width="160" height="160" fill="#222"/>' +

      '<text x="80" y="108" text-anchor="middle" font-size="70" fill="white">👤</text>' +

      '</svg>'

    )

  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,

    function(c) {

      return {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#039;"

      }[c];

    }
  );

}


function toast(
  text
) {

  const box =
    document.getElementById(
      "toast"
    );


  box.textContent =
    text;


  box.style.display =
    "block";


  clearTimeout(
    window.blinkToast
  );


  window.blinkToast =
    setTimeout(

      function() {

        box.style.display =
          "none";

      },

      2500

    );

}


function setStatus(
  text,
  live
) {

  document.getElementById(
    "statusText"
  ).textContent =
    text;


  document.getElementById(
    "statusDot"
  ).classList.toggle(
    "live",
    !!live
  );

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(

  lat1,
  lon1,

  lat2,
  lon2

) {

  const R =
    6371000;


  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) *
    rad;


  const dLon =
    (lon2 - lon1) *
    rad;


  const a =

    Math.sin(
      dLat / 2
    ) ** 2

    +

    Math.cos(
      lat1 * rad
    )

    *

    Math.cos(
      lat2 * rad
    )

    *

    Math.sin(
      dLon / 2
    ) ** 2;


  return (

    2 *

    R *

    Math.asin(
      Math.sqrt(a)
    )

  );

}


/* =========================================================
   BEARING / DIRECTION
========================================================= */

function calculateBearing(

  lat1,
  lon1,

  lat2,
  lon2

) {

  const rad =
    Math.PI / 180;


  const y =

    Math.sin(
      (lon2 - lon1) *
      rad
    )

    *

    Math.cos(
      lat2 * rad
    );


  const x =

    Math.cos(
      lat1 * rad
    )

    *

    Math.sin(
      lat2 * rad
    )

    -

    Math.sin(
      lat1 * rad
    )

    *

    Math.cos(
      lat2 * rad
    )

    *

    Math.cos(
      (lon2 - lon1) *
      rad
    );


  let bearing =

    Math.atan2(
      y,
      x
    )

    *

    180 /
    Math.PI;


  return (

    bearing +
    360
  ) % 360;

}


/* COMPASS */

function directionName(
  degrees
) {

  const names = [

    "С",

    "СВ",

    "В",

    "ЮВ",

    "Ю",

    "ЮЗ",

    "З",

    "СЗ"

  ];


  return names[
    Math.round(
      degrees / 45
    ) % 8
  ];

}


/* =========================================================
   USER ICON
========================================================= */

function userIcon(

  speed,

  direction

) {

  const moving =
    speed > 0.5;


  return L.divIcon({

    className: "",


    html:

      '<div class="pin">' +

        '<div class="ring"></div>' +

        '<img src="' +

          avatar(
            myPhoto
          ) +

        '">' +


        (

          moving

          ?

          '<div class="direction-arrow" ' +

          'style="transform:translateX(-50%) rotate(' +

          direction +

          'deg)">' +

          '➤' +

          '</div>'

          :

          ""

        ) +

      '</div>' +


      '<div class="speed-label">' +

        speed.toFixed(
          1
        ) +

        ' км/ч' +

      '</div>',


    iconSize:
      [
        46,
        70
      ],


    iconAnchor:
      [
        23,
        23
      ]

  });

}


/* =========================================================
   RAINBOW TRAIL
========================================================= */

function redrawTrail() {

  trailLayers.forEach(

    function(layer) {

      map.removeLayer(
        layer
      );

    }

  );


  trailLayers =
    [];


  if (
    trail.length < 2
  ) {

    return;

  }


  /*
    Белое свечение под радугой.
  */

  const glow =
    L.polyline(

      trail,

      {

        color:
          "#ffffff",

        weight:
          18,

        opacity:
          .12,

        lineCap:
          "round",

        lineJoin:
          "round"

      }

    ).addTo(
      map
    );


  trailLayers.push(
    glow
  );


  /*
    Каждая часть хвоста
    получает свой цвет.
  */

  for (

    let i = 1;

    i < trail.length;

    i++

  ) {

    const progress =

      (i - 1) /

      Math.max(

        1,

        trail.length - 2

      );


    const color =

      rainbow[

        Math.floor(

          progress *

          (
            rainbow.length -
            1
          )

        )

      ];


    const segment =

      L.polyline(

        [

          trail[i - 1],

          trail[i]

        ],

        {

          color:
            color,

          weight:
            8,

          opacity:
            .95,

          lineCap:
            "round",

          lineJoin:
            "round"

        }

      ).addTo(
        map
      );


    trailLayers.push(
      segment
    );

  }

}


/* =========================================================
   GPS
========================================================= */

function startGPS() {

  if (
    !locationEnabled
  ) {

    setStatus(
      "Геолокация выключена",
      false
    );

    return;

  }


  if (
    !navigator.geolocation
  ) {

    setStatus(
      "GPS не поддерживается",
      false
    );

    return;

  }


  if (
    watchId !== null
  ) {

    navigator.geolocation
      .clearWatch(
        watchId
      );

  }


  setStatus(
    "Получаем GPS…",
    true
  );


  watchId =

    navigator.geolocation
      .watchPosition(

        onPosition,

        onPositionError,

        {

          enableHighAccuracy:
            true,

          maximumAge:
            1000,

          timeout:
            15000

        }

      );

}


/* =========================================================
   NEW GPS POSITION
========================================================= */

function onPosition(
  position
) {

  const c =
    position.coords;


  /*
    Скорость GPS.
  */

  let speedMs =

    Number.isFinite(
      c.speed
    )

    ?

    Math.max(
      0,
      c.speed
    )

    :

    null;


  /*
    Последнее направление.
  */

  let direction =

    lastPosition

    ?

    lastPosition.direction

    :

    0;


  /*
    Если уже есть предыдущая
    координата — рассчитываем
    расстояние и направление.
  */

  if (
    lastPosition
  ) {

    const seconds =

      (

        position.timestamp -

        lastPosition.time

      ) / 1000;


    if (
      seconds > 0
    ) {

      const meters =

        calculateDistance(

          lastPosition.lat,

          lastPosition.lng,

          c.latitude,

          c.longitude

        );


      /*
        Если GPS не сообщил
        скорость напрямую.
      */

      if (
        speedMs === null
      ) {

        speedMs =
          meters /
          seconds;

      }


      /*
        Не меняем направление,
        если телефон практически
        не сдвинулся.
      */

      if (
        meters > 1
      ) {

        direction =

          calculateBearing(

            lastPosition.lat,

            lastPosition.lng,

            c.latitude,

            c.longitude

          );

      }

    }

  }


  /*
    Перевод м/с → км/ч.
  */

  const speedKmh =

    (speedMs || 0) *
    3.6;


  /*
    Сохраняем текущую точку.
  */

  lastPosition = {

    lat:
      c.latitude,

    lng:
      c.longitude,

    time:
      position.timestamp,

    direction:
      direction,

    speed:
      speedKmh

  };


  /*
    Скорость на экране.
  */

  document.getElementById(
    "speed"
  ).textContent =

    speedKmh.toFixed(
      1
    ) +

    " км/ч";


  /*
    Добавляем точку в хвост
    только когда человек
    действительно движется.
  */

  if (
    speedKmh > 0.5
  ) {

    trail.push(

      [

        c.latitude,

        c.longitude

      ]

    );

  }


  /*
    Ограничиваем длину хвоста.
  */

  if (
    trail.length > 50
  ) {

    trail.shift();

  }


  /* =====================================================
     MARKER
  ===================================================== */

  if (
    !marker
  ) {

    marker =

      L.marker(

        [

          c.latitude,

          c.longitude

        ],

        {

          icon:
            userIcon(

              speedKmh,

              direction

            ),

          zIndexOffset:
            1000

        }

      ).addTo(
        map
      );


    marker.bindPopup(

      "<b>" +

      escapeHtml(
        myName
      ) +

      "</b>" +

      "<br>🚀 " +

      speedKmh.toFixed(
        1
      ) +

      " км/ч" +

      "<br>🧭 " +

      directionName(
        direction
      )

    );


    map.setView(

      [

        c.latitude,

        c.longitude

      ],

      16

    );

  }

  else {

    /*
      Перемещаем фотографию.
    */

    marker.setLatLng(

      [

        c.latitude,

        c.longitude

      ]

    );


    /*
      Обновляем скорость
      и направление стрелки.
    */

    marker.setIcon(

      userIcon(

        speedKmh,

        direction

      )

    );


    marker
      .getPopup()
      .setContent(

        "<b>" +

        escapeHtml(
          myName
        ) +

        "</b>" +

        "<br>🚀 " +

        speedKmh.toFixed(
          1
        ) +

        " км/ч" +

        "<br>🧭 " +

        directionName(
          direction
        )

      );

  }


  /*
    Обновляем радужный хвост.
  */

  redrawTrail();


  /*
    Статус.
  */

  setStatus(

    "GPS • " +

    directionName(
      direction
    ),

    true

  );

}


/* =========================================================
   GPS ERROR
========================================================= */

function onPositionError(
  error
) {

  if (
    error.code === 1
  ) {

    setStatus(
      "Разреши геолокацию",
      false
    );


    toast(
      "Разреши браузеру доступ к геолокации."
    );

  }

  else {

    setStatus(
      "Ошибка GPS",
      false
    );

  }

}


/* =========================================================
   PANELS
========================================================= */

function openPanel(
  html
) {

  document.getElementById(
    "sheet"
  ).innerHTML =

    '<div class="handle"></div>' +

    html;


  document.getElementById(
    "panel"
  ).style.display =
    "flex";

}


function closePanel() {

  document.getElementById(
    "panel"
  ).style.display =
    "none";

}


document.getElementById(
  "panel"
).onclick =

  function(e) {

    if (
      e.target.id ===
      "panel"
    ) {

      closePanel();

    }

  };


/* =========================================================
   PROFILE
========================================================= */

function showProfile() {

  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>


    <h2>
      Профиль
    </h2>


    <div class="profile">

      <img
        id="profilePreview"
        class="avatar"
        src="${avatar(myPhoto)}"
      >


      <div>

        <b>
          ${escapeHtml(myName)}
        </b>


        <div class="code">

          Мой код:

          <b>
            ${myCode}
          </b>

        </div>

      </div>

    </div>


    <div class="field">

      <label>
        Одна фотография профиля
      </label>


      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

    </div>


    <div class="field">

      <label>
        Имя
      </label>


      <input
        id="nameInput"
        maxlength="30"
        value="${escapeHtml(myName)}"
      >

    </div>


    <button
      class="btn"
      onclick="saveProfile()"
    >
      Сохранить профиль
    </button>


    <p class="note">

      Без базы данных фотография
      хранится только в браузере
      этого устройства.

    </p>

  `);


  document.getElementById(
    "photoInput"
  ).onchange =

    function(e) {

      const file =
        e.target.files[0];


      if (
        !file
      ) {

        return;

      }


      if (
        file.size >
        5 * 1024 * 1024
      ) {

        toast(
          "Фото должно быть меньше 5 МБ."
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function() {

          myPhoto =
            reader.result;


          localStorage.setItem(
            "blink_photo",
            myPhoto
          );


          document.getElementById(
            "profilePreview"
          ).src =
            myPhoto;


          if (
            marker
          ) {

            marker.setIcon(

              userIcon(

                lastPosition
                  ? lastPosition.speed
                  : 0,

                lastPosition
                  ? lastPosition.direction
                  : 0

              )

            );

          }


          toast(
            "Фотография сохранена."
          );

        };


      reader.readAsDataURL(
        file
      );

    };

}


/* SAVE PROFILE */

function saveProfile() {

  myName =

    document.getElementById(
      "nameInput"
    ).value.trim()

    ||

    "Я";


  localStorage.setItem(
    "blink_name",
    myName
  );


  toast(
    "Профиль сохранён."
  );


  closePanel();

}


/* =========================================================
   FRIENDS
========================================================= */

function showFriends() {

  let list =
    "";


  friends.forEach(

    function(
      friend,
      index
    ) {

      list += `

        <div class="friend">

          <img
            class="avatar small"
            src="${avatar(friend.photo)}"
          >


          <div class="grow">

            <b>
              ${escapeHtml(friend.name)}
            </b>


            <div class="code">

              Код:

              ${escapeHtml(friend.code)}

            </div>

          </div>


          <button
            class="btn secondary"
            style="width:auto;margin:0"
            onclick="removeFriend(${index})"
          >
            ×
          </button>

        </div>

      `;

    }

  );


  if (
    !list
  ) {

    list =

      '<div class="empty">' +

      'Пока нет друзей.<br>' +

      'Добавь друга по 4-значному коду.' +

      '</div>';

  }


  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>


    <h2>
      Друзья
    </h2>


    <div class="field">

      <label>
        Добавить друга
      </label>


      <div class="row">

        <input
          id="friendName"
          placeholder="Имя"
        >


        <input
          id="friendCode"
          maxlength="4"
          inputmode="numeric"
          placeholder="1234"
        >

      </div>


      <button
        class="btn"
        onclick="addFriend()"
      >
        Добавить друга
      </button>

    </div>


    ${list}


    <p class="note">

      ⚠️ Это локальная версия.
      Реальные координаты друзей
      между телефонами появятся
      после подключения базы данных.

    </p>

  `);

}


/* ADD FRIEND */

function addFriend() {

  const name =

    document.getElementById(
      "friendName"
    ).value.trim()

    ||

    "Друг";


  const code =

    document.getElementById(
      "friendCode"
    ).value.trim();


  if (
    !/^\d{4}$/.test(
      code
    )
  ) {

    toast(
      "Код должен состоять из 4 цифр."
    );

    return;

  }


  friends.push({

    name:
      name,

    code:
      code,

    photo:
      ""

  });


  localStorage.setItem(

    "blink_friends",

    JSON.stringify(
      friends
    )

  );


  toast(
    "Друг добавлен."
  );


  showFriends();

}


/* REMOVE FRIEND */

function removeFriend(
  index
) {

  friends.splice(
    index,
    1
  );


  localStorage.setItem(

    "blink_friends",

    JSON.stringify(
      friends
    )

  );


  showFriends();

}


/* =========================================================
   SETTINGS
========================================================= */

function showSettings() {

  openPanel(`

    <button
      class="close"
      onclick="closePanel()"
    >
      ×
    </button>


    <h2>
      Настройки
    </h2>


    <div class="friend">

      <div class="grow">

        <b>
          📍 Геолокация
        </b>


        <div class="code">

          Показывать твоё
          местоположение и скорость.

        </div>

      </div>


      <button
        class="btn secondary"
        style="width:auto"
        onclick="toggleLocation()"
      >

        ${
          locationEnabled
            ? "Выключить"
            : "Включить"
        }

      </button>

    </div>


    <button
      class="btn secondary"
      onclick="centerMe()"
    >
      🎯 Показать меня
    </button>


    <p class="note">

      Blink определяет направление
      движения по последним GPS
      координатам.

      Радужный хвост остаётся
      позади движущегося пользователя.

      При повороте направление хвоста
      меняется вместе с движением.

    </p>

  `);

}


/* TOGGLE GPS */

function toggleLocation() {

  locationEnabled =
    !locationEnabled;


  localStorage.setItem(

    "blink_location",

    locationEnabled
      ? "on"
      : "off"

  );


  if (
    locationEnabled
  ) {

    startGPS();

  }

  else {

    if (
      watchId !== null
    ) {

      navigator.geolocation
        .clearWatch(
          watchId
        );

    }


    watchId =
      null;


    setStatus(
      "Геолокация выключена",
      false
    );

  }


  showSettings();

}


/* CENTER USER */

function centerMe() {

  closePanel();


  if (
    lastPosition
  ) {

    map.setView(

      [

        lastPosition.lat,

        lastPosition.lng

      ],

      17

    );

  }

  else {

    toast(
      "GPS ещё не получил координаты."
    );

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(
    ".nav"
  )
  .forEach(

    function(button) {

      button.onclick =

        function() {

          document
            .querySelectorAll(
              ".nav"
            )
            .forEach(

              function(b) {

                b.classList.remove(
                  "active"
                );

              }

            );


          button.classList.add(
            "active"
          );


          const page =
            button.dataset.page;


          if (
            page === "map"
          ) {

            closePanel();

          }


          if (
            page === "friends"
          ) {

            showFriends();

          }


          if (
            page === "profile"
          ) {

            showProfile();

          }


          if (
            page === "settings"
          ) {

            showSettings();

          }

        };

    }

  );


/* =========================================================
   START GPS
========================================================= */

startGPS();

</script>

</body>
</html>
